[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cal-mcp"
version = "0.1.0"
description = "Read-only MCP adapter for the Comprehensive Aramaic Lexicon"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "httpx2>=2.12,<3",
  "mcp>=2,<3",
]

[project.scripts]
cal-mcp = "cal_mcp.server:main"

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["cal_mcp"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["cal_mcp"]
