name: One-shot issue 356 compatibility probe

on:
  push:
    branches: [probe/python-356-live-20261125]
    paths: [.github/workflows/probe-python-356.yml]

permissions:
  contents: read

jobs:
  live-python-314:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: cal-mcp-live-smoke
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: c9b01aa0bd2fb508110499af241fd483231f16e4
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Build and install exact main wheel in fresh venv
        run: |
          set -euo pipefail
          python -m pip install build
          python -m build --wheel --outdir dist
          python -m venv "$RUNNER_TEMP/probe"
          "$RUNNER_TEMP/probe/bin/python" -m pip install --no-cache-dir dist/*.whl
          "$RUNNER_TEMP/probe/bin/python" -m pip check
          "$RUNNER_TEMP/probe/bin/python" -m pip freeze --all
      - name: One live source-attributed bibliography request
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/probe/bin/python" - <<'PY'
          import asyncio
          import json
          import os
          import sys
          from datetime import datetime, timezone
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from urllib.parse import parse_qs, urlsplit
          from mcp import Client, StdioServerParameters
          from cal_mcp.release_surface import CURRENT_PUBLIC_TOOLS
          from cal_mcp.stdio_live_smoke import DEFAULT_SMOKE_CASES, evaluate_tool_result, _read_actual_attempts

          async def main():
              assert sys.version_info[:2] == (3, 14)
              case = next(c for c in DEFAULT_SMOKE_CASES if c.name == "bibliography")
              assert case.tool == "cal_bibliography_lemma"
              assert case.arguments == {"lemma_key": "cly V"}
              with TemporaryDirectory() as directory:
                  report = Path(directory) / "attempts.json"
                  env = dict(os.environ)
                  env.update(CAL_MCP_LIVE_SMOKE_MAX_ATTEMPTS="25", CAL_MCP_LIVE_SMOKE_REPORT_PATH=str(report))
                  executable = str(Path(sys.executable).with_name("cal-mcp"))
                  async with Client(StdioServerParameters(command=executable, env=env)) as client:
                      assert client.server_info.name == "cal-mcp"
                      assert client.server_info.version == "0.2.0"
                      tools = {t.name: t for t in (await client.list_tools()).tools}
                      assert len(tools) == 37 and tools.keys() == CURRENT_PUBLIC_TOOLS
                      started = datetime.now(timezone.utc)
                      result = await client.call_tool(case.tool, arguments=case.arguments)
                      outcome = evaluate_tool_result(case, tools[case.tool], result)
                  attempts = _read_actual_attempts(report)
                  print(json.dumps({"category": outcome.category, "message": outcome.message, "actual_attempts": attempts}))
                  assert outcome.category == "ok" and attempts == 1
                  data = result.structured_content
                  p = data["provenance"]
                  source = urlsplit(p["source_url"])
                  assert source.path == "/getbiblemma.php"
                  assert parse_qs(source.query) == {"myauthor": ["cly V"]}
                  assert p["operation"] == "bibliography_lemma"
                  assert data["query"] == "cly V"
                  retrieved = datetime.fromisoformat(p["retrieved_at"])
                  assert started <= retrieved <= datetime.now(timezone.utc)
                  print(json.dumps({"python": sys.version, "source_url": p["source_url"], "retrieved_at": p["retrieved_at"], "records": len(data["records"]), "tools": len(tools)}))

          asyncio.run(main())
          PY

  offline-python-315:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: c9b01aa0bd2fb508110499af241fd483231f16e4
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.15"
      - name: Build distributions and verify clean installed stdio surface
        run: |
          set -euo pipefail
          python --version
          python -m pip install build
          python -m build --outdir dist
          python -m pip install --no-cache-dir dist/*.whl
          python -m pip check
          python -m pip freeze --all
          python scripts/verify_release_artifact.py dist
