name: Format issue 42 parser candidate

on:
  push:
    branches:
      - fix/issue-42-text-concordance-parser-drift
    paths:
      - .github/workflows/issue-42-format.yml

permissions:
  contents: write

jobs:
  format:
    if: "github.event.head_commit.message == 'format issue 42 parser candidate'"
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/issue-42-text-concordance-parser-drift
      - run: python -m pip install ruff==0.16.6
      - run: |
          ruff format src/cal_mcp/concordance.py
          rm .github/workflows/issue-42-format.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: format issue 42 parser candidate"
          git push origin HEAD:fix/issue-42-text-concordance-parser-drift
