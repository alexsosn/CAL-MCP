name: Research KWIC context length

on:
  push:
    branches:
      - issue-6-concordance
    paths:
      - .github/workflows/research-concordance.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Compare bounded one-hit KWIC context lengths
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          class TextOnly(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.text = []
              def handle_data(self, data):
                  text = " ".join(data.split())
                  if text:
                      self.text.append(text)

          for lth in ("1", "20"):
              request = Request(
                  "https://cal.huc.edu/showdialectKWIC.php",
                  data=urlencode({
                      "lemma": ")ryk#2",
                      "pos": "A",
                      "texts": "31000",
                      "charset": "R",
                      "lth": lth,
                  }).encode(),
                  headers={"User-Agent": "CAL-MCP bounded research probe"},
              )
              with urlopen(request, timeout=20) as response:
                  raw = response.read(65536)
                  print("lth", lth, "status", response.status, "bytes", len(raw))
              parser = TextOnly()
              parser.feed(raw.decode("utf-8", errors="replace"))
              semantic = [part for part in parser.text if not part.startswith(("@font-face", ".rom", ".heb", ".calsyr", ".syr", ".psyr", ".grk", ".mono", ".red", ".uni", "td {", "a{"))]
              print("semantic", " | ".join(semantic[-40:]))
          PY
