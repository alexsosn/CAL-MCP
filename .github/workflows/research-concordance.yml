name: Research concordance forms

on:
  push:
    branches:
      - issue-6-concordance
    paths:
      - .github/workflows/research-concordance.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Inspect current CAL concordance form contracts
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from urllib.request import Request, urlopen

          urls = [
              "https://cal.huc.edu/searching/basic_concordance.html",
              "https://cal.huc.edu/searching/concordance_search.html",
              "https://cal.huc.edu/dKWIC.php?lemma=nqr+V",
          ]

          class Forms(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.forms = []
                  self.current = None
                  self.text = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == "form":
                      self.current = {"attrs": attrs, "controls": []}
                      self.forms.append(self.current)
                  elif self.current is not None and tag in {"input", "select", "option", "button"}:
                      self.current["controls"].append((tag, attrs))
              def handle_endtag(self, tag):
                  if tag == "form":
                      self.current = None
              def handle_data(self, data):
                  text = " ".join(data.split())
                  if text:
                      self.text.append(text)

          for url in urls:
              print("===", url, "===")
              req = Request(url, headers={"User-Agent": "CAL-MCP bounded research probe"})
              with urlopen(req, timeout=15) as response:
                  raw = response.read(196608)
                  print("status", response.status, "final", response.geturl(), "bytes", len(raw))
              parser = Forms()
              parser.feed(raw.decode("utf-8", errors="replace"))
              for i, form in enumerate(parser.forms):
                  print("form", i, form)
              print("text", " | ".join(parser.text[:120]))
          PY
