name: Issue 79 bounded Tel Dan probe

on:
  push:
    branches:
      - fix/issue-79-tel-dan-text-page

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect one current Tel Dan response
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from html.parser import HTMLParser
          from urllib.request import Request, urlopen

          url = "https://cal.huc.edu/get_a_chapter.php?file=13250&page=0"

          class P(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.links=[]; self.href=None; self.link_parts=[]; self.observations=[]
              def handle_starttag(self, tag, attrs):
                  data=dict(attrs)
                  if tag == "a":
                      self.href=data.get("href", ""); self.link_parts=[]
                  joined=" ".join(f"{k}={v}" for k,v in attrs if v is not None)
                  if any(k in joined.lower() for k in ("coord", "word", "lex", "token", "bablex")):
                      self.observations.append((tag, joined[:500]))
              def handle_endtag(self, tag):
                  if tag == "a" and self.href is not None:
                      self.links.append((self.href, " ".join("".join(self.link_parts).split())))
                      self.href=None; self.link_parts=[]
              def handle_data(self, data):
                  if self.href is not None: self.link_parts.append(data)

          req=Request(url, headers={"User-Agent":"CAL-MCP issue-79 bounded research probe (+https://github.com/alexsosn/CAL-MCP)"})
          with urlopen(req, timeout=15) as r:
              body=r.read(512*1024)
              print("STATUS", r.status, "BYTES", len(body), "CTYPE", r.headers.get("Content-Type"))
          p=P(); p.feed(body.decode("utf-8", errors="replace")); p.close()
          print("HREFS", p.links[:100])
          print("ATTRS", p.observations[:100])
          PY
