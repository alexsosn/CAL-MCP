name: Apply issue 42 review fix

on:
  push:
    branches:
      - fix/issue-42-text-concordance-parser-drift
    paths:
      - .github/workflows/issue42-review-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/issue-42-text-concordance-parser-drift
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Apply minimal parser hardening
        run: python .github/issue42_review_fix.py
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/cal_mcp/concordance.py
          git diff --cached --quiet && exit 1
          git commit -m 'fix: reject malformed inline concordance rows'
          git push origin HEAD:fix/issue-42-text-concordance-parser-drift
