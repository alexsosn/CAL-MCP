name: One-off issue 345 external-citations stdio MCP positive acceptance

on:
  push:
    branches: [research/external-citations-345]
    paths: [.github/workflows/oneoff-external-mcp-345.yml]

permissions:
  contents: read

concurrency:
  group: cal-mcp-live-smoke
  cancel-in-progress: false

jobs:
  external-mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build one nonpublishing candidate wheel
        run: |
          python -m pip install --disable-pip-version-check "build>=1.3,<2"
          python -m build --outdir dist
      - name: Install wheel in a fresh external virtual environment
        shell: bash
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          python -m venv "$RUNNER_TEMP/cal-external-mcp-345"
          "$RUNNER_TEMP/cal-external-mcp-345/bin/python" -m pip install \
            --disable-pip-version-check --no-cache-dir "${wheels[0]}"
      - name: Verify deconflicted external citation record MCP acceptance with 3 starts
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/cal-external-mcp-345/bin/python" -m cal_mcp.pre_release_followup_smoke \
            --executable "$RUNNER_TEMP/cal-external-mcp-345/bin/cal-mcp" \
            --external-only
