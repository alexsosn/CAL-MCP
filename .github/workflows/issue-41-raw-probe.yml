name: Issue 41 raw CAL probe

on:
  push:
    branches:
      - fix/issue-41-lexicon-citation-count-drift
    paths:
      - .github/workflows/issue-41-raw-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch one br N entry and print bounded structural metadata
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 15 --max-filesize 2097152 \
            'https://cal.huc.edu/cal_entry_web.php?lemma=br+N' -o /tmp/br.html
          python - <<'PY'
          from pathlib import Path
          import re

          text = Path('/tmp/br.html').read_text(encoding='utf-8', errors='replace')
          print('bytes=', len(text.encode('utf-8')))
          for pattern in (r'(?i)citations?', r'(?i)cal_entry', r'(?i)lemma', r'(?i)fetch\s*\(', r'(?i)\.php'):
              matches = list(re.finditer(pattern, text))
              print('pattern=', pattern, 'count=', len(matches))
              for match in matches[:5]:
                  start = max(0, match.start() - 250)
                  end = min(len(text), match.end() + 450)
                  print(re.sub(r'\s+', ' ', text[start:end]))
          urls = sorted(set(re.findall(r'''(?:src|href)=["']([^"']+)["']''', text, flags=re.I)))
          print('refs=', urls[:40])
          PY
