name: Issue 41 raw CAL probe

on:
  push:
    branches:
      - fix/issue-41-lexicon-citation-count-drift
    paths:
      - .github/workflows/issue-41-raw-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch one br N entry using production User-Agent
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 15 --max-filesize 2097152 \
            -A 'CAL-MCP/0.1.0.dev0 (+https://github.com/alexsosn/CAL-MCP)' \
            'https://cal.huc.edu/cal_entry_web.php?lemma=br+N' -o /tmp/br.html
          python - <<'PY'
          from pathlib import Path
          import re

          text = Path('/tmp/br.html').read_text(encoding='utf-8', errors='replace')
          print('bytes=', len(text.encode('utf-8')))
          title = re.search(r'(?is)<title[^>]*>(.*?)</title>', text)
          print('title=', re.sub(r'\s+', ' ', title.group(1)).strip() if title else None)
          for pattern in (r'(?i)citations?', r'BT Yev', r'EphCruc', r'(?i)lemma', r'(?i)\.php'):
              matches = list(re.finditer(pattern, text))
              print('pattern=', pattern, 'count=', len(matches))
              for match in matches[:3]:
                  start = max(0, match.start() - 300)
                  end = min(len(text), match.end() + 700)
                  print(re.sub(r'\s+', ' ', text[start:end]))
          PY
