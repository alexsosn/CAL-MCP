name: Issue 47 browse research probe

on:
  push:
    branches:
      - fix/issue-47-lexicon-browse-drift
    paths:
      - .github/workflows/issue-47-browse-probe.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/issue-47-lexicon-browse-drift
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: python -m pip install .
      - name: Run one fixed CAL request
        run: python .github/issue47_probe.py
      - uses: actions/checkout@v6
        if: always()
        with:
          ref: fix/issue-47-lexicon-browse-drift
      - name: Remove research helpers
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/issue47_probe.py .github/workflows/issue-47-browse-probe.yml
          git add -A
          git commit -m "research: remove issue 47 browse probe helpers"
          git push origin HEAD:fix/issue-47-lexicon-browse-drift
