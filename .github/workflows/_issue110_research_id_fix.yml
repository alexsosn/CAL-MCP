name: Issue 110 repair durable research IDs
on:
  push:
    branches: [fix/issue-110-syriac-peshitta-routing]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/issue-110-syriac-peshitta-routing
          fetch-depth: 0
      - name: Repair remaining duplicate and restore global invariant
        run: |
          python - <<'PY'
          from pathlib import Path
          research = Path('research.md')
          text = research.read_text(encoding='utf-8')
          old = '## R-017 — CAL full lexicon entries now inline non-content stylesheet text'
          new = '## R-027 — CAL full lexicon entries now inline non-content stylesheet text'
          assert text.count(old) == 1, (old, text.count(old))
          assert new not in text, new
          assert text.count('## R-026 — Current Syriac Peshitta book rows use shallow catalogue navigation') == 1
          research.write_text(text.replace(old, new), encoding='utf-8')

          Path('tests/test_research_log_contract.py').write_text('''from __future__ import annotations\n\nimport re\nfrom collections import Counter\nfrom pathlib import Path\n\nROOT = Path(__file__).resolve().parents[1]\nRESEARCH = ROOT / "research.md"\n_RESEARCH_ID_RE = re.compile(r"^## (R-\\d{3}) — ", re.MULTILINE)\n\n\ndef test_durable_research_ids_are_unique() -> None:\n    ids = _RESEARCH_ID_RE.findall(RESEARCH.read_text(encoding="utf-8"))\n    duplicates = sorted(identifier for identifier, count in Counter(ids).items() if count > 1)\n\n    assert duplicates == []\n''', encoding='utf-8')
          PY
          rm .github/workflows/_issue110_research_id_fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research.md tests/test_research_log_contract.py .github/workflows/_issue110_research_id_fix.yml
          git commit -m "fix: enforce unique durable research IDs"
          git push origin HEAD:fix/issue-110-syriac-peshitta-routing
