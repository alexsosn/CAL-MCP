name: Issue 110 repair durable research IDs
on:
  push:
    branches: [fix/issue-110-syriac-peshitta-routing]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/issue-110-syriac-peshitta-routing
          fetch-depth: 0
      - name: Repair duplicate durable IDs and remove helper
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('research.md')
          text = p.read_text(encoding='utf-8')
          replacements = {
              '## R-017 — CAL full lexicon entries now inline non-content stylesheet text':
                  '## R-026 — CAL full lexicon entries now inline non-content stylesheet text',
              '## R-001 — Current Syriac Peshitta book rows use shallow catalogue navigation':
                  '## R-027 — Current Syriac Peshitta book rows use shallow catalogue navigation',
          }
          for old, new in replacements.items():
              assert text.count(old) == 1, (old, text.count(old))
              assert new not in text, new
              text = text.replace(old, new)
          p.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/_issue110_research_id_fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research.md .github/workflows/_issue110_research_id_fix.yml
          git commit -m "fix: make durable research IDs unique"
          git push origin HEAD:fix/issue-110-syriac-peshitta-routing
