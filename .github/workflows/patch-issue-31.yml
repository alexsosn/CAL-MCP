name: Patch issue 31 subsense placement

on:
  push:
    branches:
      - fix/issue-31-depth-one-subsenses
    paths:
      - .github/workflows/patch-issue-31.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/issue-31-depth-one-subsenses
      - name: Include depth zero in sibling search
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('src/cal_mcp/lexicon.py')
          text = path.read_text()
          old = 'for index in range(len(previous) - 1, 0, -1):'
          new = 'for index in range(len(previous) - 1, -1, -1):'
          if text.count(old) != 1:
              raise SystemExit(f'expected one subsense loop, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/cal_mcp/lexicon.py
          git commit -m "fix: place depth-one subsense siblings"
          git push origin HEAD:fix/issue-31-depth-one-subsenses
