name: Apply issue 73 review fix

on:
  push:
    branches:
      - issue-73-native-unicode-lexicon-pass-through
    paths:
      - .github/workflows/issue-73-review-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: issue-73-native-unicode-lexicon-pass-through
      - name: Narrow CAL-native fallback to verified marked letters
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/cal_mcp/lexicon.py")
          text = path.read_text()
          old = """        except UnsupportedQueryError:\n            if normalized.representation not in {\n                InputRepresentation.HEBREW,\n                InputRepresentation.SYRIAC,\n            }:\n                raise\n            conversion = None\n"""
          new = """        except UnsupportedQueryError as conversion_error:\n            if normalized.representation not in {\n                InputRepresentation.HEBREW,\n                InputRepresentation.SYRIAC,\n            }:\n                raise\n            fallback_supported = True\n            mark_anchor = False\n            for char in normalized.normalized:\n                if char in {\" \", \"_\"}:\n                    mark_anchor = False\n                    continue\n                category = unicodedata.category(char)\n                if category.startswith(\"M\"):\n                    if not mark_anchor:\n                        fallback_supported = False\n                        break\n                    continue\n                if not category.startswith(\"L\"):\n                    fallback_supported = False\n                    break\n                try:\n                    convert_to_cal_code(char, representation=normalized.representation)\n                except UnsupportedQueryError:\n                    fallback_supported = False\n                    break\n                mark_anchor = True\n            if not fallback_supported:\n                raise conversion_error from None\n            conversion = None\n"""
          if old not in text:
              raise SystemExit("lookup fallback anchor missing")
          path.write_text(text.replace(old, new, 1))
      - name: Bootstrap frozen installer
        run: python -m pip install "pip==26.2.1" "setuptools==79.0.1"
      - name: Focused verification before commit
        run: |
          python -m pip install -e '.[dev]' -c constraints/ci-py311.txt --build-constraint constraints/build-py311.txt
          ruff check src/cal_mcp/lexicon.py tests/test_lexicon_native_unicode_regression.py
          ruff format --check src/cal_mcp/lexicon.py tests/test_lexicon_native_unicode_regression.py
          mypy
          pytest tests/test_lexicon_native_unicode_regression.py tests/test_lexicon_ambiguity_expansion.py tests/test_lexicon_conversion_provenance.py tests/test_cpa_syriac_conversion.py tests/test_cal_code_conversion.py tests/test_cal_code_conversion_review_regressions.py
      - name: Rebase clean fix onto latest branch and verify
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/issue-73-review-fix.yml
          git add src/cal_mcp/lexicon.py .github/workflows/issue-73-review-fix.yml
          git commit -m "Narrow native Unicode fallback to verified marked letters"
          git fetch origin issue-73-native-unicode-lexicon-pass-through
          git rebase origin/issue-73-native-unicode-lexicon-pass-through
          ruff check src/cal_mcp/lexicon.py tests/test_lexicon_native_unicode_regression.py
          ruff format --check src/cal_mcp/lexicon.py tests/test_lexicon_native_unicode_regression.py
          mypy
          pytest tests/test_lexicon_native_unicode_regression.py tests/test_lexicon_ambiguity_expansion.py tests/test_lexicon_conversion_provenance.py tests/test_cpa_syriac_conversion.py tests/test_cal_code_conversion.py tests/test_cal_code_conversion_review_regressions.py
          git push origin HEAD:issue-73-native-unicode-lexicon-pass-through
