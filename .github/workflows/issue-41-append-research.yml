name: Issue 41 append research

on:
  push:
    branches:
      - fix/issue-41-lexicon-citation-count-drift
    paths:
      - .github/workflows/issue-41-append-research.yml

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/issue-41-lexicon-citation-count-drift
      - name: Append R-021 and remove helper
        env:
          R021_B64: 
        run: |
          set -euo pipefail
          python -c "import base64,os,pathlib; p=pathlib.Path('research.md'); p.write_text(p.read_text(encoding='utf-8') + base64.b64decode(os.environ['R021_B64']).decode('utf-8'), encoding='utf-8')"
          rm .github/workflows/issue-41-append-research.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research.md .github/workflows/issue-41-append-research.yml
          git commit -m 'docs: record current lexicon citation structure'
          git push origin HEAD:fix/issue-41-lexicon-citation-count-drift
