name: Research empty CAL text search

on:
  push:
    branches: [issue-7-texts]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Inspect one bounded empty CAL topic search
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from html import unescape
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          url = "https://cal.huc.edu/newsearchtxts.php"
          data = urlencode({"search": "zzzzcalmcpnomatchzzzz"}).encode()
          req = Request(
              url,
              data=data,
              headers={
                  "User-Agent": "CAL-MCP-research/0 (+https://github.com/alexsosn/CAL-MCP)",
                  "Content-Type": "application/x-www-form-urlencoded",
              },
          )
          with urlopen(req, timeout=15) as response:
              body = response.read().decode("utf-8", "replace")
              text = " ".join(unescape(re.sub(r"<[^>]+>", " ", body)).split())
              print("STATUS", response.status)
              print("TEXT", text[:1600])
          PY
