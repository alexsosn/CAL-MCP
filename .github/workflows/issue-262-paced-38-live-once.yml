# SINGLE-use, exact current Peshitta 37-token acceptance. Remove trigger after queue.
name: One-shot paced Peshitta 38-attempt CAL MCP acceptance (#262)
on:
  push:
    branches: [dev/issue-262-rate-limits]
    paths: [.github/workflows/issue-262-paced-38-live-once.yml]
permissions:
  contents: read
concurrency:
  group: cal-mcp-live-smoke
  cancel-in-progress: false
jobs:
  validate:
    name: validate-runner-offline
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install static validator
        run: python -m pip install "ruff==0.13.2"
      - name: Validate one-time runner without any CAL I/O
        run: |
          ruff check scripts/issue262_live_acceptance_once.py
          ruff format --check scripts/issue262_live_acceptance_once.py
          python -m py_compile scripts/issue262_live_acceptance_once.py
          grep -q 'LIMIT = 38' scripts/issue262_live_acceptance_once.py
          grep -q 'min_request_interval_seconds < 3' scripts/issue262_live_acceptance_once.py
  once:
    name: exactly-one-installed-wheel-CAL-acceptance
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build exactly one wheel
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check build
          python -m build --wheel --outdir dist
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l)" -eq 1
      - name: Install wheel into clean external environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/issue262-venv"
          "$RUNNER_TEMP/issue262-venv/bin/python" -m pip install --no-cache-dir dist/*.whl
      - name: One 38-hard-cap paced MCP session; stop on first CAL error
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/issue262-venv/bin/python" "$GITHUB_WORKSPACE/scripts/issue262_live_acceptance_once.py"
