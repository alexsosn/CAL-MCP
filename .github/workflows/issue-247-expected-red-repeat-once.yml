# Offline, one-time formatting-clean expected RED gate; no CAL I/O.
name: Issue 247 behavioral RED witness
on:
  push:
    branches: [research/issue-247-test-red-gate]
    paths: [.github/workflows/issue-247-expected-red-repeat-once.yml]
permissions:
  contents: read
jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install tests
        run: python -m pip install -e ".[dev]"
      - name: Ruff formatting and lint
        run: |
          ruff check tests/test_targum_reflex_examples.py
          ruff format --check tests/test_targum_reflex_examples.py
      - name: Expected feature-not-yet-implemented pytest failures
        run: pytest -q tests/test_targum_reflex_examples.py
