name: Issue 172 final live stdio acceptance

on:
  push:
    branches:
      - claude/issue-172-syriac-group-cards

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install candidate
        run: python -m pip install .
      - name: Verify Syriac groups and one child each over stdio
        run: |
          python - <<'PY'
          import asyncio
          from mcp import Client, StdioServerParameters

          async def call(client, tool, args):
              result = await client.call_tool(tool, args)
              if result.is_error:
                  raise RuntimeError(f"{tool} failed: {result.content!r}")
              if not isinstance(result.structured_content, dict):
                  raise RuntimeError(f"{tool}: missing structured content")
              return result.structured_content

          def check_group(data, group_id, minimum_count, expected_sub):
              if data.get("group_id") != group_id:
                  raise RuntimeError(f"{group_id}: wrong group identity")
              items = data.get("items")
              if not isinstance(items, list) or len(items) < minimum_count:
                  raise RuntimeError(f"{group_id}: too few items")
              if not all(
                  isinstance(item, dict)
                  and item.get("upstream_id") == group_id
                  and isinstance(item.get("subtext_id"), str)
                  and item.get("subtext_id")
                  and item.get("navigation_kind") == "text"
                  for item in items
              ):
                  raise RuntimeError(f"{group_id}: malformed child identity")
              if items[0].get("subtext_id") != expected_sub:
                  raise RuntimeError(f"{group_id}: unexpected first child selector")
              return items

          async def main():
              async with Client(StdioServerParameters(command="cal-mcp")) as client:
                  eph = await call(client, "cal_syriac_group", {"group_id": "60420"})
                  eph_items = check_group(eph, "60420", 15, "01")
                  ins = await call(client, "cal_syriac_group", {"group_id": "61000"})
                  ins_items = check_group(ins, "61000", 80, "001")

                  eph_page = await call(
                      client,
                      "cal_text_page",
                      {
                          "file_id": "60420",
                          "subtext_id": eph_items[0]["subtext_id"],
                          "page": 1,
                      },
                  )
                  ins_page = await call(
                      client,
                      "cal_text_page",
                      {
                          "file_id": "61000",
                          "subtext_id": ins_items[0]["subtext_id"],
                          "page": 1,
                      },
                  )
                  for label, page in (("60420/01", eph_page), ("61000/001", ins_page)):
                      if page.get("status") != "found":
                          raise RuntimeError(f"{label}: child page not found")
                      payload = page.get("page")
                      if not isinstance(payload, dict) or not payload.get("lines"):
                          raise RuntimeError(f"{label}: child page has no lines")

                  print(
                      "live #172 OK: "
                      f"60420={len(eph_items)} 61000={len(ins_items)} "
                      "children=2"
                  )

          asyncio.run(main())
          PY
