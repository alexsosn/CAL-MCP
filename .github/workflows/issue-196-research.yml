name: Issue 196 public MCP verification

on:
  push:
    branches:
      - research/issue-196-empty-cpa-55002

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install current candidate
        run: python -m pip install .
      - name: Verify explicit no-lines semantics over stdio
        run: |
          python - <<'PY'
          import asyncio
          from mcp import Client, StdioServerParameters

          async def main():
              async with Client(StdioServerParameters(command="cal-mcp")) as client:
                  result = await client.call_tool(
                      "cal_text_page",
                      {"file_id": "55002", "page": 1},
                  )
                  if result.is_error:
                      raise RuntimeError(f"55002 failed: {result.content!r}")
                  data = result.structured_content
                  if not isinstance(data, dict):
                      raise RuntimeError("missing structured content")
                  if data.get("status") != "not_found":
                      raise RuntimeError(f"unexpected status: {data!r}")
                  if data.get("page") is not None:
                      raise RuntimeError("explicit no-lines state returned a page payload")
                  print("live #196 OK: 55002 -> not_found, page=null")

          asyncio.run(main())
          PY
