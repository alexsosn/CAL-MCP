name: Issue 196 production-line probe

on:
  push:
    branches:
      - research/issue-196-empty-cpa-55002

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install candidate
        run: python -m pip install .
      - name: Inspect production semantic lines for explicit no-lines marker
        run: |
          python - <<'PY'
          import asyncio
          import json
          import re

          from cal_mcp.client import CalHttpClient, CalRequest
          from cal_mcp.lexicon import _parse_lines

          PATTERN = re.compile(r"\bNO LINES FOR\b.*\bARE CURRENTLY STORED\b", re.IGNORECASE)

          async def main():
              async with CalHttpClient() as client:
                  result = await client.fetch(
                      CalRequest(
                          method="GET",
                          path="get_a_chapter.php",
                          params=(("file", "55002"), ("cset", "C"), ("page", "0")),
                      ),
                      parser=lambda response: response,
                      cache_namespace="issue-196-line-probe",
                  )
              lines = _parse_lines(result.value)
              page_text = " ".join(line.text for line in lines)
              suspects = [
                  {
                      "index": i,
                      "text_repr": repr(line.text),
                      "links": len(line.links),
                      "codepoints": [ord(ch) for ch in line.text],
                  }
                  for i, line in enumerate(lines)
                  if "NO" in line.text.upper()
                  or "LINES" in line.text.upper()
                  or "STORED" in line.text.upper()
              ]
              print(json.dumps({
                  "line_count": len(lines),
                  "pattern_matches_page_text": PATTERN.search(page_text) is not None,
                  "suspects": suspects,
              }, sort_keys=True))

          asyncio.run(main())
          PY
