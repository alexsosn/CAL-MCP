name: Issue 196 marker-link probe

on:
  push:
    branches:
      - research/issue-196-empty-cpa-55002

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install candidate
        run: python -m pip install .
      - name: Record exact semantic marker link shape
        run: |
          python - <<'PY'
          import asyncio
          import json
          from urllib.parse import parse_qs, urlsplit

          from cal_mcp.client import CalHttpClient, CalRequest
          from cal_mcp.lexicon import _parse_lines

          async def main():
              async with CalHttpClient() as client:
                  result = await client.fetch(
                      CalRequest(
                          method="GET",
                          path="get_a_chapter.php",
                          params=(("file", "55002"), ("cset", "C"), ("page", "0")),
                      ),
                      parser=lambda response: response,
                      cache_namespace="issue-196-marker-link",
                  )
              lines = _parse_lines(result.value)
              matches = []
              for i, line in enumerate(lines):
                  if "NO LINES FOR" not in line.text:
                      continue
                  matches.append({
                      "index": i,
                      "line_text": line.text,
                      "links": [
                          {
                              "text": link.text,
                              "path": urlsplit(link.href).path.rsplit("/", 1)[-1],
                              "keys": sorted(parse_qs(urlsplit(link.href).query, keep_blank_values=True)),
                              "values": {
                                  key: parse_qs(
                                      urlsplit(link.href).query,
                                      keep_blank_values=True,
                                  )[key]
                                  for key in sorted(
                                      parse_qs(
                                          urlsplit(link.href).query,
                                          keep_blank_values=True,
                                      )
                                  )
                              },
                          }
                          for link in line.links
                      ],
                  })
              if len(matches) != 1:
                  raise RuntimeError(f"unexpected marker-line count: {len(matches)}")
              print(json.dumps(matches, sort_keys=True))

          asyncio.run(main())
          PY
