name: Format issue 13 external citation module
on:
  push:
    branches: [feat/issue-13-external-citations]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/issue-13-external-citations
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Apply repository formatter and self-clean
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'ruff<1,>=0.12'
          ruff format src/cal_mcp/external_citations.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/issue-13-core-format.yml
          git add src/cal_mcp/external_citations.py
          git commit -m 'style: format external citation module'
          git push origin HEAD:feat/issue-13-external-citations
