name: Issue 39 single-call installed-wheel CAL smoke (temporary)

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

concurrency:
  group: cal-mcp-live-smoke
  cancel-in-progress: false

jobs:
  recent-bibliography:
    if: github.event.pull_request.number == 326
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build exact PR wheel and install in a fresh environment
        shell: bash
        run: |
          python -m pip install "build>=1.3,<2"
          python -m build --wheel --outdir dist
          python -m venv "$RUNNER_TEMP/cal-mcp-recent-venv"
          "$RUNNER_TEMP/cal-mcp-recent-venv/bin/python" -m pip install --disable-pip-version-check --no-cache-dir dist/*.whl
      - name: Validate one installed stdio MCP user-facing CAL read and transport count
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/cal-mcp-recent-venv/bin/python" - <<'PY'
          import asyncio
          import json
          import os
          from datetime import datetime
          from pathlib import Path
          from mcp import Client, StdioServerParameters

          report = Path(os.environ["RUNNER_TEMP"]) / "cal-mcp-issue39-attempts.json"
          executable = str(Path(os.environ["RUNNER_TEMP"]) / "cal-mcp-recent-venv" / "bin" / "cal-mcp")
          child_env = os.environ.copy()
          child_env["CAL_MCP_LIVE_SMOKE_MAX_ATTEMPTS"] = "25"
          child_env["CAL_MCP_LIVE_SMOKE_REPORT_PATH"] = str(report)

          async def run():
              async with Client(
                  StdioServerParameters(command=executable, env=child_env),
                  raise_exceptions=False,
              ) as client:
                  tools = {tool.name: tool for tool in (await client.list_tools()).tools}
                  assert len(tools) == 37, "Unexpected installed MCP surface"
                  tool = tools["cal_bibliography_recent"]
                  assert tool.input_schema.get("properties", {}) == {}
                  assert tool.input_schema.get("required", []) == []
                  outcome = await client.call_tool("cal_bibliography_recent", {})
                  assert not outcome.is_error, "Structured CAL recent bibliography error"
                  result = outcome.structured_content
                  assert isinstance(result, dict)
                  assert result.get("heading") == "CAL Recent Bibliography"
                  records = result.get("records")
                  assert isinstance(records, list) and records
                  assert all(isinstance(record, dict)
                      and isinstance(record.get("citation"), str)
                      and record["citation"].strip()
                      and isinstance(record.get("links"), list)
                      for record in records)
                  provenance = result.get("provenance")
                  assert isinstance(provenance, dict)
                  assert provenance.get("source") == "CAL"
                  assert provenance.get("source_url") == "https://cal.huc.edu/getrecentbib.php"
                  assert provenance.get("operation") == "bibliography_recent"
                  assert provenance.get("original_query") == ""
                  assert provenance.get("submitted_query") == ""
                  timestamp = datetime.fromisoformat(provenance["retrieved_at"])
                  assert timestamp.utcoffset() is not None
                  print("User-facing recent-bibliography MCP response validated; "
                        f"records={len(records)}; no CAL records logged")

          asyncio.run(run())
          measured = json.loads(report.read_text(encoding="utf-8"))
          assert measured == {
              "actual_cal_transport_attempts": 1,
              "max_cal_transport_attempts": 25,
          }, "Must issue exactly one CAL transport start, with retries disabled"
          print("Installed-wheel live request budget verified: exactly one CAL start")
          PY
