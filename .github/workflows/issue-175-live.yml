name: Issue 175 final live acceptance

on:
  push:
    branches:
      - dev/issue-175-lexicon-browse-crossrefs

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install candidate
        run: python -m pip install .
      - name: Verify typed browse cross-references over installed stdio MCP
        run: |
          python - <<'PY'
          import asyncio
          from mcp import Client, StdioServerParameters

          CASES = [
              ("cal-$l", {"prefix": "$l", "representation": "cal_code"}),
              ("syriac-ܫܠ", {"prefix": "ܫܠ", "representation": "syriac"}),
              ("cal-by", {"prefix": "by", "representation": "cal_code"}),
          ]

          def validate(label, data):
              if not isinstance(data, dict):
                  raise RuntimeError(f"{label}: no structured result")
              rows = data.get("rows")
              entries = data.get("entries")
              if not isinstance(rows, list) or not rows:
                  raise RuntimeError(f"{label}: no browse rows")
              if not isinstance(entries, list) or not entries:
                  raise RuntimeError(f"{label}: no ordinary entries")

              kinds = [row.get("kind") for row in rows if isinstance(row, dict)]
              if "entry" not in kinds or "cross_reference" not in kinds:
                  raise RuntimeError(f"{label}: mixed row kinds missing: {kinds!r}")

              crossrefs = [
                  row
                  for row in rows
                  if isinstance(row, dict) and row.get("kind") == "cross_reference"
              ]
              for row in crossrefs:
                  if not row.get("source_text"):
                      raise RuntimeError(f"{label}: empty cross-reference source")
                  if not row.get("target_lemma_key"):
                      raise RuntimeError(f"{label}: missing cross-reference target key")
                  if not row.get("target_label"):
                      raise RuntimeError(f"{label}: missing cross-reference target label")

              for entry in entries:
                  aliases = entry.get("aliases")
                  if aliases not in ([], None):
                      raise RuntimeError(
                          f"{label}: redirect source leaked into entry aliases: {entry!r}"
                      )

              return rows, entries, crossrefs

          async def main():
              async with Client(StdioServerParameters(command="cal-mcp")) as client:
                  results = {}
                  for label, args in CASES:
                      result = await client.call_tool("cal_lexicon_browse", args)
                      if result.is_error:
                          raise RuntimeError(f"{label}: tool failed: {result.content!r}")
                      rows, entries, crossrefs = validate(label, result.structured_content)
                      results[label] = (rows, entries, crossrefs)

                  cal_xrefs = results["cal-$l"][2]
                  if not any(
                      row.get("source_text") == "šlhˀw"
                      and row.get("target_lemma_key") == "$l)hw N"
                      for row in cal_xrefs
                  ):
                      raise RuntimeError("cal-$l: researched šlhˀw → $l)hw N row missing")

                  syr_data = results["syriac-ܫܠ"][0]
                  if not any(
                      row.get("kind") == "cross_reference"
                      and row.get("target_lemma_key") == "$l)hw N"
                      for row in syr_data
                  ):
                      raise RuntimeError("syriac-ܫܠ: expected $l)hw N cross-reference missing")

                  by_xrefs = results["cal-by"][2]
                  if not any(
                      row.get("source_text") == "by dny"
                      and row.get("target_lemma_key") == "dn#2 N"
                      for row in by_xrefs
                  ):
                      raise RuntimeError("cal-by: researched by dny → dn#2 N row missing")

                  for label, (_, entries, crossrefs) in results.items():
                      sources = {row["source_text"] for row in crossrefs}
                      leaked = {
                          alias
                          for entry in entries
                          for alias in (entry.get("aliases") or [])
                          if alias in sources
                      }
                      if leaked:
                          raise RuntimeError(f"{label}: redirect aliases leaked: {leaked!r}")

                  print(
                      "live #175 OK:",
                      " ".join(
                          f"{label}=rows:{len(rows)},entries:{len(entries)},xrefs:{len(xrefs)}"
                          for label, (rows, entries, xrefs) in results.items()
                      ),
                  )

          asyncio.run(main())
          PY
