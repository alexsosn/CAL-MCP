name: Issue 15 live candidate smoke

on:
  push:
    branches:
      - release/issue-15-v0.1-current
    paths:
      - .github/workflows/issue-15-live-candidate.yml

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/issue-15-v0.1-current
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install release candidate
        run: python -m pip install .
      - name: Run fixed bounded live smoke
        run: python -m cal_mcp.live_smoke
      - uses: actions/checkout@v6
        if: always()
        with:
          ref: release/issue-15-v0.1-current
      - name: Remove one-shot live gate
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/issue-15-live-candidate.yml
          git add .github/workflows/issue-15-live-candidate.yml
          git commit -m "chore: remove issue 15 live candidate gate"
          git push origin HEAD:release/issue-15-v0.1-current
