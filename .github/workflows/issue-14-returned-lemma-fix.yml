name: Issue 14 returned lemma fix

on:
  push:
    branches:
      - feat/issue-14-dictionary-collation
    paths:
      - .github/workflows/issue-14-returned-lemma-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/issue-14-dictionary-collation
      - name: Validate returned CAL lemma keys
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src/cal_mcp/dictionary_collation.py")
          text = path.read_text(encoding="utf-8")

          old_import = "from cal_mcp.client import CalContentError, CalHttpClient, CalRequest, CalResponse\n"
          new_import = old_import + "from cal_mcp.lemma_key import validate_lemma_key\n"
          if old_import not in text:
              raise SystemExit("dictionary collation import target not found")
          text = text.replace(old_import, new_import, 1)

          old = "    target_lemma_key = _returned_single_line(lemma_values[0], \"entry lemma key\")\n"
          new = (
              "    returned_lemma_key = _returned_single_line(lemma_values[0], \"entry lemma key\")\n"
              "    try:\n"
              "        _, _, target_lemma_key = validate_lemma_key(returned_lemma_key)\n"
              "    except ValueError as exc:\n"
              "        raise DictionaryCollationParseError(\n"
              "            \"CAL dictionary collation entry link has an invalid lemma key\"\n"
              "        ) from exc\n"
          )
          if old not in text:
              raise SystemExit("dictionary collation lemma target not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

          rm .github/workflows/issue-14-returned-lemma-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/cal_mcp/dictionary_collation.py .github/workflows/issue-14-returned-lemma-fix.yml
          git commit -m "fix: validate returned dictionary lemma keys"
          git push origin HEAD:feat/issue-14-dictionary-collation
