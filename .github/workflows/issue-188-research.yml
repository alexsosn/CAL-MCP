name: Issue 188 legacy Mandaic route audit

on:
  push:
    branches:
      - research/issue-188-mandaic-routing

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Recheck legacy Mandaic route identities
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from html.parser import HTMLParser
          from urllib.parse import parse_qs, urlsplit

          LEGACY_SUBDIVIDED = ["74700", "74702", "74711", "74714"]
          LEGACY_DIRECT = ["74717"]
          UA = {"User-Agent": "CAL-MCP research/0.1 (+https://github.com/alexsosn/CAL-MCP)"}

          class Routes(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.chapter = []
              def handle_starttag(self, tag, attrs):
                  if tag != "a":
                      return
                  href = dict(attrs).get("href") or ""
                  p = urlsplit(href)
                  if p.path.rsplit("/", 1)[-1] != "get_a_chapter.php":
                      return
                  self.chapter.append(parse_qs(p.query, keep_blank_values=True))

          def fetch(url):
              req = urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=20) as response:
                  body = response.read(262145)
                  if len(body) > 262144:
                      raise RuntimeError(f"response exceeded 256 KiB: {url}")
                  return response.status, body.decode("utf-8", "replace")

          out = {"subdivided": [], "direct": []}
          for file_id in LEGACY_SUBDIVIDED:
              status, html = fetch(
                  f"https://cal.huc.edu/showsubtexts.php?subtext={file_id}&cset=M"
              )
              p = Routes(); p.feed(html); p.close()
              subs = [
                  q["sub"][0]
                  for q in p.chapter
                  if q.get("file") == [file_id] and len(q.get("sub", [])) == 1
              ]
              out["subdivided"].append({
                  "file_id": file_id,
                  "status": status,
                  "count": len(subs),
                  "first": subs[:3],
                  "last": subs[-3:],
                  "widths": sorted(set(map(len, subs))),
                  "nonnumeric": [s for s in subs if not (s.isascii() and s.isdecimal())],
              })

          for file_id in LEGACY_DIRECT:
              status, html = fetch(
                  f"https://cal.huc.edu/get_a_chapter.php?cset=M&file={file_id}"
              )
              p = Routes(); p.feed(html); p.close()
              nav = [
                  {
                      "selectors": sorted(q),
                      "page": q.get("page"),
                      "sub": q.get("sub"),
                      "cset": q.get("cset"),
                      "clen": q.get("clen"),
                  }
                  for q in p.chapter
                  if q.get("file") == [file_id] and "page" in q
              ]
              out["direct"].append({
                  "file_id": file_id,
                  "status": status,
                  "navigation_count": len(nav),
                  "navigation": nav[:8],
              })
          print(json.dumps(out, sort_keys=True))
          PY
