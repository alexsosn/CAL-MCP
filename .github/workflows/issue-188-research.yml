name: Issue 188 Mandaic selector sequence audit

on:
  push:
    branches:
      - research/issue-188-mandaic-routing

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Classify current Mandaic child selector sequences
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from html.parser import HTMLParser
          from urllib.parse import parse_qs, urlsplit

          FILES = [
              "74401", "74402", "74410", "74411", "74421", "74422",
              "74423", "74428", "74430", "74432", "74701", "74923",
          ]
          UA = {"User-Agent": "CAL-MCP research/0.1 (+https://github.com/alexsosn/CAL-MCP)"}

          class Routes(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.links = []
                  self.current = None
              def handle_starttag(self, tag, attrs):
                  if tag != "a":
                      return
                  href = dict(attrs).get("href") or ""
                  p = urlsplit(href)
                  if p.path.rsplit("/", 1)[-1] != "get_a_chapter.php":
                      return
                  q = parse_qs(p.query, keep_blank_values=True)
                  if "file" in q and "sub" in q:
                      self.current = {"q": q, "parts": []}
              def handle_data(self, data):
                  if self.current is not None:
                      self.current["parts"].append(data)
              def handle_endtag(self, tag):
                  if tag == "a" and self.current is not None:
                      self.links.append((
                          self.current["q"],
                          " ".join("".join(self.current["parts"]).split()),
                      ))
                      self.current = None

          out = []
          for file_id in FILES:
              url = f"https://cal.huc.edu/showsubtexts.php?subtext={file_id}&cset=M"
              req = urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=20) as response:
                  body = response.read(262145)
                  if len(body) > 262144:
                      raise RuntimeError(f"{file_id}: response exceeded 256 KiB")
              p = Routes()
              p.feed(body.decode("utf-8", "replace"))
              p.close()
              pairs = [
                  (q["sub"][0], label)
                  for q, label in p.links
                  if q.get("file") == [file_id]
              ]
              selectors = [sub for sub, _ in pairs]
              numeric = [int(x) for x in selectors if x.isascii() and x.isdecimal()]
              gaps = [
                  [a, b]
                  for a, b in zip(numeric, numeric[1:])
                  if b != a + 1
              ]
              nonnumeric = [x for x in selectors if not (x.isascii() and x.isdecimal())]
              out.append({
                  "file_id": file_id,
                  "count": len(selectors),
                  "first_selector": selectors[0],
                  "last_selector": selectors[-1],
                  "numeric_min": min(numeric) if numeric else None,
                  "numeric_max": max(numeric) if numeric else None,
                  "numeric_count": len(numeric),
                  "gaps": gaps,
                  "nonnumeric": nonnumeric,
                  "small_selectors": selectors if len(selectors) <= 12 else None,
                  "first_labels": [label for _, label in pairs[:3]],
                  "last_labels": [label for _, label in pairs[-3:]],
              })
          print(json.dumps(out, ensure_ascii=False, sort_keys=True))
          PY
