name: Issue 188 Mandaic navigation edge audit

on:
  push:
    branches:
      - research/issue-188-mandaic-routing

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Audit sparse offset and colophon navigation
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from html.parser import HTMLParser
          from urllib.parse import parse_qs, urlsplit

          CASES = [
              ("74401", "12"),
              ("74401", "23"),
              ("74422", "106"),
              ("74421", "103"),
              ("74421", "col"),
          ]
          UA = {"User-Agent": "CAL-MCP research/0.1 (+https://github.com/alexsosn/CAL-MCP)"}

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.current = None
                  self.links = []
              def handle_starttag(self, tag, attrs):
                  if tag == "a":
                      self.current = {"href": dict(attrs).get("href") or "", "parts": []}
              def handle_data(self, data):
                  if self.current is not None:
                      self.current["parts"].append(data)
              def handle_endtag(self, tag):
                  if tag == "a" and self.current is not None:
                      self.links.append((
                          " ".join("".join(self.current["parts"]).split()),
                          self.current["href"],
                      ))
                      self.current = None

          out = []
          for file_id, sub in CASES:
              url = (
                  "https://cal.huc.edu/get_a_chapter.php?"
                  f"cset=M&file={file_id}&sub={sub}"
              )
              req = urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=20) as response:
                  body = response.read(262145)
                  if len(body) > 262144:
                      raise RuntimeError(f"{file_id}/{sub}: response exceeded 256 KiB")
                  html = body.decode("utf-8", "replace")
              p = Links(); p.feed(html); p.close()
              nav = []
              for label, href in p.links:
                  low = label.casefold()
                  if "previous page" not in low and "next page" not in low:
                      continue
                  u = urlsplit(href)
                  q = parse_qs(u.query, keep_blank_values=True)
                  nav.append({
                      "label": label,
                      "path": u.path.rsplit("/", 1)[-1],
                      "selectors": sorted(q),
                      "file": q.get("file"),
                      "sub": q.get("sub"),
                      "cset": q.get("cset"),
                  })
              out.append({
                  "file_id": file_id,
                  "submitted_sub": sub,
                  "navigation": nav,
              })
          print(json.dumps(out, ensure_ascii=False, sort_keys=True))
          PY
