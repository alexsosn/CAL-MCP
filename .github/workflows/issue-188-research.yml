name: Issue 188 Mandaic routing audit

on:
  push:
    branches:
      - research/issue-188-mandaic-routing

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Audit current subdivided selectors and direct pagination
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from html.parser import HTMLParser
          from urllib.parse import parse_qs, urlsplit

          SUBDIVIDED = [
              "74401", "74402", "74410", "74411", "74421", "74422",
              "74423", "74428", "74430", "74432", "74701", "74923",
          ]
          DIRECT = ["74424", "74501"]
          UA = {"User-Agent": "CAL-MCP research/0.1 (+https://github.com/alexsosn/CAL-MCP)"}

          def fetch(url, cap=262144):
              req = urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=20) as response:
                  body = response.read(cap + 1)
                  if len(body) > cap:
                      raise RuntimeError(f"response exceeded {cap} bytes: {url}")
                  return response.status, response.geturl(), body.decode("utf-8", "replace")

          class Routes(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.chapter = []
              def handle_starttag(self, tag, attrs):
                  if tag != "a":
                      return
                  href = dict(attrs).get("href") or ""
                  p = urlsplit(href)
                  if p.path.rsplit("/", 1)[-1] != "get_a_chapter.php":
                      return
                  q = parse_qs(p.query, keep_blank_values=True)
                  self.chapter.append(q)

          subdivided = []
          for file_id in SUBDIVIDED:
              status, final_url, html = fetch(
                  f"https://cal.huc.edu/showsubtexts.php?subtext={file_id}&cset=M"
              )
              p = Routes()
              p.feed(html)
              p.close()
              subs = []
              selector_sets = set()
              files = set()
              csets = set()
              for q in p.chapter:
                  if "file" not in q or "sub" not in q:
                      continue
                  files.update(q["file"])
                  subs.extend(q["sub"])
                  csets.update(q.get("cset", []))
                  selector_sets.add(tuple(sorted(q)))
              if not subs:
                  raise RuntimeError(f"{file_id}: no child routes")
              subdivided.append({
                  "file_id": file_id,
                  "status": status,
                  "route_count": len(subs),
                  "files": sorted(files),
                  "csets": sorted(csets),
                  "selector_sets": sorted(selector_sets),
                  "widths": sorted(set(map(len, subs))),
                  "first": subs[:3],
                  "last": subs[-3:],
                  "all_ascii_decimal": all(x.isascii() and x.isdecimal() for x in subs),
              })

          direct = []
          for file_id in DIRECT:
              status, final_url, html = fetch(
                  f"https://cal.huc.edu/get_a_chapter.php?cset=M&file={file_id}&page=0"
              )
              p = Routes()
              p.feed(html)
              p.close()
              nav = []
              for q in p.chapter:
                  if q.get("file") != [file_id] or "page" not in q:
                      continue
                  nav.append({
                      "selectors": sorted(q),
                      "page": q.get("page"),
                      "cset": q.get("cset"),
                      "clen": q.get("clen"),
                      "sub": q.get("sub"),
                  })
              direct.append({
                  "file_id": file_id,
                  "status": status,
                  "navigation": nav[:8],
                  "navigation_count": len(nav),
              })

          print(json.dumps({
              "subdivided": subdivided,
              "direct": direct,
              "request_count": len(SUBDIVIDED) + len(DIRECT),
          }, sort_keys=True))
          PY
