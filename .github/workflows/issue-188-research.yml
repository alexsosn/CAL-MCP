name: Issue 188 Mandaic catalogue audit

on:
  push:
    branches:
      - research/issue-188-mandaic-routing

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Audit current Mandaic catalogue routes
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from html.parser import HTMLParser
          from urllib.parse import parse_qs, urlsplit

          url = "https://cal.huc.edu/show_Mandaic.php?R1=74"
          req = urllib.request.Request(
              url,
              headers={"User-Agent": "CAL-MCP research/0.1 (+https://github.com/alexsosn/CAL-MCP)"},
          )
          with urllib.request.urlopen(req, timeout=20) as response:
              body = response.read(524289)
              if len(body) > 524288:
                  raise RuntimeError("response exceeded 512 KiB")
              html = body.decode("utf-8", "replace")

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.routes = []
              def handle_starttag(self, tag, attrs):
                  if tag != "a":
                      return
                  href = dict(attrs).get("href") or ""
                  p = urlsplit(href)
                  endpoint = p.path.rsplit("/", 1)[-1]
                  if endpoint not in {"showsubtexts.php", "get_a_chapter.php"}:
                      return
                  q = parse_qs(p.query, keep_blank_values=True)
                  if endpoint == "showsubtexts.php" and "subtext" in q:
                      self.routes.append({
                          "kind": "subdivided",
                          "id": q["subtext"][0],
                          "selectors": sorted(q),
                          "cset": q.get("cset"),
                      })
                  elif endpoint == "get_a_chapter.php" and "file" in q:
                      self.routes.append({
                          "kind": "direct",
                          "id": q["file"][0],
                          "selectors": sorted(q),
                          "cset": q.get("cset"),
                      })

          p = Links()
          p.feed(html)
          p.close()
          seen = {}
          for route in p.routes:
              seen[(route["kind"], route["id"])] = route
          routes = sorted(seen.values(), key=lambda x: (x["kind"], x["id"]))
          print(json.dumps({
              "count": len(routes),
              "subdivided": [r for r in routes if r["kind"] == "subdivided"],
              "direct": [r for r in routes if r["kind"] == "direct"],
          }, sort_keys=True))
          PY
