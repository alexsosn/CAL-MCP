name: Issue 170 live structural probe

on:
  push:
    branches:
      - dev/issue-170-cpa-subtext-ids

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Inspect CPA coordinate structure with one bounded GET
        run: |
          python - <<'PY'
          import re
          import urllib.request
          from html.parser import HTMLParser
          from urllib.parse import parse_qs, urlsplit

          url = "https://cal.huc.edu/get_a_chapter.php?file=55000&sub=01001a&cset=C&page=0"
          req = urllib.request.Request(
              url,
              headers={"User-Agent": "CAL-MCP research/0.1 (+https://github.com/alexsosn/CAL-MCP)"},
          )
          with urllib.request.urlopen(req, timeout=20) as response:
              body = response.read(512 * 1024).decode("utf-8", "replace")

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.hrefs = []
              def handle_starttag(self, tag, attrs):
                  if tag == "a":
                      href = dict(attrs).get("href")
                      if href:
                          self.hrefs.append(href)

          p = Links()
          p.feed(body)
          by_route = {}
          for href in p.hrefs:
              parsed = urlsplit(href)
              route = parsed.path.rsplit("/", 1)[-1]
              if route not in {"getlex.php", "bablex.php", "comment.php", "ask_ai_prompt.php", "get_file_info.php"}:
                  continue
              q = parse_qs(parsed.query, keep_blank_values=True)
              key = "coord"
              value = (q.get(key) or [""])[0]
              by_route.setdefault(route, []).append(value)

          for route, values in sorted(by_route.items()):
              unique = list(dict.fromkeys(values))
              print({
                  "route": route,
                  "count": len(values),
                  "unique_count": len(unique),
                  "samples": unique[:8],
                  "all_decimal": all(v.isdigit() for v in unique if v),
                  "patterns": sorted({
                      re.sub(r"[0-9]+", "#", v)
                      for v in unique
                      if v
                  })[:12],
              })
          PY
