name: Prove issue 42 cleanup RED

on:
  push:
    branches:
      - fix/issue-42-text-concordance-parser-drift
    paths:
      - .github/workflows/issue-42-cleanup-red.yml

permissions:
  contents: write

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 6f6ba692ca55b72488451c220f2409da87c5f4f3
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Materialize focused cleanup regression
        run: |
          cat > tests/test_issue42_cleanup_regression.py <<'PY'
          from pathlib import Path

          ROOT = Path(__file__).parents[1]


          def test_issue42_leaves_no_review_fix_helpers() -> None:
              leftovers = [
                  path.relative_to(ROOT).as_posix()
                  for path in (
                      ROOT / ".github/issue42_review_fix.py",
                      ROOT / ".github/workflows/issue42-review-fix.yml",
                  )
                  if path.exists()
              ]
              assert leftovers == []
          PY
      - name: Verify exact reviewed head is RED
        run: |
          python -m pip install 'pytest==8.4.2'
          set +e
          pytest tests/test_issue42_cleanup_regression.py > /tmp/cleanup-red.log 2>&1
          status=$?
          set -e
          cat /tmp/cleanup-red.log
          test "$status" -eq 1
          grep -q '.github/issue42_review_fix.py' /tmp/cleanup-red.log
          grep -q '.github/workflows/issue42-review-fix.yml' /tmp/cleanup-red.log
      - uses: actions/checkout@v6
        if: always()
        with:
          ref: fix/issue-42-text-concordance-parser-drift
      - name: Remove proof workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/issue-42-cleanup-red.yml
          git add .github/workflows/issue-42-cleanup-red.yml
          git commit -m "chore: remove issue 42 cleanup RED proof"
          git push origin HEAD:fix/issue-42-text-concordance-parser-drift
