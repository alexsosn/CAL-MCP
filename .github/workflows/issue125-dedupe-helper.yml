name: issue-125 collision cleanup

on:
  push:
    branches:
      - issue-125-syriac-root-discovery
    paths:
      - .github/workflows/issue125-dedupe-helper.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          ref: issue-125-syriac-root-discovery
          fetch-depth: 0
      - name: Remove duplicate selector helper and self-remove
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          from pathlib import Path

          path = Path("src/cal_mcp/syriac.py")
          text = path.read_text()
          old = '''def syriac_text_category_slugs() -> tuple[str, ...]:
              return tuple(_TEXT_CATEGORIES)
          
          
          def syriac_text_category_slugs() -> tuple[str, ...]:
              """Return supported public Syriac text-category selectors in service order."""
              return tuple(_TEXT_CATEGORIES)
          '''
          # Dedent the literal so the source anchor is exact.
          import textwrap
          old = textwrap.dedent(old)
          new = '''def syriac_text_category_slugs() -> tuple[str, ...]:
              """Return supported public Syriac text-category selectors in service order."""
              return tuple(_TEXT_CATEGORIES)
          '''
          new = textwrap.dedent(new)
          if text.count(old) != 1:
              raise SystemExit(f"unexpected duplicate helper anchor: {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY
          git add src/cal_mcp/syriac.py
          git rm .github/workflows/issue125-dedupe-helper.yml
          git diff --cached --check
          git commit -m "Remove duplicate Syriac selector helper"
          git push origin HEAD:issue-125-syriac-root-discovery
