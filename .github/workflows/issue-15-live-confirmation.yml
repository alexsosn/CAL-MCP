name: Issue 15 v0.1 live confirmation

on:
  push:
    branches:
      - release/issue-15-v0.1-resume
    paths:
      - .github/workflows/issue-15-live-confirmation.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install candidate
        run: python -m pip install .
      - name: Run fixed nine-request CAL live smoke
        run: python -m cal_mcp.live_smoke
