name: Apply reviewed Targum ignored-content fix

on:
  push:
    branches:
      - feat/issue-10-targum
    paths:
      - .github/workflows/fix-targum-ignored-content.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/issue-10-targum
      - name: Apply parser state fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src/cal_mcp/targum.py")
          text = path.read_text()

          def replace_in_block(start: str, end: str, replacements: list[tuple[str, str]]) -> None:
              global text
              start_at = text.index(start)
              end_at = text.index(end, start_at)
              block = text[start_at:end_at]
              for old, new in replacements:
                  count = block.count(old)
                  if count != 1:
                      raise SystemExit(
                          f"expected one match in {start}, found {count}: {old[:70]!r}"
                      )
                  block = block.replace(old, new, 1)
              text = text[:start_at] + block + text[end_at:]

          marker = "class _ParallelParser(HTMLParser):\n"
          if "_IGNORED_CONTENT_TAGS" not in text:
              text = text.replace(
                  marker,
                  '_IGNORED_CONTENT_TAGS = frozenset({"script", "style"})\n\n\n' + marker,
                  1,
              )

          ignored_start = (
              "        if tag in _IGNORED_CONTENT_TAGS:\n"
              "            self._ignored_depth += 1\n"
              "            return\n"
              "        if self._ignored_depth:\n"
              "            return\n"
          )
          ignored_end = (
              "        if self._ignored_depth:\n"
              "            if tag in _IGNORED_CONTENT_TAGS:\n"
              "                self._ignored_depth -= 1\n"
              "            return\n"
          )
          ignored_data = "        if self._ignored_depth:\n            return\n"

          replace_in_block(
              "class _ParallelParser(HTMLParser):\n",
              "@dataclass(slots=True)\nclass _TableCell:",
              [
                  (
                      "        self._block: _ParallelBlock | None = None\n",
                      "        self._block: _ParallelBlock | None = None\n"
                      "        self._ignored_depth = 0\n",
                  ),
                  (
                      "    def handle_starttag(self, tag: str, attrs: list[tuple[str, str | None]]) -> None:\n"
                      "        attributes = dict(attrs)\n",
                      "    def handle_starttag(self, tag: str, attrs: list[tuple[str, str | None]]) -> None:\n"
                      + ignored_start
                      + "        attributes = dict(attrs)\n",
                  ),
                  (
                      "    def handle_endtag(self, tag: str) -> None:\n",
                      "    def handle_endtag(self, tag: str) -> None:\n" + ignored_end,
                  ),
                  (
                      "    def handle_data(self, data: str) -> None:\n"
                      "        self.all_parts.append(data)\n",
                      "    def handle_data(self, data: str) -> None:\n"
                      + ignored_data
                      + "        self.all_parts.append(data)\n",
                  ),
                  (
                      "        else:\n"
                      "            self._block.label_parts.append(data)\n\n\n",
                      "        else:\n"
                      "            self._block.label_parts.append(data)\n\n"
                      "    def close(self) -> None:\n"
                      "        super().close()\n"
                      "        if self._ignored_depth:\n"
                      "            raise TargumParseError(\n"
                      "                \"CAL Targum page has an unclosed ignored content subtree\"\n"
                      "            )\n\n\n",
                  ),
              ],
          )

          replace_in_block(
              "class _SemanticTableParser(HTMLParser):\n",
              "@dataclass(slots=True)\nclass _OpenCandidate:",
              [
                  (
                      "        self._cell: _TableCell | None = None\n",
                      "        self._cell: _TableCell | None = None\n"
                      "        self._ignored_depth = 0\n",
                  ),
                  (
                      "    def handle_starttag(self, tag: str, attrs: list[tuple[str, str | None]]) -> None:\n"
                      "        attributes = dict(attrs)\n",
                      "    def handle_starttag(self, tag: str, attrs: list[tuple[str, str | None]]) -> None:\n"
                      + ignored_start
                      + "        attributes = dict(attrs)\n",
                  ),
                  (
                      "    def handle_endtag(self, tag: str) -> None:\n",
                      "    def handle_endtag(self, tag: str) -> None:\n" + ignored_end,
                  ),
                  (
                      "    def handle_data(self, data: str) -> None:\n"
                      "        self.all_parts.append(data)\n",
                      "    def handle_data(self, data: str) -> None:\n"
                      + ignored_data
                      + "        self.all_parts.append(data)\n",
                  ),
                  (
                      "        if self._cell is not None:\n"
                      "            self._cell.parts.append(data)\n\n\n",
                      "        if self._cell is not None:\n"
                      "            self._cell.parts.append(data)\n\n"
                      "    def close(self) -> None:\n"
                      "        super().close()\n"
                      "        if self._ignored_depth:\n"
                      "            raise TargumParseError(\n"
                      "                \"CAL Targum result has an unclosed ignored content subtree\"\n"
                      "            )\n\n\n",
                  ),
              ],
          )

          replace_in_block(
              "class _HebrewLemmaChooserParser(HTMLParser):\n",
              "_BOOK_IDS = {",
              [
                  (
                      "        self._open_candidate: _OpenCandidate | None = None\n",
                      "        self._open_candidate: _OpenCandidate | None = None\n"
                      "        self._ignored_depth = 0\n",
                  ),
                  (
                      "    def handle_starttag(self, tag: str, attrs: list[tuple[str, str | None]]) -> None:\n"
                      "        attributes = dict(attrs)\n",
                      "    def handle_starttag(self, tag: str, attrs: list[tuple[str, str | None]]) -> None:\n"
                      + ignored_start
                      + "        attributes = dict(attrs)\n",
                  ),
                  (
                      "    def handle_endtag(self, tag: str) -> None:\n",
                      "    def handle_endtag(self, tag: str) -> None:\n" + ignored_end,
                  ),
                  (
                      "    def handle_data(self, data: str) -> None:\n"
                      "        self.all_parts.append(data)\n",
                      "    def handle_data(self, data: str) -> None:\n"
                      + ignored_data
                      + "        self.all_parts.append(data)\n",
                  ),
                  (
                      "    def close(self) -> None:\n"
                      "        super().close()\n"
                      "        if self._in_target_form:\n",
                      "    def close(self) -> None:\n"
                      "        super().close()\n"
                      "        if self._ignored_depth:\n"
                      "            raise TargumParseError(\n"
                      "                \"CAL MT lemma chooser has an unclosed ignored content subtree\"\n"
                      "            )\n"
                      "        if self._in_target_form:\n",
                  ),
              ],
          )

          path.write_text(text)
          PY
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/cal_mcp/targum.py
          git commit -m "fix: ignore non-rendered Targum content"
          git push origin HEAD:feat/issue-10-targum
