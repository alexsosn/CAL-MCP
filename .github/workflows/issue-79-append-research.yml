name: Issue 79 append research record

on:
  push:
    branches:
      - fix/issue-79-tel-dan-text-page

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/issue-79-tel-dan-text-page
      - name: Append R-024 and remove helper
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('research.md')
          text=p.read_text(encoding='utf-8')
          marker='## R-024 — Current CAL text pages use more than one lexical-token link family'
          if marker not in text:
              text += '''\n\n## R-024 — Current CAL text pages use more than one lexical-token link family\n\n**Rechecked:** 2026-09-08.\n\nIssue #79's bounded Tel Dan probe established that current `get_a_chapter.php?file=13250` rows link lexical tokens through `getlex.php?coord=...&word=...&hasvariant=0`, while the current paginated `BT AZ` text (`file=71026`) still exposes `bablex.php?coord=...&word=...` token links. Tel Dan with and without upstream `page=0` returned the same 9,002-byte HTML, so page-number mapping is not the regression. The file-info link, unpaginated line text, decimal token coordinates/word indexes, and comment links remain semantically intact.\n\nDetailed evidence and probe load are recorded in `docs/research/issue-79-tel-dan-text-page.md`. The branch-only probe made four fixed Tel Dan GETs total and was removed before planning; no linked token analysis or neighboring text/page traversal occurred.\n\n**Implication:** text-page parsing must recognize both current CAL lexical-token endpoint families while preserving the exact returned URL and existing coordinate/index validation. Do not infer tokens from unlinked text, replace one endpoint globally with the other, or expose CAL-private link parameters in the MCP schema.\n'''
              p.write_text(text, encoding='utf-8')
          PY
          git rm .github/workflows/issue-79-append-research.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research.md
          git commit -m 'research: record current CAL token-link families'
          git push origin HEAD:fix/issue-79-tel-dan-text-page
