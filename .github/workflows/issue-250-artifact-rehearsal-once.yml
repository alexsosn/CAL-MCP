# One-time tag-free offline release artifact rehearsal. Remove immediately after enqueue.
name: Post-hardening wheel and sdist clean install, no tag (#250)
on:
  push:
    branches: [dev/issue-250-sdist-member-types]
    paths: [.github/workflows/issue-250-artifact-rehearsal-once.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install frozen installer and validation dependencies
        shell: bash
        run: |
          python -m pip install "pip==26.2.1" "setuptools==79.0.1"
          python -m pip install -e ".[dev]" \
            -c constraints/ci-py311.txt \
            --build-constraint constraints/build-py311.txt
          python -m pip check
      - name: Build one wheel and one sdist
        shell: bash
        env:
          PIP_BUILD_CONSTRAINT: constraints/build-py311.txt
        run: |
          python -m build --outdir dist
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 1
      - name: Verify version tag semantics and two clean stdio installs
        shell: bash
        run: |
          python scripts/verify_release_artifact.py dist --tag v0.1.0
          echo "PASS: verified untagged release-artifact rehearsal; no tag created and no CAL requests"
