name: Issue 41 apply parser fix

on:
  push:
    branches:
      - fix/issue-41-lexicon-citation-count-drift
    paths:
      - .github/workflows/issue-41-apply-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/issue-41-lexicon-citation-count-drift
      - name: Apply minimal parser patch and remove helper
        env:
          PATCH_B64: 
        run: |
          set -euo pipefail
          python -c "import base64,os; exec(base64.b64decode(os.environ['PATCH_B64']))"
          rm .github/workflows/issue-41-apply-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/cal_mcp/lexicon.py .github/workflows/issue-41-apply-fix.yml
          git commit -m 'fix: preserve current CAL citation structure'
          git push origin HEAD:fix/issue-41-lexicon-citation-count-drift
