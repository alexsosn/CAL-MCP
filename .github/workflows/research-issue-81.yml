name: Research issue 81 Tel Dan token analysis

on:
  push:
    branches: [fix/issue-81-token-analysis-tel-dan]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect one current CAL empty-analysis response
        shell: python
        run: |
          from html.parser import HTMLParser
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          class SemanticParser(HTMLParser):
              BLOCKS = {"address", "article", "aside", "blockquote", "div", "footer", "h1", "h2", "h3", "h4", "h5", "h6", "header", "li", "p", "section", "td", "th", "tr"}

              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.parts = []
                  self.lines = []
                  self.href = None
                  self.link_parts = []
                  self.links = []

              def handle_starttag(self, tag, attrs):
                  if tag in self.BLOCKS or tag == "br":
                      self.flush()
                  if tag == "a" and self.href is None:
                      self.href = dict(attrs).get("href", "")
                      self.link_parts = []

              def handle_data(self, data):
                  self.parts.append(data)
                  if self.href is not None:
                      self.link_parts.append(data)

              def handle_endtag(self, tag):
                  if tag == "a" and self.href is not None:
                      text = " ".join("".join(self.link_parts).split())
                      self.links.append((self.href, text))
                      self.href = None
                      self.link_parts = []
                  if tag in self.BLOCKS or tag == "br":
                      self.flush()

              def flush(self):
                  text = " ".join("".join(self.parts).split())
                  if text:
                      self.lines.append((text, tuple(self.links)))
                  self.parts = []
                  self.links = []

          query = urlencode({"coord": "1325007", "word": "1"})
          request = Request(
              f"https://cal.huc.edu/getlex.php?{query}",
              headers={"User-Agent": "CAL-MCP/0.1.0 (+https://github.com/alexsosn/CAL-MCP)"},
          )
          with urlopen(request, timeout=15) as response:
              body = response.read(512 * 1024 + 1)
              print("status", response.status, "bytes", len(body), "url", response.geturl())
              print("content_type", response.headers.get("Content-Type"))
          parser = SemanticParser()
          parser.feed(body.decode("utf-8", errors="replace"))
          parser.flush()
          for index, (text, links) in enumerate(parser.lines):
              print("line", index, repr(text[:500]))
              for href, label in links:
                  print("link", index, repr(href), repr(label[:200]))
