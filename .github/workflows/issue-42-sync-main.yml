name: Sync issue 42 with main

on:
  push:
    branches:
      - fix/issue-42-text-concordance-parser-drift
    paths:
      - .github/workflows/issue-42-sync-main.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/issue-42-text-concordance-parser-drift
          fetch-depth: 0
      - name: Configure merge identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Capture issue 42 research update
        shell: python
        run: |
          from pathlib import Path
          text = Path("research.md").read_text()
          marker = "## R-021 — Current one-text concordance rows are inline BR-delimited streams"
          start = text.index(marker)
          section = text[start:].lstrip()
          section = section.replace("## R-021 —", "## R-022 —", 1)
          Path("/tmp/issue42-research.txt").write_text("\n\n" + section)
      - name: Merge current main and resolve research append
        run: |
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e
          conflicts="$(git diff --name-only --diff-filter=U)"
          if [ -n "$conflicts" ] && [ "$conflicts" != "research.md" ]; then
            echo "Unexpected merge conflicts: $conflicts" >&2
            exit 1
          fi
          if [ "$merge_status" -ne 0 ] && [ "$conflicts" != "research.md" ]; then
            echo "Merge failed without the expected research.md-only conflict" >&2
            exit 1
          fi
          git checkout origin/main -- research.md
          cat /tmp/issue42-research.txt >> research.md
          git add research.md
          rm .github/workflows/issue-42-sync-main.yml
          git add -A
          git diff --check
      - name: Commit merged base
        run: |
          git commit -m "merge main into issue 42 after citation drift fix"
          git push origin HEAD:fix/issue-42-text-concordance-parser-drift
