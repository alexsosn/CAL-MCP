name: Issue 18 dependency research

on:
  push:
    branches:
      - issue-18-reproducible-ci
    paths:
      - .github/workflows/issue-18-research.yml

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Resolve current broad dependency ranges
        run: |
          python --version
          python -m pip --version
          python -m pip install -e ".[dev]"
          echo '--- runtime/dev freeze ---'
          python -m pip freeze --all
          echo '--- dependency check ---'
          python -m pip check
      - name: Resolve isolated Hatchling build closure
        run: |
          python -m venv .issue18-build-env
          .issue18-build-env/bin/python -m pip install --upgrade pip
          .issue18-build-env/bin/python -m pip install "hatchling>=1.27"
          echo '--- build freeze ---'
          .issue18-build-env/bin/python -m pip freeze --all
          echo '--- build dependency check ---'
          .issue18-build-env/bin/python -m pip check
