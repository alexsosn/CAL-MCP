name: Issue 170 acceptance live stdio verification

on:
  push:
    branches:
      - dev/issue-170-cpa-subtext-ids

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install candidate
        run: python -m pip install .
      - name: Verify CPA identifier/routing contract through installed stdio MCP
        run: |
          python - <<'PY'
          import asyncio
          import re
          from mcp import Client, StdioServerParameters

          async def main() -> None:
              async with Client(StdioServerParameters(command="cal-mcp")) as client:
                  catalogue = await client.call_tool(
                      "cal_text_catalogue",
                      {"category_id": "55"},
                  )
                  if catalogue.is_error:
                      raise RuntimeError(f"CPA catalogue failed: {catalogue.content!r}")
                  data = catalogue.structured_content
                  texts = data.get("texts") if isinstance(data, dict) else None
                  if not isinstance(texts, list):
                      raise RuntimeError("CPA catalogue missing texts")
                  match = next(
                      (
                          item
                          for item in texts
                          if isinstance(item, dict)
                          and item.get("file_id") == "55000"
                          and item.get("subtext_id") == "01001a"
                      ),
                      None,
                  )
                  if match is None:
                      raise RuntimeError("CPA catalogue does not expose 55000/01001a")

                  page_result = await client.call_tool(
                      "cal_text_page",
                      {"file_id": "55000", "subtext_id": "01001a"},
                  )
                  if page_result.is_error:
                      raise RuntimeError(f"CPA page failed: {page_result.content!r}")
                  pdata = page_result.structured_content
                  page = pdata.get("page") if isinstance(pdata, dict) else None
                  if not isinstance(page, dict):
                      raise RuntimeError("CPA page missing structured content")
                  text_ref = page.get("text")
                  if (
                      not isinstance(text_ref, dict)
                      or text_ref.get("file_id") != "55000"
                      or text_ref.get("subtext_id") != "01001a"
                  ):
                      raise RuntimeError(f"CPA page identity mismatch: {text_ref!r}")

                  lines = page.get("lines")
                  if not isinstance(lines, list) or not lines:
                      raise RuntimeError("CPA page returned no lines")
                  token = next(
                      (
                          token
                          for line in lines
                          if isinstance(line, dict)
                          for token in (line.get("tokens") or [])
                          if isinstance(token, dict)
                      ),
                      None,
                  )
                  if token is None:
                      raise RuntimeError("CPA page returned no lexical token")
                  coordinate = token.get("coordinate")
                  word_index = token.get("word_index")
                  if (
                      not isinstance(coordinate, str)
                      or re.fullmatch(r"[0-9]+[a-z][0-9]+", coordinate) is None
                      or not coordinate.startswith("5500001001a")
                  ):
                      raise RuntimeError(f"unexpected CPA coordinate: {coordinate!r}")
                  if not isinstance(word_index, int):
                      raise RuntimeError("CPA token has no integer word index")

                  analysis = await client.call_tool(
                      "cal_token_analysis",
                      {"coordinate": coordinate, "word_index": word_index},
                  )
                  token_outcome = "success"
                  if analysis.is_error:
                      structured = analysis.structured_content
                      error = structured.get("error") if isinstance(structured, dict) else None
                      if not isinstance(error, dict):
                          raise RuntimeError("token-analysis error lacks structured contract")
                      if error.get("kind") == "invalid_input" or error.get("upstream_reached") is False:
                          raise RuntimeError(f"CPA coordinate was rejected locally: {error!r}")
                      if error.get("kind") != "parser_drift" or error.get("upstream_reached") is not True:
                          raise RuntimeError(f"unexpected CPA token-analysis failure: {error!r}")
                      token_outcome = "parser_drift:#179"
                  else:
                      adata = analysis.structured_content
                      if not isinstance(adata, dict) or adata.get("coordinate") != coordinate:
                          raise RuntimeError("CPA token-analysis success changed coordinate")

                  print(
                      f"live #170 OK: catalogue_texts={len(texts)} lines={len(lines)} "
                      f"coordinate={coordinate} word_index={word_index} "
                      f"token_followup={token_outcome}"
                  )

          asyncio.run(main())
          PY
