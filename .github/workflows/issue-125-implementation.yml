name: Issue 125 implementation patch

on:
  push:
    branches:
      - issue-125-syriac-root-discovery

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: issue-125-syriac-root-discovery
      - name: Apply focused implementation
        run: |
          python - <<'PY'
          from pathlib import Path

          syriac = Path('src/cal_mcp/syriac.py')
          text = syriac.read_text()
          marker = '''_MISSING_WORD_PATHS = {\n'''
          insertion = '''def syriac_text_category_slugs() -> tuple[str, ...]:\n    """Return supported public Syriac text-category selectors in service order."""\n    return tuple(_TEXT_CATEGORIES)\n\n\n'''
          if insertion not in text:
              if marker not in text:
                  raise SystemExit('syriac insertion marker missing')
              text = text.replace(marker, insertion + marker, 1)
              syriac.write_text(text)

          texts = Path('src/cal_mcp/texts.py')
          text = texts.read_text()
          old = '''from cal_mcp.lexicon import _Line, _Link, _parse_lines\n'''
          new = old + '''from cal_mcp.syriac import syriac_text_category_slugs\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit('texts import marker missing')
              text = text.replace(old, new, 1)

          old = '''_ONKELOS_JONATHAN_LABEL = "Targums Onkelos and Jonathan to the Prophets"\n'''
          new = old + '''_SYRIAC_COLLECTION_KEY = "syriac"\n_SYRIAC_ROOT_PATH = "AvailSyr.html"\n_SYRIAC_ROOT_LABEL = "Syriac"\n_SYRIAC_FOLLOW_UP_TOOL = "cal_syriac_texts"\n_SYRIAC_SELECTOR_NAME = "category"\n_ROOT_CATALOGUE_PATH = "newtextmenu.html"\n'''
          if '_SYRIAC_COLLECTION_KEY = "syriac"' not in text:
              if old not in text:
                  raise SystemExit('texts constants marker missing')
              text = text.replace(old, new, 1)

          old = '''@dataclass(frozen=True, slots=True)\nclass TextCategoryRef:\n    category_id: str\n    label: str\n\n\n'''
          new = old + '''@dataclass(frozen=True, slots=True)\nclass TextSpecializedCollectionRef:\n    collection_key: str\n    label: str\n    follow_up_tool: str\n    selector_name: str\n    supported_selectors: tuple[str, ...]\n\n\n'''
          if 'class TextSpecializedCollectionRef:' not in text:
              if old not in text:
                  raise SystemExit('specialized model marker missing')
              text = text.replace(old, new, 1)

          old = '''class TextCataloguePage:\n    categories: tuple[TextCategoryRef, ...]\n    texts: tuple[TextRef, ...]\n'''
          new = old + '''    specialized_collections: tuple[TextSpecializedCollectionRef, ...] = ()\n'''
          if 'class TextCataloguePage:' in text and '    specialized_collections: tuple[TextSpecializedCollectionRef, ...] = ()' not in text:
              if old not in text:
                  raise SystemExit('catalogue page marker missing')
              text = text.replace(old, new, 1)

          old = '''class TextCatalogueResult:\n    categories: tuple[TextCategoryRef, ...]\n    texts: tuple[TextRef, ...]\n    provenance: TextProvenance\n\n    def to_dict(self) -> dict[str, object]:\n        return {\n            "categories": [_category_to_dict(item) for item in self.categories],\n            "texts": [_text_ref_to_dict(item) for item in self.texts],\n            "provenance": _provenance_to_dict(self.provenance),\n        }\n'''
          new = '''class TextCatalogueResult:\n    categories: tuple[TextCategoryRef, ...]\n    texts: tuple[TextRef, ...]\n    provenance: TextProvenance\n    specialized_collections: tuple[TextSpecializedCollectionRef, ...] = ()\n\n    def to_dict(self) -> dict[str, object]:\n        return {\n            "categories": [_category_to_dict(item) for item in self.categories],\n            "texts": [_text_ref_to_dict(item) for item in self.texts],\n            "specialized_collections": [\n                _specialized_collection_to_dict(item) for item in self.specialized_collections\n            ],\n            "provenance": _provenance_to_dict(self.provenance),\n        }\n'''
          if 'class TextCatalogueResult:' in text and '    specialized_collections: tuple[TextSpecializedCollectionRef, ...] = ()' not in text.split('class TextCatalogueResult:',1)[1].split('class TextSearchResult:',1)[0]:
              if old not in text:
                  raise SystemExit('catalogue result marker missing')
              text = text.replace(old, new, 1)

          old = '''def parse_text_catalogue_page(response: CalResponse) -> TextCataloguePage:\n    categories: list[TextCategoryRef] = []\n    texts: list[TextRef] = []\n\n    for line in _parse_lines(response):\n        for link in line.links:\n            category = _category_from_link(link)\n            if category is not None:\n                categories.append(category)\n                continue\n            text = _text_ref_from_link(link)\n            if text is not None:\n                texts.append(text)\n\n    if not categories and not texts:\n        raise TextParseError("CAL text catalogue contains no recognizable category or text links")\n    return TextCataloguePage(categories=tuple(categories), texts=tuple(texts))\n'''
          new = '''def parse_text_catalogue_page(response: CalResponse) -> TextCataloguePage:\n    categories: list[TextCategoryRef] = []\n    texts: list[TextRef] = []\n    specialized_collections: list[TextSpecializedCollectionRef] = []\n    specialized_keys: set[str] = set()\n    is_root = _is_root_catalogue_response(response.url)\n\n    for line in _parse_lines(response):\n        for link in line.links:\n            if is_root:\n                specialized = _specialized_collection_from_link(link)\n                if specialized is not None:\n                    if specialized.collection_key in specialized_keys:\n                        raise TextParseError("CAL text catalogue repeats a specialized collection")\n                    specialized_keys.add(specialized.collection_key)\n                    specialized_collections.append(specialized)\n                    continue\n            category = _category_from_link(link)\n            if category is not None:\n                categories.append(category)\n                continue\n            text = _text_ref_from_link(link)\n            if text is not None:\n                texts.append(text)\n\n    if not categories and not texts and not specialized_collections:\n        raise TextParseError("CAL text catalogue contains no recognizable category or text links")\n    return TextCataloguePage(\n        categories=tuple(categories),\n        texts=tuple(texts),\n        specialized_collections=tuple(specialized_collections),\n    )\n'''
          if 'specialized_collections: list[TextSpecializedCollectionRef]' not in text:
              if old not in text:
                  raise SystemExit('parser marker missing')
              text = text.replace(old, new, 1)

          old = '''        return TextCatalogueResult(\n            categories=result.value.categories,\n            texts=result.value.texts,\n            provenance=TextProvenance(\n'''
          new = '''        return TextCatalogueResult(\n            categories=result.value.categories,\n            texts=result.value.texts,\n            provenance=TextProvenance(\n'''
          # Insert propagation after the provenance block using the exact closing shape below.
          old_block = '''                operation="catalogue",\n                category_id=normalized_category,\n            ),\n        )\n'''
          new_block = '''                operation="catalogue",\n                category_id=normalized_category,\n            ),\n            specialized_collections=result.value.specialized_collections,\n        )\n'''
          catalogue_segment = text.split('async def catalogue',1)[1].split('async def search',1)[0]
          if 'specialized_collections=result.value.specialized_collections' not in catalogue_segment:
              if old_block not in catalogue_segment:
                  raise SystemExit('service propagation marker missing')
              prefix, rest = text.split('async def catalogue',1)
              catalogue, suffix = rest.split('async def search',1)
              catalogue = catalogue.replace(old_block, new_block, 1)
              text = prefix + 'async def catalogue' + catalogue + 'async def search' + suffix

          insertion_marker = '''def _category_from_link(link: _Link) -> TextCategoryRef | None:\n'''
          helper = '''def _is_root_catalogue_response(url: str) -> bool:\n    parsed = urlsplit(url)\n    return parsed.path == f"/{_ROOT_CATALOGUE_PATH}" and not parsed.query and not parsed.fragment\n\n\ndef _specialized_collection_from_link(link: _Link) -> TextSpecializedCollectionRef | None:\n    label = link.text.strip()\n    parsed = urlsplit(link.href)\n    exact_path = (\n        not parsed.scheme\n        and not parsed.netloc\n        and parsed.path in (_SYRIAC_ROOT_PATH, f"/{_SYRIAC_ROOT_PATH}")\n    )\n    if exact_path:\n        if parsed.query or parsed.fragment:\n            raise TextParseError("CAL Syriac catalogue route changed unexpectedly")\n        if not label:\n            raise TextParseError("CAL Syriac catalogue link has no label")\n        return TextSpecializedCollectionRef(\n            collection_key=_SYRIAC_COLLECTION_KEY,\n            label=label,\n            follow_up_tool=_SYRIAC_FOLLOW_UP_TOOL,\n            selector_name=_SYRIAC_SELECTOR_NAME,\n            supported_selectors=syriac_text_category_slugs(),\n        )\n    if label == _SYRIAC_ROOT_LABEL:\n        raise TextParseError("CAL Syriac catalogue route changed unexpectedly")\n    return None\n\n\n'''
          if 'def _specialized_collection_from_link' not in text:
              if insertion_marker not in text:
                  raise SystemExit('specialized helper marker missing')
              text = text.replace(insertion_marker, helper + insertion_marker, 1)

          marker = '''def _category_to_dict(category: TextCategoryRef) -> dict[str, object]:\n    return {"category_id": category.category_id, "label": category.label}\n\n\n'''
          serializer = marker + '''def _specialized_collection_to_dict(\n    collection: TextSpecializedCollectionRef,\n) -> dict[str, object]:\n    return {\n        "collection_key": collection.collection_key,\n        "label": collection.label,\n        "follow_up_tool": collection.follow_up_tool,\n        "selector_name": collection.selector_name,\n        "supported_selectors": list(collection.supported_selectors),\n    }\n\n\n'''
          if 'def _specialized_collection_to_dict' not in text:
              if marker not in text:
                  raise SystemExit('serializer marker missing')
              text = text.replace(marker, serializer, 1)

          old = '''    "TextSearchResult",\n    "TextService",\n    "TextToken",\n'''
          new = '''    "TextSearchResult",\n    "TextService",\n    "TextSpecializedCollectionRef",\n    "TextToken",\n'''
          if '    "TextSpecializedCollectionRef",' not in text:
              if old not in text:
                  raise SystemExit('__all__ marker missing')
              text = text.replace(old, new, 1)

          texts.write_text(text)
          PY
      - name: Commit implementation and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/issue-125-implementation.yml
          git add src/cal_mcp/texts.py src/cal_mcp/syriac.py
          git commit -m "feat: expose Syriac specialized root discovery"
          git push origin HEAD:issue-125-syriac-root-discovery
