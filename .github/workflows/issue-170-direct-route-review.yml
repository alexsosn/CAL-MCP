name: Issue 170 direct CPA route review

on:
  push:
    branches:
      - dev/issue-170-cpa-subtext-ids

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Inspect CPA get_a_chapter routes without sub
        run: |
          python - <<'PY'
          import urllib.request
          from html.parser import HTMLParser
          from urllib.parse import parse_qs, urlsplit

          url = "https://cal.huc.edu/showsubtexts.php?subtext=55"
          req = urllib.request.Request(
              url,
              headers={"User-Agent": "CAL-MCP review/0.1 (+https://github.com/alexsosn/CAL-MCP)"},
          )
          with urllib.request.urlopen(req, timeout=20) as response:
              body = response.read().decode("utf-8", "replace")

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.hrefs = []
              def handle_starttag(self, tag, attrs):
                  if tag == "a":
                      href = dict(attrs).get("href")
                      if href:
                          self.hrefs.append(href)

          p = Links()
          p.feed(body)
          routes = []
          for href in p.hrefs:
              u = urlsplit(href)
              if u.path.rsplit("/", 1)[-1] != "get_a_chapter.php":
                  continue
              q = parse_qs(u.query, keep_blank_values=True)
              if "sub" in q:
                  continue
              routes.append({
                  "file": (q.get("file") or ["?"])[0],
                  "cset": (q.get("cset") or ["<missing>"])[0],
                  "keys": tuple(sorted(q)),
              })
          print({"direct_route_count": len(routes), "routes": routes})
          PY
