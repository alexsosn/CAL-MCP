# Offline one-shot RED proof; remove trigger after enqueue.
name: Issue 246 test-first behavior RED witness
on:
  push:
    branches: [research/issue-246-preimplementation-red]
    paths: [.github/workflows/issue-246-preimplementation-red-once.yml]
permissions:
  contents: read
jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install offline developer dependencies
        run: python -m pip install -e ".[dev]"
      - name: Formatter and linter preconditions
        run: |
          ruff check tests/test_targum_concordance_examples.py
          ruff format --check tests/test_targum_concordance_examples.py
      - name: Expected feature-not-implemented test failures
        run: pytest -q tests/test_targum_concordance_examples.py
