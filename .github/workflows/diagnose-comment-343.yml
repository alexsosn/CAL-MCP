name: One-off issue 343 CAL comment structure diagnostic

# Scoped, nonpublishing workflow; delete after one measured run.
on:
  push:
    branches: [fix/live-line-comments-drift-343]
    paths: [.github/workflows/diagnose-comment-343.yml]

permissions:
  contents: read

concurrency:
  group: cal-mcp-live-smoke
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build nonpublishing artifact
        run: |
          python -m pip install --disable-pip-version-check "build>=1.3,<2"
          python -m build --outdir dist
      - name: Install exactly one wheel outside checkout
        shell: bash
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          python -m venv "$RUNNER_TEMP/cal-comment-343"
          "$RUNNER_TEMP/cal-comment-343/bin/python" -m pip install \
            --disable-pip-version-check --no-cache-dir "${wheels[0]}"
      - name: Verify fixed Tel Dan parser in installed wheel with exact two-request evidence
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/cal-comment-343/bin/python" -m cal_mcp.line_comments_diagnostic | \
            "$RUNNER_TEMP/cal-comment-343/bin/python" -c 'import json,sys; r=json.load(sys.stdin); s=r.get("structure", {}); assert r.get("status")=="measured" and r.get("actual_cal_transport_attempts")==2 and s.get("parse_status")=="found" and s.get("title_matches") is True and s.get("summary_cards")==1 and s.get("record_count",0)>=1; print(json.dumps(r,sort_keys=True))'
