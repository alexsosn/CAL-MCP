name: One-off issue 343 CAL comment structure diagnostic

# Scoped, nonpublishing workflow; delete after one measured run.
on:
  push:
    branches: [fix/live-line-comments-drift-343]
    paths: [.github/workflows/diagnose-comment-343.yml]

permissions:
  contents: read

concurrency:
  group: cal-mcp-live-smoke
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build nonpublishing artifact
        run: |
          python -m pip install --disable-pip-version-check "build>=1.3,<2"
          python -m build --outdir dist
      - name: Install exactly one wheel outside checkout
        shell: bash
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          python -m venv "$RUNNER_TEMP/cal-comment-343"
          "$RUNNER_TEMP/cal-comment-343/bin/python" -m pip install \
            --disable-pip-version-check --no-cache-dir "${wheels[0]}"
      - name: At most two CAL starts, 60-second gap, finite parser reasons and tags only
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/cal-comment-343/bin/python" -m cal_mcp.line_comments_diagnostic
