# One-time issue #157 acceptance. Remove after inspecting the run.
name: One-time CAL-MCP installed-stdio acceptance (#157)

on:
  push:
    branches:
      - dev/issue-157-stdio-release-smoke
    paths:
      - .github/workflows/issue-157-one-time-live-acceptance.yml

permissions:
  contents: read

concurrency:
  group: cal-mcp-live-smoke
  cancel-in-progress: false

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build exactly one candidate wheel
        run: |
          python -m pip install --disable-pip-version-check build
          python -m build --wheel --outdir dist
      - name: Install wheel without source shadowing
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          python -m venv "$RUNNER_TEMP/cal-mcp-acceptance"
          "$RUNNER_TEMP/cal-mcp-acceptance/bin/python" -m pip install \
            --disable-pip-version-check --no-cache-dir "${wheels[0]}"
      - name: Installed-wheel stdio MCP live acceptance (one bounded invocation)
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/cal-mcp-acceptance/bin/python" -m cal_mcp.stdio_live_smoke \
            --executable "$RUNNER_TEMP/cal-mcp-acceptance/bin/cal-mcp"
