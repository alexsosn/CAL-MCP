name: Issue 188 adversarial direct-page audit

on:
  push:
    branches:
      - dev/issue-188-mandaic-routing

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install candidate
        run: python -m pip install .
      - name: Audit page 2 of every current direct Mandaic text
        run: |
          python - <<'PY'
          import asyncio
          import json
          from mcp import Client, StdioServerParameters

          DIRECT = ["74420","74424","74425","74426","74427","74429","74431","74501"]

          async def main():
              out = []
              async with Client(StdioServerParameters(command="cal-mcp")) as client:
                  for file_id in DIRECT:
                      result = await client.call_tool(
                          "cal_text_page",
                          {"file_id": file_id, "page": 2},
                      )
                      if result.is_error:
                          payload = None
                          if isinstance(result.structured_content, dict):
                              payload = result.structured_content
                          out.append({
                              "file_id": file_id,
                              "is_error": True,
                              "error": payload.get("error") if payload else None,
                          })
                          continue
                      data = result.structured_content
                      page = data.get("page") if isinstance(data, dict) else None
                      out.append({
                          "file_id": file_id,
                          "is_error": False,
                          "status": data.get("status") if isinstance(data, dict) else None,
                          "page": page.get("page") if isinstance(page, dict) else None,
                          "page_count": page.get("page_count") if isinstance(page, dict) else None,
                          "total_lines": page.get("total_lines") if isinstance(page, dict) else None,
                          "previous_page": page.get("previous_page") if isinstance(page, dict) else None,
                          "next_page": page.get("next_page") if isinstance(page, dict) else None,
                          "line_count": len(page.get("lines") or []) if isinstance(page, dict) else None,
                      })
              print(json.dumps({"logical_calls":len(DIRECT),"results":out}, sort_keys=True))

          asyncio.run(main())
          PY
