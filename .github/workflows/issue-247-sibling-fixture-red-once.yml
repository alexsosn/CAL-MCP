# Formatting-clean correction RED: old parser against observed sibling CAL fixture.
name: Targum issue 247 sibling-structure RED witness
on:
  push:
    branches: [research/issue-247-sibling-red]
    paths: [.github/workflows/issue-247-sibling-fixture-red-once.yml]
permissions:
  contents: read
jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install offline test environment
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff check tests/test_targum_reflex_examples.py
          ruff format --check tests/test_targum_reflex_examples.py
      - name: Expected sibling-fixture red failures from prior nested parser
        run: pytest -q tests/test_targum_reflex_examples.py
