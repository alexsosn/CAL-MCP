name: Issue 175 bounded browse research

on:
  push:
    branches:
      - dev/issue-175-lexicon-browse-crossrefs

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install candidate
        run: python -m pip install .
      - name: Pin which current browse candidate shapes fail
        run: |
          python - <<'PY'
          from datetime import UTC, datetime
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          from cal_mcp.client import CalResponse
          from cal_mcp.lexicon import (
              _lemma_key_from_href,
              _parse_lemma_header,
              _parse_lines,
              parse_browse_page,
          )

          for prefix in ("$l", "by"):
              query = urlencode({"first3": f'"{prefix}"'})
              url = f"https://cal.huc.edu/browseSKEYheaders.php?{query}"
              req = Request(url, headers={"User-Agent": "CAL-MCP bounded issue-175 research"})
              with urlopen(req, timeout=20) as response:
                  raw = response.read()
              cal = CalResponse(
                  status_code=200,
                  url=url,
                  body=raw,
                  content_type="text/html; charset=UTF-8",
                  retrieved_at=datetime.now(UTC),
              )
              try:
                  page = parse_browse_page(cal)
                  print("PARSE", prefix, "ok", len(page.entries))
              except Exception as exc:
                  print("PARSE", prefix, type(exc).__name__, str(exc))

              for line in _parse_lines(cal):
                  for link in line.links:
                      key = _lemma_key_from_href(link.href)
                      if key is None:
                          continue
                      parsed = _parse_lemma_header(
                          link.text,
                          lemma_key=key,
                          require_gloss=False,
                      )
                      before = line.text.split(link.text, 1)[0]
                      print(
                          "CANDIDATE", prefix,
                          "key", repr(key),
                          "link_text", repr(link.text),
                          "arrow_before", "→" in before,
                          "header_parse", parsed is not None,
                      )
          PY
