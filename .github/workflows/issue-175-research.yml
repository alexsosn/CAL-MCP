name: Issue 175 bounded browse research

on:
  push:
    branches:
      - dev/issue-175-lexicon-browse-crossrefs

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Inspect three explicit current browse pages
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from urllib.parse import parse_qs, urlencode, urlsplit
          from urllib.request import Request, urlopen

          PREFIXES = ["$l", "$lh", "$l)"]

          class CellParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.cells = []
                  self._depth = 0
                  self._parts = []
                  self._links = []
                  self._link = None

              def handle_starttag(self, tag, attrs):
                  if tag == "td":
                      if self._depth == 0:
                          self._parts = []
                          self._links = []
                      self._depth += 1
                      return
                  if self._depth and tag == "a" and self._link is None:
                      self._link = {"href": dict(attrs).get("href") or "", "parts": []}

              def handle_endtag(self, tag):
                  if tag == "a" and self._link is not None:
                      self._links.append(
                          (self._link["href"], " ".join("".join(self._link["parts"]).split()))
                      )
                      self._link = None
                      return
                  if tag == "td" and self._depth:
                      self._depth -= 1
                      if self._depth == 0:
                          self.cells.append(
                              (" ".join("".join(self._parts).split()), tuple(self._links))
                          )

              def handle_data(self, data):
                  if self._depth:
                      self._parts.append(data)
                      if self._link is not None:
                          self._link["parts"].append(data)

          for prefix in PREFIXES:
              query = urlencode({"first3": f'"{prefix}"'})
              url = f"https://cal.huc.edu/browseSKEYheaders.php?{query}"
              req = Request(url, headers={"User-Agent": "CAL-MCP bounded issue-175 research"})
              with urlopen(req, timeout=20) as response:
                  body = response.read().decode("utf-8", errors="replace")
                  print("PAGE", prefix, "status", response.status, "bytes", len(body))

              parser = CellParser()
              parser.feed(body)
              parser.close()

              candidates = []
              crossrefs = []
              bracketed = []
              for text, links in parser.cells:
                  lemma_links = []
                  for href, link_text in links:
                      parsed = urlsplit(href)
                      if parsed.path.endswith("oneentry.php"):
                          q = parse_qs(parsed.query, keep_blank_values=True)
                          lemma_links.append((href, link_text, q))
                  if not lemma_links:
                      continue
                  candidates.append((text, lemma_links))
                  if "→" in text:
                      crossrefs.append((text, lemma_links))
                  if any(link_text.startswith("[") for _, link_text, _ in lemma_links):
                      bracketed.append((text, lemma_links))

              print(
                  "COUNTS", prefix,
                  "candidate_cells", len(candidates),
                  "crossrefs", len(crossrefs),
                  "bracketed_linked_headers", len(bracketed),
              )
              for text, lemma_links in crossrefs[:8]:
                  source = text.split("→", 1)[0].strip()
                  targets = []
                  for _, _, q in lemma_links:
                      targets.append({
                          "lemma": q.get("lemma"),
                          "cits": q.get("cits"),
                          "keys": sorted(q),
                      })
                  print("XREF", prefix, repr(source), targets)
              for text, lemma_links in bracketed[:3]:
                  print(
                      "BRACKET", prefix,
                      [link_text for _, link_text, _ in lemma_links],
                  )
          PY
