name: issue-113 KWIC full-context implementation v2

on:
  push:
    branches:
      - issue-113-kwic-full-context
    paths:
      - .github/workflows/issue-113-implement-v2.yml

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: issue-113-kwic-full-context
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install validation environment
        run: python -m pip install -e '.[dev]'
      - name: Apply corrected frozen-plan production patch
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          helper = Path('.github/workflows/issue-113-implement.yml')
          text = helper.read_text()
          old = '''          service_method = textwrap.dedent(service_method)
          # Re-indent only the service method itself; preserve top-level parser anchor.
          split = service_method.index("\\n\\ndef _parse_kwic_hits")
          before = service_method[:split]
          after = service_method[split:]
          lines = before.splitlines()
          # First line is the existing return at 8 spaces; method block starts at line 2.
          rebuilt = [lines[0], ""] + ["    " + line if line else "" for line in lines[2:]]
          service_method = "\\n".join(rebuilt) + after
          text = replace_once(text, service_anchor, service_method, "service method")
'''
          new = '''          service_lines = service_method.splitlines()
          expected_return = "        return _kwic_result(canonical_key, KwicScopeKind.DIALECT, result.value, provenance)"
          if not service_lines or service_lines[0] != expected_return:
              raise SystemExit("service method: unexpected first line")
          normalized_service_lines = [service_lines[0], service_lines[1]]
          for line in service_lines[2:]:
              if line and not line.startswith("          "):
                  raise SystemExit(f"service method: unexpected indentation: {line!r}")
              normalized_service_lines.append(line[10:] if line else "")
          service_method = "\\n".join(normalized_service_lines)
          text = replace_once(text, service_anchor, service_method, "service method")
'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one buggy service transform, found {text.count(old)}')
          text = text.replace(old, new, 1)

          lines = text.splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "python - <<'PY'") + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'PY')
          script_lines = []
          for line in lines[start:end]:
              if line and not line.startswith('          '):
                  raise SystemExit(f'patch extraction: unexpected YAML indentation: {line!r}')
              script_lines.append(line[10:] if line else '')
          Path('/tmp/issue113_patch.py').write_text('\n'.join(script_lines) + '\n')
          PY
          python /tmp/issue113_patch.py
          ruff format src/cal_mcp/concordance.py src/cal_mcp/server.py src/cal_mcp/release_surface.py
          ruff check src/cal_mcp/concordance.py src/cal_mcp/server.py src/cal_mcp/release_surface.py
          mypy
          pytest -q tests/test_kwic_full_context.py tests/test_concordance.py tests/test_concordance_current_shape_regression.py tests/test_concordance_review_regressions.py tests/test_texts.py
      - name: Commit validated production change and remove helpers
        run: |
          set -euo pipefail
          rm .github/workflows/issue-113-implement.yml .github/workflows/issue-113-implement-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/cal_mcp/concordance.py src/cal_mcp/server.py src/cal_mcp/release_surface.py .github/workflows/issue-113-implement.yml .github/workflows/issue-113-implement-v2.yml
          git diff --cached --check
          git commit -m "Implement typed KWIC full-context follow-up"
          git push origin HEAD:issue-113-kwic-full-context
