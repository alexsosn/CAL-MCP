name: issue-127 lexicon parent patch

on:
  push:
    branches:
      - issue-127-lexicon-citation-context
    paths:
      - .github/workflows/issue127-lexicon-parent-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          ref: issue-127-lexicon-citation-context
          fetch-depth: 0
      - name: Patch typed citation selector and self-remove
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          from pathlib import Path

          path = Path("src/cal_mcp/lexicon.py")
          text = path.read_text()

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one anchor, found {count}")
              text = text.replace(old, new, 1)

          replace_once(
              '''class Citation:\n    reference: str | None\n    url: str | None\n    text: str\n''',
              '''class Citation:\n    reference: str | None\n    url: str | None\n    text: str\n    full_coordinate: str | None = None\n''',
              "Citation model",
          )

          replace_once(
              '''        reference = link.text.removesuffix("↗").strip()\n        citations.append(\n            Citation(\n                reference=reference,\n                url=urljoin(base_url, link.href) if link.href else None,\n                text=linked_text,\n            )\n        )\n''',
              '''        reference = link.text.removesuffix("↗").strip()\n        resolved_url = urljoin(base_url, link.href) if link.href else None\n        citations.append(\n            Citation(\n                reference=reference,\n                url=resolved_url,\n                text=linked_text,\n                full_coordinate=_citation_full_coordinate(resolved_url),\n            )\n        )\n''',
              "linked citation construction",
          )

          replace_once(
              '''def _raw_citation(text: str) -> Citation:\n    return Citation(reference=None, url=None, text=text)\n\n\n''',
              '''def _raw_citation(text: str) -> Citation:\n    return Citation(reference=None, url=None, text=text)\n\n\ndef _citation_full_coordinate(url: str | None) -> str | None:\n    if url is None:\n        return None\n    parsed = urlsplit(url)\n    if (\n        parsed.scheme != "https"\n        or parsed.netloc != "cal.huc.edu"\n        or parsed.path != "/showachapter.php"\n        or parsed.fragment\n    ):\n        return None\n    query = parse_qs(parsed.query, keep_blank_values=True)\n    if set(query) != {"fullcoord"}:\n        return None\n    values = query.get("fullcoord")\n    if values is None or len(values) != 1:\n        return None\n    value = values[0]\n    if not value or not value.isascii() or not value.isdecimal() or int(value) < 1:\n        return None\n    return value\n\n\n''',
              "citation selector helper",
          )

          replace_once(
              '''def _citation_to_dict(citation: Citation) -> dict[str, object]:\n    return {"reference": citation.reference, "url": citation.url, "text": citation.text}\n''',
              '''def _citation_to_dict(citation: Citation) -> dict[str, object]:\n    return {\n        "reference": citation.reference,\n        "url": citation.url,\n        "text": citation.text,\n        "full_coordinate": citation.full_coordinate,\n    }\n''',
              "citation serializer",
          )

          path.write_text(text)
          PY
          git add src/cal_mcp/lexicon.py
          git rm .github/workflows/issue127-lexicon-parent-patch.yml
          git diff --cached --check
          git commit -m "Expose typed lexicon citation coordinates"
          git push origin HEAD:issue-127-lexicon-citation-context
