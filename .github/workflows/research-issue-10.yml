name: Research issue 10 Targum contracts

on:
  push:
    branches:
      - feat/issue-10-targum
    paths:
      - .github/workflows/research-issue-10.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Finish bounded CAL Targum edge-case audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from html.parser import HTMLParser
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          class P(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.text=[]; self.links=[]; self.options=[]; self._option=None
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  if tag=='a' and a.get('href'): self.links.append(a['href'])
                  if tag=='option': self._option=[a.get('value'), []]
              def handle_endtag(self, tag):
                  if tag=='option' and self._option is not None:
                      self.options.append((self._option[0], ' '.join(self._option[1]).strip()))
                      self._option=None
              def handle_data(self, data):
                  s=' '.join(data.split())
                  if not s: return
                  self.text.append(s)
                  if self._option is not None: self._option[1].append(s)

          def fetch(url, data=None):
              body=urlencode(data).encode() if data is not None else None
              req=Request(url,data=body,headers={'User-Agent':'CAL-MCP bounded research issue-10'})
              with urlopen(req,timeout=15) as r:
                  raw=r.read(350_000).decode('utf-8','replace'); final=r.geturl()
              p=P(); p.feed(raw)
              print('REQUEST',url,data,'FINAL',final)
              print('OPTIONS',p.options[:60])
              print('LINKS',p.links[:60])
              print('TEXT',p.text[:140])

          fetch('https://cal.huc.edu/searching/targumsearch.html')
          fetch('https://cal.huc.edu/targumicpairsearch.htm')
          fetch('https://cal.huc.edu/showtargum.php', {'bookname':'01','chapter':'01','verse':'99'})
          fetch('https://cal.huc.edu/showtargumKWIC.php', {'lemma':'zzzzzz','pos':'N'})
          PY
