name: Research issue 10 Targum contracts

on:
  push:
    branches:
      - feat/issue-10-targum
    paths:
      - .github/workflows/research-issue-10.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Inspect bounded CAL Hebrew-reflex results
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from html.parser import HTMLParser
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          class P(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.links = []
                  self.text = []
                  self.forms = []
                  self.current = None
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if tag == "a" and a.get("href"): self.links.append(a["href"])
                  if tag == "form":
                      self.current = {"method": a.get("method"), "action": a.get("action"), "controls": []}
                      self.forms.append(self.current)
                  elif tag in {"input", "select", "button"} and self.current is not None:
                      self.current["controls"].append({k: a.get(k) for k in ("name", "type", "value") if a.get(k) is not None})
                  elif tag == "option" and self.current is not None:
                      self.current["controls"].append({"option": a.get("value")})
              def handle_endtag(self, tag):
                  if tag == "form": self.current = None
              def handle_data(self, data):
                  s = " ".join(data.split())
                  if s: self.text.append(s)

          def post(path, data):
              url = "https://cal.huc.edu/" + path
              req = Request(url, data=urlencode(data).encode(), headers={"User-Agent": "CAL-MCP bounded research issue-10"})
              with urlopen(req, timeout=15) as r:
                  raw = r.read(400_000).decode("utf-8", "replace")
                  final = r.geturl()
              p = P(); p.feed(raw)
              print("REQUEST", path, data, "FINAL", final)
              print("FORMS", p.forms[:4])
              print("LINKS", p.links[:80])
              print("TEXT", p.text[:160])

          post("getOmtlemma.php", {"R1": "1751"})
          post("getNmtlemma.php", {"R1": "1751"})
          post("getOmtlemma.php", {"R1": "999999"})
          PY
