name: Research issue 10 Targum contracts

on:
  push:
    branches:
      - feat/issue-10-targum
    paths:
      - .github/workflows/research-issue-10.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Inspect bounded CAL Targum forms and representative results
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from html.parser import HTMLParser
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          class P(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.forms = []
                  self.current = None
                  self.links = []
                  self.text = []
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if tag == "form":
                      self.current = {"method": a.get("method"), "action": a.get("action"), "controls": []}
                      self.forms.append(self.current)
                  elif tag in {"input", "select", "button"} and self.current is not None:
                      self.current["controls"].append({k: a.get(k) for k in ("name", "type", "value") if a.get(k) is not None})
                  elif tag == "option" and self.current is not None:
                      self.current["controls"].append({"option": a.get("value")})
                  elif tag == "a" and a.get("href"):
                      self.links.append(a["href"])
              def handle_endtag(self, tag):
                  if tag == "form": self.current = None
              def handle_data(self, data):
                  s = " ".join(data.split())
                  if s: self.text.append(s)

          def fetch(url, data=None):
              body = urlencode(data).encode() if data is not None else None
              req = Request(url, data=body, headers={"User-Agent": "CAL-MCP bounded research issue-10"})
              with urlopen(req, timeout=15) as r:
                  raw = r.read(500_000).decode("utf-8", "replace")
                  final = r.geturl()
              p = P(); p.feed(raw)
              print("URL", url, "FINAL", final)
              print("FORMS", p.forms[:8])
              print("LINKS", p.links[:100])
              print("TEXT", p.text[:180])

          fetch("https://cal.huc.edu/Omtlemmas/memMTlemma.html")
          fetch("https://cal.huc.edu/mtlemmas/memMTlemma.html")
          fetch("https://cal.huc.edu/showtargum.php", {
              "bookname": "01", "chapter": "01", "verse": "01", "Peshitta": "ON", "Sam": "ON"
          })
          fetch("https://cal.huc.edu/showtargumKWIC.php", {"lemma": "klb", "pos": "N"})
          PY
