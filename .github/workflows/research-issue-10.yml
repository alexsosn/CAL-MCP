name: Research issue 10 Targum contracts

on:
  push:
    branches:
      - feat/issue-10-targum
    paths:
      - .github/workflows/research-issue-10.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Inspect four public CAL Targum pages
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from html.parser import HTMLParser
          from urllib.request import Request, urlopen

          URLS = [
              "https://cal.huc.edu/searching/targumsearch.html",
              "https://cal.huc.edu/searching/targum_concordance.html",
              "https://cal.huc.edu/targumicpairsearch.htm",
              "https://cal.huc.edu/Olemmaselect.htm",
          ]

          class P(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.forms = []
                  self.current = None
                  self.links = []
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if tag == "form":
                      self.current = {"method": a.get("method"), "action": a.get("action"), "controls": []}
                      self.forms.append(self.current)
                  elif tag in {"input", "select", "button"} and self.current is not None:
                      self.current["controls"].append({k: a.get(k) for k in ("name", "type", "value") if a.get(k) is not None})
                  elif tag == "option" and self.current is not None:
                      self.current["controls"].append({"option": a.get("value")})
                  elif tag == "a" and a.get("href"):
                      self.links.append(a["href"])
              def handle_endtag(self, tag):
                  if tag == "form":
                      self.current = None

          for url in URLS:
              req = Request(url, headers={"User-Agent": "CAL-MCP bounded research issue-10"})
              with urlopen(req, timeout=15) as r:
                  data = r.read(300_000).decode("utf-8", "replace")
              p = P(); p.feed(data)
              print("URL", url)
              print("FORMS", p.forms)
              print("LINKS", p.links[:80])
          PY
