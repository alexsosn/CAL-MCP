name: Issue 85 production reproduction

on:
  push:
    branches:
      - issue-85-ginza-rabba-text-page
    paths:
      - .github/workflows/issue-85-route-probe.yml

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install exact branch package
        run: python -m pip install .
      - name: Reproduce one production request
        shell: python
        run: |
          import asyncio

          from cal_mcp.client import CalClientConfig, CalHttpClient
          from cal_mcp.texts import TextService

          async def main() -> None:
              client = CalHttpClient(
                  config=CalClientConfig(
                      max_retries=0,
                      max_concurrency=1,
                      cache_enabled=False,
                  )
              )
              try:
                  try:
                      result = await TextService(client).page("74410", page=1)
                  except Exception as exc:
                      print(type(exc).__name__ + ": " + str(exc))
                      raise
                  else:
                      print(result.to_dict())
              finally:
                  await client.aclose()

          asyncio.run(main())
