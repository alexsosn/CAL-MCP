name: Issue 85 pagination marker probe

on:
  push:
    branches:
      - issue-85-ginza-rabba-text-page
    paths:
      - .github/workflows/issue-85-route-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install probe dependency
        run: python -m pip install "httpx2==2.12.0"
      - name: Print only the current pagination marker
        shell: python
        run: |
          import asyncio
          import re
          from html.parser import HTMLParser

          import httpx2

          class Text(HTMLParser):
              def __init__(self) -> None:
                  super().__init__(convert_charrefs=True)
                  self.parts = []

              def handle_data(self, data):
                  self.parts.append(data)

          async def main() -> None:
              async with httpx2.AsyncClient(
                  base_url="https://cal.huc.edu/",
                  timeout=httpx2.Timeout(10.0, connect=5.0),
                  follow_redirects=False,
                  headers={"User-Agent": "CAL-MCP bounded issue-85 marker research"},
              ) as client:
                  async with client.stream(
                      "GET", "get_a_chapter.php", params={"file": "74410", "page": "0"}
                  ) as response:
                      body = bytearray()
                      async for chunk in response.aiter_bytes():
                          body.extend(chunk)
                          if len(body) > 131072:
                              raise RuntimeError("probe response exceeded 128 KiB research cap")

              parser = Text()
              parser.feed(body.decode("utf-8", errors="replace"))
              page_text = " ".join(" ".join(parser.parts).split())
              match = re.search(r"Page\s+1\s+of\s+.{0,120}", page_text, re.IGNORECASE)
              if match is None:
                  raise RuntimeError("current page marker not found")
              print(match.group(0))

          asyncio.run(main())
