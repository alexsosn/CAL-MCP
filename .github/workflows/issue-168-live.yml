name: Issue 168 live verification

on:
  push:
    branches:
      - dev/issue-168-blank-text-lines

permissions:
  contents: read

concurrency:
  group: cal-mcp-issue-168-live
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CAL-MCP
        run: python -m pip install .
      - name: Verify blank Ephrem lines through installed stdio MCP
        run: |
          python - <<'PY'
          import anyio
          import shutil

          from mcp import Client, StdioServerParameters

          async def main() -> None:
              executable = shutil.which("cal-mcp")
              assert executable is not None
              async with Client(StdioServerParameters(command=executable)) as client:
                  result = await client.call_tool("cal_text_page", {"file_id": "60424"})
                  assert not result.is_error, result
                  payload = result.structured_content
                  assert payload is not None
                  assert payload["status"] == "found"
                  page = payload["page"]
                  assert page is not None
                  blanks = [
                      line
                      for line in page["lines"]
                      if line["text"] == "" and line["tokens"] == []
                  ]
                  assert blanks, "live 60424 page contains no preserved blank lines"
                  assert any(
                      line["coordinate"] == "60424100508"
                      and line["display_coordinate"] == "1.005:08"
                      for line in blanks
                  ), "known blank line 1.005:08 / 60424100508 was not preserved"
                  print(f"live blank lines preserved: {len(blanks)}")

          anyio.run(main)
          PY
