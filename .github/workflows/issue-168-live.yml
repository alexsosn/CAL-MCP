name: Issue 168 live stdio verification

on:
  push:
    branches:
      - dev/issue-168-blank-text-lines

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install candidate
        run: python -m pip install .
      - name: Verify current CAL through installed stdio MCP
        run: |
          python - <<'PY'
          import asyncio
          from mcp import Client, StdioServerParameters

          async def main() -> None:
              async with Client(StdioServerParameters(command="cal-mcp")) as client:
                  result = await client.call_tool("cal_text_page", {"file_id": "60424"})
                  if result.is_error:
                      raise RuntimeError(f"cal_text_page failed: {result.content!r}")
                  data = result.structured_content
                  if not isinstance(data, dict):
                      raise RuntimeError("missing structured content")
                  page = data.get("page")
                  if not isinstance(page, dict):
                      raise RuntimeError("missing text page")
                  lines = page.get("lines")
                  if not isinstance(lines, list):
                      raise RuntimeError("missing text lines")

                  all_empty = next(
                      (line for line in lines if line.get("coordinate") == "60424100508"),
                      None,
                  )
                  if all_empty is None:
                      raise RuntimeError("known all-empty CAL line is missing")
                  if all_empty.get("text") != "" or all_empty.get("tokens") != []:
                      raise RuntimeError("known all-empty CAL line was not preserved faithfully")
                  if all_empty.get("empty_word_indexes") != [0]:
                      raise RuntimeError("known all-empty CAL slot index was not preserved")

                  mixed = [
                      line
                      for line in lines
                      if line.get("tokens")
                      and any(
                          isinstance(index, int) and index > 0
                          for index in line.get("empty_word_indexes", [])
                      )
                  ]
                  if not mixed:
                      raise RuntimeError("no mixed rendered/empty CAL row was preserved")

                  slot_count = sum(len(line.get("empty_word_indexes", [])) for line in lines)
                  print(
                      f"live stdio OK: lines={len(lines)} "
                      f"empty_slots={slot_count} mixed_rows={len(mixed)}"
                  )

          asyncio.run(main())
          PY
