name: Issue 168 live verification

on:
  push:
    branches:
      - dev/issue-168-blank-text-lines

permissions:
  contents: read

concurrency:
  group: cal-mcp-issue-168-live
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Inspect affected current rows with one bounded GET
        run: |
          python - <<'PY'
          import html
          import re
          import urllib.request
          from html.parser import HTMLParser
          from urllib.parse import parse_qs, urlsplit

          url = "https://cal.huc.edu/get_a_chapter.php?file=60424&page=0"
          req = urllib.request.Request(
              url,
              headers={"User-Agent": "CAL-MCP research/0.1 (+https://github.com/alexsosn/CAL-MCP)"},
          )
          with urllib.request.urlopen(req, timeout=20) as response:
              body = response.read().decode("utf-8", "replace")

          class Rows(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.in_text = False
                  self.row = None
                  self.cell = None
                  self.link = None
                  self.rows = []
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if tag == "table" and "text-display" in (a.get("class") or "").split():
                      self.in_text = True
                  elif self.in_text and tag == "tr":
                      self.row = [[], []]
                      self.cell = -1
                  elif self.row is not None and tag == "td":
                      self.cell += 1
                  elif self.row is not None and tag == "a" and self.cell in (0,1):
                      self.link = [a.get("href") or "", []]
                      self.row[self.cell].append(self.link)
              def handle_data(self, data):
                  if self.link is not None:
                      self.link[1].append(data)
              def handle_endtag(self, tag):
                  if tag == "a":
                      self.link = None
                  elif tag == "tr" and self.row is not None:
                      self.rows.append(self.row)
                      self.row = None
                      self.cell = None
                  elif tag == "table" and self.in_text:
                      self.in_text = False

          p = Rows()
          p.feed(body)
          affected = 0
          all_empty_rows = 0
          for row in p.rows:
              if len(row) != 2:
                  continue
              links = []
              for href, parts in row[1]:
                  parsed = urlsplit(href)
                  if parsed.path != "getlex.php":
                      continue
                  q = parse_qs(parsed.query, keep_blank_values=True)
                  coord = (q.get("coord") or ["?"])[0]
                  word = (q.get("word") or ["?"])[0]
                  rendered = bool("".join(parts).strip())
                  links.append((coord, word, rendered))
              empties = [int(word) for _coord, word, rendered in links if not rendered and word.isdigit()]
              if not empties:
                  continue
              affected += 1
              rendered_words = [int(word) for _coord, word, rendered in links if rendered and word.isdigit()]
              coords = sorted({coord for coord, _word, _rendered in links})
              if not rendered_words:
                  all_empty_rows += 1
              print({
                  "coords": coords,
                  "empty_words": empties,
                  "rendered_word_count": len(rendered_words),
                  "rendered_word_min": min(rendered_words) if rendered_words else None,
                  "rendered_word_max": max(rendered_words) if rendered_words else None,
              })
          print({"affected_rows": affected, "all_empty_rows": all_empty_rows, "total_rows": len(p.rows)})
          PY
