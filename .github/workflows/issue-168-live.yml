name: Issue 168 live verification

on:
  push:
    branches:
      - dev/issue-168-blank-text-lines

permissions:
  contents: read

concurrency:
  group: cal-mcp-issue-168-live
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Inspect current empty lexical anchors with one bounded GET
        run: |
          python - <<'PY'
          import re
          import urllib.request
          from collections import Counter
          from urllib.parse import parse_qs, urlsplit

          url = "https://cal.huc.edu/get_a_chapter.php?file=60424&page=0"
          req = urllib.request.Request(
              url,
              headers={"User-Agent": "CAL-MCP research/0.1 (+https://github.com/alexsosn/CAL-MCP)"},
          )
          with urllib.request.urlopen(req, timeout=20) as response:
              body = response.read().decode("utf-8", "replace")

          empty = []
          for match in re.finditer(r'<a\b([^>]*)>\s*</a>', body, flags=re.IGNORECASE):
              attrs = match.group(1)
              href_match = re.search(r'href=["\']([^"\']+)["\']', attrs, flags=re.IGNORECASE)
              if href_match:
                  href = href_match.group(1)
                  if "getlex.php" in href or "bablex.php" in href:
                      empty.append(href)

          print("empty lexical anchors:", len(empty))
          shapes = Counter()
          for href in empty:
              parsed = urlsplit(href)
              query = parse_qs(parsed.query, keep_blank_values=True)
              shape = (
                  parsed.scheme,
                  parsed.netloc,
                  parsed.path,
                  tuple(sorted((key, tuple(values)) for key, values in query.items() if key != "coord")),
                  bool(parsed.fragment),
              )
              shapes[shape] += 1
          for shape, count in shapes.items():
              print(count, shape)
          print("first hrefs:")
          for href in empty[:40]:
              print(href)
          PY
