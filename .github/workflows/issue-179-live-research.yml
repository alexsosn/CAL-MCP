name: Issue 179 bounded token-analysis research

on:
  push:
    branches:
      - research/issue-179-live-probe

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Probe three fixed current CAL token-analysis pages
        run: |
          python - <<'PY'
          import html
          import json
          import re
          import urllib.parse
          import urllib.request
          from html.parser import HTMLParser

          BASE = "https://cal.huc.edu/getlex.php"
          CASES = [
              ("peshitta-word0", "620570101", 0),
              ("peshitta-word1", "620570101", 1),
              ("cpa-word0", "5500001001a019001", 0),
          ]
          MAX_BYTES = 256 * 1024

          class Structure(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.links = []
                  self.current = None
                  self.events = []
                  self.class_counts = {}

              def handle_starttag(self, tag, attrs):
                  attrs_d = dict(attrs)
                  cls = attrs_d.get("class") or ""
                  for name in cls.split():
                      self.class_counts[name] = self.class_counts.get(name, 0) + 1
                  if tag == "a":
                      self.current = {
                          "href": attrs_d.get("href", ""),
                          "class": cls,
                          "parts": [],
                      }
                  if tag in {"h2", "br", "table", "tr", "td", "a", "span", "pos", "div"}:
                      event = {"event": "start", "tag": tag}
                      if cls:
                          event["class"] = cls
                      if tag == "a":
                          event["href"] = attrs_d.get("href", "")
                      self.events.append(event)

              def handle_endtag(self, tag):
                  if tag in {"h2", "br", "table", "tr", "td", "a", "span", "pos", "div"}:
                      self.events.append({"event": "end", "tag": tag})
                  if tag == "a" and self.current is not None:
                      self.current["text"] = " ".join("".join(self.current["parts"]).split())
                      self.links.append(self.current)
                      self.current = None

              def handle_data(self, data):
                  if self.current is not None:
                      self.current["parts"].append(data)

          for name, coord, word in CASES:
              query = urllib.parse.urlencode({"coord": coord, "word": word})
              url = f"{BASE}?{query}"
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "CAL-MCP research/0.1 (+https://github.com/alexsosn/CAL-MCP)"},
              )
              with urllib.request.urlopen(req, timeout=20) as response:
                  raw = response.read(MAX_BYTES + 1)
                  if len(raw) > MAX_BYTES:
                      raise RuntimeError(f"{name}: response exceeded {MAX_BYTES} bytes")
                  status = response.status
              body = raw.decode("utf-8", "replace")

              parser = Structure()
              parser.feed(body)
              parser.close()

              marker = "Click on a headword to see a complete lexicon entry"
              marker_pos = body.lower().find(marker.lower())
              pretable = ""
              if marker_pos >= 0:
                  after = body[marker_pos + len(marker):]
                  table_pos = after.lower().find("<table")
                  region = after if table_pos < 0 else after[:table_pos]
                  region = re.sub(r"<[^>]*>", " ", region)
                  pretable = " ".join(html.unescape(region).split())[:300]

              entry_links = []
              for link in parser.links:
                  path = urllib.parse.urlsplit(link["href"]).path.rsplit("/", 1)[-1]
                  if path != "oneentry.php":
                      continue
                  q = urllib.parse.parse_qs(
                      urllib.parse.urlsplit(link["href"]).query,
                      keep_blank_values=True,
                  )
                  entry_links.append(
                      {
                          "class": link["class"],
                          "lemma": q.get("lemma"),
                          "selectors": sorted(q),
                          "text": link.get("text", "")[:240],
                      }
                  )

              print(json.dumps({
                  "case": name,
                  "status": status,
                  "bytes": len(raw),
                  "marker_count": body.lower().count(marker.lower()),
                  "pretable_text": pretable,
                  "entry_links": entry_links,
                  "class_counts": {
                      k: parser.class_counts[k]
                      for k in sorted(parser.class_counts)
                      if k in {"lexlink", "lem", "rom", "mgP", "sense-line", "subsense-block"}
                  },
                  "event_prefix": parser.events[:45],
              }, ensure_ascii=False))
          PY
