name: Issue 179 bounded token-analysis research

on:
  push:
    branches:
      - research/issue-179-live-probe

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install current main-compatible package
        run: python -m pip install .
      - name: Inspect production semantic lines for one fixed Syriac token
        run: |
          python - <<'PY'
          import asyncio
          import json

          from cal_mcp.client import CalHttpClient, CalRequest
          from cal_mcp.lexicon import _parse_lines
          from cal_mcp.token_analysis import parse_token_analysis_page

          async def main():
              async with CalHttpClient() as client:
                  result = await client.fetch(
                      CalRequest(
                          method="GET",
                          path="getlex.php",
                          params=(("coord", "620570101"), ("word", "1")),
                      ),
                      parser=lambda response: response,
                      cache_namespace="issue-179-research",
                  )
              response = result.value
              lines = _parse_lines(response)
              print(json.dumps({
                  "line_count": len(lines),
                  "lines": [
                      {
                          "index": i,
                          "text": line.text[:260],
                          "links": [
                              {"href": link.href, "text": link.text[:220]}
                              for link in line.links
                          ],
                      }
                      for i, line in enumerate(lines)
                  ],
              }, ensure_ascii=False))
              try:
                  page = parse_token_analysis_page(response)
              except Exception as exc:
                  print(json.dumps({
                      "parser_exception": type(exc).__name__,
                      "message": str(exc),
                  }))
              else:
                  print(json.dumps({
                      "parser_success": True,
                      "candidate_count": len(page.candidates),
                  }))

          asyncio.run(main())
          PY
