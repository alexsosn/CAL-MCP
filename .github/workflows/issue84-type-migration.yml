name: Issue 84 typed error migration

on:
  push:
    branches:
      - feat/issue-84-structured-errors

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/issue-84-structured-errors
      - name: Apply explicit input/parser type migration
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path("src/cal_mcp")
          public_value_error_modules = {
              "biblical.py",
              "bibliography.py",
              "concordance.py",
              "dictionary_collation.py",
              "external_citations.py",
              "lemma_key.py",
              "search.py",
              "syriac.py",
              "targum.py",
              "texts.py",
              "token_analysis.py",
          }
          parser_modules = {
              "bibliography.py",
              "concordance.py",
              "dictionary_collation.py",
              "external_citations.py",
              "lexicon.py",
              "search.py",
              "syriac.py",
              "targum.py",
              "texts.py",
              "token_analysis.py",
          }

          def add_error_import(text: str, import_line: str) -> str:
              lines = text.splitlines()
              client_starts = [
                  i for i, line in enumerate(lines) if line.startswith("from cal_mcp.client import")
              ]
              if client_starts:
                  start = client_starts[0]
                  end = start
                  if lines[start].rstrip().endswith("("):
                      end = next(i for i in range(start + 1, len(lines)) if lines[i] == ")")
                  lines.insert(end + 1, import_line)
              else:
                  future = next(
                      i for i, line in enumerate(lines) if line == "from __future__ import annotations"
                  )
                  insert_at = future + 1
                  while insert_at < len(lines) and lines[insert_at] == "":
                      insert_at += 1
                  lines.insert(insert_at, import_line)
                  lines.insert(insert_at + 1, "")
              return "\n".join(lines) + "\n"

          for name in sorted(public_value_error_modules | parser_modules):
              path = root / name
              text = path.read_text()
              original = text

              needs_input = name in public_value_error_modules
              needs_parse = name in parser_modules

              if needs_parse:
                  text, parse_count = re.subn(
                      r"class (\w+ParseError)\(CalContentError\):",
                      r"class \1(CalParseError):",
                      text,
                  )
                  if parse_count < 1:
                      raise SystemExit(f"{name}: expected at least one parser error class")
                  text = text.replace("    CalContentError,\n", "")
                  text = text.replace("CalContentError, ", "")

              if needs_input and name != "lexicon.py":
                  text = text.replace("raise ValueError(", "raise CalInputError(")

              if name == "lexicon.py":
                  old = 'raise ValueError("lemma_key must identify one of the matching CAL candidates")'
                  new = 'raise CalInputError("lemma_key must identify one of the matching CAL candidates")'
                  if text.count(old) != 1:
                      raise SystemExit("lexicon.py: exact public lemma-key validation changed")
                  text = text.replace(old, new)

              imports = []
              if needs_input:
                  imports.append("CalInputError")
              if needs_parse:
                  imports.append("CalParseError")
              import_line = f"from cal_mcp.errors import {', '.join(imports)}"
              if import_line not in text:
                  text = add_error_import(text, import_line)

              if text == original:
                  raise SystemExit(f"{name}: migration made no change")
              path.write_text(text)

          normalization = root / "normalization.py"
          text = normalization.read_text()
          if "from cal_mcp.errors import CalInputError" not in text:
              anchor = "from urllib.parse import urlencode\n"
              if anchor not in text:
                  raise SystemExit("normalization.py import anchor changed")
              text = text.replace(anchor, anchor + "\nfrom cal_mcp.errors import CalInputError\n", 1)
          old = "class NormalizationError(ValueError):"
          if text.count(old) != 1:
              raise SystemExit("normalization.py base changed")
          text = text.replace(old, "class NormalizationError(CalInputError):")
          normalization.write_text(text)
          PY
      - name: Commit migration and remove helper workflow
        run: |
          git rm .github/workflows/issue84-type-migration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/cal_mcp
          git commit -m "refactor: type public input and parser errors"
          git push origin HEAD:feat/issue-84-structured-errors
