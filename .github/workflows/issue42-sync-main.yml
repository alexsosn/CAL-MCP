name: Issue 42 current-main sync

on:
  push:
    branches:
      - fix/issue-42-text-concordance-parser-drift

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: fix/issue-42-text-concordance-parser-drift
      - name: Merge current main and resolve append-only research record
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git show HEAD:research.md | awk '
            /^## R-021 — Current one-text concordance rows are inline BR-delimited streams$/ {
              keep=1
              sub("R-021", "R-022")
            }
            keep { print }
          ' > /tmp/issue42-research.txt
          test -s /tmp/issue42-research.txt

          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            unresolved="$(git diff --name-only --diff-filter=U)"
            if [ "$unresolved" != "research.md" ]; then
              echo "Unexpected merge conflicts: $unresolved" >&2
              exit 1
            fi
          fi

          git show origin/main:research.md > research.md
          printf '\n\n' >> research.md
          cat /tmp/issue42-research.txt >> research.md
          git add research.md

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "Unresolved merge conflicts remain" >&2
            git diff --name-only --diff-filter=U >&2
            exit 1
          fi

          rm .github/workflows/issue42-sync-main.yml
          git add -A
          git commit -m "merge: sync issue 42 with current main"
          git push origin HEAD:fix/issue-42-text-concordance-parser-drift
