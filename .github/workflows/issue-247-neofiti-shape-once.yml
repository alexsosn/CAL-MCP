# Exactly one CAL request, scoped to a fixture-backed Neofiti example link.
name: One-time Neofiti example DOM research (#247)
on:
  push:
    branches: [research/issue-109-targum-example-pages]
    paths: [.github/workflows/issue-247-neofiti-shape-once.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Capture reduced Neofiti example DOM shape only
        shell: bash
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from html.parser import HTMLParser
          from urllib.parse import urlsplit
          from urllib.request import HTTPRedirectHandler, Request, build_opener

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self,*args):
                  return None
          class Shape(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.stack=[]
                  self.events=[]
                  self.count=Counter()
                  self.ignore=0
              def handle_starttag(self,tag,attrs):
                  self.count[tag]+=1
                  a=dict(attrs)
                  self.stack.append(tag+("."+".".join(a.get("class","").split()) if a.get("class") else ""))
                  if tag in ("style","script"):
                      self.ignore+=1
                  if not self.ignore and tag in ("div","span","br","center","h3","a","p","hr"):
                      extra=None
                      if tag=="a":
                          u=urlsplit(a.get("href",""))
                          extra={"path":u.path,"query_keys":[e.partition("=")[0] for e in u.query.split("&") if e]}
                      self.events.append(["tag", "/".join(self.stack[-3:]), extra])
              def handle_endtag(self,tag):
                  if tag in ("style","script") and self.ignore:
                      self.ignore-=1
                  if self.stack:
                      self.stack.pop()
              def handle_startendtag(self,tag,attrs):
                  self.handle_starttag(tag,attrs)
                  self.handle_endtag(tag)
              def handle_data(self,data):
                  text=" ".join(data.split())
                  if text and not self.ignore:
                      self.events.append(["text","/".join(self.stack[-3:]),text[:75]])
          url="https://cal.huc.edu/getNMT.php?MT=1751&cal=gypwp+N"
          req=Request(url,headers={"User-Agent":"CAL-MCP/0.1.0 (issue-247 one-shot Neofiti structural research)"})
          with build_opener(NoRedirect).open(req,timeout=12) as response:
              if response.status!=200 or response.url!=url:
                  raise RuntimeError("unexpected Neofiti source response")
              raw=response.read(262145)
          if len(raw)>262144:
              raise RuntimeError("bounded Neofiti response too large")
          parser=Shape()
          parser.feed(raw.decode("utf-8",errors="replace"))
          parser.close()
          print(json.dumps({"case":"reflex-neofiti","status":200,"bytes":len(raw),"tag_counts":dict(parser.count),
                            "events":parser.events[:120]},ensure_ascii=False))
          PY
