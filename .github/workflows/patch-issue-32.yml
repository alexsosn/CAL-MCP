name: Patch issue 32 parser

on:
  push:
    branches:
      - fix/issue-32-lexicon-inline-style
    paths:
      - .github/workflows/patch-issue-32.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/issue-32-lexicon-inline-style
      - name: Apply exact ignored-subtree parser change
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/cal_mcp/lexicon.py')
          text = path.read_text()

          old = '''_BLOCK_TAGS = frozenset(\n    {\n'''
          new = '''_IGNORED_CONTENT_TAGS = frozenset({"script", "style"})\n\n\n_BLOCK_TAGS = frozenset(\n    {\n'''
          if text.count(old) != 1:
              raise SystemExit('block-tag anchor mismatch')
          text = text.replace(old, new, 1)

          old = '''        self._list_depth = -1\n        self._line_depth = 0\n\n    def handle_starttag(self, tag: str, attrs: list[tuple[str, str | None]]) -> None:\n        if tag in {"ul", "ol"}:\n'''
          new = '''        self._list_depth = -1\n        self._line_depth = 0\n        self._ignored_depth = 0\n\n    def handle_starttag(self, tag: str, attrs: list[tuple[str, str | None]]) -> None:\n        if tag in _IGNORED_CONTENT_TAGS:\n            self._ignored_depth += 1\n            return\n        if self._ignored_depth:\n            return\n        if tag in {"ul", "ol"}:\n'''
          if text.count(old) != 1:
              raise SystemExit('starttag anchor mismatch')
          text = text.replace(old, new, 1)

          old = '''    def handle_endtag(self, tag: str) -> None:\n        if tag == "a" and self._open_link is not None:\n'''
          new = '''    def handle_endtag(self, tag: str) -> None:\n        if self._ignored_depth:\n            if tag in _IGNORED_CONTENT_TAGS:\n                self._ignored_depth -= 1\n            return\n        if tag == "a" and self._open_link is not None:\n'''
          if text.count(old) != 1:
              raise SystemExit('endtag anchor mismatch')
          text = text.replace(old, new, 1)

          old = '''    def handle_data(self, data: str) -> None:\n        self._parts.append(data)\n'''
          new = '''    def handle_data(self, data: str) -> None:\n        if self._ignored_depth:\n            return\n        self._parts.append(data)\n'''
          if text.count(old) != 1:
              raise SystemExit('data anchor mismatch')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/cal_mcp/lexicon.py
          git commit -m "fix: ignore non-content lexicon HTML subtrees"
          git push origin HEAD:fix/issue-32-lexicon-inline-style
