name: Fix issue 13 test formatting
on:
  push:
    branches: [feat/issue-13-external-citations]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/issue-13-external-citations
      - name: Reflow test string and self-clean
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_external_citations.py')
          text = path.read_text(encoding='utf-8')
          old = '''        "<html><body><style>.x{content:'No citations for &quot;1CorH&quot; are currently stored.'}</style>"\n'''
          new = '''        "<html><body><style>.x{content:'No citations for "\n        "&quot;1CorH&quot; are currently stored.'}</style>"\n'''
          if old not in text:
              raise SystemExit('expected test string not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/issue-13-test-format-fix.yml
          git add tests/test_external_citations.py
          git commit -m 'test: format external citation RED suite'
          git push origin HEAD:feat/issue-13-external-citations
