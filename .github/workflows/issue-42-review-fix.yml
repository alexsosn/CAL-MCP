name: Apply issue 42 review fix

on:
  push:
    branches:
      - fix/issue-42-text-concordance-parser-drift
    paths:
      - .github/workflows/issue-42-review-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/issue-42-text-concordance-parser-drift
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Apply review regression fix
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/cal_mcp/concordance.py")
          text = path.read_text()
          old = '''    linked_row_indexes: list[int] = []
    for index, line in enumerate(lines):
        text = getattr(line, "text", "")
        if _FREQUENCY_RE.match(text) is None:
            continue
        links = getattr(line, "links", ())
        if any(_is_path(getattr(link, "href", ""), "showKWIC.php") for link in links):
            linked_row_indexes.append(index)

    if not linked_row_indexes:
        return None

    start = linked_row_indexes[0]
    while start > 0 and _FREQUENCY_RE.match(getattr(lines[start - 1], "text", "")) is not None:
        start -= 1
    end = linked_row_indexes[0]
    while (
        end + 1 < len(lines)
        and _FREQUENCY_RE.match(getattr(lines[end + 1], "text", "")) is not None
    ):
        end += 1
    if any(index > end for index in linked_row_indexes):
        raise ConcordanceParseError("CAL inline concordance lemma rows are not contiguous")
'''
          new = '''    kwic_row_indexes: list[int] = []
    linked_frequency_indexes: list[int] = []
    for index, line in enumerate(lines):
        text = getattr(line, "text", "")
        links = getattr(line, "links", ())
        has_kwic_link = any(
            _is_path(getattr(link, "href", ""), "showKWIC.php") for link in links
        )
        if has_kwic_link:
            kwic_row_indexes.append(index)
        if has_kwic_link and _FREQUENCY_RE.match(text) is not None:
            linked_frequency_indexes.append(index)

    if not linked_frequency_indexes:
        return None

    def is_candidate_row(index: int) -> bool:
        line = lines[index]
        text = getattr(line, "text", "")
        return _FREQUENCY_RE.match(text) is not None or index in kwic_row_indexes

    start = linked_frequency_indexes[0]
    while start > 0 and is_candidate_row(start - 1):
        start -= 1
    end = linked_frequency_indexes[0]
    while end + 1 < len(lines) and is_candidate_row(end + 1):
        end += 1
    if any(index < start or index > end for index in kwic_row_indexes):
        raise ConcordanceParseError("CAL inline concordance lemma rows are not contiguous")
'''
          if text.count(old) != 1:
              raise SystemExit("inline concordance window block changed")
          path.write_text(text.replace(old, new, 1))
      - name: Focused GREEN
        run: |
          python -m pip install -e ".[dev]"
          ruff format src/cal_mcp/concordance.py
          ruff check src/cal_mcp/concordance.py tests/test_concordance_current_shape_regression.py
          pytest tests/test_concordance_current_shape_regression.py tests/test_concordance.py tests/test_concordance_review_regressions.py
          git diff --check
      - name: Commit fix and remove helper
        run: |
          rm .github/workflows/issue-42-review-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/cal_mcp/concordance.py .github/workflows/issue-42-review-fix.yml
          git commit -m "fix: reject incomplete inline concordance rows"
          git push origin HEAD:fix/issue-42-text-concordance-parser-drift
