name: Issue 97 apply route fix

on:
  push:
    branches: [fix/issue-97-mandaic-route-scope]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/issue-97-mandaic-route-scope
      - name: Apply exact production patch and remove helper
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/cal_mcp/texts.py")
          text = path.read_text(encoding="utf-8")

          old_constant = '_MANDAIC_COLLECTION_PREFIX = "74"\n'
          new_constant = '''_MANDAIC_COLLECTION_PREFIX = "74"\n_MANDAIC_SUBDIVIDED_FILE_IDS = frozenset(\n    {\n        "74401",\n        "74402",\n        "74410",\n        "74411",\n        "74421",\n        "74422",\n        "74423",\n        "74428",\n        "74430",\n        "74432",\n        "74700",\n        "74701",\n        "74923",\n    }\n)\n'''
          if text.count(old_constant) != 1:
              raise SystemExit("unexpected Mandaic constant shape")
          text = text.replace(old_constant, new_constant)

          old_route = '''        mandaic_page_route = normalized_subtext is None and normalized_file.startswith(\n            _MANDAIC_COLLECTION_PREFIX\n        )\n        if mandaic_page_route:\n            params = [\n                ("cset", "M"),\n                ("file", normalized_file),\n                ("sub", f"{page:03d}"),\n            ]\n        else:\n            params = [("file", normalized_file)]\n            if normalized_subtext is not None:\n                params.append(("sub", normalized_subtext))\n            params.append(("page", str(page - 1)))\n'''
          new_route = '''        mandaic_collection_route = normalized_subtext is None and normalized_file.startswith(\n            _MANDAIC_COLLECTION_PREFIX\n        )\n        mandaic_page_route = (\n            mandaic_collection_route and normalized_file in _MANDAIC_SUBDIVIDED_FILE_IDS\n        )\n        mandaic_direct_route = mandaic_collection_route and not mandaic_page_route\n        if mandaic_page_route:\n            params = [\n                ("cset", "M"),\n                ("file", normalized_file),\n                ("sub", f"{page:03d}"),\n            ]\n        elif mandaic_direct_route:\n            if page != 1:\n                raise ValueError("direct Mandaic texts currently support only page 1")\n            params = [("cset", "M"), ("file", normalized_file)]\n        else:\n            params = [("file", normalized_file)]\n            if normalized_subtext is not None:\n                params.append(("sub", normalized_subtext))\n            params.append(("page", str(page - 1)))\n'''
          if text.count(old_route) != 1:
              raise SystemExit("unexpected TextService Mandaic route shape")
          path.write_text(text.replace(old_route, new_route), encoding="utf-8")
          PY
          rm .github/workflows/issue-97-apply-fix.yml
          git config user.name "Oleksandr (Alex) Sosnovshchenko"
          git config user.email "alex.sosn88@gmail.com"
          git add src/cal_mcp/texts.py .github/workflows/issue-97-apply-fix.yml
          git commit -m "fix: narrow Mandaic text-page routing"
          git push origin HEAD:fix/issue-97-mandaic-route-scope
