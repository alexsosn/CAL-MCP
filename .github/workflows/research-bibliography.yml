name: Temporary bibliography research

on:
  push:
    branches: [issue-9-bibliography]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Inspect one positive CAL bibliography author result
        run: |
          python - <<'PY'
          import re
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          BASE = "https://cal.huc.edu/"
          UA = {"User-Agent": "CAL-MCP bounded research probe"}

          def post(path, data):
              req = Request(BASE + path, data=urlencode(data).encode(), headers=UA)
              with urlopen(req, timeout=15) as response:
                  text = response.read().decode("utf-8", "replace")
                  print("FETCH", path, response.status, response.geturl(), len(text))
                  return text

          select = post("browsenames.php", {"first3": "Kau"})
          values = re.findall(r'<option[^>]+value=["\']([^"\']+)["\']', select, re.I)
          print("AUTHOR_OPTIONS", values[:20])
          preferred = next((v for v in values if "Kaufman" in v), values[0] if values else None)
          if preferred:
              result = post("getbibauthor.php", {"myauthor": preferred})
              plain = re.sub(r"<script\b.*?</script>|<style\b.*?</style>", " ", result, flags=re.I | re.S)
              plain = re.sub(r"<[^>]+>", "\n", plain)
              plain = "\n".join(x for x in (" ".join(s.split()) for s in plain.splitlines()) if x)
              print("AUTHOR_SELECTED", preferred)
              print("AUTHOR_RESULT_TEXT", plain[:3000])
          PY
