name: Temporary bibliography record-boundary research

on:
  push:
    branches: [issue-9-bibliography]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Inspect repeated bibliography record markup
        run: |
          python - <<'PY'
          import re
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          req = Request(
              "https://cal.huc.edu/getbibauthor.php",
              data=urlencode({"myauthor": "Kaufman, Stephen A."}).encode(),
              headers={"User-Agent": "CAL-MCP bounded research probe"},
          )
          with urlopen(req, timeout=15) as response:
              html = response.read().decode("utf-8", "replace")
              print("STATUS", response.status, "FINAL", response.geturl(), "BYTES", len(html))

          needle = "Si'gabbar"
          start = max(0, html.find(needle) - 1200)
          print("FIRST_RECORD_MARKUP", html[start:start + 5000])
          print("TAG_COUNTS", {tag: len(re.findall(fr"<{tag}\\b", html, re.I)) for tag in ["p", "div", "table", "tr", "td", "li", "hr", "br", "a"]})
          PY
