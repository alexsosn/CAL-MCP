name: Temporary bibliography research

on:
  push:
    branches: [issue-9-bibliography]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Inspect bibliography result blocks and empty markers
        run: |
          python - <<'PY'
          import re
          from collections import Counter
          from html.parser import HTMLParser
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          BASE = "https://cal.huc.edu/"
          UA = {"User-Agent": "CAL-MCP bounded research probe"}

          def fetch(path, data=None):
              payload = None if data is None else urlencode(data).encode()
              req = Request(BASE + path, data=payload, headers=UA)
              with urlopen(req, timeout=15) as response:
                  text = response.read().decode("utf-8", "replace")
                  print("FETCH", path, "POST" if payload else "GET", response.status, response.geturl(), len(text))
                  return text

          class Shape(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.classes = Counter()
                  self.links = Counter()
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if a.get("class"):
                      for cls in a["class"].split():
                          self.classes[(tag, cls)] += 1
                  if tag == "a" and a.get("href"):
                      path = a["href"].split("?", 1)[0]
                      self.links[path] += 1

          def plain(html):
              cleaned = re.sub(r"<script\b.*?</script>|<style\b.*?</style>", " ", html, flags=re.I | re.S)
              cleaned = re.sub(r"<[^>]+>", "\n", cleaned)
              return "\n".join(x for x in (" ".join(s.split()) for s in cleaned.splitlines()) if x)

          positive = fetch("getbibauthor.php", {"myauthor": "Kaufman, Stephen A."})
          shape = Shape(); shape.feed(positive)
          print("POSITIVE_CLASSES", shape.classes.most_common(30))
          print("POSITIVE_LINK_PATHS", shape.links.most_common(20))
          print("POSITIVE_TEXT", plain(positive)[:1600])

          empty_lemma = fetch("getbiblemma.php", {"myauthor": "zzzzzz N"})
          print("EMPTY_LEMMA_TEXT", plain(empty_lemma)[:1200])

          empty_subject = fetch(
              "browsesigla.php?generalclass=General%20Topics&subclass=NoSuchCALTopicXYZ"
          )
          print("EMPTY_SUBJECT_TEXT", plain(empty_subject)[:1200])
          PY
