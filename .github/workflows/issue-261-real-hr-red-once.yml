# One-shot corrected source-shaped behavioral RED with next <hr>; zero CAL calls.
name: Issue 261 corrected end-of-outline HR behavioral RED
on:
  push:
    branches: [research/issue-261-test-red]
    paths: [.github/workflows/issue-261-real-hr-red-once.yml]
permissions:
  contents: read
jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install offline dependencies
        run: python -m pip install -e ".[dev]"
      - name: Formatter and lint preconditions
        run: |
          ruff check tests/test_token_analysis_unclosed_dial_outline.py
          ruff format --check tests/test_token_analysis_unclosed_dial_outline.py
      - name: Expected old-parser failure at real segment HR boundary
        run: pytest -q tests/test_token_analysis_unclosed_dial_outline.py
