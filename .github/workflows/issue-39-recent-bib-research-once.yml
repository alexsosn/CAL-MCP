# One explicit, no-redirect GET for #39. Delete trigger immediately after enqueue.
name: Issue 39 one-shot recent bibliography response audit
on:
  push:
    branches: [research/issue-39-recent-bib-source]
    paths: [.github/workflows/issue-39-recent-bib-research-once.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Single no-retry capped recent bibliography request
        shell: bash
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from html.parser import HTMLParser
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlsplit
          from urllib.request import Request, HTTPRedirectHandler, build_opener

          URL = "https://cal.huc.edu/getrecentbib.php"
          LIMIT = 262144

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          class Markup(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.tags = Counter()
                  self.links = Counter()
                  self.headings = []
                  self.current = None
                  self.years = Counter()
                  self.chunks = 0
              def handle_starttag(self,tag,attrs):
                  self.tags[tag]+=1
                  a=dict(attrs)
                  if tag=="a":
                      u=urlsplit(a.get("href") or "")
                      self.links[u.path]+=1
                  if tag in ("h1","h2","h3","h4"):
                      self.current=[]
              def handle_endtag(self,tag):
                  if tag in ("h1","h2","h3","h4") and self.current is not None:
                      self.headings.append(" ".join(" ".join(self.current).split())[:100])
                      self.current=None
              def handle_data(self,text):
                  if self.current is not None:
                      self.current.append(text)
                  self.chunks+=1
                  for token in text.split():
                      if len(token)==4 and token.isascii() and token.isdecimal():
                          year=int(token)
                          if 2010 <= year <= 2035:
                              self.years[str(year)]+=1

          req=Request(URL, headers={"User-Agent":"CAL-MCP/0.1.0 (+issue-39 one-shot bounded research)"})
          try:
              with build_opener(NoRedirect).open(req,timeout=15) as resp:
                  status=resp.status
                  final=resp.url
                  ct=resp.headers.get("content-type","")
                  raw=resp.read(LIMIT+1)
          except HTTPError as err:
              print(json.dumps({"request_count":1,"status":err.code,
                                "error_class":"HTTPError","body_not_read":True}))
              raise SystemExit(0)
          except (URLError,TimeoutError) as err:
              print(json.dumps({"request_count":1,"status":None,
                                "error_class":type(err).__name__,"body_not_read":True}))
              raise SystemExit(0)
          if len(raw)>LIMIT:
              print(json.dumps({"request_count":1,"status":status,
                                "bytes_lower_bound":len(raw),"too_large":True,
                                "content_type":ct,"same_url":final==URL}))
              raise SystemExit(0)
          p=Markup()
          p.feed(raw.decode("utf-8",errors="replace"))
          p.close()
          print(json.dumps({
              "request_count":1,"status":status,"bytes":len(raw),
              "same_url":final==URL,"content_type":ct,
              "headings":p.headings[:12],"tags":dict(p.tags),
              "link_path_counts":p.links.most_common(12),
              "year_token_histogram":dict(p.years),
              "html_text_segments":p.chunks
          }))
          PY
