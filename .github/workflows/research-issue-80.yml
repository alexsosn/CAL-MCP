name: Research issue 80 Ginza search

on:
  push:
    branches:
      - fix/issue-80-ginza-text-search

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe one current CAL Ginza text search result shape
        shell: python
        run: |
          from html.parser import HTMLParser
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          BLOCKS = {
              "address", "article", "aside", "blockquote", "div", "footer",
              "h1", "h2", "h3", "h4", "h5", "h6", "header", "li", "p",
              "section", "td", "th", "tr",
          }

          class SemanticParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.parts = []
                  self.links = []
                  self.open_href = None
                  self.open_parts = []
                  self.lines = []

              def handle_starttag(self, tag, attrs):
                  if tag in BLOCKS or tag == "br":
                      self.flush()
                  if tag == "a" and self.open_href is None:
                      self.open_href = dict(attrs).get("href", "")
                      self.open_parts = []

              def handle_data(self, data):
                  self.parts.append(data)
                  if self.open_href is not None:
                      self.open_parts.append(data)

              def handle_endtag(self, tag):
                  if tag == "a" and self.open_href is not None:
                      text = " ".join("".join(self.open_parts).split())
                      self.links.append((self.open_href, text))
                      self.open_href = None
                      self.open_parts = []
                  if tag in BLOCKS or tag == "br":
                      self.flush()

              def flush(self):
                  text = " ".join("".join(self.parts).split())
                  if text:
                      self.lines.append((text, tuple(self.links)))
                  self.parts = []
                  self.links = []

          data = urlencode({"search": "Ginza"}).encode()
          request = Request(
              "https://cal.huc.edu/newsearchtxts.php",
              data=data,
              method="POST",
              headers={
                  "Content-Type": "application/x-www-form-urlencoded",
                  "User-Agent": "CAL-MCP/0.1.0 (+https://github.com/alexsosn/CAL-MCP)",
              },
          )
          with urlopen(request, timeout=15) as response:
              body = response.read(2 * 1024 * 1024 + 1)
              print("status", response.status)
              print("content_type", response.headers.get("Content-Type"))
              print("bytes", len(body))
              print("url", response.geturl())

          parser = SemanticParser()
          parser.feed(body.decode("utf-8", errors="replace"))
          parser.flush()
          result_lines = [
              (text, links)
              for text, links in parser.lines
              if any("showsubtexts.php" in href for href, _ in links)
          ]
          print("specialized_result_line_count", len(result_lines))
          for text, links in result_lines:
              print("line", repr(text[:500]))
              for href, anchor_text in links:
                  if "showsubtexts.php" in href:
                      print("result_link", repr(href), repr(anchor_text))
