name: issue-120-ruff-fix

on:
  push:
    branches:
      - issue-120-cache-aware-request-volume-audit

permissions:
  contents: write

jobs:
  fix-ruff:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: issue-120-cache-aware-request-volume-audit
      - name: Wrap one overlong docstring line
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/cal_mcp/server.py')
          text = path.read_text(encoding='utf-8')
          old = '    ``script`` is ``semitic`` (default) or ``transliteration``. Following a lemma into KWIC requires another explicit tool call.\n'
          new = '    ``script`` is ``semitic`` (default) or ``transliteration``. Following a lemma into\n    KWIC requires another explicit tool call.\n'
          if text.count(old) != 1:
              raise RuntimeError(f'expected one overlong line, got {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git rm .github/workflows/issue-120-ruff-fix.yml
          git diff --check
      - name: Commit lint repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/cal_mcp/server.py
          git commit -m 'Wrap request-volume docstring for Ruff'
          git push origin HEAD:issue-120-cache-aware-request-volume-audit
