name: One-off pre-v0.2 extra CAL MCP smoke (#340)

# This audit launches only for this single workflow-file push and is deleted after evidence.
on:
  push:
    branches: [smoke/all-tool-acceptance-340]
    paths: [.github/workflows/pre-v02-extra-340.yml]

permissions:
  contents: read

concurrency:
  group: cal-mcp-live-smoke
  cancel-in-progress: false

jobs:
  extra-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build wheel and sdist without release tag
        run: |
          python -m pip install --disable-pip-version-check "build>=1.3,<2"
          python -m build --outdir dist
      - name: Install exactly one built wheel in a clean environment
        shell: bash
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          python -m venv "$RUNNER_TEMP/cal-mcp-extra-venv"
          "$RUNNER_TEMP/cal-mcp-extra-venv/bin/python" -m pip install \
            --disable-pip-version-check --no-cache-dir "${wheels[0]}"
      - name: Run 13 extra strict MCP probes with max 25 real CAL starts
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/cal-mcp-extra-venv/bin/cal-mcp" --version
          "$RUNNER_TEMP/cal-mcp-extra-venv/bin/python" -m cal_mcp.pre_release_smoke \
            --executable "$RUNNER_TEMP/cal-mcp-extra-venv/bin/cal-mcp"
