name: Live CAL drift smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: cal-mcp-live-smoke
  cancel-in-progress: false

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install wheel build tooling
        run: python -m pip install --disable-pip-version-check build
      - name: Build this revision's wheel
        run: python -m build --wheel --outdir dist
      - name: Install one built wheel in a fresh virtual environment
        shell: bash
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          python -m venv "$RUNNER_TEMP/cal-mcp-smoke-venv"
          "$RUNNER_TEMP/cal-mcp-smoke-venv/bin/python" -m pip install \
            --disable-pip-version-check --no-cache-dir "${wheels[0]}"
      - name: Run one bounded installed-stdio CAL drift smoke
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/cal-mcp-smoke-venv/bin/python" -m cal_mcp.stdio_live_smoke \
            --executable "$RUNNER_TEMP/cal-mcp-smoke-venv/bin/cal-mcp"
