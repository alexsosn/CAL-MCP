name: issue105-self-cleaning-patch

on:
  push:
    branches:
      - issue-105-syriac-group-followup

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: issue-105-syriac-group-followup
      - name: Apply focused implementation
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          syriac_path = Path('src/cal_mcp/syriac.py')
          text = syriac_path.read_text(encoding='utf-8')

          old = '''    category: str | None = None
    upstream_category: str | None = None
    book: str | None = None
'''
          new = '''    category: str | None = None
    upstream_category: str | None = None
    group_id: str | None = None
    book: str | None = None
'''
          assert text.count(old) == 1
          text = text.replace(old, new)

          marker = '''@dataclass(frozen=True, slots=True)
class SyriacMissingWordsResult:
'''
          group_result = '''@dataclass(frozen=True, slots=True)
class SyriacTextGroupResult:
    group_id: str
    items: tuple[SyriacTextItem, ...]
    provenance: SyriacProvenance

    def to_dict(self) -> dict[str, object]:
        provenance = _provenance_to_dict(self.provenance)
        provenance["group_id"] = self.group_id
        return {
            "group_id": self.group_id,
            "items": [_text_item_to_dict(item) for item in self.items],
            "provenance": provenance,
        }


'''
          assert text.count(marker) == 1
          text = text.replace(marker, group_result + marker)

          function_start = text.index('def parse_syriac_text_category_page(')
          block_start = text.index('    items: list[SyriacTextItem] = []', function_start)
          return_line = '    return SyriacTextCategoryPage(label=matching_headings[0], items=tuple(items))'
          return_start = text.index(return_line, block_start)
          return_end = return_start + len(return_line)
          navigation_body = textwrap.dedent(text[block_start:return_start]).replace(
              'response.url', 'source_url'
          )
          category_replacement = '''    items = _parse_syriac_navigation_items(parser.lines, response.url)
    return SyriacTextCategoryPage(label=matching_headings[0], items=items)'''
          text = text[:block_start] + category_replacement + text[return_end:]

          insert_marker = '\ndef parse_syriac_missing_words_page(\n'
          assert text.count(insert_marker) == 1
          helper = '''

def _parse_syriac_navigation_items(
    lines: list[_Line],
    source_url: str,
) -> tuple[SyriacTextItem, ...]:
''' + textwrap.indent(navigation_body, '    ') + '''    return tuple(items)


def parse_syriac_text_group_page(
    response: CalResponse,
    *,
    group_id: str,
) -> tuple[SyriacTextItem, ...]:
    submitted_group = _validate_group_id(group_id)
    _require_response_path(response.url, "showsubtexts.php", "Syriac grouped-text")
    query = parse_qs(urlsplit(response.url).query, keep_blank_values=True)
    if set(query) != {"keyword"}:
        raise SyriacParseError(
            "CAL Syriac grouped-text response has unexpected query semantics"
        )
    returned_group = _single_query_value(
        query,
        "keyword",
        "Syriac grouped-text response",
    )
    if returned_group != submitted_group:
        raise SyriacParseError(
            "CAL Syriac grouped-text response contradicts the selected group"
        )

    parser = _SemanticLinesParser()
    parser.feed(response.body.decode("utf-8", errors="replace"))
    parser.close()
    return _parse_syriac_navigation_items(parser.lines, response.url)
'''
          text = text.replace(insert_marker, helper + insert_marker)

          service_marker = '''    async def missing_words(self, category: str) -> SyriacMissingWordsResult:
'''
          group_service = '''    async def group(self, group_id: str) -> SyriacTextGroupResult:
        submitted_group = _validate_group_id(group_id)
        result = await self._client.fetch(
            CalRequest(
                method="GET",
                path="showsubtexts.php",
                params=(("keyword", submitted_group),),
            ),
            parser=lambda response: parse_syriac_text_group_page(
                response,
                group_id=submitted_group,
            ),
            cache_namespace="syriac-group-v1",
        )
        return SyriacTextGroupResult(
            group_id=submitted_group,
            items=result.value,
            provenance=_make_provenance(
                result.source_url,
                result.retrieved_at,
                operation="syriac_group",
                group_id=submitted_group,
            ),
        )

'''
          assert text.count(service_marker) == 1
          text = text.replace(service_marker, group_service + service_marker)

          validation_marker = '''def _missing_word_path(category: str) -> str:
'''
          group_validation = '''def _validate_group_id(value: object) -> str:
    if type(value) is not str or not value.isdecimal() or int(value) < 1:
        raise ValueError("group_id must be a positive decimal Syriac GROUP selector")
    return value


'''
          assert text.count(validation_marker) == 1
          text = text.replace(validation_marker, group_validation + validation_marker)

          old = '''    category: str | None = None,
    upstream_category: str | None = None,
    book: str | None = None,
'''
          new = '''    category: str | None = None,
    upstream_category: str | None = None,
    group_id: str | None = None,
    book: str | None = None,
'''
          assert text.count(old) == 1
          text = text.replace(old, new)

          old = '''        category=category,
        upstream_category=upstream_category,
        book=book,
'''
          new = '''        category=category,
        upstream_category=upstream_category,
        group_id=group_id,
        book=book,
'''
          assert text.count(old) == 1
          text = text.replace(old, new)

          syriac_path.write_text(text, encoding='utf-8')

          server_path = Path('src/cal_mcp/server.py')
          server = server_path.read_text(encoding='utf-8')
          old = '''        "Use cal_syriac_texts for one explicit CAL Syriac text category, "
        "cal_syriac_missing_words for one CAL-curated missing-from-A-Syriac-Lexicon "
        "list, and cal_syriac_peshitta_parallel for one MT/Peshitta verse. Syriac "
        "text and lexicon follow-ups compose through cal_text_page and "
        "cal_lexicon_lookup. Use cal_external_citation_dialects to discover CAL "
'''
          new = '''        "Use cal_syriac_texts for one explicit CAL Syriac text category and "
        "cal_syriac_group for one GROUP selector returned by that tool. Use "
        "cal_syriac_missing_words for one CAL-curated missing-from-A-Syriac-Lexicon "
        "list, and cal_syriac_peshitta_parallel for one MT/Peshitta verse. Syriac direct-text, "
        "catalogue, and lexicon follow-ups compose through cal_text_page, cal_text_catalogue, "
        "and cal_lexicon_lookup. Use cal_external_citation_dialects to discover CAL "
'''
          assert server.count(old) == 1
          server = server.replace(old, new)

          old = '''    ``category`` is a CAL-MCP descriptive slug, not CAL's private numeric category value.
    Direct text and grouped-navigation results remain distinct and are never followed
    automatically. Use existing text tools for explicit follow-up reading.
'''
          new = '''    ``category`` is a CAL-MCP descriptive slug, not CAL's private numeric category value.
    Direct text, grouped-navigation, and catalogue results remain distinct and are never
    followed automatically. Use ``cal_syriac_group`` for returned GROUP selectors and the
    generic text tools for explicit direct-text/catalogue follow-up.
'''
          assert server.count(old) == 1
          server = server.replace(old, new)

          marker = '''@mcp.tool(
    name="cal_syriac_missing_words",
'''
          tool = '''@mcp.tool(
    name="cal_syriac_group",
    title="Browse one returned CAL Syriac grouped-text selector",
    structured_output=True,
)
async def cal_syriac_group(
    group_id: str,
    ctx: Context[AppContext],
) -> dict[str, object]:
    """Follow one GROUP selector returned by ``cal_syriac_texts``.

    ``group_id`` is CAL's grouped-text selector, not a generic file or catalogue identifier.
    Returned child navigation remains ordered metadata and is never followed recursively.

    One explicit call submits at most one new logical CAL request. A completed cache hit
    performs no new upstream I/O.
    """

    client = ctx.request_context.lifespan_context.client
    result = await SyriacService(client).group(group_id)
    return result.to_dict()


'''
          assert server.count(marker) == 1
          server = server.replace(marker, tool + marker)
          server_path.write_text(server, encoding='utf-8')

          Path('.github/workflows/issue105-self-cleaning-patch.yml').unlink()
          PY
      - name: Commit focused implementation and self-clean
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Implement Syriac group follow-up (#105)"
          git push origin HEAD:issue-105-syriac-group-followup
