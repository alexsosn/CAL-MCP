name: issue105-self-cleaning-patch

on:
  push:
    branches:
      - issue-105-syriac-group-followup

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: issue-105-syriac-group-followup
      - name: Apply focused implementation
        run: python .github/issue105_patch.py
      - name: Commit focused implementation and self-clean
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Implement Syriac group follow-up (#105)"
          git push origin HEAD:issue-105-syriac-group-followup
