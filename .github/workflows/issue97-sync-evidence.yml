name: issue-97 sync evidence

on:
  push:
    branches:
      - fix/issue-97-mandaic-route-scope

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/issue-97-mandaic-route-scope
          fetch-depth: 0
      - name: Synchronize durable evidence ledger
        shell: python
        run: |
          from pathlib import Path

          path = Path("research.md")
          text = path.read_text()
          old = '''Four fixed branch-only menu GETs were used while resolving CAL's raw rendering/`cset` variation; each had a 15-second timeout and 512 KiB cap. No text, subtext, token, page, or result link was followed. Detailed evidence is in `docs/research/issue-97-mandaic-route-scope.md`.

          **Implication:** `cal_text_page` keeps one public schema and one-request behavior, but private Mandaic route selection must be per-file. A current allowlist selects only CAL files explicitly observed as subdivided; all other `74...` files use the direct Mandaic page-1 route rather than inventing `sub=NNN`. Explicit public `subtext_id` and non-Mandaic routing remain unchanged. New subdivided files require researched allowlist updates rather than prefix inference or runtime discovery.'''
          new = '''A post-review bounded direct-page probe of `74717` confirmed HTTP 200 with the expected file heading, ordinary line/token coordinates, the first `getlex.php` token link, and no previous/next-page navigation. The reduced `tests/fixtures/cal/text_page_mandaic_direct_74717.html` fixture preserves only those parser-relevant semantics.

          Five fixed branch-only CAL GETs were made in total: four menu/rendering requests while resolving route classification and one direct-page request for `74717`. Each had a 15-second timeout and 512 KiB cap. No token, comment, next-page, catalogue-child, or other returned navigation link was followed. Detailed evidence is in `docs/research/issue-97-mandaic-route-scope.md`.

          **Implication:** `cal_text_page` keeps one public schema and one-request behavior, but private Mandaic route selection must be per-file. A current allowlist selects only CAL files explicitly observed as subdivided; all other `74...` files use the direct Mandaic page-1 route rather than inventing `sub=NNN`. Explicit public `subtext_id` and non-Mandaic routing remain unchanged. New subdivided files require researched allowlist updates rather than prefix inference or runtime discovery.'''
          if text.count(old) != 1:
              raise SystemExit("expected stale R-025 evidence paragraph exactly once")
          path.write_text(text.replace(old, new))
      - name: Commit evidence correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research.md
          git diff --cached --check
          git commit -m "docs: synchronize Mandaic direct-page evidence"
          git push origin HEAD:fix/issue-97-mandaic-route-scope
