name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/ci-py311.txt
            constraints/build-py311.txt
      - name: Bootstrap frozen installer
        run: python -m pip install "pip==26.2.1" "setuptools==79.0.1"
      - name: Install frozen development validation dependencies
        run: >-
          python -m pip install -e ".[dev]"
          -c constraints/ci-py311.txt
          --build-constraint constraints/build-py311.txt
      - name: Report and verify frozen dependency set
        run: |
          python -m pip freeze --all
          python -m pip check
          python scripts/verify_ci_environment.py constraints/ci-py311.txt \
            --exclude cal-mcp \
            --exclude pip \
            --exclude setuptools
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy
      - name: Pytest
        run: pytest
      - name: Build wheel and sdist once
        env:
          PIP_BUILD_CONSTRAINT: constraints/build-py311.txt
        run: python -m build --outdir dist
      - name: Verify tag, wheel and sdist installs, and stdio surface
        run: python scripts/verify_release_artifact.py dist --tag "${GITHUB_REF_NAME}"
      - name: Upload exact distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  live-smoke:
    needs: build-and-test
    runs-on: ubuntu-latest
    concurrency:
      group: cal-mcp-live-smoke
      cancel-in-progress: false
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Download exact wheel from the tested build
        uses: actions/download-artifact@v5
        with:
          name: python-distributions
          path: dist
      - name: Install exact built wheel in a fresh virtual environment
        shell: bash
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          python -m venv "$RUNNER_TEMP/cal-mcp-smoke-venv"
          "$RUNNER_TEMP/cal-mcp-smoke-venv/bin/python" -m pip install \
            --disable-pip-version-check --no-cache-dir "${wheels[0]}"
      - name: Full 37-tool offline installed-wheel registry and 47-case gate
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/cal-mcp-smoke-venv/bin/python" - <<'PY'
          from cal_mcp.release_surface import CURRENT_PUBLIC_TOOLS
          from cal_mcp.stdio_live_smoke import DEFAULT_SMOKE_CASES
          from cal_mcp.pre_release_smoke import BATCH_CASES
          from cal_mcp.pre_release_followup_smoke import STEPS

          base = {case.tool for case in DEFAULT_SMOKE_CASES}
          extra = {case.tool for case in BATCH_CASES}
          dependent = {step.tool for step in STEPS}
          names = (
              [case.name for case in DEFAULT_SMOKE_CASES]
              + [case.name for case in BATCH_CASES]
              + [step.name for step in STEPS]
          )
          assert len(CURRENT_PUBLIC_TOOLS) == 37
          assert (len(DEFAULT_SMOKE_CASES), len(BATCH_CASES), len(STEPS)) == (13, 13, 21)
          assert len(names) == len(set(names)) == 47
          assert base | extra | dependent == CURRENT_PUBLIC_TOOLS
          assert sum(case.tool != "cal_convert_to_code" for case in DEFAULT_SMOKE_CASES) == 12
          print("Full 37-tool preflight PASS: 47 cases; 46 CAL-backed tool invocations")
          PY
      - name: Full 37-tool dependent installed-wheel MCP smoke (21 scenarios)
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/cal-mcp-smoke-venv/bin/python" -m cal_mcp.pre_release_followup_smoke \
            --executable "$RUNNER_TEMP/cal-mcp-smoke-venv/bin/cal-mcp"
      - name: Full 37-tool independent installed-wheel MCP smoke (13 scenarios)
        shell: bash
        run: |
          set -euo pipefail
          sleep 60
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/cal-mcp-smoke-venv/bin/python" -m cal_mcp.pre_release_smoke \
            --executable "$RUNNER_TEMP/cal-mcp-smoke-venv/bin/cal-mcp"
      - name: Full 37-tool representative release smoke (13 scenarios)
        shell: bash
        run: |
          set -euo pipefail
          sleep 60
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/cal-mcp-smoke-venv/bin/python" -m cal_mcp.stdio_live_smoke \
            --executable "$RUNNER_TEMP/cal-mcp-smoke-venv/bin/cal-mcp"

  publish-pypi:
    needs:
      - build-and-test
      - live-smoke
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download exact validated distributions
        uses: actions/download-artifact@v5
        with:
          name: python-distributions
          path: dist
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs:
      - build-and-test
      - live-smoke
      - publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Download exact published distributions
        uses: actions/download-artifact@v5
        with:
          name: python-distributions
          path: dist
      - name: Create GitHub release from the same distributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" dist/*
          --verify-tag
          --title "CAL-MCP ${GITHUB_REF_NAME}"
          --notes-file CHANGELOG.md
