name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/ci-py311.txt
            constraints/build-py311.txt
      - name: Bootstrap frozen installer
        run: python -m pip install "pip==26.2.1" "setuptools==79.0.1"
      - name: Install frozen development validation dependencies
        run: >-
          python -m pip install -e ".[dev]"
          -c constraints/ci-py311.txt
          --build-constraint constraints/build-py311.txt
      - name: Report frozen dependency set
        run: |
          python -m pip freeze --all
          python -m pip check
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy
      - name: Pytest
        run: pytest
      - name: Build wheel and sdist once
        run: python -m build --outdir dist
      - name: Verify tag, distributions, clean wheel install, and stdio surface
        run: python scripts/verify_release_artifact.py dist --tag "${GITHUB_REF_NAME}"
      - name: Upload exact distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  live-smoke:
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install tagged CAL-MCP source
        run: python -m pip install .
      - name: Run fixed nine-request CAL live_smoke
        run: python -m cal_mcp.live_smoke

  publish-pypi:
    needs:
      - build-and-test
      - live-smoke
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download exact validated distributions
        uses: actions/download-artifact@v5
        with:
          name: python-distributions
          path: dist
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs:
      - build-and-test
      - live-smoke
      - publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Download exact published distributions
        uses: actions/download-artifact@v5
        with:
          name: python-distributions
          path: dist
      - name: Create GitHub release from the same distributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" dist/*
          --verify-tag
          --title "CAL-MCP ${GITHUB_REF_NAME}"
          --notes-file CHANGELOG.md
