name: Research CAL text interfaces

on:
  push:
    branches: [issue-7-texts]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Inspect bounded CAL text forms and links
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from html.parser import HTMLParser
          from urllib.parse import urlencode, urljoin
          from urllib.request import Request, urlopen

          BASE = "https://cal.huc.edu/"
          UA = "CAL-MCP-research/0 (+https://github.com/alexsosn/CAL-MCP)"

          def fetch(url, data=None):
              req = Request(url, data=data, headers={"User-Agent": UA})
              with urlopen(req, timeout=15) as response:
                  return response.geturl(), response.read().decode("utf-8", "replace")

          class Inspector(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.forms = []
                  self.inputs = []
                  self.links = []
              def handle_starttag(self, tag, attrs):
                  d = dict(attrs)
                  if tag == "form":
                      self.forms.append((d.get("method"), d.get("action")))
                  elif tag == "input":
                      self.inputs.append((d.get("name"), d.get("value"), d.get("type")))
                  elif tag == "a" and d.get("href"):
                      self.links.append(d["href"])

          _, topic_html = fetch(urljoin(BASE, "searching/searchtopic.html"))
          p = Inspector(); p.feed(topic_html)
          print("TOPIC_FORMS", p.forms)
          print("TOPIC_INPUTS", p.inputs)

          if p.forms and p.inputs:
              method, action = p.forms[0]
              field = next((name for name, _, typ in p.inputs if name and typ not in {"submit", "reset"}), None)
              if action and field:
                  data = urlencode({field: "Tel Dan"}).encode()
                  result_url, result_html = fetch(
                      urljoin("https://cal.huc.edu/searching/", action),
                      data=data if (method or "").lower() == "post" else None,
                  )
                  q = Inspector(); q.feed(result_html)
                  text_links = [href for href in q.links if "get_a_chapter.php" in href or "showsubtexts.php" in href]
                  print("TOPIC_RESULT_URL", result_url)
                  print("TOPIC_TEXT_LINKS", text_links[:10])

          page_url, page_html = fetch(urljoin(BASE, "get_a_chapter.php?file=71026"))
          r = Inspector(); r.feed(page_html)
          interesting = [href for href in r.links if any(key in href for key in ("get_a_chapter.php", "getlex.php", "coord", "translation", "comment"))]
          print("PAGE_URL", page_url)
          print("PAGE_LINKS", interesting[:30])
          PY
