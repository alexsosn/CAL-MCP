name: Research CAL forms

on:
  push:
    branches: [issue-5-search]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect two CAL form pages
        shell: bash
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from urllib.request import Request, urlopen

          URLS = [
              "https://cal.huc.edu/searching/englishnew.html",
              "https://cal.huc.edu/searching/srchcits.html",
          ]

          class Forms(HTMLParser):
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == "form":
                      print("FORM", {k: attrs.get(k) for k in ("method", "action")})
                  elif tag == "input":
                      print(
                          "INPUT",
                          {k: attrs.get(k) for k in ("type", "name", "value", "checked")},
                      )

          for url in URLS:
              print("URL", url)
              request = Request(url, headers={"User-Agent": "CAL-MCP research form audit"})
              with urlopen(request, timeout=15) as response:
                  html = response.read().decode("utf-8", errors="replace")
              parser = Forms()
              parser.feed(html)
          PY
