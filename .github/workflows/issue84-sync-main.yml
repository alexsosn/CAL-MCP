name: issue-84 synchronize current main

on:
  push:
    branches:
      - feat/issue-84-structured-errors
    paths:
      - .github/workflows/issue84-sync-main.yml

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/issue-84-structured-errors
          fetch-depth: 0
      - name: Merge current main and self-remove
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-commit origin/main
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "current main no longer merges cleanly; refusing scripted resolution" >&2
            git diff --name-only --diff-filter=U >&2
            exit 1
          fi
          git rm .github/workflows/issue84-sync-main.yml
          git commit -m "Merge current main into structured-errors work"
          git push origin HEAD:feat/issue-84-structured-errors
