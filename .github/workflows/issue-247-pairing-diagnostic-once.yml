# One-time exact two-GET HTML structural diagnosis; no scholar text output.
name: Bounded reflex div-span pairing diagnosis (#247)
on:
  push:
    branches: [research/issue-109-targum-example-pages]
    paths: [.github/workflows/issue-247-pairing-diagnostic-once.yml]
permissions:
  contents: read
jobs:
  shape:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Diagnose exact tag nesting, without content
        shell: bash
        run: |
          python - <<'PY'
          import json
          from html.parser import HTMLParser
          from urllib.request import build_opener, HTTPRedirectHandler, Request

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          class Shape(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.headings=0
                  self.div=0
                  self.seq=[]
                  self.span=None
                  self.length=0
              def handle_starttag(self,tag,attrs):
                  if tag=="h3":
                      self.headings+=1
                  if self.headings<2:
                      return
                  if tag=="div":
                      self.div+=1
                  if tag=="span":
                      self.span=self.div
                      self.length=0
                  if tag in ("div","span","br","hr","center","p","b","bdo","a"):
                      self.seq.append(["start",tag,self.div,dict(attrs).get("class")])
              def handle_endtag(self,tag):
                  if self.headings<2:
                      return
                  if tag=="span":
                      self.seq.append(["content-length",self.span,self.length])
                      self.span=None
                  if tag in ("div","span","center","p","b","bdo","a"):
                      self.seq.append(["end",tag,self.div])
                  if tag=="div":
                      self.div-=1
              def handle_data(self,content):
                  if self.span is not None:
                      self.length+=len(content)
          cases=(
            ("onqelos","https://cal.huc.edu/getOMT.php?MT=1751&cal=tyq%232+N"),
            ("neofiti","https://cal.huc.edu/getNMT.php?MT=1751&cal=gypwp+N"),
          )
          opener=build_opener(NoRedirect)
          for label,url in cases:
              with opener.open(Request(url,headers={"User-Agent":"CAL-MCP/0.1.0 (issue-247 fixed shape diagnostic)"}),timeout=12) as r:
                  if r.status!=200 or r.url!=url:
                      raise RuntimeError("Unexpected source/status")
                  raw=r.read(262145)
              if len(raw)>262144:
                  raise RuntimeError("Oversize bounded page")
              parser=Shape()
              parser.feed(raw.decode("utf-8",errors="replace"))
              parser.close()
              print(json.dumps({"case":label,"bytes":len(raw),"events":parser.seq[:150],"final_div":parser.div}))
          PY
