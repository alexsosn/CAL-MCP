name: Issue 14 summary card fix

on:
  push:
    branches:
      - feat/issue-14-dictionary-collation
    paths:
      - .github/workflows/issue-14-summary-card-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/issue-14-dictionary-collation
      - name: Reject nested result summary cards
        run: |
          python -c 'from pathlib import Path; p=Path("src/cal_mcp/dictionary_collation.py"); s=p.read_text(encoding="utf-8"); old="            if self._card_depth:\n                self._card_depth += 1\n            elif \"summary-card\" in classes:"; new="            if self._card_depth:\n                if \"summary-card\" in classes:\n                    raise DictionaryCollationParseError(\n                        \"CAL dictionary collation contains a nested summary card\"\n                    )\n                self._card_depth += 1\n            elif \"summary-card\" in classes:"; assert old in s; p.write_text(s.replace(old,new,1),encoding="utf-8")'
          rm .github/workflows/issue-14-summary-card-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/cal_mcp/dictionary_collation.py .github/workflows/issue-14-summary-card-fix.yml
          git commit -m "fix: reject nested dictionary summary cards"
          git push origin HEAD:feat/issue-14-dictionary-collation
