name: Finalize Syriac docs

on:
  push:
    branches:
      - feat/issue-11-syriac
    paths:
      - .github/workflows/finalize-syriac-docs.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/issue-11-syriac
      - name: Patch docs
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/finalize_syriac.py
          python /tmp/finalize_syriac.py
      - name: Commit final docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md tests/fixtures/cal/README.md
          git commit -m "docs: finalize Syriac public contract"
          git push origin HEAD:feat/issue-11-syriac
