name: Fix issue 13 citation empty marker
on:
  push:
    branches: [feat/issue-13-external-citations]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/issue-13-external-citations
      - name: Fix page-level empty marker matching and self-clean
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('src/cal_mcp/external_citations.py')
          text = path.read_text(encoding='utf-8')
          old = '''_EMPTY_CITATIONS_RE = re.compile(\n    r'^No\\s+citations\\s+for\\s+"(.+?)"\\s+are\\s+currently\\s+stored\\.$',\n    re.IGNORECASE,\n)'''
          new = '''_EMPTY_CITATIONS_RE = re.compile(\n    r'\\bNo\\s+citations\\s+for\\s+"(.+?)"\\s+are\\s+currently\\s+stored\\.',\n    re.IGNORECASE,\n)'''
          if old not in text:
              raise SystemExit('empty marker pattern not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/issue-13-empty-marker-fix.yml
          git add src/cal_mcp/external_citations.py
          git commit -m 'fix: recognize CAL external citation empty marker'
          git push origin HEAD:feat/issue-13-external-citations
