name: Issue 179 live stdio acceptance

on:
  push:
    branches:
      - dev/issue-179-syriac-token-redirects

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install candidate
        run: python -m pip install .
      - name: Inspect one fixed Targum compatibility token
        run: |
          python - <<'PY'
          import asyncio
          import json
          from html.parser import HTMLParser
          from urllib.parse import parse_qs, urlsplit

          from cal_mcp.client import CalHttpClient, CalRequest
          from cal_mcp.lexicon import _parse_lines

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.current = None
                  self.links = []

              def handle_starttag(self, tag, attrs):
                  if tag != "a":
                      return
                  d = dict(attrs)
                  self.current = {
                      "href": d.get("href", ""),
                      "class": d.get("class", ""),
                      "parts": [],
                  }

              def handle_data(self, data):
                  if self.current is not None:
                      self.current["parts"].append(data)

              def handle_endtag(self, tag):
                  if tag == "a" and self.current is not None:
                      self.current["text"] = " ".join("".join(self.current["parts"]).split())
                      self.links.append(self.current)
                      self.current = None

          async def main():
              async with CalHttpClient() as client:
                  result = await client.fetch(
                      CalRequest(
                          method="GET",
                          path="getlex.php",
                          params=(("coord", "5101801011"), ("word", "0")),
                      ),
                      parser=lambda response: response,
                      cache_namespace="issue-179-targum-research",
                  )
              response = result.value
              lines = _parse_lines(response)
              parser = Links()
              parser.feed(response.body.decode("utf-8", errors="replace"))
              parser.close()
              entry_links = []
              for link in parser.links:
                  if urlsplit(link["href"]).path.rsplit("/", 1)[-1] != "oneentry.php":
                      continue
                  query = parse_qs(urlsplit(link["href"]).query, keep_blank_values=True)
                  entry_links.append({
                      "class": link["class"],
                      "lemma": query.get("lemma"),
                      "selectors": sorted(query),
                      "text": link.get("text", "")[:220],
                  })
              print(json.dumps({
                  "line_count": len(lines),
                  "relevant_lines": [
                      {
                          "index": i,
                          "text": line.text[:260],
                          "links": [{"href": x.href, "text": x.text[:220]} for x in line.links],
                      }
                      for i, line in enumerate(lines)
                      if i >= 2
                  ][:10],
                  "entry_links": entry_links,
              }, ensure_ascii=False))

          asyncio.run(main())
          PY
