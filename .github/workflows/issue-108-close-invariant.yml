name: Issue 108 close invariant

on:
  push:
    branches:
      - issue-108-line-comments
    paths:
      - .github/workflows/issue-108-close-invariant.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: issue-108-line-comments
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Add close-time semantic invariant
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/cal_mcp/texts.py")
          text = path.read_text(encoding="utf-8")
          anchor = '''    def handle_data(self, data: str) -> None:\n        if self._ignored_depth:\n            return\n'''
          replacement = '''    def close(self) -> None:\n        super().close()\n        if (\n            self._record is not None\n            or self._summary_depth\n            or self._ignored_depth\n            or self._span_parts is not None\n            or self._anchor_parts is not None\n            or self._in_reference\n            or self._in_gloss\n            or self._title_parts is not None\n        ):\n            raise TextParseError("CAL line-comments page ends with unfinished semantic markup")\n\n    def handle_data(self, data: str) -> None:\n        if self._ignored_depth:\n            return\n'''
          if text.count(anchor) != 1:
              raise SystemExit(f"close invariant anchor count: {text.count(anchor)}")
          path.write_text(text.replace(anchor, replacement, 1), encoding="utf-8")
          PY
      - name: Remove helper before validation
        run: git rm .github/workflows/issue-108-close-invariant.yml
      - name: Install deterministic validation environment
        run: |
          python -m pip install "pip==26.2.1" "setuptools==79.0.1"
          python -m pip install -e ".[dev]" -c constraints/ci-py311.txt --build-constraint constraints/build-py311.txt
      - name: Validate complete tree
        run: |
          ruff check .
          ruff format --check .
          mypy
          pytest
      - name: Commit close invariant after GREEN
        run: |
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fail closed on truncated line-comment markup"
          git push origin HEAD:issue-108-line-comments
