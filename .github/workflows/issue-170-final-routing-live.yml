name: Issue 170 final CPA routing acceptance

on:
  push:
    branches:
      - dev/issue-170-cpa-subtext-ids

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install candidate
        run: python -m pip install .
      - name: Verify suffix and decimal CPA routes over stdio
        run: |
          python - <<'PY'
          import asyncio
          from mcp import Client, StdioServerParameters

          async def call_ok(client, name, args):
              result = await client.call_tool(name, args)
              if result.is_error:
                  raise RuntimeError(f"{name} failed: {result.structured_content!r}")
              if not isinstance(result.structured_content, dict):
                  raise RuntimeError(f"{name} missing structured content")
              return result.structured_content

          async def main():
              async with Client(StdioServerParameters(command="cal-mcp")) as client:
                  catalogue = await call_ok(
                      client, "cal_text_catalogue", {"category_id": "55"}
                  )
                  texts = catalogue.get("texts")
                  if not isinstance(texts, list):
                      raise RuntimeError("CPA catalogue has no text list")

                  expected = {("55000", "01001a"), ("55001", "002")}
                  found = {
                      (item.get("file_id"), item.get("subtext_id"))
                      for item in texts
                      if isinstance(item, dict)
                  }
                  missing = expected - found
                  if missing:
                      raise RuntimeError(f"CPA catalogue missing expected routes: {sorted(missing)!r}")

                  results = []
                  for file_id, subtext_id in sorted(expected):
                      data = await call_ok(
                          client,
                          "cal_text_page",
                          {"file_id": file_id, "subtext_id": subtext_id},
                      )
                      page = data.get("page")
                      if not isinstance(page, dict):
                          raise RuntimeError(f"CPA page {file_id}/{subtext_id} missing")
                      ref = page.get("text")
                      if (
                          not isinstance(ref, dict)
                          or ref.get("file_id") != file_id
                          or ref.get("subtext_id") != subtext_id
                      ):
                          raise RuntimeError(
                              f"CPA page identity mismatch for {file_id}/{subtext_id}: {ref!r}"
                          )
                      lines = page.get("lines")
                      if not isinstance(lines, list) or not lines:
                          raise RuntimeError(f"CPA page {file_id}/{subtext_id} has no lines")
                      results.append((file_id, subtext_id, len(lines)))

                  print(
                      "live #170 routing OK: "
                      + ", ".join(f"{f}/{s}:lines={n}" for f, s, n in results)
                  )

          asyncio.run(main())
          PY
