name: Issue 108 final docs synchronization

# Temporary self-removing Gate 3 runner.
on:
  push:
    branches:
      - issue-108-line-comments
    paths:
      - .github/workflows/issue-108-gate3-docs.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: issue-108-line-comments
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/tmp_issue108_gate3.py
      - name: Remove temporary staging files before validation
        run: |
          git rm .github/workflows/issue-108-gate3-docs.yml
          git rm scripts/tmp_issue108_gate3.py scripts/_finalize_issue108.py
      - name: Validate focused Gate 3
        run: |
          ruff check .
          ruff format --check .
          mypy
          pytest -q tests/test_docs_contract.py tests/test_release_contract.py tests/test_reachability_docs_contract.py tests/test_text_line_comments.py tests/test_text_line_comments_review_regressions.py
      - name: Commit synchronized docs only after GREEN
        run: |
          git add src/cal_mcp/server.py docs/tools/texts.md
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Document explicit CAL line comment follow-up"
          git push origin HEAD:issue-108-line-comments
