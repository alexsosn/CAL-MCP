name: Issue 84 lint cleanup

on:
  push:
    branches:
      - feat/issue-84-structured-errors
    paths:
      - .github/workflows/issue84-lint-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/issue-84-structured-errors
          fetch-depth: 0
      - name: Fix typed-error migration imports and self-remove
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "src/cal_mcp/bibliography.py": (
                  "from cal_mcp.client import CalHttpClient, CalRequest, CalResponse\n"
                  "from cal_mcp.errors import CalInputError, CalParseError\n"
                  "from cal_mcp.concordance import _validate_lemma_key\n",
                  "from cal_mcp.client import CalHttpClient, CalRequest, CalResponse\n"
                  "from cal_mcp.concordance import _validate_lemma_key\n"
                  "from cal_mcp.errors import CalInputError, CalParseError\n",
              ),
              "src/cal_mcp/lemma_key.py": (
                  "from __future__ import annotations\n\n"
                  "from cal_mcp.errors import CalInputError\n\n"
                  "import re\n\n"
                  "from cal_mcp.normalization import InputRepresentation, normalize_query\n",
                  "from __future__ import annotations\n\n"
                  "import re\n\n"
                  "from cal_mcp.errors import CalInputError\n"
                  "from cal_mcp.normalization import InputRepresentation, normalize_query\n",
              ),
              "src/cal_mcp/targum.py": (
                  "from cal_mcp.biblical import cal_biblical_book_id\n"
                  "from cal_mcp.client import CalHttpClient, CalRequest, CalResponse\n"
                  "from cal_mcp.errors import CalInputError, CalParseError\n"
                  "from cal_mcp.concordance import _validate_lemma_key\n",
                  "from cal_mcp.biblical import cal_biblical_book_id\n"
                  "from cal_mcp.client import CalHttpClient, CalRequest, CalResponse\n"
                  "from cal_mcp.concordance import _validate_lemma_key\n"
                  "from cal_mcp.errors import CalInputError, CalParseError\n",
              ),
              "src/cal_mcp/lexicon.py": (
                  "from cal_mcp.errors import CalParseError\n",
                  "from cal_mcp.errors import CalInputError, CalParseError\n",
              ),
          }
          for name, (old, new) in replacements.items():
              path = Path(name)
              text = path.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"{name}: import anchor changed")
              path.write_text(text.replace(old, new, 1))
          PY
          git add src/cal_mcp/bibliography.py src/cal_mcp/lemma_key.py src/cal_mcp/lexicon.py src/cal_mcp/targum.py
          git rm .github/workflows/issue84-lint-cleanup.yml
          git diff --cached --check
          git commit -m "fix: clean typed-error migration imports"
          git push origin HEAD:feat/issue-84-structured-errors
