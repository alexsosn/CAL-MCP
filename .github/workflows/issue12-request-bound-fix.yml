name: Issue 12 request-bound review fix

on:
  push:
    branches:
      - feat/issue-12-v0.1-contract-docs
    paths:
      - .github/workflows/issue12-request-bound-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/issue-12-v0.1-contract-docs
          fetch-depth: 0
      - name: Apply exact bounded-request documentation fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path("docs/research/issue-12-v0.1-contract-docs.md"): [
                  (
                      "- one public operation maps to one CAL request unless the operation explicitly represents a caller-selected stage;",
                      "- public operations use the smallest researched bounded request sequence for the task; most use one CAL request, while a successful `cal_lexicon_lookup` normally uses two CAL requests (browser discovery, then the selected entry fetch);",
                  ),
              ],
              Path("wiki/architecture.md"): [
                  (
                      "    H->>C: one explicit HTTP request",
                      "    H->>C: bounded HTTP request for the current task step",
                  ),
              ],
              Path("docs/limitations.md"): [
                  (
                      "Most public operations map to exactly one explicit CAL request. Multi-stage workflows expose each stage as a separate caller-controlled tool.",
                      "Most public operations map to exactly one explicit CAL request. The documented bounded exception is `cal_lexicon_lookup`: a successful exact lookup normally uses two CAL requests (browser discovery followed by the selected entry fetch). Multi-stage workflows otherwise expose each stage as a separate caller-controlled tool.",
                  ),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  if text.count(old) != 1:
                      raise SystemExit(f"expected exactly one match in {path}: {old!r}")
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")
          PY
      - name: Commit fixes and remove helper workflow
        run: |
          rm .github/workflows/issue12-request-bound-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/research/issue-12-v0.1-contract-docs.md wiki/architecture.md docs/limitations.md .github/workflows/issue12-request-bound-fix.yml
          git commit -m "docs: correct bounded request architecture"
          git push origin HEAD:feat/issue-12-v0.1-contract-docs
