name: issue-120-wording-fix

on:
  push:
    branches:
      - issue-120-cache-aware-request-volume-audit

permissions:
  contents: write

jobs:
  apply-wording-fix:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: issue-120-cache-aware-request-volume-audit
          fetch-depth: 0
      - name: Apply audited wording-only corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          server_path = Path('src/cal_mcp/server.py')
          server = server_path.read_text(encoding='utf-8')
          suffix = (
              'One explicit call submits at most one new logical CAL request. '
              'A completed cache hit performs no new upstream I/O.'
          )
          rules = {
              'cal_gloss_search': [(r'One tool call performs one bounded CAL search request\.', '')],
              'cal_gloss_field': [(r'One tool call\s+performs one bounded CAL request and does not expand or traverse other fields\.', 'It does not expand or traverse other fields.')],
              'cal_citation_text_search': [(r'One tool call performs one bounded CAL search request\.', '')],
              'cal_token_analysis': [(r'One call performs\s+one bounded CAL request and never expands candidate lexicon entries automatically\.', 'Candidate lexicon entries are never expanded automatically.')],
              'cal_text_concordance': [(r'One call performs exactly\s+one bounded CAL request\.', '')],
              'cal_kwic_texts': [(r'One call performs one bounded CAL request and never fetches full context\.', 'Full context is never fetched automatically.')],
              'cal_kwic_dialect': [(r'One call performs exactly one CAL request and never expands to other dialects or fetches\s+full-context pages automatically\.', 'It never expands to other dialects or fetches full-context pages automatically.')],
              'cal_bibliography_authors': [(r'One call performs exactly one bounded CAL request\.', '')],
              'cal_bibliography_author': [(r'One call\s+performs exactly one bounded CAL request\.', '')],
              'cal_bibliography_keyword': [(r'One call performs\s+exactly one bounded CAL request\.', '')],
              'cal_bibliography_lemma': [(r'One call performs exactly one bounded\s+CAL request\.', '')],
              'cal_targum_parallel': [(r'One call performs exactly one bounded CAL request\.', '')],
              'cal_syriac_missing_words': [(r'; one call performs exactly one bounded CAL request\.', '.')],
              'cal_syriac_peshitta_parallel': [(r'One call performs exactly one bounded CAL request\.', '')],
              'cal_external_citation_dialects': [(r'One call performs exactly one bounded CAL request and does not enumerate sources\.', 'It does not enumerate sources.')],
              'cal_external_citation_sources': [(r'One call performs exactly one bounded CAL request\.', '')],
              'cal_external_citations': [(r'One call performs exactly one bounded CAL request\.', '')],
              'cal_dictionary_collation': [(r'One call\s+performs exactly one bounded CAL request and never follows returned lemma links\.', 'Returned lemma links are never followed automatically.')],
          }

          for name, replacements in rules.items():
              marker = f'async def {name}('
              start = server.index(marker)
              open_quote = server.index('"""', start)
              close_quote = server.index('"""', open_quote + 3)
              body = server[open_quote + 3:close_quote]
              for pattern, replacement in replacements:
                  body, count = re.subn(pattern, replacement, body, count=1, flags=re.S)
                  if count != 1:
                      raise RuntimeError(f'{name}: expected exactly one match for {pattern!r}, got {count}')
              body = re.sub(r'\n[ \t]*\n[ \t]*\n+', '\n\n', body)
              if suffix in body:
                  raise RuntimeError(f'{name}: cache-aware suffix unexpectedly already present')
              body = body.rstrip() + '\n\n    ' + suffix + '\n    '
              server = server[:open_quote + 3] + body + server[close_quote:]

          server_path.write_text(server, encoding='utf-8')

          docs = {
              'docs/tools/search.md': [
                  'one call performs exactly one field-result request',
                  'one mcp call performs exactly one cal search request',
                  'a search is bounded operationally by one upstream request',
              ],
              'docs/tools/token-analysis.md': [
                  'every `cal_token_analysis` call performs exactly **one** user-initiated cal request',
              ],
              'docs/tools/concordance.md': [
                  'each public call performs exactly **one** user-initiated cal request',
                  'one call performs one bounded cal request',
                  'this operation requests one exact cal lemma key in one explicit decimal dialect id. it performs one cal request',
                  'every operation has an exact one-request upper bound',
              ],
              'docs/tools/bibliography.md': [
                  'each public call performs exactly **one** user-initiated cal request',
                  'every bibliography operation has an exact one-request upper bound',
              ],
              'docs/tools/dictionary-collation.md': [
                  'each call performs exactly one user-initiated cal request',
                  'one `cal_dictionary_collation` call performs exactly one bounded post to cal through the shared request layer',
              ],
              'docs/tools/targum.md': [
                  'each public tool call performs exactly **one** user-initiated cal request',
                  'every public targum operation performs exactly one cal request',
                  'one discovery call plus one reflex call means two caller-controlled cal requests',
              ],
              'docs/tools/syriac.md': [
                  'every public operation performs exactly **one** user-initiated cal request',
                  'every public syriac studies operation performs exactly one cal request',
              ],
              'docs/tools/external-citations.md': [
                  'each tool call performs exactly one bounded cal request',
              ],
          }

          replacement = 'each valid explicit operation submits at most one new logical CAL request to the shared client'
          special = {
              'a search is bounded operationally by one upstream request': 'a search is bounded operationally by at most one new logical CAL request',
              'one discovery call plus one reflex call means two caller-controlled cal requests': 'one discovery call plus one reflex call remains two caller-controlled scholarly operations',
          }
          shared_section = (
              '\n\n### Shared cache, single-flight, and retry semantics\n\n'
              'Each valid explicit operation in this family submits at most one new logical CAL request to the shared client. '
              'A completed cache hit performs zero new upstream I/O, and an identical simultaneous call can be a single-flight follower without duplicating the active request. '
              'Retryable failures may consume bounded retry transport attempts under the shared policy. '
              'These mechanisms do not create hidden traversal, prefetch, or background work.\n'
          )
          insert_before = {
              'docs/tools/search.md': '\n## Provenance\n',
              'docs/tools/token-analysis.md': '\n## Fixture-backed examples\n',
              'docs/tools/concordance.md': '\n## Empty results, upstream failures, and parser drift\n',
              'docs/tools/bibliography.md': '\n## Provenance\n',
              'docs/tools/dictionary-collation.md': '\n## Provenance\n',
              'docs/tools/targum.md': '\n## Empty results, upstream failures, and parser drift\n',
              'docs/tools/syriac.md': '\n## Provenance\n',
              'docs/tools/external-citations.md': '\n## Relationship to other citation/text tools\n',
          }

          for filename, phrases in docs.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              for phrase in phrases:
                  repl = special.get(phrase, replacement)
                  pattern = re.escape(phrase)
                  text, count = re.subn(pattern, repl, text, count=1, flags=re.I)
                  if count != 1:
                      raise RuntimeError(f'{filename}: expected exactly one match for {phrase!r}, got {count}')
              anchor = insert_before[filename]
              if text.count(anchor) != 1:
                  raise RuntimeError(f'{filename}: expected one insertion anchor {anchor!r}')
              if '### Shared cache, single-flight, and retry semantics' in text:
                  raise RuntimeError(f'{filename}: shared request section already present')
              text = text.replace(anchor, shared_section + anchor, 1)
              path.write_text(text, encoding='utf-8')
          PY
          git rm .github/workflows/issue-120-wording-fix.yml
          git diff --check
          git status --short
      - name: Commit wording-only implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/cal_mcp/server.py docs/tools/search.md docs/tools/token-analysis.md docs/tools/concordance.md docs/tools/bibliography.md docs/tools/dictionary-collation.md docs/tools/targum.md docs/tools/syriac.md docs/tools/external-citations.md
          git commit -m 'Apply cache-aware request-volume wording'
          git push origin HEAD:issue-120-cache-aware-request-volume-audit
