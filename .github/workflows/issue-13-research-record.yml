name: Record issue 13 research
on:
  push:
    branches: [feat/issue-13-external-citations]
permissions:
  contents: write
jobs:
  record:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/issue-13-external-citations
      - name: Append R-020 and self-clean
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('research.md')
          text = path.read_text(encoding='utf-8')
          marker = '## R-020 — Current external-text citation finder is an explicit dialect → source → citation workflow'
          if marker not in text:
              addition = '''\n\n## R-020 — Current external-text citation finder is an explicit dialect → source → citation workflow\n\n**Rechecked:** 2026-09-05.\n\nCAL's current search page exposes citations from texts not present in the online database as a separate Citation Finder. The live UI is an explicit three-stage workflow: `citfinder.html` lists 19 ordered CAL dialect IDs/labels; choosing one dialect opens a source-abbreviation list headed as texts with citations but no full text yet; choosing one exact source abbreviation opens that source's ordered lexical citations. A bounded Syriac probe returned 703 source rows in one approximately 317 KB response, and `1CorH` returned three citation rows. No pagination/continuation control was observed on these representative pages.\n\nCurrent source rows preserve a CAL source abbreviation plus rendered bibliographic/source description. Current citation rows expose a same-origin CAL lexical-entry link with canonical lemma key, rendered lemma/POS, external-source citation string, lexical gloss, source-language citation text when present, and optional English translation. The lexical link is an explicit follow-up into entry context; the absent source is not thereby available through CAL's ordinary online text browser. A source abbreviation such as `1CorH` must therefore not be represented as a CAL online `file_id` or guessed passage coordinate.\n\nCAL currently returns explicit HTTP-200 empty markers for both stages: `No extra citations for that dialect are currently found.` and `No citations for "…" are currently stored.` A successful-looking page with neither recognized semantic rows nor the corresponding marker is parser drift rather than an empty result.\n\nBranch-only research made seven fixed, bounded CAL GETs across three runs (three structural pages, two negative pages, and one repeat of those same two negative pages after correcting a local visible-text extractor). All requests had hard time/size caps; no dialect/source/citation enumeration or lexical-entry traversal occurred. Detailed evidence and raw semantic shapes are recorded in `docs/research/issue-13-external-citations.md`.\n\n**Implication:** expose caller-controlled dialect discovery, one-dialect source discovery, and one-source citation retrieval as separate bounded operations. Keep private endpoint/form fields hidden, do not invent pagination, never auto-follow lexical-entry links, and keep this result model distinct from both English citation-text search and online-corpus passage retrieval.\n'''
              path.write_text(text.rstrip() + addition + '\n', encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/issue-13-research-record.yml
          git add research.md
          git commit -m 'docs: record external citation upstream contract'
          git push origin HEAD:feat/issue-13-external-citations
