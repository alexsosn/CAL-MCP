name: issue-117-wording-fix

on:
  push:
    branches:
      - issue-117-cache-aware-text-request-docs

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: issue-117-cache-aware-text-request-docs
      - name: Apply wording-only fix
        run: |
          python - <<'PY'
          from pathlib import Path

          server = Path('src/cal_mcp/server.py')
          text = server.read_text(encoding='utf-8')
          old = '''    Metadata is returned as CAL's ordered free-form text rather than inferred bibliographic\n    fields. One call performs exactly one bounded CAL request and follows no metadata links.\n'''
          new = '''    Metadata is returned as CAL's ordered free-form text rather than inferred bibliographic\n    fields. One explicit call submits at most one new logical CAL request and follows no\n    metadata links. A completed cache hit performs no new upstream I/O.\n'''
          if text.count(old) != 1:
              raise SystemExit('expected cal_text_information description exactly once')
          server.write_text(text.replace(old, new), encoding='utf-8')

          docs = Path('docs/tools/texts.md')
          text = docs.read_text(encoding='utf-8')
          replacements = {
              'A call performs **one CAL request**. CAL-MCP does not recursively expand returned categories.':
                  'On a cache miss, an explicit call submits one logical CAL request. A completed cache hit performs zero new upstream I/O. CAL-MCP does not recursively expand returned categories.',
              'An explicit `cal_text_catalogue(category_id="51")` call makes one request to that dedicated collection page':
                  'An explicit `cal_text_catalogue(category_id="51")` call targets only that dedicated collection page',
              'Search still performs only the original single CAL request and never follows a returned result link automatically.':
                  'Search still submits at most one new logical CAL request and never follows a returned result link automatically; a completed cache hit performs zero new upstream I/O.',
              'One tool call performs exactly one bounded `get_file_info.php` request. Links rendered inside CAL metadata are never followed automatically.':
                  'One explicit tool call submits at most one new logical CAL request to `get_file_info.php`. A completed cache hit performs zero new upstream I/O. Links rendered inside CAL metadata are never followed automatically.',
              'These upstream forms remain adapter-private, and each supported public call still makes exactly one CAL request.':
                  'These upstream forms remain adapter-private, and each supported public call submits at most one new logical CAL request; a completed cache hit performs zero new upstream I/O.',
              'Every public text tool performs exactly one user-initiated CAL request:\n':
                  'Every explicit public text operation submits at most one new logical CAL request to the shared client. A completed cache hit performs zero new upstream I/O, and an identical simultaneous call can be a single-flight follower without duplicating the active request. Retryable failures may consume bounded retry transport attempts under the shared retry policy. These mechanisms do not create hidden background work.\n\nThe operation-level bounds remain:\n',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'expected docs phrase exactly once: {old!r}')
              text = text.replace(old, new)
          docs.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/issue-117-wording-fix.yml')
          workflow.unlink()
          PY
      - name: Commit wording fix and remove helper
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/cal_mcp/server.py docs/tools/texts.md .github/workflows/issue-117-wording-fix.yml
          git commit -m "Make core text request wording cache-aware"
          git push origin HEAD:issue-117-cache-aware-text-request-docs
