name: Register Syriac MCP tools

on:
  push:
    branches:
      - feat/issue-11-syriac
    paths:
      - .github/workflows/register-syriac-tools.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/issue-11-syriac
      - name: Register frozen public surface
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import base64; from pathlib import Path; p=Path('"'"'src/cal_mcp/server.py'"'"'); t=p.read_text(); old='"'"'from cal_mcp.search import EnglishSearchService\nfrom cal_mcp.targum import TargumService\n'"'"'; new='"'"'from cal_mcp.search import EnglishSearchService\nfrom cal_mcp.syriac import SyriacService\nfrom cal_mcp.targum import TargumService\n'"'"'; assert t.count(old)==1, '"'"'import anchor mismatch'"'"'; t=t.replace(old,new,1); marker='"'"'\n\ndef main() -> None:\n    """Run the CAL-MCP server over stdio."""\n    mcp.run()\n'"'"'; assert t.count(marker)==1, '"'"'main anchor mismatch'"'"'; tools=base64.b64decode('"'"''"'"').decode(); p.write_text(t.replace(marker,tools+marker,1))'
          python -m pip install "ruff<1,>=0.12"
          ruff format src/cal_mcp/server.py
          ruff check src/cal_mcp/server.py
      - name: Commit registration GREEN
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/cal_mcp/server.py
          git commit -m "feat: register Syriac MCP tools"
          git push origin HEAD:feat/issue-11-syriac
