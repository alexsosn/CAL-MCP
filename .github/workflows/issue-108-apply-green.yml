name: issue-108-apply-green

on:
  push:
    branches:
      - issue-108-line-comments
    paths:
      - .github/workflows/issue-108-apply-green.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: issue-108-line-comments
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Apply patch
        run: python scripts/tmp_issue108_green.py
      - name: Remove temporary harness
        run: git rm .github/workflows/issue-108-apply-green.yml scripts/tmp_issue108_green.py
      - name: Install
        run: |
          python -m pip install "pip==26.2.1" "setuptools==79.0.1"
          python -m pip install -e ".[dev]" -c constraints/ci-py311.txt --build-constraint constraints/build-py311.txt
      - name: Format
        run: ruff format src/cal_mcp/texts.py tests/test_kwic_full_context.py tests/test_release_artifact_verifier.py
      - name: Validate
        run: |
          ruff check .
          ruff format --check .
          mypy
          pytest
      - name: Commit
        run: |
          git add src/cal_mcp/texts.py tests/test_kwic_full_context.py tests/test_release_artifact_verifier.py docs/tools/texts.md
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix and document CAL line comment follow-up"
          git push origin HEAD:issue-108-line-comments
