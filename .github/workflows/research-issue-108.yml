name: issue-108 bounded comment-page research

on:
  push:
    branches:
      - issue-108-line-comments

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe three fixed current CAL comment pages
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            'https://cal.huc.edu/comment.php?coord=8100110821'
            'https://cal.huc.edu/comment.php?coord=5400111937'
            'https://cal.huc.edu/comment.php?coord=999999999999'
          )
          for url in "${urls[@]}"; do
            echo "===== $url ====="
            rm -f body headers
            curl --fail-with-body --silent --show-error \
              --max-time 15 --max-redirs 0 --max-filesize 524288 \
              --proto '=https' \
              -A 'CAL-MCP bounded research issue-108/2026-09-10' \
              -D headers -o body "$url" || status=$?
            status=${status:-0}
            echo "curl_exit=$status"
            sed -n '1,20p' headers || true
            printf 'bytes='; wc -c < body || true
            echo '--- body ---'
            cat body || true
            echo
            if [[ "$status" -ne 0 ]]; then exit "$status"; fi
            unset status
          done
