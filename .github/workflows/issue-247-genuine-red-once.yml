# One-time offline test-only RED evidence; removed after enqueue.
name: Issue 247 formatting-clean RED witness
on:
  push:
    branches: [research/issue-247-test-red-gate]
    paths: [.github/workflows/issue-247-genuine-red-once.yml]
permissions:
  contents: read
jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install offline test environment
        run: python -m pip install -e ".[dev]"
      - name: Ruff gates
        run: |
          ruff check tests/test_targum_reflex_examples.py
          ruff format --check tests/test_targum_reflex_examples.py
      - name: Expected missing-feature pytest failures
        run: pytest -q tests/test_targum_reflex_examples.py
