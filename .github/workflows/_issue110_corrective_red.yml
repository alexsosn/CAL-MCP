name: Establish issue 110 corrective RED

on:
  push:
    branches:
      - fix/issue-110-syriac-peshitta-routing

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Restore production and make RED test type-safe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git show origin/main:src/cal_mcp/syriac.py > src/cal_mcp/syriac.py
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_syriac.py')
          text = path.read_text()
          old = '''    assert all(\n        item.navigation_kind is SyriacTextNavigationKind.CATALOGUE for item in page.items\n    )\n'''
          new = '''    assert [item.navigation_kind.value for item in page.items] == ["catalogue", "catalogue"]\n'''
          if old not in text:
              raise SystemExit('expected assertion not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git rm .github/workflows/_issue110_corrective_red.yml
          git add src/cal_mcp/syriac.py tests/test_syriac.py
          git commit -m "test: establish valid Peshitta routing RED"
          git push origin HEAD:fix/issue-110-syriac-peshitta-routing
