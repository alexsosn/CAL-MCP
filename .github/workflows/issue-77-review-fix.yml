name: Issue 77 review fix

on:
  push:
    branches:
      - issue-77-shallow-catalogue

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          ref: issue-77-shallow-catalogue
          fetch-depth: 0
      - name: Enforce nonrecursive result invariant
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/cal_mcp/texts.py')
          text = path.read_text(encoding='utf-8')
          old = '''    specialized_collections: tuple[TextSpecializedCollectionRef, ...] = ()\n    recursive: bool = False\n\n    @property\n    def has_unexpanded_children(self) -> bool:\n        return bool(self.categories or self.specialized_collections)\n'''
          new = '''    specialized_collections: tuple[TextSpecializedCollectionRef, ...] = ()\n\n    @property\n    def recursive(self) -> bool:\n        return False\n\n    @property\n    def has_unexpanded_children(self) -> bool:\n        return bool(self.categories or self.specialized_collections)\n'''
          if text.count(old) != 1:
              raise SystemExit(f'unexpected TextCatalogueResult anchor count: {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit fix and remove helper
        run: |
          rm .github/workflows/issue-77-review-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/cal_mcp/texts.py .github/workflows/issue-77-review-fix.yml
          git diff --cached --check
          git commit -m "fix: enforce nonrecursive catalogue invariant"
          git push origin HEAD:issue-77-shallow-catalogue
