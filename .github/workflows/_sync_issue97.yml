name: Sync issue 97 with main

on:
  push:
    branches:
      - fix/issue-97-mandaic-route-scope
    paths:
      - .github/workflows/_sync_issue97.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/issue-97-mandaic-route-scope
          fetch-depth: 0
      - name: Merge current main and remove helper
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-commit --no-ff origin/main
          rm .github/workflows/_sync_issue97.yml
          git add -A
          git commit -m "chore: sync main before issue-97 review"
          git push origin HEAD:fix/issue-97-mandaic-route-scope
