name: Issue 170 direct CPA row-shape probe

on:
  push:
    branches:
      - dev/issue-170-cpa-subtext-ids

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Inspect direct CPA text row structure
        run: |
          python - <<'PY'
          import urllib.request
          from html.parser import HTMLParser

          url = "https://cal.huc.edu/get_a_chapter.php?file=55002&cset=C&page=0"
          req = urllib.request.Request(
              url,
              headers={"User-Agent": "CAL-MCP research/0.1 (+https://github.com/alexsosn/CAL-MCP)"},
          )
          with urllib.request.urlopen(req, timeout=20) as response:
              body = response.read().decode("utf-8", "replace")

          class Rows(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.in_text = False
                  self.row = None
                  self.cell = None
                  self.rows = []
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if tag == "table":
                      classes = (a.get("class") or "").split()
                      if "text-display" in classes:
                          self.in_text = True
                      elif self.in_text:
                          self.in_text = False
                  elif self.in_text and tag == "tr":
                      self.row = []
                  elif self.row is not None and tag == "td":
                      self.cell = {"links": 0, "has_text": False}
                      self.row.append(self.cell)
                  elif self.cell is not None and tag == "a":
                      self.cell["links"] += 1
              def handle_data(self, data):
                  if self.cell is not None and data.strip():
                      self.cell["has_text"] = True
              def handle_endtag(self, tag):
                  if tag == "td":
                      self.cell = None
                  elif tag == "tr" and self.row is not None:
                      self.rows.append(tuple((c["links"], c["has_text"]) for c in self.row))
                      self.row = None
                      self.cell = None

          p = Rows()
          p.feed(body)
          two_cell = [r for r in p.rows if len(r) == 2]
          plain = [r for r in two_cell if r[0][1] and r[1][1] and r[1][0] == 0]
          linked = [r for r in two_cell if r[1][0] > 0]
          print({
              "text_rows": len(p.rows),
              "two_cell_rows": len(two_cell),
              "plain_text_rows": len(plain),
              "linked_token_rows": len(linked),
              "row_shapes": sorted(set(p.rows)),
          })
          PY
