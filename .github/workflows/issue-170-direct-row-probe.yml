name: Issue 170 direct CPA row-shape probe

on:
  push:
    branches:
      - dev/issue-170-cpa-subtext-ids

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Inspect direct CPA structural markers
        run: |
          python - <<'PY'
          import urllib.request
          from collections import Counter
          from html.parser import HTMLParser
          from urllib.parse import urlsplit

          url = "https://cal.huc.edu/get_a_chapter.php?file=55002&cset=C&page=0"
          req = urllib.request.Request(
              url,
              headers={"User-Agent": "CAL-MCP research/0.1 (+https://github.com/alexsosn/CAL-MCP)"},
          )
          with urllib.request.urlopen(req, timeout=20) as response:
              body = response.read().decode("utf-8", "replace")

          class Shape(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.tags = Counter()
                  self.table_classes = Counter()
                  self.span_classes = Counter()
                  self.link_routes = Counter()
                  self.text_chunks_by_parent = Counter()
                  self.stack = []
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  self.tags[tag] += 1
                  self.stack.append(tag)
                  if tag == "table":
                      self.table_classes[a.get("class") or "<none>"] += 1
                  if tag == "span":
                      self.span_classes[a.get("class") or "<none>"] += 1
                  if tag == "a":
                      path = urlsplit(a.get("href") or "").path
                      self.link_routes[path.rsplit("/", 1)[-1] or "<empty>"] += 1
              def handle_endtag(self, tag):
                  for i in range(len(self.stack)-1, -1, -1):
                      if self.stack[i] == tag:
                          del self.stack[i:]
                          break
              def handle_data(self, data):
                  if data.strip():
                      self.text_chunks_by_parent[self.stack[-1] if self.stack else "<root>"] += 1

          p = Shape()
          p.feed(body)
          print({
              "bytes": len(body.encode("utf-8")),
              "tags": dict(p.tags),
              "table_classes": dict(p.table_classes),
              "span_classes": dict(p.span_classes),
              "link_routes": dict(p.link_routes),
              "text_chunks_by_parent": dict(p.text_chunks_by_parent),
          })
          PY
