name: Apply second Syriac review GREEN

on:
  push:
    branches:
      - feat/issue-11-syriac
    paths:
      - .github/workflows/syriac-review-green-2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/issue-11-syriac
      - name: Apply reviewed production fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one occurrence, found {count}: {old!r}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          syriac = Path("src/cal_mcp/syriac.py")
          replace_once(
              syriac,
              "from cal_mcp.client import CalContentError, CalHttpClient, CalRequest, CalResponse\n",
              "from cal_mcp.biblical import cal_biblical_book_id\n"
              "from cal_mcp.client import CalContentError, CalHttpClient, CalRequest, CalResponse\n",
          )
          text = syriac.read_text(encoding="utf-8")
          start = text.index("_BOOK_IDS = {")
          end = text.index("_PESHITTA_HEADING_PREFIX", start)
          syriac.write_text(text[:start] + text[end:], encoding="utf-8")
          replace_once(
              syriac,
              "            _, _, canonical_key = validate_lemma_key(lemma_key)\n",
              "            try:\n"
              "                _, _, canonical_key = validate_lemma_key(lemma_key)\n"
              "            except ValueError as exc:\n"
              "                raise SyriacParseError(\n"
              "                    \"CAL Syriac missing-word link contains an invalid lemma key\"\n"
              "                ) from exc\n",
          )
          replace_once(
              syriac,
              "                category=category,\n                upstream_category=path,\n",
              "                category=category,\n",
          )
          replace_once(
              syriac,
              "def _validate_book(book: str) -> str:\n"
              "    if not isinstance(book, str) or book not in _BOOK_IDS:\n"
              "        raise ValueError(\"book must be one exact current CAL biblical book label\")\n"
              "    return _BOOK_IDS[book]\n",
              "def _validate_book(book: str) -> str:\n"
              "    return cal_biblical_book_id(book)\n",
          )

          targum = Path("src/cal_mcp/targum.py")
          replace_once(
              targum,
              "from cal_mcp.client import CalContentError, CalHttpClient, CalRequest, CalResponse\n",
              "from cal_mcp.biblical import cal_biblical_book_id\n"
              "from cal_mcp.client import CalContentError, CalHttpClient, CalRequest, CalResponse\n",
          )
          text = targum.read_text(encoding="utf-8")
          start = text.index("_BOOK_IDS = {")
          end = text.index("_INITIALS =", start)
          targum.write_text(text[:start] + text[end:], encoding="utf-8")
          replace_once(
              targum,
              "def _validate_book(book: str) -> str:\n"
              "    if not isinstance(book, str) or book not in _BOOK_IDS:\n"
              "        raise ValueError(\"book must be one exact current CAL Targum book label\")\n"
              "    return _BOOK_IDS[book]\n",
              "def _validate_book(book: str) -> str:\n"
              "    return cal_biblical_book_id(book)\n",
          )
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/cal_mcp/syriac.py src/cal_mcp/targum.py
          git commit -m "fix: resolve Syriac review blockers"
          git push origin HEAD:feat/issue-11-syriac
