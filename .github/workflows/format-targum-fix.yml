name: Format reviewed Targum fix

on:
  push:
    branches:
      - feat/issue-10-targum
    paths:
      - .github/workflows/format-targum-fix.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/issue-10-targum
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Format target
        run: |
          python -m pip install "ruff<1,>=0.12"
          ruff format src/cal_mcp/targum.py
      - name: Commit format-only change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/cal_mcp/targum.py
          git commit -m "style: format Targum review fix"
          git push origin HEAD:feat/issue-10-targum
