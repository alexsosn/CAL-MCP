name: Research token analysis

on:
  push:
    branches:
      - issue-8-token-analysis
    paths:
      - .github/workflows/research-token-analysis.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Probe four existing fixture tokens for CAL analysis multiplicity
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from urllib.parse import parse_qs, urlsplit
          from urllib.request import Request, urlopen

          cases = [
              ("bt-az-xd", "https://cal.huc.edu/getlex.php?coord=7102601002107&word=0"),
              ("bt-az-tany", "https://cal.huc.edu/getlex.php?coord=7102601002107&word=1"),
              ("bt-az-man", "https://cal.huc.edu/getlex.php?coord=7102601002203&word=0"),
              ("bt-az-dtny", "https://cal.huc.edu/getlex.php?coord=7102601002203&word=1"),
          ]

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.links = []
                  self.href = None
                  self.parts = []
              def handle_starttag(self, tag, attrs):
                  if tag == "a":
                      self.href = next((v for k, v in attrs if k == "href"), None)
                      self.parts = []
              def handle_endtag(self, tag):
                  if tag == "a" and self.href is not None:
                      self.links.append((self.href, " ".join("".join(self.parts).split())))
                      self.href = None
                      self.parts = []
              def handle_data(self, data):
                  if self.href is not None:
                      self.parts.append(data)

          for name, url in cases:
              print(f"=== {name} ===")
              req = Request(url, headers={"User-Agent": "CAL-MCP bounded research probe"})
              with urlopen(req, timeout=15) as response:
                  raw = response.read(131072)
                  print("status", response.status)
              parser = Links()
              parser.feed(raw.decode("utf-8", errors="replace"))
              lemma_links = []
              for href, text in parser.links:
                  parsed = urlsplit(href)
                  if parsed.path.endswith(("oneentry.php", "cal_entry_web.php")):
                      lemma = parse_qs(parsed.query, keep_blank_values=True).get("lemma", [None])[0]
                      lemma_links.append((lemma, text))
              print("lemma-links", lemma_links)
          PY
