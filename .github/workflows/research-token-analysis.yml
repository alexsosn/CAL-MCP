name: Research token analysis structure

on:
  push:
    branches:
      - issue-8-token-analysis
    paths:
      - .github/workflows/research-token-analysis.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Inspect one confirmed ambiguous CAL token
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from urllib.request import Request, urlopen

          url = "https://cal.huc.edu/getlex.php?coord=7102601002203&word=0"

          class Blocks(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.parts = []
                  self.links = []
                  self.href = None
                  self.link_parts = []
                  self.lines = []
                  self.skip = 0
              def handle_starttag(self, tag, attrs):
                  if tag in {"style", "script"}:
                      self.skip += 1
                      return
                  if self.skip:
                      return
                  if tag in {"div", "p", "li", "tr", "td", "h1", "h2", "h3", "br"}:
                      self.flush()
                  if tag == "a":
                      self.href = next((v for k, v in attrs if k == "href"), "")
                      self.link_parts = []
              def handle_endtag(self, tag):
                  if tag in {"style", "script"}:
                      self.skip = max(0, self.skip - 1)
                      return
                  if self.skip:
                      return
                  if tag == "a" and self.href is not None:
                      self.links.append((self.href, " ".join("".join(self.link_parts).split())))
                      self.href = None
                      self.link_parts = []
                  if tag in {"div", "p", "li", "tr", "td", "h1", "h2", "h3", "br"}:
                      self.flush()
              def handle_data(self, data):
                  if self.skip:
                      return
                  self.parts.append(data)
                  if self.href is not None:
                      self.link_parts.append(data)
              def flush(self):
                  text = " ".join("".join(self.parts).split())
                  if text or self.links:
                      self.lines.append((text, tuple(self.links)))
                  self.parts = []
                  self.links = []

          req = Request(url, headers={"User-Agent": "CAL-MCP bounded research probe"})
          with urlopen(req, timeout=15) as response:
              raw = response.read(131072)
              print("status", response.status)
          parser = Blocks()
          parser.feed(raw.decode("utf-8", errors="replace"))
          parser.close()
          parser.flush()
          for index, item in enumerate(parser.lines[:80]):
              print(index, repr(item))
          PY
