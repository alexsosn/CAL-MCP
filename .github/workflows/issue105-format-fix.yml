name: issue105-format-fix

on:
  push:
    branches:
      - issue-105-syriac-group-followup

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: issue-105-syriac-group-followup
      - name: Apply formatter-equivalent edits
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/cal_mcp/syriac.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "return SyriacTextCategoryPage(label=matching_headings[0], items=items)\n\n\n\ndef _parse_syriac_navigation_items(",
              "return SyriacTextCategoryPage(label=matching_headings[0], items=items)\n\n\ndef _parse_syriac_navigation_items(",
          )
          text = text.replace(
              "        raise SyriacParseError(\n            \"CAL Syriac grouped-text response has unexpected query semantics\"\n        )",
              "        raise SyriacParseError(\"CAL Syriac grouped-text response has unexpected query semantics\")",
          )
          text = text.replace(
              "        raise SyriacParseError(\n            \"CAL Syriac grouped-text response contradicts the selected group\"\n        )",
              "        raise SyriacParseError(\"CAL Syriac grouped-text response contradicts the selected group\")",
          )
          text = text.replace(
              "    return _parse_syriac_navigation_items(parser.lines, response.url)\n\ndef parse_syriac_missing_words_page(",
              "    return _parse_syriac_navigation_items(parser.lines, response.url)\n\n\ndef parse_syriac_missing_words_page(",
          )
          path.write_text(text, encoding="utf-8")
          Path(".github/workflows/issue105-format-fix.yml").unlink()
          PY
      - name: Commit and self-clean
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Format Syriac group implementation (#105)"
          git push origin HEAD:issue-105-syriac-group-followup
