name: Issue 15 v0.1 artifact confirmation

on:
  push:
    branches:
      - release/issue-15-v0.1-resume
    paths:
      - .github/workflows/issue-15-artifact-confirmation.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install validation dependencies
        run: python -m pip install -e ".[dev]"
      - name: Build candidate distributions once
        run: python -m build --outdir dist
      - name: Verify v0.1.0 metadata and clean installed stdio surface
        run: python scripts/verify_release_artifact.py dist --tag v0.1.0
