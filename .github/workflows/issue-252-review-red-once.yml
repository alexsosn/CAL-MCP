# One-shot independent review RED: old parser with formatted counterexample tests.
name: Issue 252 wrong-prefix marker adversarial RED witness
on:
  push:
    branches: [research/issue-252-review-red]
    paths: [.github/workflows/issue-252-review-red-once.yml]
permissions:
  contents: read
jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install offline test deps
        run: python -m pip install -e ".[dev]"
      - name: Ruff test lint and format preconditions
        run: |
          ruff check tests/test_lexicon_current_no_headwords.py
          ruff format --check tests/test_lexicon_current_no_headwords.py
      - name: Expected wrong-prefix and contradictory-row failures
        run: pytest -q tests/test_lexicon_current_no_headwords.py
