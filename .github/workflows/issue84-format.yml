name: Issue 84 server formatting

on:
  push:
    branches:
      - feat/issue-84-structured-errors
    paths:
      - .github/workflows/issue84-format.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/issue-84-structured-errors
          fetch-depth: 0
      - name: Apply Ruff-equivalent server formatting and self-remove
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          from pathlib import Path

          path = Path("src/cal_mcp/server.py")
          text = path.read_text()
          replacements = [
              (
                  '''    fields = sorted(\n        {\n            ".".join(str(part) for part in item["loc"])\n            for item in error.errors()\n            if item.get("loc")\n        }\n    )\n''',
                  '''    fields = sorted(\n        {".".join(str(part) for part in item["loc"]) for item in error.errors() if item.get("loc")}\n    )\n''',
              ),
              (
                  '''            public_error = (\n                classify_public_tool_error(name, cause) if cause is not None else None\n            )\n''',
                  '''            public_error = classify_public_tool_error(name, cause) if cause is not None else None\n''',
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit("server format anchor changed")
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          git add src/cal_mcp/server.py
          git rm .github/workflows/issue84-format.yml
          git diff --cached --check
          git commit -m "style: format structured error boundary"
          git push origin HEAD:feat/issue-84-structured-errors
