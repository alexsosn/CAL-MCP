# Exact one-call installed-wheel source acceptance; remove this trigger after enqueue.
name: One-time Targum concordance group acceptance (#246)
on:
  push:
    branches: [dev/issue-246-targum-concordance-examples]
    paths: [.github/workflows/issue-246-kwic-live-once.yml]
permissions:
  contents: read
concurrency:
  group: cal-mcp-live-smoke
  cancel-in-progress: false
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build one package wheel
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check build
          python -m build --wheel --outdir dist
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l)" -eq 1
      - name: Install wheel outside checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/cal-kwic-acceptance"
          "$RUNNER_TEMP/cal-kwic-acceptance/bin/python" -m pip install \
            --disable-pip-version-check --no-cache-dir dist/*.whl
      - name: One bounded CAL stdio MCP example request
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/cal-kwic-acceptance/bin/python" - <<'PY'
          import asyncio
          import json
          import os
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from urllib.parse import parse_qs, urlsplit

          from jsonschema import Draft202012Validator
          from mcp import Client, StdioServerParameters

          ROOT = Path(os.environ["RUNNER_TEMP"]) / "cal-kwic-acceptance"
          COMMAND = str(ROOT / "bin" / "cal-mcp")
          IDS = ["51001", "51002", "51003", "51004", "51005"]

          async def smoke(report: Path):
              env = dict(os.environ)
              env["CAL_MCP_LIVE_SMOKE_MAX_ATTEMPTS"] = "25"
              env["CAL_MCP_LIVE_SMOKE_REPORT_PATH"] = str(report)
              async with Client(StdioServerParameters(command=COMMAND, env=env)) as client:
                  tools = {tool.name: tool for tool in (await client.list_tools()).tools}
                  assert len(tools) == 36, f"wrong MCP tool count: {len(tools)}"
                  tool = tools["cal_targum_concordance_examples"]
                  assert set(tool.input_schema["properties"]) == {"lemma_key", "text_ids"}
                  result = await client.call_tool(
                      "cal_targum_concordance_examples",
                      {"lemma_key": "klb N", "text_ids": IDS},
                  )
                  if result.is_error:
                      data = result.structured_content or {}
                      err = data.get("error", {})
                      return {"status": "error", "kind": err.get("kind", "unknown"),
                              "message": str(err.get("message", ""))[:160]}
                  data = result.structured_content
                  assert isinstance(data, dict)
                  Draft202012Validator(tool.output_schema).validate(data)
                  assert data.get("lemma_key") == "klb N"
                  assert data.get("text_ids") == IDS
                  assert data.get("total") == 3
                  source = data.get("provenance")
                  assert isinstance(source, dict)
                  assert source.get("source") == "CAL"
                  assert source.get("operation") == "targum_concordance_examples"
                  assert source.get("lemma_key") == "klb N"
                  url = urlsplit(source.get("source_url", ""))
                  assert (url.scheme, url.netloc, url.path) == (
                      "https", "cal.huc.edu", "/show1dialectKWIC.php"
                  )
                  query = parse_qs(url.query)
                  assert query == {
                      "lemma": ["klb"], "pos": ["N"],
                      "texts": [" ".join(IDS)], "charset": ["H"]
                  }
                  hits = data.get("hits")
                  assert isinstance(hits, list) and len(hits) == 3
                  for item in hits:
                      assert isinstance(item, dict)
                      assert item.get("file_id") in IDS
                      assert item.get("charset") == "H"
                      assert isinstance(item.get("context"), str) and item["context"].strip()
                      assert isinstance(item.get("target_coordinate"), str) and item["target_coordinate"].isdigit()
                      assert isinstance(item.get("target_text"), str) and item["target_text"].strip()
                      follow = urlsplit(item.get("full_context_url", ""))
                      assert (follow.scheme, follow.netloc, follow.path) == (
                          "https", "cal.huc.edu", "/get_a_kwicchapter.php"
                      )
                  return {
                      "status": "ok", "count": len(hits),
                      "text_ids_used": sorted({hit["file_id"] for hit in hits})
                  }

          with TemporaryDirectory(prefix="cal-kwic-") as d:
              report = Path(d) / "requests.json"
              result = asyncio.run(smoke(report))
              meter = json.loads(report.read_text(encoding="utf-8"))
              assert meter == {
                  "actual_cal_transport_attempts": 1, "max_cal_transport_attempts": 25
              }, meter
              print(json.dumps({"result": result, "meter": meter}, ensure_ascii=False))
              assert result["status"] == "ok"
          PY
