name: Format issue 108 texts implementation

on:
  push:
    branches:
      - issue-108-line-comments

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: issue-108-line-comments
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Format implementation
        run: |
          python -m pip install 'ruff==0.16.6'
          ruff format src/cal_mcp/texts.py
      - name: Commit formatting and remove helper
        run: |
          git rm .github/workflows/format-issue108-texts.yml
          git add src/cal_mcp/texts.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Format line-comments implementation"
          git push origin HEAD:issue-108-line-comments
