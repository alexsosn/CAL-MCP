# One-shot offline RED witness for test-only commit, removed after enqueue.
name: Issue 277 test-first lexicon completeness RED
on:
  push:
    branches: [research/issue-277-formatted-behavior-red]
    paths: [.github/workflows/issue-277-formatted-red-once.yml]
permissions:
  contents: read
jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install offline test environment
        run: python -m pip install -e ".[dev]"
      - name: Confirm test-source Ruff preconditions
        run: |
          ruff check tests/test_lexicon_incomplete_results.py
          ruff format --check tests/test_lexicon_incomplete_results.py
      - name: Expected missing feature failures
        run: pytest -q tests/test_lexicon_incomplete_results.py
