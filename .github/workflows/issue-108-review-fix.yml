name: Issue 108 review fixes

on:
  push:
    branches:
      - issue-108-line-comments
    paths:
      - .github/workflows/issue-108-review-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: issue-108-line-comments
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Apply minimal parser fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/cal_mcp/texts.py")
          text = path.read_text(encoding="utf-8")

          old = '_LINE_COMMENTS_EMPTY_MARKER = "NO CITATIONS FOR THIS LINE ARE CURRENTLY BEING USED"\n'
          new = old + '_LINE_COMMENTS_IGNORED_TAGS = frozenset({"script", "style"})\n'
          if text.count(old) != 1:
              raise SystemExit(f"empty-marker anchor count: {text.count(old)}")
          text = text.replace(old, new, 1)

          old = '        self._in_reference = False\n        self._in_gloss = False\n\n    def handle_starttag'
          new = '        self._in_reference = False\n        self._in_gloss = False\n        self._ignored_depth = 0\n\n    def handle_starttag'
          if text.count(old) != 1:
              raise SystemExit(f"parser-state anchor count: {text.count(old)}")
          text = text.replace(old, new, 1)

          old = '''    def handle_starttag(self, tag: str, attrs: list[tuple[str, str | None]]) -> None:\n        attr_map = dict(attrs)\n        if tag == "title":\n'''
          new = '''    def handle_starttag(self, tag: str, attrs: list[tuple[str, str | None]]) -> None:\n        if self._ignored_depth:\n            self._ignored_depth += 1\n            return\n        if tag in _LINE_COMMENTS_IGNORED_TAGS:\n            self._ignored_depth = 1\n            return\n\n        attr_map = dict(attrs)\n        if tag == "title":\n'''
          if text.count(old) != 1:
              raise SystemExit(f"starttag anchor count: {text.count(old)}")
          text = text.replace(old, new, 1)

          old = '''        if tag == "div":\n            classes = (attr_map.get("class") or "").split()\n            if self._summary_depth:\n                self._summary_depth += 1\n            elif "summary-card" in classes:\n                self.summary_count += 1\n                self._summary_depth = 1\n            return\n'''
          new = '''        if tag == "div":\n            classes = (attr_map.get("class") or "").split()\n            if "summary-card" in classes:\n                if self._summary_depth:\n                    raise TextParseError("CAL line-comments page has nested summary cards")\n                self.summary_count += 1\n                self._summary_depth = 1\n            elif self._summary_depth:\n                self._summary_depth += 1\n            return\n'''
          if text.count(old) != 1:
              raise SystemExit(f"summary-card anchor count: {text.count(old)}")
          text = text.replace(old, new, 1)

          old = '''    def handle_endtag(self, tag: str) -> None:\n        if tag == "title" and self._title_parts is not None:\n'''
          new = '''    def handle_endtag(self, tag: str) -> None:\n        if self._ignored_depth:\n            self._ignored_depth -= 1\n            return\n\n        if tag == "title" and self._title_parts is not None:\n'''
          if text.count(old) != 1:
              raise SystemExit(f"endtag anchor count: {text.count(old)}")
          text = text.replace(old, new, 1)

          old = '''    def handle_data(self, data: str) -> None:\n        if self._title_parts is not None:\n'''
          new = '''    def handle_data(self, data: str) -> None:\n        if self._ignored_depth:\n            return\n        if self._title_parts is not None:\n'''
          if text.count(old) != 1:
              raise SystemExit(f"data anchor count: {text.count(old)}")
          text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY
      - name: Remove helper before validation
        run: git rm .github/workflows/issue-108-review-fix.yml
      - name: Install deterministic validation environment
        run: |
          python -m pip install "pip==26.2.1" "setuptools==79.0.1"
          python -m pip install -e ".[dev]" -c constraints/ci-py311.txt --build-constraint constraints/build-py311.txt
      - name: Validate complete tree
        run: |
          ruff check .
          ruff format --check .
          mypy
          pytest
      - name: Commit review fixes after GREEN
        run: |
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fail closed on line-comment structural drift"
          git push origin HEAD:issue-108-line-comments
