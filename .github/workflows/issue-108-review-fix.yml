name: Issue 108 review regression fix

on:
  push:
    branches:
      - issue-108-line-comments
    paths:
      - .github/workflows/issue-108-review-fix.yml

permissions:
  contents: write

jobs:
  red-green:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: issue-108-line-comments
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install validation environment
        run: python -m pip install -e '.[dev]'
      - name: Confirm review regression is RED before fix
        run: |
          set +e
          pytest -q tests/test_text_line_comments_review_regressions.py
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'review regression unexpectedly passed before the fix' >&2
            exit 1
          fi
          echo 'Confirmed RED: malformed unclosed reference markup is currently accepted.'
      - name: Apply narrow parser-state fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/cal_mcp/texts.py')
          text = path.read_text()
          old = '''        if tag == "p" and self._record is not None:
            if self._span_parts is not None or self._anchor_parts is not None or self._in_gloss:
                raise TextParseError(
                    "CAL line-comments record closes with unfinished semantic markup"
                )
'''
          new = '''        if tag == "p" and self._record is not None:
            if (
                self._span_parts is not None
                or self._anchor_parts is not None
                or self._in_reference
                or self._in_gloss
            ):
                raise TextParseError(
                    "CAL line-comments record closes with unfinished semantic markup"
                )
'''
          if text.count(old) != 1:
              raise SystemExit(f'unexpected paragraph guard anchor count: {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          ruff format src/cal_mcp/texts.py
      - name: Confirm focused GREEN after fix
        run: |
          ruff check .
          ruff format --check .
          mypy
          pytest -q tests/test_text_line_comments.py tests/test_text_line_comments_review_regressions.py -k 'not release_manifest'
      - name: Commit only after RED and GREEN
        run: |
          git rm .github/workflows/issue-108-review-fix.yml
          git add src/cal_mcp/texts.py tests/test_text_line_comments_review_regressions.py
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fail closed on incomplete line-comment references"
          git push origin HEAD:issue-108-line-comments
