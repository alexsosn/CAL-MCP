name: Issue 208 live raw-angle probe

on:
  push:
    branches:
      - dev/issue-208-full-context-row-strictness

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Confirm current Samaritan raw angle-bracket shape
        run: |
          python - <<'PY'
          from urllib.request import Request, urlopen

          url = "https://cal.huc.edu/get_a_kwicchapter.php?file=56000&sub=112&cset=R&target=56000112010"
          req = Request(url, headers={"User-Agent": "CAL-MCP bounded research probe"})
          with urlopen(req, timeout=20) as response:
              body = response.read().decode("utf-8", errors="replace")
          needle = "<w)th"
          positions = []
          start = 0
          while True:
              i = body.find(needle, start)
              if i < 0:
                  break
              positions.append(i)
              start = i + len(needle)
          print("count", len(positions))
          for i in positions[:5]:
              print("shape", repr(body[i:i+18]))
          PY
