name: Issue 208 live markup probe

on:
  push:
    branches:
      - dev/issue-208-full-context-row-strictness

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Probe current full-context text-cell tag vocabulary
        run: |
          python - <<'PY'
          from collections import Counter
          from html.parser import HTMLParser
          from urllib.request import Request, urlopen

          CASES = {
              "R": "https://cal.huc.edu/get_a_kwicchapter.php?file=56000&sub=112&cset=R&target=56000112010",
              "H": "https://cal.huc.edu/get_a_kwicchapter.php?file=71002&sub=01051&cset=H&target=7100201051217",
              "U": "https://cal.huc.edu/get_a_kwicchapter.php?file=60301&sub=53&cset=U&target=603015323",
          }

          class Probe(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.in_cell = False
                  self.depth = 0
                  self.tags = []
                  self.links = []
                  self.cells = []
              def handle_starttag(self, tag, attrs):
                  if tag in {"td", "th"}:
                      self.in_cell = True
                      self.depth = 1
                      self.tags = []
                      self.links = []
                      return
                  if self.in_cell:
                      self.depth += 1
                      self.tags.append(tag)
                      if tag == "a":
                          href = dict(attrs).get("href") or ""
                          self.links.append(href.split("?", 1)[0])
              def handle_endtag(self, tag):
                  if not self.in_cell:
                      return
                  if tag in {"td", "th"} and self.depth == 1:
                      if any(x.endswith("getlex.php") or x.endswith("bablex.php") for x in self.links):
                          self.cells.append((tuple(self.tags), tuple(self.links)))
                      self.in_cell = False
                      self.depth = 0
                      return
                  self.depth = max(1, self.depth - 1)

          for label, url in CASES.items():
              req = Request(url, headers={"User-Agent": "CAL-MCP bounded research probe"})
              with urlopen(req, timeout=20) as response:
                  body = response.read().decode("utf-8", errors="replace")
              p = Probe()
              p.feed(body)
              p.close()
              vocab = Counter(tag for tags, _ in p.cells for tag in tags)
              shapes = Counter(tags for tags, _ in p.cells)
              print(label, "cells", len(p.cells), "vocab", dict(sorted(vocab.items())))
              for shape, count in shapes.most_common(10):
                  print(label, "shape", count, shape)
          PY
