name: Issue 222 bounded uncertain-POS research

on:
  push:
    branches:
      - dev/issue-222-uncertain-lexicon-pos

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install candidate
        run: python -m pip install .
      - name: Inspect exact-entry uncertain POS structure and false header
        run: |
          python - <<'PY'
          from datetime import UTC, datetime
          from html.parser import HTMLParser
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          from cal_mcp.client import CalResponse
          from cal_mcp.lexicon import _parse_lemma_header, _parse_lines, parse_lexicon_entry

          url = "https://cal.huc.edu/oneentry.php?" + urlencode({"lemma": "$lh N", "cits": "all"})
          req = Request(url, headers={"User-Agent": "CAL-MCP bounded issue-222 research"})
          with urlopen(req, timeout=20) as response:
              raw = response.read()
              print("HTTP", response.status, "bytes", len(raw))

          class StackProbe(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.stack = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  marker = tag
                  if attrs.get("class"):
                      marker += "." + ".".join(attrs["class"].split())
                  self.stack.append(marker)
              def handle_endtag(self, tag):
                  if self.stack:
                      self.stack.pop()
              def handle_data(self, data):
                  if "n.f.?" in data:
                      print("DOM", repr(data.strip()), "stack", self.stack[-6:])

          probe = StackProbe()
          probe.feed(raw.decode("utf-8", errors="replace"))
          probe.close()

          cal = CalResponse(
              status_code=200,
              url=url,
              body=raw,
              content_type="text/html; charset=UTF-8",
              retrieved_at=datetime.now(UTC),
          )
          parsed = parse_lexicon_entry(cal, lemma_key="$lh N")
          print(
              "RETURNED",
              "lemma_key", repr(parsed.lemma.lemma_key),
              "headwords", parsed.lemma.headwords,
              "pos", repr(parsed.lemma.part_of_speech),
              "gloss", repr(parsed.lemma.gloss),
          )

          for index, line in enumerate(_parse_lines(cal)):
              candidate = _parse_lemma_header(
                  line.text,
                  lemma_key="$lh N",
                  require_gloss=True,
              )
              if "n.f.?" in line.text or candidate is not None:
                  print(
                      "LINE", index,
                      repr(line.text),
                      "candidate",
                      None if candidate is None else {
                          "headwords": candidate.headwords,
                          "pos": candidate.part_of_speech,
                          "gloss": candidate.gloss,
                      },
                  )
          PY
