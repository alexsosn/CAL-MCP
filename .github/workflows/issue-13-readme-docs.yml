name: Issue 13 README update

on:
  push:
    branches:
      - feat/issue-13-external-citations
    paths:
      - .github/workflows/issue-13-readme-docs.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/issue-13-external-citations
      - name: Update README and self-clean
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('README.md')
          s = p.read_text(encoding='utf-8')
          replacements = [
              (
                  'bounded bibliography search, bounded Targum Studies operations, and bounded Syriac Studies operations; no versioned release has been published yet.',
                  'bounded bibliography search, bounded external/non-online citation retrieval, bounded Targum Studies operations, and bounded Syriac Studies operations; no versioned release has been published yet.',
              ),
              (
                  '| Citations | Planned | citation lookup, source links, retrieval metadata beyond English citation-text search |',
                  '| Citations | **Implemented** | `cal_external_citation_dialects`, `cal_external_citation_sources`, and `cal_external_citations`: explicit one-request discovery and lexical citation retrieval for CAL sources cited in the database but not available as full online texts |',
              ),
              (
                  '[`docs/tools/bibliography.md`](docs/tools/bibliography.md) for bounded CAL bibliography search, [`docs/tools/targum.md`](docs/tools/targum.md)',
                  '[`docs/tools/bibliography.md`](docs/tools/bibliography.md) for bounded CAL bibliography search, [`docs/tools/external-citations.md`](docs/tools/external-citations.md) for CAL citations from cited-but-not-online texts, [`docs/tools/targum.md`](docs/tools/targum.md)',
              ),
              (
                  '- [`docs/tools/targum.md`](docs/tools/targum.md) — bounded parallel-verse comparison, Targum concordance, MT Hebrew lemma discovery/reflexes, failures, and provenance.\n',
                  '- [`docs/tools/external-citations.md`](docs/tools/external-citations.md) — explicit dialect/source discovery and ordered lexical citations for CAL sources not available as full online texts.\n- [`docs/tools/targum.md`](docs/tools/targum.md) — bounded parallel-verse comparison, Targum concordance, MT Hebrew lemma discovery/reflexes, failures, and provenance.\n',
              ),
              (
                  '- live `cal_targum_parallel`, `cal_targum_concordance`, `cal_targum_hebrew_lemmas`, and `cal_targum_hebrew_reflexes` tools',
                  '- live `cal_external_citation_dialects`, `cal_external_citation_sources`, and `cal_external_citations` tools with explicit caller-controlled dialect/source stages, one-request bounds, preserved external-source references, and no online-text or lexical-entry expansion;\n- live `cal_targum_parallel`, `cal_targum_concordance`, `cal_targum_hebrew_lemmas`, and `cal_targum_hebrew_reflexes` tools',
              ),
              (
                  'concordance/bibliography/Targum/Syriac parser/service, and MCP contract tests make no live CAL requests.',
                  'concordance/bibliography/external-citation/Targum/Syriac parser/service, and MCP contract tests make no live CAL requests.',
              ),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'README replacement target missing: {old[:80]!r}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          rm .github/workflows/issue-13-readme-docs.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md .github/workflows/issue-13-readme-docs.yml
          git commit -m 'docs: expose external citations in README'
          git push origin HEAD:feat/issue-13-external-citations
