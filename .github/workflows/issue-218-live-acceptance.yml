name: Issue 218 live stdio acceptance

on:
  push:
    branches:
      - dev/issue-218-mandaic-alphanumeric-coordinates

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install candidate
        run: python -m pip install .
      - name: Verify live Mandaic coordinates over installed stdio
        run: |
          python - <<'PY'
          import asyncio
          from mcp import Client, StdioServerParameters

          calls = 0

          async def call(client, tool, args):
              global calls
              calls += 1
              if calls > 3:
                  raise RuntimeError(f"request budget exceeded: {calls}")
              result = await client.call_tool(tool, args)
              if result.is_error:
                  raise RuntimeError(f"{tool} {args}: {result.content!r}")
              data = result.structured_content
              if not isinstance(data, dict):
                  raise RuntimeError(f"{tool}: missing structured content")
              return data

          def token_coordinates(page):
              payload = page.get("page")
              if not isinstance(payload, dict):
                  raise RuntimeError("missing page payload")
              out = []
              for line in payload.get("lines") or []:
                  if not isinstance(line, dict):
                      continue
                  for token in line.get("tokens") or []:
                      if isinstance(token, dict):
                          coord = token.get("coordinate")
                          word = token.get("word_index")
                          if isinstance(coord, str) and isinstance(word, int):
                              out.append((coord, word))
              return out

          async def main():
              async with Client(StdioServerParameters(command="cal-mcp")) as client:
                  p25 = await call(client, "cal_text_page", {"file_id":"74425","page":1})
                  c25 = token_coordinates(p25)
                  special25 = next(
                      ((c,w) for c,w in c25 if c.startswith("74425") and any(ch.isalpha() for ch in c)),
                      None,
                  )
                  if special25 is None:
                      raise RuntimeError("74425 returned no researched alphanumeric token coordinate")

                  p29 = await call(client, "cal_text_page", {"file_id":"74429","page":1})
                  c29 = token_coordinates(p29)
                  if not any(c.startswith("74429A") for c,_ in c29):
                      raise RuntimeError("74429 returned no uppercase-A coordinate")

                  coord, word = special25
                  analysis = await call(
                      client,
                      "cal_token_analysis",
                      {"coordinate":coord,"word_index":word},
                  )
                  if analysis.get("coordinate") != coord or analysis.get("word_index") != word:
                      raise RuntimeError("token-analysis follow-up changed coordinate identity")
                  if analysis.get("status") not in {"found","not_found"}:
                      raise RuntimeError("token-analysis follow-up returned no recognized status")
                  if calls != 3:
                      raise RuntimeError(f"expected 3 logical calls, got {calls}")
                  print(f"#218 live OK: followup={coord}/{word} calls={calls}")

          asyncio.run(main())
          PY
