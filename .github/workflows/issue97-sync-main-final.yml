name: issue-97 final main sync

on:
  push:
    branches:
      - fix/issue-97-mandaic-route-scope
    paths:
      - .github/workflows/issue97-sync-main-final.yml

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/issue-97-mandaic-route-scope
          fetch-depth: 0
      - name: Merge current main and remove helper
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-ff --no-edit origin/main
          git rm .github/workflows/issue97-sync-main-final.yml
          git commit -m "Sync issue-97 with current main"
          git push origin HEAD:fix/issue-97-mandaic-route-scope
