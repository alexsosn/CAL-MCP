name: Issue 84 server boundary

on:
  push:
    branches:
      - feat/issue-84-structured-errors
    paths:
      - .github/workflows/issue84-server-boundary.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/issue-84-structured-errors
          fetch-depth: 0
      - name: Add structured error MCP boundary and self-remove
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          from pathlib import Path

          path = Path("src/cal_mcp/server.py")
          text = path.read_text()

          old = '''from dataclasses import dataclass\n\nfrom mcp.server import MCPServer\nfrom mcp.server.mcpserver import Context\n'''
          new = '''from dataclasses import dataclass\nfrom typing import Any\n\nfrom mcp.server import MCPServer\nfrom mcp.server.mcpserver import Context\nfrom mcp.server.mcpserver.exceptions import ToolError, UnexpectedToolError\nfrom mcp.types import CallToolResult, InputRequiredResult, TextContent\nfrom pydantic import ValidationError\n'''
          if text.count(old) != 1:
              raise SystemExit("server import anchor changed")
          text = text.replace(old, new, 1)

          old = '''from cal_mcp.dictionary_collation import DictionaryCollationService, DictionarySource\nfrom cal_mcp.external_citations import ExternalCitationService\n'''
          new = '''from cal_mcp.dictionary_collation import DictionaryCollationService, DictionarySource\nfrom cal_mcp.errors import PublicErrorKind, PublicToolError, classify_public_tool_error\nfrom cal_mcp.external_citations import ExternalCitationService\n'''
          if text.count(old) != 1:
              raise SystemExit("server CAL import anchor changed")
          text = text.replace(old, new, 1)

          marker = '''@asynccontextmanager\nasync def app_lifespan(_server: MCPServer[AppContext]) -> AsyncIterator[AppContext]:\n'''
          insertion = '''def _public_tool_error_result(error: PublicToolError) -> CallToolResult:\n    return CallToolResult(\n        content=[\n            TextContent(\n                type="text",\n                text=f"{error.operation}: {error.kind.value}: {error.message}",\n            )\n        ],\n        structured_content=error.to_dict(),\n        is_error=True,\n    )\n\n\ndef _sdk_validation_message(error: ValidationError) -> str:\n    fields = sorted(\n        {\n            ".".join(str(part) for part in item["loc"])\n            for item in error.errors()\n            if item.get("loc")\n        }\n    )\n    if not fields:\n        return "Invalid tool arguments"\n    return f"Invalid tool arguments: {', '.join(fields)}"\n\n\nclass CalMCPServer(MCPServer[AppContext]):\n    async def call_tool(\n        self,\n        name: str,\n        arguments: dict[str, Any],\n        context: Context[AppContext, Any] | None = None,\n    ) -> CallToolResult | InputRequiredResult:\n        try:\n            return await super().call_tool(name, arguments, context)\n        except UnexpectedToolError as exc:\n            cause = exc.__cause__\n            public_error = (\n                classify_public_tool_error(name, cause) if cause is not None else None\n            )\n            if public_error is None:\n                raise\n            return _public_tool_error_result(public_error)\n        except ToolError as exc:\n            cause = exc.__cause__\n            if not isinstance(cause, ValidationError):\n                raise\n            return _public_tool_error_result(\n                PublicToolError(\n                    kind=PublicErrorKind.INVALID_INPUT,\n                    operation=name,\n                    upstream_reached=False,\n                    retryable=False,\n                    message=_sdk_validation_message(cause),\n                )\n            )\n\n\n'''
          if text.count(marker) != 1:
              raise SystemExit("server lifespan anchor changed")
          text = text.replace(marker, insertion + marker, 1)

          old = '''mcp = MCPServer(\n    "cal-mcp",\n'''
          new = '''mcp = CalMCPServer(\n    "cal-mcp",\n'''
          if text.count(old) != 1:
              raise SystemExit("server construction anchor changed")
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY
          git add src/cal_mcp/server.py
          git rm .github/workflows/issue84-server-boundary.yml
          git diff --cached --check
          git commit -m "feat: return structured known tool errors"
          git push origin HEAD:feat/issue-84-structured-errors
