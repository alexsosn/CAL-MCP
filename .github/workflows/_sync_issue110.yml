name: Sync issue 110 with main

on:
  push:
    branches:
      - fix/issue-110-syriac-peshitta-routing

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Merge current main and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          git rm .github/workflows/_sync_issue110.yml
          git commit -m "chore: sync issue 110 with current main"
          git push origin HEAD:fix/issue-110-syriac-peshitta-routing
