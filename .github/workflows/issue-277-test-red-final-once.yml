# Exactly one offline test-only RED run; delete trigger when queued.
name: Issue 277 final formatted test-first RED
on:
  push:
    branches: [research/issue-277-formatted-behavior-red]
    paths: [.github/workflows/issue-277-test-red-final-once.yml]
permissions:
  contents: read
jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install offline test environment
        run: python -m pip install -e ".[dev]"
      - name: Check Ruff lint and format before RED
        run: |
          ruff check tests/test_lexicon_incomplete_results.py
          ruff format --check tests/test_lexicon_incomplete_results.py
      - name: Expected unimplemented feature tests fail
        run: pytest -q tests/test_lexicon_incomplete_results.py
