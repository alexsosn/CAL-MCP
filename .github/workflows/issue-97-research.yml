name: Issue 97 Mandaic routing research

on:
  push:
    branches:
      - fix/issue-97-mandaic-route-scope

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Inspect one current CAL Mandaic menu response
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from urllib.request import Request, urlopen

          URL = "https://cal.huc.edu/show_Mandaic.php?R1=74"
          request = Request(URL, headers={"User-Agent": "CAL-MCP/issue-97-research (+https://github.com/alexsosn/CAL-MCP)"})
          with urlopen(request, timeout=15) as response:
              body = response.read(512 * 1024 + 1)
          if len(body) > 512 * 1024:
              raise SystemExit("menu response exceeded 512 KiB research cap")
          html = body.decode("utf-8", errors="replace")

          class Anchors(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.anchors = []
              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "a":
                      self.anchors.append(dict(attrs))

          parser = Anchors()
          parser.feed(html)
          print("MENU_URL", URL)
          print("BODY_BYTES", len(body))
          print("ANCHOR_COUNT", len(parser.anchors))
          for index, attrs in enumerate(parser.anchors):
              print("ANCHOR", index, repr(attrs))
          PY
