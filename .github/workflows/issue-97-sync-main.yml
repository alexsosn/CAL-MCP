name: Issue 97 sync current main

on:
  push:
    branches: [fix/issue-97-mandaic-route-scope]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/issue-97-mandaic-route-scope
          fetch-depth: 0
      - name: Merge current main and remove helper
        run: |
          git config user.name "Oleksandr (Alex) Sosnovshchenko"
          git config user.email "alex.sosn88@gmail.com"
          git fetch origin main
          git merge --no-edit origin/main
          git rm .github/workflows/issue-97-sync-main.yml
          git commit -m "chore: remove issue 97 sync helper"
          git push origin HEAD:fix/issue-97-mandaic-route-scope
