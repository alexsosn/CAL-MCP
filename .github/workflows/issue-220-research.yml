name: Issue 220 Mandaic col coordinate research

on:
  push:
    branches:
      - research/issue-220-mandaic-col-coordinates

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Probe 74421 col and numeric control
        run: |
          python - <<'PY'
          import json
          import re
          import urllib.request
          from collections import Counter
          from html.parser import HTMLParser
          from urllib.parse import parse_qs, urlencode, urlsplit

          BASE = "https://cal.huc.edu/"
          requests = 0

          def fetch(path, params, cap=2 * 1024 * 1024):
              global requests
              requests += 1
              if requests > 3:
                  raise RuntimeError(f"request budget exceeded: {requests}")
              url = BASE + path + "?" + urlencode(params)
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent":"CAL-MCP research/0.1 (+https://github.com/alexsosn/CAL-MCP)"},
              )
              with urllib.request.urlopen(req, timeout=20) as response:
                  body = response.read(cap + 1)
                  if len(body) > cap:
                      raise RuntimeError(f"response exceeded {cap} bytes")
                  return url, body.decode("utf-8","replace")

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.tokens = []
                  self.comments = []
                  self.info = []
              def handle_starttag(self, tag, attrs):
                  if tag != "a":
                      return
                  p = urlsplit(dict(attrs).get("href") or "")
                  q = parse_qs(p.query, keep_blank_values=True)
                  endpoint = p.path.rsplit("/",1)[-1]
                  if endpoint in {"getlex.php","bablex.php"} and q.get("coord") and q.get("word"):
                      self.tokens.append((q["coord"][0],q["word"][0],endpoint))
                  elif endpoint == "comment.php" and q.get("coord"):
                      self.comments.append(q["coord"][0])
                  elif endpoint == "get_file_info.php" and q.get("coord"):
                      self.info.append(q["coord"][0])

          generic = re.compile(r"^(?:[0-9]+|[0-9]+[a-z][0-9]+)$")

          def summarize(sub):
              _, html = fetch(
                  "get_a_chapter.php",
                  [("cset","M"),("file","74421"),("sub",sub)],
              )
              p=Links(); p.feed(html); p.close()
              unique=list(dict.fromkeys(c for c,_,_ in p.tokens))
              shapes=Counter()
              examples=[]
              for coord in unique:
                  if generic.fullmatch(coord):
                      key="generic"
                  elif coord.startswith("74421col"):
                      key="file+literal-col-prefix"
                  elif coord.startswith("74421"):
                      key="file-prefix-other"
                  else:
                      key="foreign-prefix"
                  shapes[key]+=1
                  if len(examples)<12:
                      examples.append(coord)
              return p, {
                  "token_links":len(p.tokens),
                  "unique_token_coords":len(unique),
                  "shape_counts":dict(sorted(shapes.items())),
                  "examples":examples,
                  "file_info":list(dict.fromkeys(p.info))[:6],
                  "comment_examples":list(dict.fromkeys(p.comments))[:8],
                  "charsets":sorted(set("".join(unique))) if unique else [],
              }

          col, col_summary = summarize("col")
          numeric, numeric_summary = summarize("103")

          candidate = next(
              ((c,w,e) for c,w,e in col.tokens if generic.fullmatch(c) is None),
              None,
          )
          if candidate is None:
              raise RuntimeError("col page exposed no non-generic token coordinate")
          coord, word, endpoint = candidate
          url, analysis = fetch(endpoint, [("coord",coord),("word",word)], cap=512*1024)
          lower=analysis.lower()
          result={
              "requests":requests,
              "col":col_summary,
              "numeric_103":numeric_summary,
              "followup":{
                  "coordinate":coord,
                  "word":word,
                  "endpoint":endpoint,
                  "url":url,
                  "has_analysis_marker":"click on a headword to see a complete lexicon entry" in lower,
                  "has_no_data":"there is no data for this word" in lower,
                  "has_no_lemma":"unrecognizable query or no such lemma found" in lower,
                  "has_lemma_route":("oneentry.php?lemma=" in lower or "cal_entry_web.php?lemma=" in lower),
              },
          }
          print(json.dumps(result,sort_keys=True))
          PY
