name: Temporary issue 125 implementation harness

on:
  push:
    branches:
      - issue-125-syriac-root-discovery

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: issue-125-syriac-root-discovery
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install validation environment
        run: python -m pip install -e '.[dev]'
      - name: Apply planned production change
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          texts_path = Path('src/cal_mcp/texts.py')
          text = texts_path.read_text()
          text = replace_once(
              text,
              'from cal_mcp.lexicon import _Line, _Link, _parse_lines\n',
              'from cal_mcp.lexicon import _Line, _Link, _parse_lines\nfrom cal_mcp.syriac import syriac_text_category_slugs\n',
              'syriac helper import',
          )
          text = replace_once(
              text,
              '_ONKELOS_JONATHAN_LABEL = "Targums Onkelos and Jonathan to the Prophets"\n',
              '_ONKELOS_JONATHAN_LABEL = "Targums Onkelos and Jonathan to the Prophets"\n_SYRIAC_COLLECTION_KEY = "syriac"\n_SYRIAC_ROOT_PATH = "AvailSyr.html"\n_SYRIAC_ROOT_LABEL = "Syriac"\n_SYRIAC_FOLLOW_UP_TOOL = "cal_syriac_texts"\n_SYRIAC_SELECTOR_NAME = "category"\n',
              'syriac constants',
          )
          text = replace_once(
              text,
              '@dataclass(frozen=True, slots=True)\nclass TextCategoryRef:\n    category_id: str\n    label: str\n\n\n@dataclass(frozen=True, slots=True)\nclass TextToken:',
              '@dataclass(frozen=True, slots=True)\nclass TextCategoryRef:\n    category_id: str\n    label: str\n\n\n@dataclass(frozen=True, slots=True)\nclass TextSpecializedCollectionRef:\n    collection_key: str\n    label: str\n    follow_up_tool: str\n    selector_name: str\n    supported_selectors: tuple[str, ...]\n\n\n@dataclass(frozen=True, slots=True)\nclass TextToken:',
              'specialized collection model',
          )
          text = replace_once(
              text,
              'class TextCataloguePage:\n    categories: tuple[TextCategoryRef, ...]\n    texts: tuple[TextRef, ...]\n',
              'class TextCataloguePage:\n    categories: tuple[TextCategoryRef, ...]\n    texts: tuple[TextRef, ...]\n    specialized_collections: tuple[TextSpecializedCollectionRef, ...] = ()\n',
              'catalogue page field',
          )
          text = replace_once(
              text,
              'class TextCatalogueResult:\n    categories: tuple[TextCategoryRef, ...]\n    texts: tuple[TextRef, ...]\n    provenance: TextProvenance\n\n    def to_dict(self) -> dict[str, object]:\n        return {\n            "categories": [_category_to_dict(item) for item in self.categories],\n            "texts": [_text_ref_to_dict(item) for item in self.texts],\n            "provenance": _provenance_to_dict(self.provenance),\n        }\n',
              'class TextCatalogueResult:\n    categories: tuple[TextCategoryRef, ...]\n    texts: tuple[TextRef, ...]\n    provenance: TextProvenance\n    specialized_collections: tuple[TextSpecializedCollectionRef, ...] = ()\n\n    def to_dict(self) -> dict[str, object]:\n        return {\n            "categories": [_category_to_dict(item) for item in self.categories],\n            "texts": [_text_ref_to_dict(item) for item in self.texts],\n            "specialized_collections": [\n                _specialized_collection_to_dict(item) for item in self.specialized_collections\n            ],\n            "provenance": _provenance_to_dict(self.provenance),\n        }\n',
              'catalogue result field',
          )
          text = replace_once(
              text,
              'def parse_text_catalogue_page(response: CalResponse) -> TextCataloguePage:\n    categories: list[TextCategoryRef] = []\n    texts: list[TextRef] = []\n\n    for line in _parse_lines(response):\n        for link in line.links:\n            category = _category_from_link(link)\n            if category is not None:\n                categories.append(category)\n                continue\n            text = _text_ref_from_link(link)\n            if text is not None:\n                texts.append(text)\n\n    if not categories and not texts:\n        raise TextParseError("CAL text catalogue contains no recognizable category or text links")\n    return TextCataloguePage(categories=tuple(categories), texts=tuple(texts))\n',
              'def parse_text_catalogue_page(response: CalResponse) -> TextCataloguePage:\n    categories: list[TextCategoryRef] = []\n    texts: list[TextRef] = []\n    specialized_collections: list[TextSpecializedCollectionRef] = []\n    seen_collection_keys: set[str] = set()\n\n    for line in _parse_lines(response):\n        for link in line.links:\n            specialized = _specialized_collection_from_link(link)\n            if specialized is not None:\n                if specialized.collection_key in seen_collection_keys:\n                    raise TextParseError("CAL text catalogue repeats a specialized collection")\n                seen_collection_keys.add(specialized.collection_key)\n                specialized_collections.append(specialized)\n                continue\n            category = _category_from_link(link)\n            if category is not None:\n                categories.append(category)\n                continue\n            text = _text_ref_from_link(link)\n            if text is not None:\n                texts.append(text)\n\n    if not categories and not texts and not specialized_collections:\n        raise TextParseError("CAL text catalogue contains no recognizable category or text links")\n    return TextCataloguePage(\n        categories=tuple(categories),\n        texts=tuple(texts),\n        specialized_collections=tuple(specialized_collections),\n    )\n',
              'catalogue parser',
          )
          text = replace_once(
              text,
              '        return TextCatalogueResult(\n            categories=result.value.categories,\n            texts=result.value.texts,\n            provenance=TextProvenance(',
              '        return TextCatalogueResult(\n            categories=result.value.categories,\n            texts=result.value.texts,\n            provenance=TextProvenance(',
              'catalogue result anchor',
          )
          text = replace_once(
              text,
              '                category_id=normalized_category,\n            ),\n        )\n\n    async def search(self, query: str) -> TextSearchResult:',
              '                category_id=normalized_category,\n            ),\n            specialized_collections=result.value.specialized_collections,\n        )\n\n    async def search(self, query: str) -> TextSearchResult:',
              'catalogue propagation',
          )
          category_anchor = 'def _category_from_link(link: _Link) -> TextCategoryRef | None:\n'
          helper = '''def _specialized_collection_from_link(\n    link: _Link,\n) -> TextSpecializedCollectionRef | None:\n    label = link.text.strip()\n    parsed = urlsplit(link.href)\n    exact_path = (\n        not parsed.scheme\n        and not parsed.netloc\n        and parsed.path in (_SYRIAC_ROOT_PATH, f"/{_SYRIAC_ROOT_PATH}")\n    )\n    if exact_path:\n        if parsed.query or parsed.fragment:\n            raise TextParseError("CAL Syriac collection route changed unexpectedly")\n        if not label:\n            raise TextParseError("CAL Syriac collection link has no label")\n        return TextSpecializedCollectionRef(\n            collection_key=_SYRIAC_COLLECTION_KEY,\n            label=label,\n            follow_up_tool=_SYRIAC_FOLLOW_UP_TOOL,\n            selector_name=_SYRIAC_SELECTOR_NAME,\n            supported_selectors=syriac_text_category_slugs(),\n        )\n    if label == _SYRIAC_ROOT_LABEL:\n        raise TextParseError("CAL Syriac collection route changed unexpectedly")\n    return None\n\n\n'''
          text = replace_once(text, category_anchor, helper + category_anchor, 'specialized parser helper')
          text = replace_once(
              text,
              'def _category_to_dict(category: TextCategoryRef) -> dict[str, object]:\n    return {"category_id": category.category_id, "label": category.label}\n\n\ndef _token_to_dict',
              'def _category_to_dict(category: TextCategoryRef) -> dict[str, object]:\n    return {"category_id": category.category_id, "label": category.label}\n\n\ndef _specialized_collection_to_dict(\n    collection: TextSpecializedCollectionRef,\n) -> dict[str, object]:\n    return {\n        "collection_key": collection.collection_key,\n        "label": collection.label,\n        "follow_up_tool": collection.follow_up_tool,\n        "selector_name": collection.selector_name,\n        "supported_selectors": list(collection.supported_selectors),\n    }\n\n\ndef _token_to_dict',
              'specialized serializer',
          )
          text = replace_once(
              text,
              '    "TextCategoryRef",\n',
              '    "TextCategoryRef",\n    "TextSpecializedCollectionRef",\n',
              'public export',
          )
          texts_path.write_text(text)

          syriac_path = Path('src/cal_mcp/syriac.py')
          syriac = syriac_path.read_text()
          anchor = '\n_MISSING_WORD_PATHS = {\n'
          helper = '\n\ndef syriac_text_category_slugs() -> tuple[str, ...]:\n    return tuple(_TEXT_CATEGORIES)\n'
          syriac = replace_once(syriac, anchor, helper + anchor, 'syriac selector helper')
          syriac_path.write_text(syriac)
          PY
      - name: Validate focused implementation
        run: |
          ruff check src/cal_mcp/texts.py src/cal_mcp/syriac.py tests/test_syriac_root_discovery.py
          ruff format --check src/cal_mcp/texts.py src/cal_mcp/syriac.py tests/test_syriac_root_discovery.py
          mypy
          pytest tests/test_syriac_root_discovery.py tests/test_onkelos_jonathan_catalogue.py tests/test_mandaic_catalogue.py tests/test_syriac.py
      - name: Commit validated production change and remove harness
        run: |
          rm .github/workflows/tmp-issue-125-implementation.yml
          git config user.name 'CAL-MCP automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/cal_mcp/texts.py src/cal_mcp/syriac.py .github/workflows/tmp-issue-125-implementation.yml
          git commit -m 'Implement Syriac root discovery metadata'
          git push origin HEAD:issue-125-syriac-root-discovery
