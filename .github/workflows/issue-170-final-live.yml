name: Issue 170 final live stdio verification

on:
  push:
    branches:
      - dev/issue-170-cpa-subtext-ids

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install candidate
        run: python -m pip install .
      - name: Verify CPA workflow through installed stdio MCP
        run: |
          python - <<'PY'
          import asyncio
          import re
          from mcp import Client, StdioServerParameters

          async def main() -> None:
              async with Client(StdioServerParameters(command="cal-mcp")) as client:
                  catalogue = await client.call_tool(
                      "cal_text_catalogue",
                      {"category_id": "55"},
                  )
                  if catalogue.is_error:
                      raise RuntimeError(f"CPA catalogue failed: {catalogue.content!r}")
                  data = catalogue.structured_content
                  if not isinstance(data, dict):
                      raise RuntimeError("CPA catalogue missing structured content")
                  texts = data.get("texts")
                  if not isinstance(texts, list):
                      raise RuntimeError("CPA catalogue missing texts")
                  match = next(
                      (
                          item
                          for item in texts
                          if isinstance(item, dict)
                          and item.get("file_id") == "55000"
                          and item.get("subtext_id") == "01001a"
                      ),
                      None,
                  )
                  if match is None:
                      raise RuntimeError("CPA catalogue does not expose 55000/01001a")

                  page_result = await client.call_tool(
                      "cal_text_page",
                      {"file_id": "55000", "subtext_id": "01001a"},
                  )
                  if page_result.is_error:
                      raise RuntimeError(f"CPA page failed: {page_result.content!r}")
                  pdata = page_result.structured_content
                  if not isinstance(pdata, dict) or not isinstance(pdata.get("page"), dict):
                      raise RuntimeError("CPA page missing structured content")
                  page = pdata["page"]
                  text_ref = page.get("text")
                  if not isinstance(text_ref, dict):
                      raise RuntimeError("CPA page missing text reference")
                  if (
                      text_ref.get("file_id") != "55000"
                      or text_ref.get("subtext_id") != "01001a"
                  ):
                      raise RuntimeError(f"CPA page identity mismatch: {text_ref!r}")
                  lines = page.get("lines")
                  if not isinstance(lines, list) or not lines:
                      raise RuntimeError("CPA page returned no lines")

                  token = None
                  for line in lines:
                      if not isinstance(line, dict):
                          continue
                      tokens = line.get("tokens")
                      if isinstance(tokens, list) and tokens:
                          candidate = tokens[0]
                          if isinstance(candidate, dict):
                              token = candidate
                              break
                  if token is None:
                      raise RuntimeError("CPA page returned no lexical token")
                  coordinate = token.get("coordinate")
                  word_index = token.get("word_index")
                  if (
                      not isinstance(coordinate, str)
                      or re.fullmatch(r"[0-9]+[a-z][0-9]+", coordinate) is None
                  ):
                      raise RuntimeError(f"unexpected CPA coordinate shape: {coordinate!r}")
                  if not coordinate.startswith("5500001001a"):
                      raise RuntimeError(f"CPA coordinate names another subtext: {coordinate!r}")
                  if not isinstance(word_index, int):
                      raise RuntimeError("CPA token has no integer word index")

                  analysis = await client.call_tool(
                      "cal_token_analysis",
                      {"coordinate": coordinate, "word_index": word_index},
                  )
                  if analysis.is_error:
                      raise RuntimeError(f"CPA token analysis failed: {analysis.content!r}")
                  adata = analysis.structured_content
                  if not isinstance(adata, dict):
                      raise RuntimeError("CPA token analysis missing structured content")
                  if adata.get("coordinate") != coordinate:
                      raise RuntimeError("CPA token-analysis coordinate changed")
                  if adata.get("word_index") != word_index:
                      raise RuntimeError("CPA token-analysis word index changed")

                  print(
                      f"live stdio OK: catalogue_texts={len(texts)} "
                      f"lines={len(lines)} coordinate={coordinate} "
                      f"word_index={word_index} analysis_status={adata.get('status')}"
                  )

          asyncio.run(main())
          PY
