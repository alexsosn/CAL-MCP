name: Issue 41 linked citation boundary research

on:
  push:
    branches:
      - fix/issue-41-lexicon-citation-drift
    paths:
      - .github/workflows/issue41-link-boundaries.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/issue-41-lexicon-citation-drift
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e .
      - name: Inspect one failing linked citation block
        run: |
          python - <<'PY'
          import asyncio

          from cal_mcp.client import CalClientConfig, CalHttpClient, CalRequest
          from cal_mcp.lexicon import _CITATION_MARKER_RE, _parse_lines

          async def main() -> None:
              async with CalHttpClient(
                  config=CalClientConfig(max_concurrency=1, max_retries=0, cache_enabled=False)
              ) as client:
                  def inspect(response):
                      lines = _parse_lines(response)
                      for index, line in enumerate(lines):
                          marker = _CITATION_MARKER_RE.match(line.text)
                          if marker is None or int(marker.group("count")) != 3:
                              continue
                          following = lines[index + 1]
                          if len(following.links) != 3:
                              continue
                          cursor = 0
                          positions = []
                          for link in following.links:
                              start = following.text.find(link.text, cursor)
                              positions.append((link.text, start))
                              cursor = start + len(link.text)
                          print(f"MARKER={line.text!r}")
                          print(f"PREFIX={following.text[:positions[0][1]]!r}")
                          for link_index, (link_text, start) in enumerate(positions):
                              content_start = start + len(link_text)
                              content_end = (
                                  positions[link_index + 1][1]
                                  if link_index + 1 < len(positions)
                                  else len(following.text)
                              )
                              print(
                                  f"LINK{link_index + 1}={link_text!r} "
                                  f"CHUNK={following.text[content_start:content_end]!r}"
                              )
                          return None
                      raise RuntimeError("did not find current three-link citation block")

                  await client.fetch(
                      CalRequest(
                          method="GET",
                          path="cal_entry_web.php",
                          params=(("lemma", "br N"),),
                      ),
                      parser=inspect,
                      cache_namespace="issue41-link-research",
                  )

          asyncio.run(main())
          PY
      - name: Remove research workflow
        if: always()
        run: |
          rm .github/workflows/issue41-link-boundaries.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/issue41-link-boundaries.yml
          git commit -m "research: remove issue-41 link-boundary probe"
          git push origin HEAD:fix/issue-41-lexicon-citation-drift
