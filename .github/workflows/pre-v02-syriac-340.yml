name: One-off #340 Syriac group live acceptance

on:
  push:
    branches: [smoke/all-tool-acceptance-340]
    paths: [.github/workflows/pre-v02-syriac-340.yml]

permissions:
  contents: read

concurrency:
  group: cal-mcp-live-smoke
  cancel-in-progress: false

jobs:
  syriac-group:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build candidate source wheel without release tag
        run: |
          python -m pip install --disable-pip-version-check "build>=1.3,<2"
          python -m build --outdir dist
      - name: Install exactly one wheel in fresh virtualenv
        shell: bash
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          python -m venv "$RUNNER_TEMP/cal-mcp-syriac-340"
          "$RUNNER_TEMP/cal-mcp-syriac-340/bin/python" -m pip install \
            --disable-pip-version-check --no-cache-dir "${wheels[0]}"
      - name: Exactly two source-derived Syriac MCP steps, max two CAL starts
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/cal-mcp-syriac-340/bin/cal-mcp" --version
          "$RUNNER_TEMP/cal-mcp-syriac-340/bin/python" -m cal_mcp.pre_release_followup_smoke \
            --executable "$RUNNER_TEMP/cal-mcp-syriac-340/bin/cal-mcp" \
            --syriac-only
