name: One-off pre-v0.2 dependent CAL MCP smoke (#340)

# Nonpublishing; only this branch's workflow-file push can start the audit.
on:
  push:
    branches: [smoke/all-tool-acceptance-340]
    paths: [.github/workflows/pre-v02-followup-340.yml]

permissions:
  contents: read

concurrency:
  group: cal-mcp-live-smoke
  cancel-in-progress: false

jobs:
  dependent-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build one candidate wheel and sdist
        run: |
          python -m pip install --disable-pip-version-check "build>=1.3,<2"
          python -m build --outdir dist
      - name: Install exactly one built wheel into fresh venv
        shell: bash
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          python -m venv "$RUNNER_TEMP/cal-mcp-followup-venv"
          "$RUNNER_TEMP/cal-mcp-followup-venv/bin/python" -m pip install \
            --disable-pip-version-check --no-cache-dir "${wheels[0]}"
      - name: Run source-selected 21-step dependent smoke within 25 CAL starts
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/cal-mcp-followup-venv/bin/cal-mcp" --version
          "$RUNNER_TEMP/cal-mcp-followup-venv/bin/python" -m cal_mcp.pre_release_followup_smoke \
            --executable "$RUNNER_TEMP/cal-mcp-followup-venv/bin/cal-mcp"
