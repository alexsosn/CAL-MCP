name: Issue 47 minimal implementation gate

on:
  push:
    branches:
      - issue-47-lexicon-browse-drift
    paths:
      - .github/workflows/issue-47-implementation.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: issue-47-lexicon-browse-drift
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Apply narrow parser correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/cal_mcp/lexicon.py")
          text = path.read_text(encoding="utf-8")

          old_endtag = '''        if self._open_link is not None and tag == self._open_link.tag:\n            self._open_link.depth -= 1\n            if self._open_link.depth == 0:\n                text = _clean_text("".join(self._open_link.parts))\n                self._links.append(_Link(href=self._open_link.href, text=text))\n                self._open_link = None\n        if tag in _BLOCK_TAGS or tag == "br":\n'''
          new_endtag = '''        if tag in {"td", "th"} and self._open_link is not None and self._open_link.tag == "a":\n            self._finish_open_link()\n        elif self._open_link is not None and tag == self._open_link.tag:\n            self._open_link.depth -= 1\n            if self._open_link.depth == 0:\n                self._finish_open_link()\n        if tag in _BLOCK_TAGS or tag == "br":\n'''
          if text.count(old_endtag) != 1:
              raise SystemExit("expected semantic end-tag block exactly once")
          text = text.replace(old_endtag, new_endtag)

          old_flush = '''    def _flush(self) -> None:\n        text = _clean_text("".join(self._parts))\n'''
          new_flush = '''    def _finish_open_link(self) -> None:\n        if self._open_link is None:\n            return\n        text = _clean_text("".join(self._open_link.parts))\n        self._links.append(_Link(href=self._open_link.href, text=text))\n        self._open_link = None\n\n    def _flush(self) -> None:\n        text = _clean_text("".join(self._parts))\n'''
          if text.count(old_flush) != 1:
              raise SystemExit("expected semantic flush block exactly once")
          text = text.replace(old_flush, new_flush)

          old_browse = '''        for link in line.links:\n            lemma_key = _lemma_key_from_href(link.href)\n            if lemma_key is None:\n                continue\n            parsed = _parse_lemma_header(link.text, lemma_key=lemma_key, require_gloss=False)\n            if parsed is None:\n                continue\n'''
          new_browse = '''        for link in line.links:\n            if not _is_lemma_entry_href(link.href):\n                continue\n            lemma_key = _lemma_key_from_href(link.href)\n            if lemma_key is None:\n                raise LexiconParseError(\n                    "CAL lexicon browse candidate is missing a usable lemma key"\n                )\n            parsed = _parse_lemma_header(link.text, lemma_key=lemma_key, require_gloss=False)\n            if parsed is None:\n                raise LexiconParseError(\n                    "CAL lexicon browse candidate is missing a recognizable lemma header"\n                )\n'''
          if text.count(old_browse) != 1:
              raise SystemExit("expected browse candidate block exactly once")
          text = text.replace(old_browse, new_browse)

          old_href = '''def _lemma_key_from_href(href: str) -> str | None:\n    if not href:\n        return None\n    parsed = urlsplit(href)\n    if not (parsed.path.endswith("oneentry.php") or parsed.path.endswith("cal_entry_web.php")):\n        return None\n    values = parse_qs(parsed.query, keep_blank_values=True).get("lemma")\n'''
          new_href = '''def _is_lemma_entry_href(href: str) -> bool:\n    if not href:\n        return False\n    path = urlsplit(href).path\n    return path.endswith("oneentry.php") or path.endswith("cal_entry_web.php")\n\n\ndef _lemma_key_from_href(href: str) -> str | None:\n    if not _is_lemma_entry_href(href):\n        return None\n    parsed = urlsplit(href)\n    values = parse_qs(parsed.query, keep_blank_values=True).get("lemma")\n'''
          if text.count(old_href) != 1:
              raise SystemExit("expected lemma href helper exactly once")
          text = text.replace(old_href, new_href)

          path.write_text(text, encoding="utf-8")
          PY
      - name: Focused implementation gate
        run: |
          ruff check src/cal_mcp/lexicon.py tests/test_lexicon_browse_drift_issue47.py
          ruff format --check src/cal_mcp/lexicon.py tests/test_lexicon_browse_drift_issue47.py
          mypy
          pytest \
            tests/test_lexicon_browse_drift_issue47.py \
            tests/test_lexicon.py \
            tests/test_lexicon_current_citation_drift.py \
            tests/test_lexicon_parser_edges.py \
            tests/test_lexicon_live_shape_regressions.py
      - name: Commit production correction
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/cal_mcp/lexicon.py
          git commit -m "fix: restore current CAL lexicon browse parsing"
          git push origin HEAD:issue-47-lexicon-browse-drift
