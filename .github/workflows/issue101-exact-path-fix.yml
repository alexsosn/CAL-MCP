name: issue-101 exact path fix

on:
  push:
    branches:
      - issue-101-onkelos-jonathan-catalogue

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6
        with:
          ref: issue-101-onkelos-jonathan-catalogue
          fetch-depth: 0
      - name: Apply exact dedicated-path correction
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/cal_mcp/texts.py")
          text = path.read_text()
          old = '''    if parsed.path.endswith(_ONKELOS_JONATHAN_PATH):
              if parsed.query:
          '''
          new = '''    if parsed.path in {_ONKELOS_JONATHAN_PATH, f"/{_ONKELOS_JONATHAN_PATH}"}:
              if parsed.query:
          '''
          if text.count(old) != 1:
              raise SystemExit("expected route predicate exactly once")
          path.write_text(text.replace(old, new))
      - name: Commit production correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/cal_mcp/texts.py
          git diff --cached --check
          git commit -m "fix: require exact dedicated Targum route"
          git push origin HEAD:issue-101-onkelos-jonathan-catalogue
