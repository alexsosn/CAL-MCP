name: Issue 77 recursive invariant fix

on:
  push:
    branches:
      - issue-77-shallow-catalogue
    paths:
      - .github/workflows/issue-77-recursive-invariant.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          ref: issue-77-shallow-catalogue
          fetch-depth: 0
      - name: Make recursive metadata read-only and self-remove
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          from pathlib import Path

          path = Path("src/cal_mcp/texts.py")
          text = path.read_text(encoding="utf-8")
          old = '''    specialized_collections: tuple[TextSpecializedCollectionRef, ...] = ()
    recursive: bool = False

    @property
    def has_unexpanded_children(self) -> bool:
        return bool(self.categories or self.specialized_collections)
'''
          new = '''    specialized_collections: tuple[TextSpecializedCollectionRef, ...] = ()

    @property
    def recursive(self) -> bool:
        return False

    @property
    def has_unexpanded_children(self) -> bool:
        return bool(self.categories or self.specialized_collections)
'''
          if text.count(old) != 1:
              raise SystemExit(f"unexpected TextCatalogueResult anchor: {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          git add src/cal_mcp/texts.py
          git rm .github/workflows/issue-77-recursive-invariant.yml
          git diff --cached --check
          git commit -m "Enforce nonrecursive catalogue invariant"
          git push origin HEAD:issue-77-shallow-catalogue
