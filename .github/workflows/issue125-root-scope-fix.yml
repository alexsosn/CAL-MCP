name: issue-125 root-scope correction

on:
  push:
    branches:
      - issue-125-syriac-root-discovery
    paths:
      - .github/workflows/issue125-root-scope-fix.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          ref: issue-125-syriac-root-discovery
          fetch-depth: 0
      - name: Scope specialized-route parsing to the root catalogue
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          from pathlib import Path

          path = Path("src/cal_mcp/texts.py")
          text = path.read_text()

          constants = '''_SYRIAC_SELECTOR_NAME = "category"\n'''
          if '_ROOT_CATALOGUE_PATH = "newtextmenu.html"' not in text:
              if text.count(constants) != 1:
                  raise SystemExit("root constant anchor changed")
              text = text.replace(
                  constants,
                  constants + '_ROOT_CATALOGUE_PATH = "newtextmenu.html"\n',
                  1,
              )

          old = '''    specialized_collections: list[TextSpecializedCollectionRef] = []\n    seen_specialized_keys: set[str] = set()\n\n    for line in _parse_lines(response):\n        for link in line.links:\n            specialized = _specialized_collection_from_link(link)\n            if specialized is not None:\n                if specialized.collection_key in seen_specialized_keys:\n                    raise TextParseError("CAL text catalogue repeats a specialized collection")\n                seen_specialized_keys.add(specialized.collection_key)\n                specialized_collections.append(specialized)\n                continue\n'''
          new = '''    specialized_collections: list[TextSpecializedCollectionRef] = []\n    seen_specialized_keys: set[str] = set()\n    is_root_catalogue = _is_root_catalogue_response(response.url)\n\n    for line in _parse_lines(response):\n        for link in line.links:\n            if is_root_catalogue:\n                specialized = _specialized_collection_from_link(link)\n                if specialized is not None:\n                    if specialized.collection_key in seen_specialized_keys:\n                        raise TextParseError("CAL text catalogue repeats a specialized collection")\n                    seen_specialized_keys.add(specialized.collection_key)\n                    specialized_collections.append(specialized)\n                    continue\n'''
          if old not in text:
              raise SystemExit("catalogue loop anchor changed or correction already applied")
          text = text.replace(old, new, 1)

          marker = '''def _specialized_collection_from_link(\n'''
          helper = '''def _is_root_catalogue_response(url: str) -> bool:\n    parsed = urlsplit(url)\n    return (\n        parsed.path == f"/{_ROOT_CATALOGUE_PATH}"\n        and not parsed.query\n        and not parsed.fragment\n    )\n\n\n'''
          if 'def _is_root_catalogue_response' not in text:
              if text.count(marker) != 1:
                  raise SystemExit("specialized helper anchor changed")
              text = text.replace(marker, helper + marker, 1)

          path.write_text(text)
          PY
          git add src/cal_mcp/texts.py
          git rm .github/workflows/issue125-root-scope-fix.yml
          git diff --cached --check
          git commit -m "Fix Syriac root discovery parser scope"
          git push origin HEAD:issue-125-syriac-root-discovery
