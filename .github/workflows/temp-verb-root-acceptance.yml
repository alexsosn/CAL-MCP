name: Temporary installed-stdio verb root acceptance
on:
  pull_request:
    paths: [".github/workflows/temp-verb-root-acceptance.yml"]
permissions:
  contents: read
jobs:
  exact-wheel-stdio:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build and install wheel (not editable source)
        run: |
          python -m pip install build
          python -m build --wheel --outdir dist
          python -m pip install dist/*.whl
          python -m pip show cal-mcp
      - name: Exercise public stdio MCP verb root lookup, one bounded logical call
        run: |
          cd "$RUNNER_TEMP"
          python - <<'PY'
          import asyncio
          import os
          from mcp import Client, StdioServerParameters

          async def main():
              params = StdioServerParameters(command="cal-mcp", env=dict(os.environ))
              async with Client(params) as client:
                  tools = {item.name: item for item in (await client.list_tools()).tools}
                  assert "cal_lexicon_lookup" in tools
                  result = await client.call_tool("cal_lexicon_lookup", arguments={"query": "(hr"})
                  assert not result.is_error, str(result.content)[:500]
                  data = result.structured_content
                  assert data is not None
                  assert data["status"] == "ambiguous", data.get("status")
                  keys = [item["lemma_key"] for item in data["matches"]]
                  assert keys == ["(hr V", "(hr A"], keys
                  assert data["matches"][0]["headwords"] == ["ˁHR", "ˀHR"]
                  provenance = data["provenance"]
                  assert provenance["source_url"].startswith("https://cal.huc.edu/")
                  assert provenance["retrieved_at"]
                  print("installed-stdio live verb browse accepted:", keys)

          asyncio.run(main())
          PY
