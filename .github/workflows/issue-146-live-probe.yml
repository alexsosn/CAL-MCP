name: Issue 146 one-shot CAL chooser probe

on:
  push:
    branches:
      - issue-146-targum-chooser-action

permissions:
  contents: read

jobs:
  probe:
    if: github.event.head_commit.message == 'Probe live Targum chooser action'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fetch one chooser page and report form actions
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          status="$(
            curl --silent --show-error               --max-time 20               --max-redirs 0               --output "$tmp"               --write-out '%{http_code}'               --user-agent 'CAL-MCP/0.1 issue-146 bounded research probe'               'https://cal.huc.edu/Omtlemmas/memMTlemma.html'
          )"
          echo "HTTP status: $status"
          test "$status" = "200"
          python - "$tmp" <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import sys

          class Forms(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.forms = []

              def handle_starttag(self, tag, attrs):
                  if tag == "form":
                      values = dict(attrs)
                      self.forms.append(
                          ((values.get("method") or "").lower(), values.get("action"))
                      )

          parser = Forms()
          parser.feed(Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace"))
          print("Forms:", parser.forms)
          post_actions = [action for method, action in parser.forms if method == "post"]
          print("POST actions:", post_actions)
          if "/getOmtlemma.php" not in post_actions:
              raise SystemExit("Expected current Onqelos chooser action was not observed")
          PY
