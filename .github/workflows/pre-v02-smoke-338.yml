name: One-off pre-v0.2 installed-wheel CAL smoke (#338)

# This workflow is intentionally ephemeral and never runs on tags or schedules.
# It is removed from the final PR after its one bounded source-bound execution.
on:
  push:
    branches:
      - smoke/pre-v02-338
    paths:
      - .github/workflows/pre-v02-smoke-338.yml

permissions:
  contents: read

concurrency:
  group: cal-mcp-live-smoke
  cancel-in-progress: false

jobs:
  audited-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install build tool
        run: python -m pip install "build>=1.3,<2"
      - name: Build candidate wheel and sdist without release tag
        run: python -m build --outdir dist
      - name: Install exact built wheel outside the source checkout
        shell: bash
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          python -m venv "$RUNNER_TEMP/cal-mcp-candidate-venv"
          "$RUNNER_TEMP/cal-mcp-candidate-venv/bin/python" -m pip install --disable-pip-version-check --no-cache-dir "${wheels[0]}"
      - name: Preflight all 37 installed MCP tool schemas without CAL traffic
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/cal-mcp-candidate-venv/bin/cal-mcp" --version
          export CAL_MCP_SMOKE_EXECUTABLE="$RUNNER_TEMP/cal-mcp-candidate-venv/bin/cal-mcp"
          "$RUNNER_TEMP/cal-mcp-candidate-venv/bin/python" - <<'PY'
          import asyncio
          import os
          from mcp import Client, StdioServerParameters
          from cal_mcp.release_surface import CURRENT_PUBLIC_TOOLS

          async def check():
              async with Client(StdioServerParameters(command=os.environ["CAL_MCP_SMOKE_EXECUTABLE"])) as client:
                  tools = (await client.list_tools()).tools
                  found = [tool.name for tool in tools]
                  assert len(found) == len(set(found)) == 37
                  assert set(found) == CURRENT_PUBLIC_TOOLS
                  assert all(tool.output_schema is not None for tool in tools)
                  print(f"Installed stdio: {len(found)} unique tools with declared output schemas; no CAL request")

          asyncio.run(check())
          PY
      - name: Run exact capped current installed-wheel 13-case live smoke
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/cal-mcp-candidate-venv/bin/python" -m cal_mcp.stdio_live_smoke \
            --executable "$RUNNER_TEMP/cal-mcp-candidate-venv/bin/cal-mcp"
