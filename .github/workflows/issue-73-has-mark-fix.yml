name: Apply issue 73 has-mark review fix

on:
  push:
    branches:
      - issue-73-native-unicode-lexicon-pass-through
    paths:
      - .github/workflows/issue-73-has-mark-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: issue-73-native-unicode-lexicon-pass-through
      - name: Require an actual combining mark for native fallback
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/cal_mcp/lexicon.py")
          text = path.read_text()
          text = text.replace(
              "            fallback_supported = True\n            mark_anchor = False\n",
              "            fallback_supported = True\n            has_mark = False\n            mark_anchor = False\n",
              1,
          )
          text = text.replace(
              "                if category.startswith(\"M\"):\n                    if not mark_anchor:\n",
              "                if category.startswith(\"M\"):\n                    has_mark = True\n                    if not mark_anchor:\n",
              1,
          )
          text = text.replace(
              "            if not fallback_supported:\n                raise conversion_error from None\n",
              "            if not fallback_supported or not has_mark:\n                raise conversion_error from None\n",
              1,
          )
          path.write_text(text)
      - name: Bootstrap frozen installer
        run: python -m pip install "pip==26.2.1" "setuptools==79.0.1"
      - name: Focused GREEN
        run: |
          python -m pip install -e '.[dev]' -c constraints/ci-py311.txt --build-constraint constraints/build-py311.txt
          ruff check src/cal_mcp/lexicon.py tests/test_lexicon_native_unicode_regression.py
          ruff format --check src/cal_mcp/lexicon.py tests/test_lexicon_native_unicode_regression.py
          mypy
          pytest tests/test_lexicon_native_unicode_regression.py tests/test_lexicon_ambiguity_expansion.py tests/test_lexicon_conversion_provenance.py tests/test_cpa_syriac_conversion.py tests/test_cal_code_conversion.py tests/test_cal_code_conversion_review_regressions.py
      - name: Commit fix and remove helper
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/issue-73-has-mark-fix.yml
          git add src/cal_mcp/lexicon.py .github/workflows/issue-73-has-mark-fix.yml
          git commit -m "Require marked Unicode for lexicon fallback"
          git push origin HEAD:issue-73-native-unicode-lexicon-pass-through
