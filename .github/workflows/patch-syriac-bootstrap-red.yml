name: Add Syriac MCP registration RED

on:
  push:
    branches:
      - feat/issue-11-syriac
    paths:
      - .github/workflows/patch-syriac-bootstrap-red.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/issue-11-syriac
      - name: Patch bootstrap expectations only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_bootstrap.py")
          text = path.read_text()

          old = '''        "cal_targum_hebrew_reflexes",\n    }\n'''
          new = '''        "cal_targum_hebrew_reflexes",\n        "cal_syriac_texts",\n        "cal_syriac_missing_words",\n        "cal_syriac_peshitta_parallel",\n    }\n'''
          if text.count(old) != 1:
              raise SystemExit("tool-set anchor mismatch")
          text = text.replace(old, new, 1)

          old = '''    targum_hebrew_reflexes_schema = tools["cal_targum_hebrew_reflexes"].input_schema\n    assert set(targum_hebrew_reflexes_schema["properties"]) == {"targum", "mt_lemma_id"}\n    assert targum_hebrew_reflexes_schema["required"] == ["targum", "mt_lemma_id"]\n\n'''
          new = old + '''    syriac_texts_schema = tools["cal_syriac_texts"].input_schema\n    assert set(syriac_texts_schema["properties"]) == {"category"}\n    assert syriac_texts_schema["required"] == ["category"]\n\n    syriac_missing_words_schema = tools["cal_syriac_missing_words"].input_schema\n    assert set(syriac_missing_words_schema["properties"]) == {"category"}\n    assert syriac_missing_words_schema["required"] == ["category"]\n\n    syriac_peshitta_schema = tools["cal_syriac_peshitta_parallel"].input_schema\n    assert set(syriac_peshitta_schema["properties"]) == {"book", "chapter", "verse"}\n    assert syriac_peshitta_schema["required"] == ["book", "chapter", "verse"]\n\n'''
          if text.count(old) != 1:
              raise SystemExit("schema anchor mismatch")
          text = text.replace(old, new, 1)

          old = '''        targum_hebrew_lemmas_schema,\n        targum_hebrew_reflexes_schema,\n    ):\n'''
          new = '''        targum_hebrew_lemmas_schema,\n        targum_hebrew_reflexes_schema,\n        syriac_texts_schema,\n        syriac_missing_words_schema,\n        syriac_peshitta_schema,\n    ):\n'''
          if text.count(old) != 1:
              raise SystemExit("global-schema anchor mismatch")
          text = text.replace(old, new, 1)

          old = '''    for schema in (\n        bibliography_authors_schema,\n        bibliography_author_schema,\n        bibliography_keyword_schema,\n        bibliography_lemma_schema,\n    ):\n        for unsupported_bound in ("page", "offset", "limit"):\n            assert unsupported_bound not in schema["properties"]\n\n'''
          new = old + '''    for schema in (syriac_texts_schema, syriac_missing_words_schema, syriac_peshitta_schema):\n        for private_syriac_parameter in (\n            "bookname",\n            "dial",\n            "cset",\n            "file",\n            "keyword",\n            "coord",\n        ):\n            assert private_syriac_parameter not in schema["properties"]\n\n'''
          if text.count(old) != 1:
              raise SystemExit("privacy anchor mismatch")
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          python -m pip install "ruff<1,>=0.12"
          ruff format tests/test_bootstrap.py
          ruff check tests/test_bootstrap.py
      - name: Commit test-only RED
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_bootstrap.py
          git commit -m "test: require Syriac MCP tool registration"
          git push origin HEAD:feat/issue-11-syriac
