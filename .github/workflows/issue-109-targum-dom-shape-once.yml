# One-time two-GET structural audit; no recursive traversal or raw HTML retention.
name: Bounded Targum example DOM audit (#109)
on:
  push:
    branches: [research/issue-109-targum-example-pages]
    paths: [.github/workflows/issue-109-targum-dom-shape-once.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Enumerate structural element paths and truncated label examples
        shell: bash
        run: |
          python - <<'PY'
          import json
          from html.parser import HTMLParser
          from urllib.parse import urlsplit
          from urllib.request import HTTPRedirectHandler, Request, build_opener

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          class Structural(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.stack = []
                  self.events = []
                  self.skipped = 0
              def handle_starttag(self, tag, attrs):
                  m = dict(attrs)
                  cl = m.get("class","").replace(" ", ".")[:55]
                  token = tag + ("." + cl if cl else "")
                  self.stack.append(token)
                  if self.skipped:
                      if tag in ("script","style"):
                          self.skipped += 1
                      return
                  if tag in ("script","style"):
                      self.skipped = 1
                      return
                  if tag in ("div","span","p","bdo","a","br","b","h3","center","table","tr","td"):
                      attrs_subset = {}
                      if tag=="a":
                          u=urlsplit(m.get("href",""))
                          attrs_subset={"href_path":u.path,"query_keys":sorted(
                              p.partition("=")[0] for p in u.query.split("&") if p)}
                      elif tag=="bdo":
                          attrs_subset={"dir":m.get("dir","")}
                      self.events.append(["start", "/".join(self.stack[-4:]), attrs_subset])
              def handle_endtag(self, tag):
                  if self.skipped:
                      if tag in ("style","script"):
                          self.skipped-=1
                  if self.stack:
                      self.stack.pop()
              def handle_startendtag(self, tag, attrs):
                  self.handle_starttag(tag, attrs)
                  self.handle_endtag(tag)
              def handle_data(self, data):
                  if self.skipped:
                      return
                  label=" ".join(data.split())
                  if label and len(self.events)<240:
                      self.events.append(["text","/".join(self.stack[-3:]),label[:75]])
          targets=(
            ("concordance","https://cal.huc.edu/show1dialectKWIC.php?lemma=klb&pos=N&texts=51001%2051002%2051003%2051004%2051005&charset=H"),
            ("reflex-onqelos","https://cal.huc.edu/getOMT.php?MT=1751&cal=tyq%232+N"),
          )
          opener=build_opener(NoRedirect)
          for label,url in targets:
              req=Request(url,headers={"User-Agent":"CAL-MCP/0.1.0 (issue-109 bounded DOM research)"})
              with opener.open(req,timeout=12) as resp:
                  if resp.status!=200 or urlsplit(resp.url).hostname!="cal.huc.edu":
                      raise RuntimeError("unexpected response")
                  raw=resp.read(262145)
              if len(raw)>262144:
                  raise RuntimeError("bounded page too large")
              p=Structural()
              p.feed(raw.decode("utf-8",errors="replace"))
              p.close()
              print(json.dumps({"case":label,"bytes":len(raw),"events":p.events[:135]},ensure_ascii=False))
          PY
