name: issue-127 format module

on:
  push:
    branches:
      - issue-127-lexicon-citation-context
    paths:
      - .github/workflows/issue127-format-module.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          ref: issue-127-lexicon-citation-context
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install "ruff==0.16.6"
      - name: Format source and self-remove
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ruff format src/cal_mcp/lexicon_citation_context.py
          git add src/cal_mcp/lexicon_citation_context.py
          git rm .github/workflows/issue127-format-module.yml
          git diff --cached --check
          git commit -m "Format lexicon citation context module"
          git push origin HEAD:issue-127-lexicon-citation-context
