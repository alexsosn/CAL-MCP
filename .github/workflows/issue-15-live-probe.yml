name: Issue 15 bounded release live probe

on:
  push:
    branches:
      - issue-15-v0.1-release

permissions:
  contents: write

jobs:
  smoke:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: issue-15-v0.1-release
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install current release candidate
        run: python -m pip install .
      - name: Run fixed capped live smoke
        run: python -m cal_mcp.live_smoke
      - name: Remove research helper
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/issue-15-live-probe.yml
          git commit -m "chore: remove issue 15 live probe" || true
          git push origin HEAD:issue-15-v0.1-release
