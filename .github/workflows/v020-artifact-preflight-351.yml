name: One-off v0.2.0 source artifact preflight (#351)

# Temporary branch-only evidence. This workflow publishes nothing and issues no CAL requests.
on:
  push:
    branches: [release/v020-candidate-351]
    paths: [.github/workflows/v020-artifact-preflight-351.yml]

permissions:
  contents: read

jobs:
  candidate-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install build tool and current project
        run: python -m pip install --disable-pip-version-check "build>=1.3,<2" -e .
      - name: Build candidate wheel and source distribution once
        run: python -m build --outdir dist
      - name: Verify v0.2.0 tag identity, both fresh installs and all 37 MCP tool schemas
        run: python scripts/verify_release_artifact.py dist --tag v0.2.0
      - name: Verify wheel long description is a truthful prepublication candidate
        shell: bash
        run: |
          python - <<'PY'
          import glob
          import zipfile
          from email.parser import Parser
          wheels = glob.glob("dist/*.whl")
          assert len(wheels) == 1
          with zipfile.ZipFile(wheels[0]) as archive:
              paths = [name for name in archive.namelist() if name.endswith(".dist-info/METADATA")]
              assert len(paths) == 1
              metadata = Parser().parsestr(archive.read(paths[0]).decode("utf-8"))
          assert metadata["Name"] == "cal-mcp"
          assert metadata["Version"] == "0.2.0"
          description = metadata.get_payload()
          assert "release candidate" in description.lower()
          assert "v0.1.0" in description
          assert "37" in description
          assert "No versioned release has been published yet" not in description
          print("candidate wheel metadata/long description prepublication check PASS")
          PY
