name: Issue 170 final routing acceptance

on:
  push:
    branches:
      - dev/issue-170-cpa-subtext-ids

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install candidate
        run: python -m pip install .
      - name: Verify CPA routes over installed stdio MCP
        run: |
          python - <<'PY'
          import asyncio
          from mcp import Client, StdioServerParameters

          async def call_success(client, name, args):
              result = await client.call_tool(name, args)
              if result.is_error:
                  raise RuntimeError(f"{name} unexpectedly failed: {result.structured_content!r}")
              data = result.structured_content
              if not isinstance(data, dict):
                  raise RuntimeError(f"{name} missing structured content")
              return data

          async def main():
              async with Client(StdioServerParameters(command="cal-mcp")) as client:
                  catalogue = await call_success(
                      client, "cal_text_catalogue", {"category_id": "55"}
                  )
                  texts = catalogue.get("texts")
                  if not isinstance(texts, list):
                      raise RuntimeError("CPA catalogue missing texts")
                  refs = {
                      (item.get("file_id"), item.get("subtext_id"))
                      for item in texts if isinstance(item, dict)
                  }
                  expected = {
                      ("55000", "01001a"),
                      ("55001", "002"),
                      ("55002", None),
                  }
                  missing = expected - refs
                  if missing:
                      raise RuntimeError(f"missing representative CPA refs: {sorted(missing, key=str)!r}")

                  successes = []
                  for file_id, subtext_id in [
                      ("55000", "01001a"),
                      ("55001", "002"),
                  ]:
                      data = await call_success(
                          client,
                          "cal_text_page",
                          {"file_id": file_id, "subtext_id": subtext_id},
                      )
                      page = data.get("page")
                      if not isinstance(page, dict):
                          raise RuntimeError(f"missing page for {file_id}/{subtext_id}")
                      ref = page.get("text")
                      if (
                          not isinstance(ref, dict)
                          or ref.get("file_id") != file_id
                          or ref.get("subtext_id") != subtext_id
                      ):
                          raise RuntimeError(f"identity mismatch for {file_id}/{subtext_id}: {ref!r}")
                      lines = page.get("lines")
                      if not isinstance(lines, list) or not lines:
                          raise RuntimeError(f"no lines for {file_id}/{subtext_id}")
                      successes.append((file_id, subtext_id, len(lines)))

                  direct = await client.call_tool("cal_text_page", {"file_id": "55002"})
                  if not direct.is_error:
                      raise RuntimeError("direct CPA 55002 unexpectedly parsed before #185")
                  error = direct.structured_content
                  if not isinstance(error, dict):
                      raise RuntimeError("direct CPA error lacks structured content")
                  detail = error.get("error")
                  if (
                      not isinstance(detail, dict)
                      or detail.get("kind") != "parser_drift"
                      or detail.get("upstream_reached") is not True
                      or detail.get("message")
                      != "CAL text page contains no recognizable coordinate/token rows"
                  ):
                      raise RuntimeError(f"direct CPA did not hit the known #185 boundary: {error!r}")

                  print(
                      "live #170 OK: "
                      + ", ".join(f"{f}/{s}:lines={n}" for f, s, n in successes)
                      + "; 55002 routing reached CAL -> parser_drift:#185"
                  )

          asyncio.run(main())
          PY
