name: Issue 155 Targum MT structure recheck

on:
  push:
    branches:
      - dev/issue-155-mt-label-leak

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install candidate
        run: python -m pip install .
      - name: Probe one current Targum MT block
        run: |
          python - <<'PY'
          from __future__ import annotations

          from datetime import UTC, datetime
          from html.parser import HTMLParser
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          from cal_mcp.client import CalResponse
          from cal_mcp.targum import parse_targum_parallel_page

          class Probe(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.capture_depth = 0
                  self.events = []
                  self.blocks = []

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  classes = (attrs.get("class") or "").split()
                  if not self.capture_depth and tag == "span" and "heb" in classes:
                      self.capture_depth = 1
                      self.events = [("start", tag, tuple(classes))]
                      return
                  if self.capture_depth:
                      self.capture_depth += 1
                      self.events.append(("start", tag, tuple(classes)))

              def handle_endtag(self, tag):
                  if not self.capture_depth:
                      return
                  self.events.append(("end", tag))
                  self.capture_depth -= 1
                  if self.capture_depth == 0:
                      self.blocks.append(tuple(self.events))
                      self.events = []

              def handle_data(self, data):
                  if self.capture_depth and data.strip():
                      self.events.append(("data", " ".join(data.split())))

          data = urlencode(
              {"bookname": "01", "chapter": "01", "verse": "01"}
          ).encode()
          req = Request(
              "https://cal.huc.edu/showtargum.php",
              data=data,
              method="POST",
              headers={
                  "Content-Type": "application/x-www-form-urlencoded",
                  "User-Agent": "CAL-MCP/0.1.0 issue-155 bounded research",
              },
          )
          with urlopen(req, timeout=20) as response:
              body = response.read(262145)
              if len(body) > 262144:
                  raise RuntimeError("response exceeded 256 KiB")
              status = response.status
              url = response.geturl()
              ctype = response.headers.get("Content-Type", "")

          html = body.decode("utf-8", errors="replace")
          probe = Probe()
          probe.feed(html)
          probe.close()
          print(f"status={status} bytes={len(body)} url={url}")
          print(f"heb_blocks={len(probe.blocks)}")
          for index, events in enumerate(probe.blocks[:5]):
              print(f"heb[{index}]={events!r}")

          page = parse_targum_parallel_page(
              CalResponse(
                  status_code=status,
                  url=url,
                  body=body,
                  content_type=ctype,
                  retrieved_at=datetime.now(UTC),
              ),
              book="Gen",
              chapter=1,
              verse=1,
          )
          print(f"current_mt_text={page.mt_text!r}")
          PY
