name: issue-101 exact route fix

on:
  push:
    branches:
      - issue-101-onkelos-jonathan-catalogue
    paths:
      - .github/workflows/issue101-exact-route-fix.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6
        with:
          ref: issue-101-onkelos-jonathan-catalogue
      - name: Tighten dedicated route match
        run: python -c 'from pathlib import Path; p=Path("src/cal_mcp/texts.py"); s=p.read_text(); old="    parsed = urlsplit(link.href)\n    if parsed.path.endswith(_ONKELOS_JONATHAN_PATH):\n        if parsed.query:\n            raise TextParseError(\"CAL Onkelos/Jonathan catalogue route changed unexpectedly\")\n        if not label:\n            raise TextParseError(\"CAL Onkelos/Jonathan catalogue link has no label\")\n        return TextCategoryRef(category_id=_ONKELOS_JONATHAN_CATEGORY_ID, label=label)\n    if label == _ONKELOS_JONATHAN_LABEL:\n"; new="    parsed = urlsplit(link.href)\n    exact_dedicated_route = (\n        not parsed.scheme\n        and not parsed.netloc\n        and parsed.path in (_ONKELOS_JONATHAN_PATH, f\"/{_ONKELOS_JONATHAN_PATH}\")\n    )\n    if exact_dedicated_route:\n        if parsed.query:\n            raise TextParseError(\"CAL Onkelos/Jonathan catalogue route changed unexpectedly\")\n        if not label:\n            raise TextParseError(\"CAL Onkelos/Jonathan catalogue link has no label\")\n        return TextCategoryRef(category_id=_ONKELOS_JONATHAN_CATEGORY_ID, label=label)\n    if label == _ONKELOS_JONATHAN_LABEL:\n"; assert s.count(old) == 1, s.count(old); p.write_text(s.replace(old, new))'
      - name: Remove helper and commit
        run: |
          rm .github/workflows/issue101-exact-route-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Tighten Onkelos/Jonathan route matching"
          git push origin HEAD:issue-101-onkelos-jonathan-catalogue
