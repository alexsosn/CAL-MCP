name: Issue 15 bounded smoke research

on:
  push:
    branches:
      - release/issue-15-v0.1
    paths:
      - .github/workflows/issue15-smoke-research.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/issue-15-v0.1
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e .
      - name: Run capped public-tool probe
        run: |
          python - <<'PY'
          import asyncio
          from typing import Any

          from mcp import Client

          import cal_mcp.server as server
          from cal_mcp.client import CalClientConfig, CalHttpClient

          MAX_REQUESTS = 9

          class BudgetClient(CalHttpClient):
              def __init__(self) -> None:
                  super().__init__(
                      config=CalClientConfig(
                          max_concurrency=1,
                          max_retries=0,
                          cache_enabled=False,
                      )
                  )
                  self.request_count = 0

              async def fetch(self, request: Any, *, parser: Any, cache_namespace: str) -> Any:
                  self.request_count += 1
                  if self.request_count > MAX_REQUESTS:
                      raise RuntimeError(f"CAL request budget exceeded: {self.request_count}>{MAX_REQUESTS}")
                  return await super().fetch(
                      request,
                      parser=parser,
                      cache_namespace=cache_namespace,
                  )

          cases = [
              ("cal_lexicon_lookup", {"query": "br", "lemma_key": "br N"}),
              ("cal_text_search", {"query": "Tel Dan"}),
              ("cal_text_concordance", {"text_id": "13250"}),
              ("cal_bibliography_lemma", {"lemma_key": "cly V"}),
              ("cal_dictionary_collation", {"source": "jastrow", "page": "705"}),
              ("cal_external_citation_dialects", {}),
              ("cal_targum_parallel", {"book": "Gen", "chapter": 1, "verse": 1}),
              ("cal_syriac_peshitta_parallel", {"book": "Gen", "chapter": 1, "verse": 1}),
          ]

          async def main() -> None:
              budget_client = BudgetClient()
              server.CalHttpClient = lambda: budget_client  # type: ignore[assignment]
              try:
                  async with Client(server.mcp, raise_exceptions=True) as client:
                      for name, args in cases:
                          try:
                              result = await client.call_tool(name, args)
                              content = result.structured_content or {}
                              provenance = content.get("provenance") if isinstance(content, dict) else None
                              source_url = provenance.get("source_url") if isinstance(provenance, dict) else None
                              status = content.get("status") if isinstance(content, dict) else None
                              print(f"OK {name} status={status!r} source_url={source_url!r}")
                          except Exception as exc:
                              print(f"ERROR {name} {type(exc).__name__}: {exc}")
                              raise
              finally:
                  print(f"TOTAL_CAL_REQUESTS={budget_client.request_count}")

          asyncio.run(main())
          PY
      - name: Remove research workflow
        if: always()
        run: |
          rm .github/workflows/issue15-smoke-research.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/issue15-smoke-research.yml
          git commit -m "research: remove issue-15 smoke probe"
          git push origin HEAD:release/issue-15-v0.1
