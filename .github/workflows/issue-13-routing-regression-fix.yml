name: Issue 13 routing regression fix

on:
  push:
    branches:
      - feat/issue-13-external-citations
    paths:
      - .github/workflows/issue-13-routing-regression-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/issue-13-external-citations
      - name: Restore established routing phrase and self-clean
        run: |
          python -c "from pathlib import Path; p=Path('src/cal_mcp/server.py'); s=p.read_text(); old='This non-online citation workflow is distinct from cal_citation_text_search. '; new='The external/non-online-text citations workflow is distinct from cal_citation_text_search. '; assert old in s; p.write_text(s.replace(old,new,1))"
          rm .github/workflows/issue-13-routing-regression-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/cal_mcp/server.py .github/workflows/issue-13-routing-regression-fix.yml
          git commit -m 'fix: preserve Syriac citation routing boundary'
          git push origin HEAD:feat/issue-13-external-citations
