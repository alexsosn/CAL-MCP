name: Issue 218 Mandaic coordinate followup research

on:
  push:
    branches:
      - dev/issue-218-mandaic-alphanumeric-coordinates

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Verify edge coordinates resolve in CAL token analysis
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from urllib.parse import urlencode

          BASE = "https://cal.huc.edu/getlex.php?"
          CASES = [("74425231aa", 0), ("74429A01", 0)]
          requests = 0
          out = []
          for coord, word in CASES:
              requests += 1
              if requests > 2:
                  raise RuntimeError("request budget exceeded")
              url = BASE + urlencode([("coord",coord),("word",str(word))])
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent":"CAL-MCP research/0.1 (+https://github.com/alexsosn/CAL-MCP)"},
              )
              with urllib.request.urlopen(req, timeout=20) as response:
                  body = response.read(512 * 1024 + 1)
                  if len(body) > 512 * 1024:
                      raise RuntimeError("token-analysis response exceeded 512 KiB")
              lower = body.decode("utf-8","replace").lower()
              out.append({
                  "coordinate": coord,
                  "word": word,
                  "status": response.status,
                  "has_analysis_marker": "click on a headword to see a complete lexicon entry" in lower,
                  "has_no_data": "there is no data for this word" in lower,
                  "has_no_lemma": "unrecognizable query or no such lemma found" in lower,
                  "has_lemma_route": ("oneentry.php?lemma=" in lower or "cal_entry_web.php?lemma=" in lower),
              })
          print(json.dumps({"requests":requests,"cases":out},sort_keys=True))
          PY
