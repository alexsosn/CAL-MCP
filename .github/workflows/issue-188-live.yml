name: Issue 188 74425 coordinate probe

on:
  push:
    branches:
      - dev/issue-188-mandaic-routing

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Classify 74425 coordinate shapes without retaining text
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from html.parser import HTMLParser
          from urllib.parse import parse_qs, urlsplit

          url = "https://cal.huc.edu/get_a_chapter.php?cset=M&file=74425"
          req = urllib.request.Request(
              url,
              headers={"User-Agent": "CAL-MCP research/0.1 (+https://github.com/alexsosn/CAL-MCP)"},
          )
          with urllib.request.urlopen(req, timeout=20) as response:
              body = response.read(1048577)
              if len(body) > 1048576:
                  raise RuntimeError("response exceeded 1 MiB")
              html = body.decode("utf-8", "replace")

          class Probe(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.links = []
                  self.text_table = False
                  self.table_rows = 0
                  self.table_cells = 0
                  self.token_coords = []
                  self.comment_coords = []
                  self.file_info_coords = []
                  self.nav = []
              def handle_starttag(self, tag, attrs):
                  d = dict(attrs)
                  if tag == "table" and "text-display" in (d.get("class") or "").split():
                      self.text_table = True
                  if self.text_table and tag == "tr":
                      self.table_rows += 1
                  if self.text_table and tag == "td":
                      self.table_cells += 1
                  if tag != "a":
                      return
                  href = d.get("href") or ""
                  p = urlsplit(href)
                  endpoint = p.path.rsplit("/", 1)[-1]
                  q = parse_qs(p.query, keep_blank_values=True)
                  if endpoint in {"getlex.php", "bablex.php"} and "coord" in q:
                      self.token_coords.extend(q["coord"])
                  elif endpoint == "comment.php" and "coord" in q:
                      self.comment_coords.extend(q["coord"])
                  elif endpoint == "get_file_info.php" and "coord" in q:
                      self.file_info_coords.extend(q["coord"])
                  elif endpoint == "get_a_chapter.php" and q.get("file") == ["74425"]:
                      self.nav.append({
                          "keys": sorted(q),
                          "page": q.get("page"),
                          "sub": q.get("sub"),
                          "cset": q.get("cset"),
                          "clen": q.get("clen"),
                      })
              def handle_endtag(self, tag):
                  if tag == "table" and self.text_table:
                      self.text_table = False

          p = Probe()
          p.feed(html)
          p.close()
          token_unique = list(dict.fromkeys(p.token_coords))
          comment_unique = list(dict.fromkeys(p.comment_coords))
          print(json.dumps({
              "file_info_coords": list(dict.fromkeys(p.file_info_coords)),
              "token_coord_count": len(p.token_coords),
              "token_coord_unique_sample": token_unique[:8],
              "token_coord_charset": sorted(set("".join(token_unique))) if token_unique else [],
              "comment_coord_unique_sample": comment_unique[:8],
              "table_rows": p.table_rows,
              "table_cells": p.table_cells,
              "navigation": p.nav[:8],
          }, sort_keys=True))
          PY
