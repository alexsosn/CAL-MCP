name: Issue 110 minimal GREEN
on:
  push:
    branches: [fix/issue-110-syriac-peshitta-routing]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/issue-110-syriac-peshitta-routing
          fetch-depth: 0
      - name: Apply minimal production patch and durable research amendment
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/cal_mcp/syriac.py')
          text = path.read_text()
          old_enum = '''class SyriacTextNavigationKind(StrEnum):\n    TEXT = "text"\n    GROUP = "group"\n'''
          new_enum = '''class SyriacTextNavigationKind(StrEnum):\n    TEXT = "text"\n    GROUP = "group"\n    CATALOGUE = "catalogue"\n'''
          if text.count(old_enum) != 1:
              raise SystemExit('enum target not unique')
          text = text.replace(old_enum, new_enum)

          old_block = '''            elif endpoint == "showsubtexts.php":\n                resolved = _validated_same_origin_url(response.url, link.href, endpoint)\n                upstream_id = _single_query_value(\n                    parse_qs(urlsplit(resolved).query, keep_blank_values=True),\n                    "keyword",\n                    "Syriac grouped-text navigation",\n                )\n                _require_decimal_identifier(upstream_id, "Syriac grouped-text keyword")\n                navigation.append((SyriacTextNavigationKind.GROUP, upstream_id, resolved, link))\n'''
          new_block = '''            elif endpoint == "showsubtexts.php":\n                resolved = _validated_same_origin_url(response.url, link.href, endpoint)\n                query = parse_qs(urlsplit(resolved).query, keep_blank_values=True)\n                allowed_keys = {"keyword", "subtext", "cset", "script"}\n                if unknown_keys := set(query) - allowed_keys:\n                    raise SyriacParseError(\n                        "CAL Syriac subtext navigation has unexpected query fields: "\n                        + ", ".join(sorted(unknown_keys))\n                    )\n                for presentation_key in ("cset", "script"):\n                    if presentation_key in query:\n                        _single_query_value(\n                            query,\n                            presentation_key,\n                            "Syriac subtext presentation metadata",\n                        )\n\n                selectors: list[tuple[SyriacTextNavigationKind, str]] = []\n                if "keyword" in query:\n                    keyword = _single_query_value(\n                        query,\n                        "keyword",\n                        "Syriac grouped-text navigation",\n                    )\n                    _require_decimal_identifier(keyword, "Syriac grouped-text keyword")\n                    selectors.append((SyriacTextNavigationKind.GROUP, keyword))\n                if "subtext" in query:\n                    subtext = _single_query_value(\n                        query,\n                        "subtext",\n                        "Syriac catalogue navigation",\n                    )\n                    _require_decimal_identifier(subtext, "Syriac catalogue identifier")\n                    selectors.append((SyriacTextNavigationKind.CATALOGUE, subtext))\n                if len(selectors) != 1:\n                    raise SyriacParseError(\n                        "CAL Syriac subtext navigation must expose exactly one semantic selector"\n                    )\n                kind, upstream_id = selectors[0]\n                navigation.append((kind, upstream_id, resolved, link))\n'''
          if text.count(old_block) != 1:
              raise SystemExit('showsubtexts target not unique')
          path.write_text(text.replace(old_block, new_block))

          research = Path('research.md')
          rtext = research.read_text()
          marker = 'Current Syriac Peshitta book rows use shallow catalogue navigation'
          if marker not in rtext:
              nums = [int(value) for value in re.findall(r'^## R-(\\d+)\\b', rtext, re.MULTILINE)]
              next_num = max(nums, default=0) + 1
              amendment = f'''\n\n## R-{next_num:03d} — Current Syriac Peshitta book rows use shallow catalogue navigation\n\n**Rechecked:** 2026-09-09.\n\nCurrent CAL OT and NT Peshitta category pages no longer expose their biblical book rows as direct text-page links. Representative current rows such as `62001 P Gn` and `62040 P Mt` link to `showsubtexts.php` with a decimal book selector; the immediate destination is a shallow chapter catalogue whose chapter rows then use ordinary `file` + `sub` text-page navigation. This route is distinct from Syriac grouped navigation selected by CAL's `keyword` field.\n\nFocused evidence and bounded request details are recorded in `docs/research/issue-110-syriac-peshitta-subtext-routing.md`.\n\n**Implication:** Syriac category parsing preserves three navigation kinds: direct `text`, grouped `group`, and shallow `catalogue`. Peshitta book rows use `catalogue` and compose explicitly through `cal_text_catalogue(category_id=<returned upstream_id>)`; CAL-MCP does not prefetch chapters or expose private selector/form controls.\n'''
              research.write_text(rtext.rstrip() + amendment + '\n')
          PY
      - name: Commit GREEN and remove helper
        run: |
          rm .github/workflows/_issue110_green.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/cal_mcp/syriac.py research.md .github/workflows/_issue110_green.yml
          git commit -m "fix: restore Peshitta catalogue routing"
          git push origin HEAD:fix/issue-110-syriac-peshitta-routing
