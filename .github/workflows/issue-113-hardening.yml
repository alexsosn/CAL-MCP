name: issue-113 KWIC lexical-link hardening

on:
  push:
    branches:
      - issue-113-kwic-full-context
    paths:
      - .github/workflows/issue-113-hardening.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: issue-113-kwic-full-context
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Apply fail-closed selector validation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/cal_mcp/concordance.py')
          text = path.read_text()
          old = '''    query = parse_qs(urlsplit(lexical_url).query, keep_blank_values=True)
              coordinate = _parse_decimal_id(
                  _single_query_value(query, "coord", "full-context lexical coordinate"),
                  "coordinate",
              )
              word = _single_query_value(query, "word", "full-context lexical word")
              if not word.isascii() or not word.isdecimal():
                  raise ConcordanceParseError("CAL full-context lexical word index is not decimal")
              return coordinate, int(word), link.text, lexical_url
          '''
          old = '\n'.join(line[10:] if line.startswith('          ') else line for line in old.splitlines())
          new = '''    query = parse_qs(urlsplit(lexical_url).query, keep_blank_values=True)
              if set(query) != {"coord", "word", "hasvariant"}:
                  raise ConcordanceParseError(
                      "CAL full-context lexical link has unexpected or missing selectors"
                  )
              coordinate = _parse_decimal_id(
                  _single_query_value(query, "coord", "full-context lexical coordinate"),
                  "coordinate",
              )
              word = _single_query_value(query, "word", "full-context lexical word")
              hasvariant = _single_query_value(
                  query, "hasvariant", "full-context lexical hasvariant"
              )
              if not word.isascii() or not word.isdecimal():
                  raise ConcordanceParseError("CAL full-context lexical word index is not decimal")
              if not hasvariant.isascii() or not hasvariant.isdecimal():
                  raise ConcordanceParseError(
                      "CAL full-context lexical hasvariant selector is not decimal"
                  )
              return coordinate, int(word), link.text, lexical_url
          '''
          new = '\n'.join(line[10:] if line.startswith('          ') else line for line in new.splitlines())
          if text.count(old) != 1:
              raise SystemExit(f'expected one lexical parser anchor, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          ruff format src/cal_mcp/concordance.py
      - name: Validate review regression
        run: |
          ruff check src/cal_mcp/concordance.py tests/test_kwic_full_context.py tests/test_kwic_full_context_review_regressions.py
          ruff format --check src/cal_mcp/concordance.py tests/test_kwic_full_context.py tests/test_kwic_full_context_review_regressions.py
          mypy
          pytest -q tests/test_kwic_full_context.py tests/test_kwic_full_context_review_regressions.py tests/test_concordance.py tests/test_concordance_current_shape_regression.py tests/test_concordance_review_regressions.py
      - name: Commit validated hardening
        run: |
          rm .github/workflows/issue-113-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/cal_mcp/concordance.py .github/workflows/issue-113-hardening.yml
          git diff --cached --check
          git commit -m "Fail closed on malformed KWIC lexical selectors"
          git push origin HEAD:issue-113-kwic-full-context
