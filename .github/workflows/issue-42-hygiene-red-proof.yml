name: Prove issue 42 hygiene RED

on:
  push:
    branches:
      - fix/issue-42-text-concordance-parser-drift
    paths:
      - .github/workflows/issue-42-hygiene-red-proof.yml

permissions:
  contents: write

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 9e5610b48dc2c1e14ba77832d3ac75500bf587ed
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Verify historical hygiene RED
        run: |
          python -m pip install pytest
          set +e
          pytest tests/test_repository_hygiene.py > /tmp/hygiene-red.log 2>&1
          status=$?
          set -e
          cat /tmp/hygiene-red.log
          test "$status" -eq 1
          grep -q '.github/issue42_review_fix.py' /tmp/hygiene-red.log
          grep -q '.github/workflows/issue42-review-fix.yml' /tmp/hygiene-red.log
      - uses: actions/checkout@v6
        with:
          ref: fix/issue-42-text-concordance-parser-drift
      - name: Remove proof workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/issue-42-hygiene-red-proof.yml
          git add .github/workflows/issue-42-hygiene-red-proof.yml
          git commit -m "chore: remove issue 42 hygiene RED proof"
          git push origin HEAD:fix/issue-42-text-concordance-parser-drift
