name: issue110 stale fixture cleanup

on:
  push:
    branches:
      - fix/issue-110-syriac-peshitta-routing

permissions:
  contents: write

jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/issue-110-syriac-peshitta-routing
          fetch-depth: 0
      - name: Replace stale OT fixture contract
        shell: python
        run: |
          from pathlib import Path

          fixture = Path("tests/fixtures/cal/syriac_category_ot_peshitta.html")
          fixture.write_text(
              '''<!doctype html>\n<html lang="en">\n<head><meta charset="UTF-8"><title>OT Peshiṭta — Comprehensive Aramaic Lexicon</title></head>\n<body>\n  <h1>OT Peshiṭta</h1>\n  <ul>\n    <li><a href="/showsubtexts.php?cset=Syriac&amp;subtext=62001">62001</a> P Gn <a href="/get_file_info.php?coord=62001">ⓘ</a></li>\n    <li><a href="/showsubtexts.php?cset=Syriac&amp;subtext=62002">62002</a> P Ex <a href="/get_file_info.php?coord=62002">ⓘ</a></li>\n  </ul>\n</body>\n</html>\n''',
              encoding="utf-8",
          )

          test_path = Path("tests/test_syriac.py")
          text = test_path.read_text(encoding="utf-8")
          old = '''    assert all(item.navigation_kind is SyriacTextNavigationKind.TEXT for item in page.items)\n'''
          new = '''    assert all(\n        item.navigation_kind is SyriacTextNavigationKind.CATALOGUE for item in page.items\n    )\n'''
          if text.count(old) != 1:
              raise SystemExit("stale static Syriac expectation did not match exactly once")
          test_path.write_text(text.replace(old, new), encoding="utf-8")
      - name: Commit cleanup and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/fixtures/cal/syriac_category_ot_peshitta.html tests/test_syriac.py
          git rm .github/workflows/_issue110_clean_stale_fixture.yml
          git diff --cached --check
          git commit -m "test: replace stale Peshitta direct-route contract"
          git push origin HEAD:fix/issue-110-syriac-peshitta-routing
