name: Issue 220 final live stdio acceptance

on:
  push:
    branches:
      - dev/issue-220-mandaic-col-coordinates

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install candidate
        run: python -m pip install .
      - name: Verify 74421 col coordinate composition over stdio
        run: |
          python - <<'PY'
          import asyncio
          from mcp import Client, StdioServerParameters

          calls = 0

          async def call(client, tool, args):
              global calls
              calls += 1
              if calls > 3:
                  raise RuntimeError(f"live request budget exceeded: {calls}")
              result = await client.call_tool(tool, args)
              if result.is_error:
                  raise RuntimeError(f"{tool} {args} failed: {result.content!r}")
              data = result.structured_content
              if not isinstance(data, dict):
                  raise RuntimeError(f"{tool} {args}: missing structured content")
              return data

          def tokens(data):
              page = data.get("page")
              if not isinstance(page, dict):
                  raise RuntimeError("missing page payload")
              lines = page.get("lines")
              if not isinstance(lines, list) or not lines:
                  raise RuntimeError("page has no lines")
              out = []
              for line in lines:
                  if not isinstance(line, dict):
                      continue
                  for token in line.get("tokens") or []:
                      if isinstance(token, dict):
                          out.append((token.get("coordinate"), token.get("word_index")))
              return out

          async def main():
              async with Client(StdioServerParameters(command="cal-mcp")) as client:
                  col = await call(
                      client,
                      "cal_text_page",
                      {"file_id": "74421", "subtext_id": "col", "page": 1},
                  )
                  if col.get("status") != "found":
                      raise RuntimeError("74421/col not found")
                  special = next(
                      (
                          (coord, word)
                          for coord, word in tokens(col)
                          if isinstance(coord, str)
                          and coord.startswith("74421col")
                          and coord[len("74421col"):].isdigit()
                          and isinstance(word, int)
                      ),
                      None,
                  )
                  if special is None:
                      raise RuntimeError("74421/col returned no exact special token coordinate")

                  coord, word = special
                  analysis = await call(
                      client,
                      "cal_token_analysis",
                      {"coordinate": coord, "word_index": word},
                  )
                  if analysis.get("coordinate") != coord or analysis.get("word_index") != word:
                      raise RuntimeError("token-analysis changed returned coordinate identity")
                  if analysis.get("status") not in {"found", "not_found"}:
                      raise RuntimeError("token-analysis returned no recognized status")

                  numeric = await call(
                      client,
                      "cal_text_page",
                      {"file_id": "74421", "subtext_id": "103", "page": 1},
                  )
                  if numeric.get("status") != "found":
                      raise RuntimeError("74421/103 not found")
                  numeric_tokens = tokens(numeric)
                  if not numeric_tokens:
                      raise RuntimeError("74421/103 returned no tokens")
                  if not all(
                      isinstance(coord2, str) and coord2.isdigit()
                      for coord2, _ in numeric_tokens
                  ):
                      raise RuntimeError("74421/103 unexpectedly left decimal coordinate grammar")

                  if calls != 3:
                      raise RuntimeError(f"expected exactly 3 calls, got {calls}")
                  print(f"live #220 OK: token={coord}/{word} calls={calls}")

          asyncio.run(main())
          PY
