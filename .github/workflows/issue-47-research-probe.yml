name: Issue 47 bounded lexicon research probe

on:
  push:
    branches:
      - issue-47-lexicon-browse-drift
    paths:
      - .github/workflows/issue-47-research-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Inspect one current CAL candidate markup window
        shell: bash
        run: |
          python - <<'PY'
          import http.client

          host = "cal.huc.edu"
          path = "/browseSKEYheaders.php?first3=%22br%22"
          limit = 128 * 1024
          connection = http.client.HTTPSConnection(host, timeout=10)
          connection.request(
              "GET",
              path,
              headers={
                  "User-Agent": "CAL-MCP/0.1 issue-47-bounded-research-probe",
                  "Accept": "text/html,application/xhtml+xml",
              },
          )
          response = connection.getresponse()
          body = response.read(limit + 1)
          connection.close()
          print(f"STATUS {response.status} {response.reason}")
          print(f"CONTENT_TYPE {response.getheader('Content-Type')}")
          print(f"BYTES {len(body)}")
          if response.status != 200 or len(body) > limit:
              raise SystemExit("bounded research response was not acceptable")

          html = body.decode("utf-8", errors="replace")
          marker = "oneentry.php?lemma=br N&cits=all"
          index = html.find(marker)
          print(f"MARKER_INDEX {index}")
          if index < 0:
              raise SystemExit("first br candidate marker absent")
          start = max(0, index - 500)
          end = min(len(html), index + len(marker) + 900)
          print("RAW_WINDOW_START")
          print(repr(html[start:end]))
          print("RAW_WINDOW_END")
          PY
