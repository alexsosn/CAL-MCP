name: Issue 185 CPA navigation probe

on:
  push:
    branches:
      - dev/issue-185-unlemmatized-text

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Probe current 55430 pagination links
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from html.parser import HTMLParser
          from urllib.parse import parse_qs, urlsplit

          url = "https://cal.huc.edu/get_a_chapter.php?file=55430&cset=C&page=0"
          req = urllib.request.Request(
              url,
              headers={"User-Agent": "CAL-MCP research/0.1 (+https://github.com/alexsosn/CAL-MCP)"},
          )
          with urllib.request.urlopen(req, timeout=20) as response:
              body = response.read(262145)
              if len(body) > 262144:
                  raise RuntimeError("response exceeded 256 KiB")
              html = body.decode("utf-8", "replace")

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.open = None
                  self.links = []
              def handle_starttag(self, tag, attrs):
                  if tag == "a":
                      d = dict(attrs)
                      self.open = [d.get("href") or "", []]
              def handle_data(self, data):
                  if self.open is not None:
                      self.open[1].append(data)
              def handle_endtag(self, tag):
                  if tag == "a" and self.open is not None:
                      href, parts = self.open
                      label = " ".join("".join(parts).split())
                      if "previous page" in label.lower() or "next page" in label.lower():
                          u = urlsplit(href)
                          q = parse_qs(u.query, keep_blank_values=True)
                          self.links.append({
                              "path": u.path.rsplit("/", 1)[-1],
                              "label": label,
                              "keys": sorted(q),
                              "values": {key: q[key] for key in sorted(q)},
                          })
                      self.open = None

          p=Links(); p.feed(html); p.close()
          print(json.dumps({"navigation": p.links}, sort_keys=True))
          if not p.links:
              raise RuntimeError("no current previous/next navigation links found")
          PY
