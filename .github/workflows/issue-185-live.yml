name: Issue 185 final live stdio acceptance

on:
  push:
    branches:
      - dev/issue-185-unlemmatized-text

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install candidate
        run: python -m pip install .
      - name: Verify plain and linked text pages over stdio
        run: |
          python - <<'PY'
          import asyncio
          from mcp import Client, StdioServerParameters

          async def page(client, file_id, page_number=1):
              result = await client.call_tool(
                  "cal_text_page",
                  {"file_id": file_id, "page": page_number},
              )
              if result.is_error:
                  raise RuntimeError(
                      f"{file_id}/page{page_number} failed: {result.content!r}"
                  )
              data = result.structured_content
              if not isinstance(data, dict) or data.get("status") != "found":
                  raise RuntimeError(f"{file_id}/page{page_number}: no found structured page")
              page = data.get("page")
              if not isinstance(page, dict):
                  raise RuntimeError(f"{file_id}/page{page_number}: page payload missing")
              lines = page.get("lines")
              if not isinstance(lines, list) or not lines:
                  raise RuntimeError(f"{file_id}/page{page_number}: no lines")
              return lines

          def assert_plain(lines, label):
              if any(line.get("tokens") for line in lines):
                  raise RuntimeError(f"{label}: plain page unexpectedly contains tokens")
              if any(line.get("empty_word_indexes") for line in lines):
                  raise RuntimeError(f"{label}: plain page unexpectedly contains empty token slots")
              if any(not line.get("display_coordinate") or not line.get("text") for line in lines):
                  raise RuntimeError(f"{label}: plain display/text lost")

          async def main():
              async with Client(StdioServerParameters(command="cal-mcp")) as client:
                  mandaic = await page(client, "74420")
                  assert_plain(mandaic, "74420")
                  if not any(line.get("coordinate") is None for line in mandaic):
                      raise RuntimeError("74420 has no nullable-coordinate plain row")
                  if not any(
                      line.get("coordinate") is not None and line.get("comment_url")
                      for line in mandaic
                  ):
                      raise RuntimeError("74420 lost comment-derived line coordinate")

                  cpa1 = await page(client, "55430", 1)
                  assert_plain(cpa1, "55430/page1")
                  if not any(line.get("coordinate") is None for line in cpa1):
                      raise RuntimeError("55430/page1 has no nullable-coordinate row")
                  if not any(
                      line.get("coordinate") is not None and line.get("comment_url")
                      for line in cpa1
                  ):
                      raise RuntimeError("55430/page1 lost comment-derived coordinate")

                  cpa2 = await page(client, "55430", 2)
                  assert_plain(cpa2, "55430/page2")

                  peshitta = await page(client, "62057")
                  if not all(line.get("coordinate") for line in peshitta):
                      raise RuntimeError("62057 lost linked line coordinates")
                  if not all(line.get("tokens") for line in peshitta):
                      raise RuntimeError("62057 lost linked tokens")

                  print(
                      "live #185 OK: "
                      f"mandaic={len(mandaic)} "
                      f"cpa1={len(cpa1)} cpa2={len(cpa2)} "
                      f"linked={len(peshitta)}"
                  )

          asyncio.run(main())
          PY
