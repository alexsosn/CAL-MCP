name: Issue 185 live stdio acceptance

on:
  push:
    branches:
      - dev/issue-185-unlemmatized-text

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install candidate
        run: python -m pip install .
      - name: Verify plain and linked text pages over stdio
        run: |
          python - <<'PY'
          import asyncio
          from mcp import Client, StdioServerParameters

          async def page(client, file_id):
              result = await client.call_tool("cal_text_page", {"file_id": file_id})
              if result.is_error:
                  raise RuntimeError(f"{file_id} failed: {result.content!r}")
              data = result.structured_content
              if not isinstance(data, dict) or data.get("status") != "found":
                  raise RuntimeError(f"{file_id}: not found/structured")
              page_data = data.get("page")
              if not isinstance(page_data, dict):
                  raise RuntimeError(f"{file_id}: no page object")
              lines = page_data.get("lines")
              if not isinstance(lines, list) or not lines:
                  raise RuntimeError(f"{file_id}: no lines")
              return lines

          async def main():
              async with Client(StdioServerParameters(command="cal-mcp")) as client:
                  mandaic = await page(client, "74420")
                  if any(line.get("tokens") for line in mandaic):
                      raise RuntimeError("74420 unexpectedly contains lexical tokens")
                  if any(not line.get("display_coordinate") or not line.get("text") for line in mandaic):
                      raise RuntimeError("74420 lost plain display/text")
                  if not any(line.get("coordinate") is None for line in mandaic):
                      raise RuntimeError("74420 has no nullable-coordinate plain row")
                  if not any(
                      line.get("coordinate") is not None and line.get("comment_url")
                      for line in mandaic
                  ):
                      raise RuntimeError("74420 lost comment-derived line coordinate")

                  cpa = await page(client, "55430")
                  if any(line.get("tokens") for line in cpa):
                      raise RuntimeError("55430 unexpectedly contains lexical tokens")
                  if any(not line.get("display_coordinate") or not line.get("text") for line in cpa):
                      raise RuntimeError("55430 lost plain display/text")

                  peshitta = await page(client, "62057")
                  if not all(line.get("coordinate") for line in peshitta):
                      raise RuntimeError("62057 lost linked line coordinates")
                  if not all(line.get("tokens") for line in peshitta):
                      raise RuntimeError("62057 lost linked tokens")

                  print(
                      "live #185 OK: "
                      f"mandaic_lines={len(mandaic)} "
                      f"cpa_lines={len(cpa)} "
                      f"linked_lines={len(peshitta)}"
                  )

          asyncio.run(main())
          PY
