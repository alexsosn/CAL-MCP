name: Prepare Syriac review RED

on:
  push:
    branches:
      - feat/issue-11-syriac
    paths:
      - .github/workflows/syriac-review-red.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/issue-11-syriac
      - name: Add corrected fixtures and review regressions
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/patch_syriac_review_red.py
          python /tmp/patch_syriac_review_red.py
          python -m pip install "ruff<1,>=0.12"
          ruff format tests/test_syriac.py tests/test_syriac_review_regressions.py
          ruff check tests/test_syriac.py tests/test_syriac_review_regressions.py
      - name: Commit test-only RED
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/fixtures/cal/syriac_category_ot_peshitta.html tests/fixtures/cal/syriac_peshitta_gen_1_1.html tests/fixtures/cal/syriac_missing_verbs.html tests/test_syriac.py tests/test_syriac_review_regressions.py
          git commit -m "test: add Syriac review regressions"
          git push origin HEAD:feat/issue-11-syriac
