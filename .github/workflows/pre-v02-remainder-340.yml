name: One-off #340 remaining 17-step CAL acceptance

# Temporary, run once on this branch only; no release trigger, secrets or schedule.
on:
  push:
    branches: [smoke/all-tool-acceptance-340]
    paths: [.github/workflows/pre-v02-remainder-340.yml]

permissions:
  contents: read

concurrency:
  group: cal-mcp-live-smoke
  cancel-in-progress: false

jobs:
  remaining-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build candidate wheel and sdist without version tag
        run: |
          python -m pip install --disable-pip-version-check "build>=1.3,<2"
          python -m build --outdir dist
      - name: Fresh environment installation of the exact built wheel
        shell: bash
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          python -m venv "$RUNNER_TEMP/cal-mcp-remainder-venv"
          "$RUNNER_TEMP/cal-mcp-remainder-venv/bin/python" -m pip install \
            --disable-pip-version-check --no-cache-dir "${wheels[0]}"
      - name: Run exactly 17 remaining reviewed steps; never retry failed comment route
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/cal-mcp-remainder-venv/bin/cal-mcp" --version
          "$RUNNER_TEMP/cal-mcp-remainder-venv/bin/python" -m cal_mcp.pre_release_followup_smoke \
            --executable "$RUNNER_TEMP/cal-mcp-remainder-venv/bin/cal-mcp" \
            --remaining-only
