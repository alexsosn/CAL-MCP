name: Issue 9 live probe

on:
  push:
    branches: [research/issue-9-live-probe]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect bounded bibliography author form
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 \
            --user-agent 'CAL-MCP research probe (https://github.com/alexsosn/CAL-MCP)' \
            https://cal.huc.edu/namesearch.html > /tmp/namesearch.html
          python - <<'PY'
          from html.parser import HTMLParser

          class FormProbe(HTMLParser):
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == "form":
                      print("FORM", {k: attrs.get(k) for k in ("action", "method")})
                  elif tag in {"input", "select", "option"}:
                      keep = {k: attrs.get(k) for k in ("name", "type", "value") if k in attrs}
                      if keep:
                          print(tag.upper(), keep)

          parser = FormProbe()
          with open('/tmp/namesearch.html', encoding='utf-8', errors='replace') as fh:
              parser.feed(fh.read())
          PY
