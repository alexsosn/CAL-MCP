name: Issue 179 Tel Dan current-token probe

on:
  push:
    branches:
      - dev/issue-179-syriac-token-redirects

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Probe current Tel Dan lexical tokens
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from html.parser import HTMLParser
          from urllib.parse import parse_qs, urlsplit

          UA = {"User-Agent": "CAL-MCP review/0.1 (+https://github.com/alexsosn/CAL-MCP)"}

          def get(url):
              req = urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=20) as response:
                  body = response.read(262145)
                  if len(body) > 262144:
                      raise RuntimeError("response exceeded 256 KiB")
                  return body.decode("utf-8", "replace")

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.hrefs = []
              def handle_starttag(self, tag, attrs):
                  if tag == "a":
                      href = dict(attrs).get("href")
                      if href:
                          self.hrefs.append(href)

          page = get("https://cal.huc.edu/get_a_chapter.php?file=13250&page=0")
          p = Links(); p.feed(page); p.close()
          tokens = []
          for href in p.hrefs:
              u = urlsplit(href)
              if u.path.rsplit("/", 1)[-1] != "getlex.php":
                  continue
              q = parse_qs(u.query, keep_blank_values=True)
              tokens.append(((q.get("coord") or [None])[0], (q.get("word") or [None])[0]))
          unique = []
          for item in tokens:
              if item not in unique:
                  unique.append(item)

          probes = []
          for coord, word in unique[:8]:
              body = get(f"https://cal.huc.edu/getlex.php?coord={coord}&word={word}")
              lp = Links(); lp.feed(body); lp.close()
              low = body.lower()
              probes.append({
                  "coord": coord,
                  "word": word,
                  "oneentry_links": sum(
                      urlsplit(h).path.rsplit("/", 1)[-1] == "oneentry.php" for h in lp.hrefs
                  ),
                  "has_marker": "click on a headword to see a complete lexicon entry" in low,
                  "has_no_data": "there is no data for this word" in low,
              })
              if probes[-1]["oneentry_links"] or (
                  probes[-1]["has_marker"] and not probes[-1]["has_no_data"]
              ):
                  break

          print(json.dumps({
              "token_route_count": len(tokens),
              "first_unique_routes": unique[:8],
              "probes": probes,
          }, sort_keys=True))
          if not any(p["oneentry_links"] for p in probes):
              raise RuntimeError("no linked current Tel Dan control found in first eight token routes")
          PY
