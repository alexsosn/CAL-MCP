name: Issue 179 final live stdio acceptance

on:
  push:
    branches:
      - dev/issue-179-syriac-token-redirects

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install candidate
        run: python -m pip install .
      - name: Verify Peshitta, Targum and current Tel Dan over stdio
        run: |
          python - <<'PY'
          import asyncio
          from mcp import Client, StdioServerParameters

          async def call(client, coordinate, word_index):
              result = await client.call_tool(
                  "cal_token_analysis",
                  {"coordinate": coordinate, "word_index": word_index},
              )
              if result.is_error:
                  raise RuntimeError(
                      f"{coordinate}/{word_index} failed: {result.content!r}"
                  )
              data = result.structured_content
              if not isinstance(data, dict):
                  raise RuntimeError(f"{coordinate}/{word_index} lacks structured content")
              candidates = data.get("candidates")
              if not isinstance(candidates, list) or not candidates:
                  raise RuntimeError(f"{coordinate}/{word_index} has no candidates")
              return candidates

          async def main():
              async with Client(StdioServerParameters(command="cal-mcp")) as client:
                  syriac = await call(client, "620570101", 1)
                  if len(syriac) != 1:
                      raise RuntimeError(f"Syriac candidate count changed: {syriac!r}")
                  candidate = syriac[0]
                  if candidate.get("analyzed_lemma_key") != ")syr N":
                      raise RuntimeError(f"wrong Syriac analyzed key: {candidate!r}")
                  lemma = candidate.get("lemma")
                  if not isinstance(lemma, dict) or lemma.get("lemma_key") != ")syr A":
                      raise RuntimeError(f"wrong Syriac linked target: {candidate!r}")

                  targum = await call(client, "5101801011", 0)
                  if any(item.get("analyzed_lemma_key") is not None for item in targum):
                      raise RuntimeError(f"Targum fabricated redirect key: {targum!r}")

                  tel_dan = await call(client, "1325001", 4)
                  if len(tel_dan) < 2:
                      raise RuntimeError(f"Tel Dan lost current ambiguity: {tel_dan!r}")
                  if any(item.get("analyzed_lemma_key") is not None for item in tel_dan):
                      raise RuntimeError(f"Tel Dan fabricated redirect key: {tel_dan!r}")

                  print(
                      "live #179 OK: "
                      f"syriac={len(syriac)} "
                      f"targum={len(targum)} "
                      f"tel_dan={len(tel_dan)}"
                  )

          asyncio.run(main())
          PY
