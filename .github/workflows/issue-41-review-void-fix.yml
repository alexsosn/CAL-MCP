name: Issue 41 review void fix

on:
  push:
    branches:
      - fix/issue-41-lexicon-citation-count-drift
    paths:
      - .github/workflows/issue-41-review-void-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/issue-41-lexicon-citation-count-drift
      - name: Handle self-closing void tags inside excluded citation content
        run: |
          python -c 'from pathlib import Path; p=Path("src/cal_mcp/lexicon.py"); s=p.read_text(); old="""    def handle_endtag(self, tag: str) -> None:\n"""; new="""    def handle_startendtag(self, tag: str, attrs: list[tuple[str, str | None]]) -> None:\n        if self._semantic_skip_tags and tag in _HTML_VOID_TAGS:\n            self.handle_starttag(tag, attrs)\n            return\n        super().handle_startendtag(tag, attrs)\n\n    def handle_endtag(self, tag: str) -> None:\n"""; assert s.count(old)==1; p.write_text(s.replace(old,new,1))'
          rm .github/workflows/issue-41-review-void-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/cal_mcp/lexicon.py .github/workflows/issue-41-review-void-fix.yml
          git commit -m 'fix: allow self-closing void tags in hidden citations'
          git push origin HEAD:fix/issue-41-lexicon-citation-count-drift
