name: Append issue 32 research note

on:
  push:
    branches:
      - fix/issue-32-lexicon-inline-style
    paths:
      - .github/workflows/research-note-issue-32.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/issue-32-lexicon-inline-style
      - name: Insert dated research record
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('research.md')
          text = path.read_text()
          anchor = '\n## Open research questions\n'
          section = '''
## R-017 — CAL full lexicon entries now inline non-content stylesheet text

**Rechecked:** 2026-09-05.

Issue #32 records bounded live evidence from `cal_entry_web.php?lemma=b+s`: CAL now emits the `fullentry.css` stylesheet inside a `<style>` element in the page head rather than only as an external linked resource. The page still contains the normal rendered lexical entry and a `<meta name="cal-lemma" content="b+s">` marker, but CAL-MCP's shared semantic HTML parser previously harvested text from every element. Dot-bearing CSS tokens such as `fullentry.css` could therefore satisfy the generic lemma-header grammar before the real rendered header, silently producing stylesheet content as `entry.lemma` while later sense parsing still appeared successful.

The same contamination was reported for unrelated full entries, so the defect is page-shape-wide rather than lemma-specific. Existing reduced pre-drift fixtures did not include head-level `<style>` or `<script>` content and therefore could not detect the change.

Source:

- https://cal.huc.edu/cal_entry_web.php?lemma=b+s
- GitHub issue #32, captured 2026-09-05

A reduced regression fixture is kept as `tests/fixtures/cal/entry_b_s_inline_style.html`; it contains only the semantic shape needed to reproduce the parser failure, not a full archived CAL page.

**Implication:** semantic HTML extraction must exclude non-rendered `style` and `script` subtrees before lemma/sense parsing. The fix belongs at the shared semantic-parser boundary, not in CSS-token heuristics or a post-parse filter. Public lexicon models and request behavior remain unchanged.
'''
          if text.count(anchor) != 1:
              raise SystemExit('research anchor mismatch')
          if '## R-017 — CAL full lexicon entries now inline non-content stylesheet text' in text:
              raise SystemExit('research note already present')
          path.write_text(text.replace(anchor, '\n' + section + anchor, 1))
          PY
      - name: Commit research note
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research.md
          git commit -m "research: record CAL inline stylesheet drift"
          git push origin HEAD:fix/issue-32-lexicon-inline-style
