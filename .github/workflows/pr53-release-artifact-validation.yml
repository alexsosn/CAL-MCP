name: PR53 release artifact validation

on:
  push:
    branches:
      - issue-52-cal-code-conversion
    paths:
      - .github/workflows/pr53-release-artifact-validation.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/ci-py311.txt
            constraints/build-py311.txt
      - name: Bootstrap frozen installer
        run: python -m pip install "pip==26.2.1" "setuptools==79.0.1"
      - name: Install frozen validation environment
        run: python -m pip install -e ".[dev]" -c constraints/ci-py311.txt --build-constraint constraints/build-py311.txt
      - name: Verify frozen environment
        run: |
          python -m pip check
          python scripts/verify_ci_environment.py constraints/ci-py311.txt \
            --exclude cal-mcp \
            --exclude pip \
            --exclude setuptools
      - name: Build exact distributions
        env:
          PIP_BUILD_CONSTRAINT: constraints/build-py311.txt
        run: python -m build --outdir dist
      - name: Verify wheel, sdist, version, and installed stdio surface
        run: python scripts/verify_release_artifact.py dist --tag v0.1.0
