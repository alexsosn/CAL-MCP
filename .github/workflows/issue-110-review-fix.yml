name: Issue 110 review fix

on:
  push:
    branches:
      - fix/issue-110-syriac-peshitta-routing
    paths:
      - .github/workflows/issue-110-review-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/issue-110-syriac-peshitta-routing
      - name: Renumber Peshitta durable research record
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("research.md")
          text = path.read_text(encoding="utf-8")
          old = "## R-001 — Current Syriac Peshitta book rows use shallow catalogue navigation"
          new = "## R-026 — Current Syriac Peshitta book rows use shallow catalogue navigation"
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one target heading, found {text.count(old)}")
          if new in text:
              raise SystemExit("R-026 target heading already exists")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
      - name: Commit fix and remove helper
        run: |
          rm .github/workflows/issue-110-review-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research.md .github/workflows/issue-110-review-fix.yml
          git commit -m "fix: assign next durable Peshitta research id"
          git push origin HEAD:fix/issue-110-syriac-peshitta-routing
