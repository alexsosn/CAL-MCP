name: Apply issue 73 minimal fix

on:
  push:
    branches:
      - issue-73-native-unicode-lexicon-pass-through
    paths:
      - .github/workflows/issue-73-apply-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: issue-73-native-unicode-lexicon-pass-through
      - name: Apply minimal lookup fallback
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/cal_mcp/lexicon.py")
          text = path.read_text()
          old_import = """    NormalizedQuery,\n    convert_to_cal_code,\n"""
          new_import = """    NormalizedQuery,\n    UnsupportedQueryError,\n    convert_to_cal_code,\n"""
          if old_import not in text:
              raise SystemExit("normalization import anchor missing")
          text = text.replace(old_import, new_import, 1)

          old = """        normalized = normalize_query(query)\n        conversion = convert_to_cal_code(query)\n        has_ambiguity = any(word.ambiguities for word in conversion.words)\n        requires_cal_code_search = (\n            has_ambiguity or conversion.representation in _DEDICATED_CAL_CODE_SEARCH_REPRESENTATIONS\n        )\n\n        if requires_cal_code_search:\n"""
          new = """        normalized = normalize_query(query)\n        conversion: CalCodeConversion | None\n        try:\n            conversion = convert_to_cal_code(query)\n        except UnsupportedQueryError:\n            if normalized.representation not in {\n                InputRepresentation.HEBREW,\n                InputRepresentation.SYRIAC,\n            }:\n                raise\n            conversion = None\n\n        requires_cal_code_search = conversion is not None and (\n            any(word.ambiguities for word in conversion.words)\n            or conversion.representation in _DEDICATED_CAL_CODE_SEARCH_REPRESENTATIONS\n        )\n\n        if requires_cal_code_search:\n            assert conversion is not None\n"""
          if old not in text:
              raise SystemExit("lookup conversion anchor missing")
          path.write_text(text.replace(old, new, 1))
      - name: Focused verification
        run: |
          python -m pip install -e '.[dev]' -c constraints/ci-py311.txt --build-constraint constraints/build-py311.txt
          ruff check src/cal_mcp/lexicon.py tests/test_lexicon_native_unicode_regression.py
          ruff format --check src/cal_mcp/lexicon.py tests/test_lexicon_native_unicode_regression.py
          mypy
          pytest tests/test_lexicon_native_unicode_regression.py tests/test_lexicon_ambiguity_expansion.py tests/test_lexicon_conversion_provenance.py tests/test_cal_code_conversion.py tests/test_cal_code_conversion_review_regressions.py
      - name: Commit fix and remove helper
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/issue-73-apply-fix.yml
          git add src/cal_mcp/lexicon.py .github/workflows/issue-73-apply-fix.yml
          git commit -m "Restore CAL-native Hebrew and Syriac lexicon pass-through"
          git push origin HEAD:issue-73-native-unicode-lexicon-pass-through
