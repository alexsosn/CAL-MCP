name: issue-107 sync main

on:
  push:
    branches:
      - issue-107-specialized-gloss-fields
    paths:
      - .github/workflows/issue107-sync-main.yml

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          ref: issue-107-specialized-gloss-fields
          fetch-depth: 0
      - name: Merge current main and remove helper
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-commit --no-ff origin/main
          rm .github/workflows/issue107-sync-main.yml
          git add -A
          git diff --cached --check
          git commit -m "Sync current main before issue-107 final review"
          git push origin HEAD:issue-107-specialized-gloss-fields
