name: Issue 185 plain-row coordinate-link audit

on:
  push:
    branches:
      - research/issue-185-unlemmatized-text

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Audit nonlexical links in plain rows
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from html.parser import HTMLParser
          from urllib.parse import parse_qs, urlsplit

          CASES = [
              ("74420", "https://cal.huc.edu/get_a_chapter.php?cset=M&file=74420&page=0"),
              ("55430", "https://cal.huc.edu/get_a_chapter.php?file=55430&cset=C&page=0"),
          ]
          UA = {"User-Agent": "CAL-MCP research/0.1 (+https://github.com/alexsosn/CAL-MCP)"}

          class Probe(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.in_text = False
                  self.row = None
                  self.cell_index = None
                  self.rows = []
              def handle_starttag(self, tag, attrs):
                  d = dict(attrs)
                  if tag == "table":
                      if self.in_text:
                          self._end_row()
                          self.in_text = False
                          return
                      if "text-display" in (d.get("class") or "").split():
                          self.in_text = True
                          return
                  if not self.in_text:
                      return
                  if tag == "tr":
                      self._end_row()
                      self.row = {"cells": [], "links": []}
                  elif tag == "td" and self.row is not None:
                      self.cell_index = len(self.row["cells"])
                      self.row["cells"].append([])
                  elif tag == "a" and self.row is not None:
                      href = d.get("href") or ""
                      u = urlsplit(href)
                      q = parse_qs(u.query, keep_blank_values=True)
                      self.row["links"].append({
                          "cell": self.cell_index,
                          "path": u.path.rsplit("/", 1)[-1],
                          "keys": sorted(q),
                          "coord": (q.get("coord") or [None])[0],
                      })
              def handle_endtag(self, tag):
                  if not self.in_text:
                      return
                  if tag == "td":
                      self.cell_index = None
                  elif tag == "tr":
                      self._end_row()
              def handle_data(self, data):
                  if self.row is None or self.cell_index is None:
                      return
                  text = " ".join(data.split())
                  if text:
                      self.row["cells"][self.cell_index].append(text)
              def _end_row(self):
                  if self.row is not None and self.row["cells"]:
                      self.rows.append(self.row)
                  self.row = None
                  self.cell_index = None

          output = []
          for name, url in CASES:
              req = urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=20) as response:
                  body = response.read(524289)
                  if len(body) > 524288:
                      raise RuntimeError("response exceeded 512 KiB")
              p=Probe(); p.feed(body.decode("utf-8","replace")); p.close()
              links = []
              for index,row in enumerate(p.rows):
                  if row["links"]:
                      links.append({
                          "row_index": index,
                          "display_coordinate": " ".join(row["cells"][0]) if row["cells"] else None,
                          "links": row["links"],
                      })
              output.append({
                  "case": name,
                  "rows": len(p.rows),
                  "rows_with_links": len(links),
                  "link_rows": links,
              })
          print(json.dumps(output, ensure_ascii=False, sort_keys=True))
          PY
