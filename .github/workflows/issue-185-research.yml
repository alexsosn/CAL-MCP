name: Issue 185 direct CPA audit

on:
  push:
    branches:
      - research/issue-185-unlemmatized-text

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Audit four current direct CPA files
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from html.parser import HTMLParser
          from urllib.parse import urlsplit

          FILES = ["55002", "55406", "55407", "55430"]
          UA = {"User-Agent": "CAL-MCP research/0.1 (+https://github.com/alexsosn/CAL-MCP)"}

          class Probe(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.in_text = False
                  self.nonempty_data = 0
                  self.data_chars = 0
                  self.lexical_links = 0
                  self.tags = {}
              def handle_starttag(self, tag, attrs):
                  d = dict(attrs)
                  if tag == "table":
                      if self.in_text:
                          self.in_text = False
                          return
                      if "text-display" in (d.get("class") or "").split():
                          self.in_text = True
                          return
                  if not self.in_text:
                      return
                  self.tags[tag] = self.tags.get(tag, 0) + 1
                  if tag == "a":
                      path = urlsplit(d.get("href") or "").path.rsplit("/", 1)[-1]
                      if path in {"getlex.php", "bablex.php"}:
                          self.lexical_links += 1
              def handle_data(self, data):
                  if not self.in_text:
                      return
                  text = " ".join(data.split())
                  if text:
                      self.nonempty_data += 1
                      self.data_chars += len(text)

          output = []
          for file_id in FILES:
              url = f"https://cal.huc.edu/get_a_chapter.php?file={file_id}&cset=C&page=0"
              req = urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=20) as response:
                  body = response.read(262145)
                  if len(body) > 262144:
                      raise RuntimeError(f"{file_id}: response exceeded 256 KiB")
                  p = Probe()
                  p.feed(body.decode("utf-8", "replace"))
                  p.close()
                  output.append({
                      "file_id": file_id,
                      "status": response.status,
                      "final_path": urlsplit(response.geturl()).path.rsplit("/", 1)[-1],
                      "nonempty_text_nodes": p.nonempty_data,
                      "text_chars": p.data_chars,
                      "lexical_links": p.lexical_links,
                      "tags": p.tags,
                  })
          print(json.dumps(output, sort_keys=True))
          PY
