name: Issue 185 bounded plain-text research

on:
  push:
    branches:
      - research/issue-185-unlemmatized-text

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Probe four fixed text pages
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from html.parser import HTMLParser
          from urllib.parse import urlsplit

          UA = {"User-Agent": "CAL-MCP research/0.1 (+https://github.com/alexsosn/CAL-MCP)"}
          CASES = [
              ("mandaic-74420", "https://cal.huc.edu/get_a_chapter.php?cset=M&file=74420&page=0"),
              ("mandaic-74501", "https://cal.huc.edu/get_a_chapter.php?cset=M&file=74501&page=0"),
              ("cpa-55002", "https://cal.huc.edu/get_a_chapter.php?file=55002&cset=C&page=0"),
              ("peshitta-62057", "https://cal.huc.edu/get_a_chapter.php?file=62057&page=0"),
          ]

          class Probe(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.in_text_table = False
                  self.text_table_depth = 0
                  self.current_row = None
                  self.current_cell = None
                  self.rows = []
                  self.table_count = 0
              def handle_starttag(self, tag, attrs):
                  d = dict(attrs)
                  if tag == "table":
                      if self.in_text_table:
                          self.text_table_depth += 1
                      elif "text-display" in (d.get("class") or "").split():
                          self.in_text_table = True
                          self.text_table_depth = 1
                          self.table_count += 1
                      return
                  if not self.in_text_table:
                      return
                  if tag == "tr" and self.current_row is None:
                      self.current_row = {"cells": [], "lexical_links": 0, "tags": {}, "loose": []}
                  elif tag == "td" and self.current_row is not None:
                      self.current_cell = {"parts": [], "links": 0}
                      self.current_row["cells"].append(self.current_cell)
                  if self.current_row is not None:
                      self.current_row["tags"][tag] = self.current_row["tags"].get(tag, 0) + 1
                  if tag == "a" and self.current_row is not None:
                      path = urlsplit(d.get("href") or "").path.rsplit("/", 1)[-1]
                      if path in {"getlex.php", "bablex.php"}:
                          self.current_row["lexical_links"] += 1
                      if self.current_cell is not None:
                          self.current_cell["links"] += 1
              def handle_endtag(self, tag):
                  if not self.in_text_table:
                      return
                  if tag == "td":
                      self.current_cell = None
                  elif tag == "tr" and self.current_row is not None:
                      self.rows.append(self.current_row)
                      self.current_row = None
                      self.current_cell = None
                  elif tag == "table":
                      self.text_table_depth -= 1
                      if self.text_table_depth <= 0:
                          if self.current_row is not None:
                              self.rows.append(self.current_row)
                              self.current_row = None
                          self.in_text_table = False
                          self.text_table_depth = 0
              def handle_data(self, data):
                  if not self.in_text_table or self.current_row is None:
                      return
                  cleaned = " ".join(data.split())
                  if not cleaned:
                      return
                  if self.current_cell is not None:
                      self.current_cell["parts"].append(cleaned)
                  else:
                      self.current_row["loose"].append(cleaned)

          def get(url):
              req = urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=20) as response:
                  body = response.read(524289)
                  if len(body) > 524288:
                      raise RuntimeError("response exceeded 512 KiB")
                  return response.status, response.geturl(), body.decode("utf-8", "replace")

          output = []
          for name, url in CASES:
              status, final_url, body = get(url)
              p = Probe()
              p.feed(body)
              p.close()
              row_shapes = {}
              linked = plain_two_cell = other_linkless = mixed = 0
              examples = []
              for row in p.rows:
                  cells = row["cells"]
                  lex = row["lexical_links"]
                  nonempty_cells = [
                      " ".join(cell["parts"]).strip()
                      for cell in cells
                  ]
                  key = f"td{len(cells)}-lex{lex}"
                  row_shapes[key] = row_shapes.get(key, 0) + 1
                  if lex:
                      linked += 1
                  elif len(cells) == 2 and all(nonempty_cells):
                      plain_two_cell += 1
                  else:
                      other_linkless += 1
                  if lex and any(nonempty_cells):
                      mixed += 0
                  if len(examples) < 3:
                      examples.append({
                          "td_count": len(cells),
                          "lexical_links": lex,
                          "cell_text_lengths": [len(x) for x in nonempty_cells],
                          "tags": row["tags"],
                          "loose_text_length": len(" ".join(row["loose"])),
                      })
              output.append({
                  "case": name,
                  "status": status,
                  "final_path": urlsplit(final_url).path.rsplit("/", 1)[-1],
                  "text_table_count": p.table_count,
                  "row_count": len(p.rows),
                  "row_shapes": row_shapes,
                  "linked_rows": linked,
                  "plain_two_cell_rows": plain_two_cell,
                  "other_linkless_rows": other_linkless,
                  "has_both_linked_and_linkless": bool(linked and (plain_two_cell or other_linkless)),
                  "first_row_structures": examples,
              })
          print(json.dumps(output, sort_keys=True))
          PY
