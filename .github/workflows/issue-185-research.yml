name: Issue 185 CPA raw structure probe

on:
  push:
    branches:
      - research/issue-185-unlemmatized-pages

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Probe raw CPA 55002 text-display events
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from html.parser import HTMLParser

          url = "https://cal.huc.edu/get_a_chapter.php?file=55002&cset=C"
          req = urllib.request.Request(
              url,
              headers={"User-Agent": "CAL-MCP research/0.1 (+https://github.com/alexsosn/CAL-MCP)"},
          )
          with urllib.request.urlopen(req, timeout=20) as response:
              body = response.read(262145)
              if len(body) > 262144:
                  raise RuntimeError("response exceeded 256 KiB")
              html = body.decode("utf-8", "replace")

          class Events(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.seen = False
                  self.depth = 0
                  self.events = []

              def handle_starttag(self, tag, attrs):
                  d = dict(attrs)
                  if tag == "table" and "text-display" in (d.get("class") or "").split():
                      self.seen = True
                      self.depth = 1
                      self.events.append({"kind":"start","tag":"table","class":"text-display"})
                      return
                  if not self.seen or self.depth <= 0:
                      return
                  if tag == "table":
                      self.depth += 1
                  if len(self.events) < 100:
                      self.events.append({
                          "kind":"start",
                          "tag":tag,
                          "class":d.get("class"),
                          "dir":d.get("dir"),
                          "href":d.get("href"),
                      })

              def handle_endtag(self, tag):
                  if not self.seen or self.depth <= 0:
                      return
                  if len(self.events) < 100:
                      self.events.append({"kind":"end","tag":tag})
                  if tag == "table":
                      self.depth -= 1

              def handle_data(self, data):
                  if not self.seen or self.depth <= 0:
                      return
                  text = " ".join(data.split())
                  if text and len(self.events) < 100:
                      self.events.append({
                          "kind":"text",
                          "text":text[:140],
                      })

          p=Events(); p.feed(html); p.close()
          print(json.dumps({
              "seen":p.seen,
              "events":p.events,
          }, ensure_ascii=False))
          PY
