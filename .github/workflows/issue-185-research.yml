name: Issue 185 CPA 55430 exception audit

on:
  push:
    branches:
      - research/issue-185-unlemmatized-text

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Classify non-plain rows without retaining text
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from html.parser import HTMLParser
          from urllib.parse import urlsplit

          url = "https://cal.huc.edu/get_a_chapter.php?file=55430&cset=C&page=0"
          req = urllib.request.Request(
              url,
              headers={"User-Agent": "CAL-MCP research/0.1 (+https://github.com/alexsosn/CAL-MCP)"},
          )
          with urllib.request.urlopen(req, timeout=20) as response:
              body = response.read(262145)
              if len(body) > 262144:
                  raise RuntimeError("response exceeded 256 KiB")
              html = body.decode("utf-8", "replace")

          class Probe(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.in_text = False
                  self.row = None
                  self.cell = None
                  self.rows = []
              def handle_starttag(self, tag, attrs):
                  d = dict(attrs)
                  if tag == "table":
                      if self.in_text:
                          self._end_row()
                          self.in_text = False
                          return
                      if "text-display" in (d.get("class") or "").split():
                          self.in_text = True
                          return
                  if not self.in_text:
                      return
                  if tag == "tr":
                      self._end_row()
                      self.row = {"cells": [], "loose_chars": 0, "tags": {}}
                  if self.row is not None:
                      self.row["tags"][tag] = self.row["tags"].get(tag, 0) + 1
                  if tag == "td" and self.row is not None:
                      self.cell = {"chars": 0, "links": [], "tags": {}}
                      self.row["cells"].append(self.cell)
                  elif tag == "a" and self.cell is not None:
                      self.cell["links"].append(urlsplit(d.get("href") or "").path.rsplit("/", 1)[-1])
                  elif self.cell is not None:
                      self.cell["tags"][tag] = self.cell["tags"].get(tag, 0) + 1
              def handle_endtag(self, tag):
                  if not self.in_text:
                      return
                  if tag == "td":
                      self.cell = None
                  elif tag == "tr":
                      self._end_row()
              def handle_data(self, data):
                  if not self.in_text or self.row is None:
                      return
                  text = " ".join(data.split())
                  if not text:
                      return
                  if self.cell is None:
                      self.row["loose_chars"] += len(text)
                  else:
                      self.cell["chars"] += len(text)
              def _end_row(self):
                  if self.row is not None:
                      self.rows.append(self.row)
                  self.row = None
                  self.cell = None

          p = Probe()
          p.feed(html)
          p.close()

          exceptions = []
          for index, row in enumerate(p.rows):
              exact = (
                  len(row["cells"]) == 2
                  and all(cell["chars"] > 0 for cell in row["cells"])
                  and not any(cell["links"] for cell in row["cells"])
                  and row["loose_chars"] == 0
              )
              if not exact:
                  exceptions.append({
                      "row_index": index,
                      "cell_count": len(row["cells"]),
                      "cell_chars": [cell["chars"] for cell in row["cells"]],
                      "cell_links": [cell["links"] for cell in row["cells"]],
                      "cell_tags": [cell["tags"] for cell in row["cells"]],
                      "row_tags": row["tags"],
                      "loose_chars": row["loose_chars"],
                  })

          print(json.dumps({
              "row_count": len(p.rows),
              "exception_count": len(exceptions),
              "exceptions": exceptions,
          }, sort_keys=True))
          PY
