name: Issue 185 CPA structural follow-up

on:
  push:
    branches:
      - research/issue-185-unlemmatized-text

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Probe one fixed CPA page
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from html.parser import HTMLParser

          url = "https://cal.huc.edu/get_a_chapter.php?file=55002&cset=C&page=0"
          req = urllib.request.Request(
              url,
              headers={"User-Agent": "CAL-MCP research/0.1 (+https://github.com/alexsosn/CAL-MCP)"},
          )
          with urllib.request.urlopen(req, timeout=20) as response:
              body = response.read(262145)
              if len(body) > 262144:
                  raise RuntimeError("response exceeded 256 KiB")
              html = body.decode("utf-8", "replace")

          class Events(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.in_text = False
                  self.depth = 0
                  self.events = []
              def handle_starttag(self, tag, attrs):
                  d = dict(attrs)
                  if tag == "table":
                      if self.in_text:
                          self.events.append(["next-table"])
                          self.in_text = False
                          return
                      if "text-display" in (d.get("class") or "").split():
                          self.in_text = True
                          self.events.append(["start-table", {"class": d.get("class")}])
                          return
                  if not self.in_text or len(self.events) >= 80:
                      return
                  keep = {}
                  for key in ("class", "dir", "lang", "id"):
                      if d.get(key):
                          keep[key] = d[key]
                  self.events.append(["start", tag, keep])
              def handle_endtag(self, tag):
                  if self.in_text and len(self.events) < 80:
                      self.events.append(["end", tag])
              def handle_data(self, data):
                  if not self.in_text or len(self.events) >= 80:
                      return
                  text = " ".join(data.split())
                  if text:
                      self.events.append(["data", len(text), text[:80]])

          p = Events()
          p.feed(html)
          p.close()
          print(json.dumps(p.events, ensure_ascii=False))
          PY
