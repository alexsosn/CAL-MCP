name: Issue 185 bounded plain-text research

on:
  push:
    branches:
      - research/issue-185-unlemmatized-pages

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Probe four current text pages
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from html.parser import HTMLParser
          from urllib.parse import parse_qs, urlsplit

          URLS = [
              ("mandaic-74420", "https://cal.huc.edu/get_a_chapter.php?cset=M&file=74420"),
              ("mandaic-74501", "https://cal.huc.edu/get_a_chapter.php?cset=M&file=74501"),
              ("cpa-55002", "https://cal.huc.edu/get_a_chapter.php?file=55002&cset=C"),
              ("cpa-55406", "https://cal.huc.edu/get_a_chapter.php?file=55406&cset=C"),
          ]
          UA = {"User-Agent": "CAL-MCP research/0.1 (+https://github.com/alexsosn/CAL-MCP)"}

          def get(url):
              req = urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=20) as response:
                  body = response.read(524289)
                  if len(body) > 524288:
                      raise RuntimeError("response exceeded 512 KiB")
                  return response.status, response.geturl(), body.decode("utf-8", "replace")

          class Probe(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.in_text_table = False
                  self.table_depth = 0
                  self.in_row = False
                  self.rows = []
                  self.current_row = None
                  self.in_td = False
                  self.current_td = None
                  self.element_stack = []
                  self.special = []
                  self.text_table_count = 0

              def handle_starttag(self, tag, attrs):
                  d = dict(attrs)
                  classes = set((d.get("class") or "").split())
                  if tag == "table":
                      if self.in_text_table:
                          self.table_depth += 1
                      elif "text-display" in classes:
                          self.in_text_table = True
                          self.table_depth = 1
                          self.text_table_count += 1
                          return
                  if not self.in_text_table:
                      return
                  if tag == "tr":
                      self.in_row = True
                      self.current_row = {"tds": [], "links": [], "special": [], "loose": []}
                  elif tag == "td" and self.in_row:
                      self.in_td = True
                      self.current_td = {"parts": [], "links": []}
                  elif tag == "a" and self.in_row:
                      href = d.get("href") or ""
                      p = urlsplit(href)
                      q = parse_qs(p.query, keep_blank_values=True)
                      rec = {
                          "path": p.path.rsplit("/", 1)[-1],
                          "keys": sorted(q),
                          "coord": (q.get("coord") or [None])[0],
                          "word": (q.get("word") or [None])[0],
                      }
                      self.current_row["links"].append(rec)
                      if self.in_td:
                          self.current_td["links"].append(rec)
                  elif tag in {"bdo", "span"} and self.in_row:
                      rec = {
                          "tag": tag,
                          "class": d.get("class"),
                          "dir": d.get("dir"),
                          "parts": [],
                      }
                      self.current_row["special"].append(rec)
                      self.element_stack.append(rec)

              def handle_endtag(self, tag):
                  if not self.in_text_table:
                      return
                  if tag == "td" and self.in_td:
                      self.current_td["text"] = " ".join("".join(self.current_td["parts"]).split())
                      self.current_row["tds"].append(self.current_td)
                      self.in_td = False
                      self.current_td = None
                  elif tag in {"bdo", "span"} and self.element_stack:
                      if self.element_stack[-1]["tag"] == tag:
                          rec = self.element_stack.pop()
                          rec["text"] = " ".join("".join(rec["parts"]).split())
                  elif tag == "tr" and self.in_row:
                      self.current_row["loose_text"] = " ".join(
                          "".join(self.current_row["loose"]).split()
                      )
                      self.rows.append(self.current_row)
                      self.current_row = None
                      self.in_row = False
                  elif tag == "table":
                      self.table_depth -= 1
                      if self.table_depth <= 0:
                          self.in_text_table = False
                          self.table_depth = 0

              def handle_data(self, data):
                  if not self.in_text_table or not self.in_row:
                      return
                  if self.in_td:
                      self.current_td["parts"].append(data)
                  else:
                      self.current_row["loose"].append(data)
                  for rec in self.element_stack:
                      rec["parts"].append(data)

          output = []
          for name, url in URLS:
              status, final, body = get(url)
              p = Probe()
              p.feed(body)
              p.close()
              rows = p.rows
              row_summary = []
              for row in rows:
                  lexical = [
                      link for link in row["links"]
                      if link["path"] in {"getlex.php", "bablex.php"}
                  ]
                  row_summary.append({
                      "td_count": len(row["tds"]),
                      "lexical_link_count": len(lexical),
                      "other_link_paths": [
                          x["path"] for x in row["links"]
                          if x["path"] not in {"getlex.php", "bablex.php"}
                      ],
                      "td_texts": [td["text"][:120] for td in row["tds"]],
                      "special": [
                          {
                              "tag": x["tag"],
                              "class": x["class"],
                              "dir": x["dir"],
                              "text": x.get("text", "")[:120],
                          }
                          for x in row["special"]
                      ],
                      "loose_text": row["loose_text"][:160],
                  })
              output.append({
                  "case": name,
                  "status": status,
                  "final_path": urlsplit(final).path.rsplit("/", 1)[-1],
                  "text_table_count": p.text_table_count,
                  "row_count": len(rows),
                  "rows_with_lexical_links": sum(
                      any(x["path"] in {"getlex.php", "bablex.php"} for x in r["links"])
                      for r in rows
                  ),
                  "rows_without_lexical_links": sum(
                      not any(x["path"] in {"getlex.php", "bablex.php"} for x in r["links"])
                      for r in rows
                  ),
                  "first_rows": row_summary[:3],
              })
          print(json.dumps(output, ensure_ascii=False, sort_keys=True))
          PY
