name: Issue 185 CPA 55430 row contract

on:
  push:
    branches:
      - research/issue-185-unlemmatized-text

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Verify exact two-cell plain-row shape
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from html.parser import HTMLParser
          from urllib.parse import urlsplit

          url = "https://cal.huc.edu/get_a_chapter.php?file=55430&cset=C&page=0"
          req = urllib.request.Request(
              url,
              headers={"User-Agent": "CAL-MCP research/0.1 (+https://github.com/alexsosn/CAL-MCP)"},
          )
          with urllib.request.urlopen(req, timeout=20) as response:
              body = response.read(262145)
              if len(body) > 262144:
                  raise RuntimeError("response exceeded 256 KiB")
              html = body.decode("utf-8", "replace")

          class Probe(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.in_text = False
                  self.row = None
                  self.cell = None
                  self.rows = []
              def handle_starttag(self, tag, attrs):
                  d = dict(attrs)
                  if tag == "table":
                      if self.in_text:
                          self._end_row()
                          self.in_text = False
                          return
                      if "text-display" in (d.get("class") or "").split():
                          self.in_text = True
                          return
                  if not self.in_text:
                      return
                  if tag == "tr":
                      self._end_row()
                      self.row = []
                  elif tag == "td" and self.row is not None:
                      self.cell = {"parts": [], "links": 0}
                      self.row.append(self.cell)
                  elif tag == "a" and self.cell is not None:
                      self.cell["links"] += 1
              def handle_endtag(self, tag):
                  if not self.in_text:
                      return
                  if tag == "td":
                      self.cell = None
                  elif tag == "tr":
                      self._end_row()
              def handle_data(self, data):
                  if self.cell is None:
                      return
                  text = " ".join(data.split())
                  if text:
                      self.cell["parts"].append(text)
              def _end_row(self):
                  if self.row:
                      self.rows.append(self.row)
                  self.row = None
                  self.cell = None

          p = Probe()
          p.feed(html)
          p.close()
          normalized = []
          for row in p.rows:
              normalized.append([
                  {"text": " ".join(cell["parts"]), "links": cell["links"]}
                  for cell in row
              ])

          if not normalized:
              raise RuntimeError("no rows")
          exact = [
              row for row in normalized
              if len(row) == 2
              and all(cell["text"] for cell in row)
              and not any(cell["links"] for cell in row)
          ]
          print(json.dumps({
              "row_count": len(normalized),
              "exact_plain_two_cell_rows": len(exact),
              "first_display_coordinates": [row[0]["text"] for row in exact[:5]],
              "first_text_lengths": [len(row[1]["text"]) for row in exact[:5]],
          }, ensure_ascii=False, sort_keys=True))
          if len(exact) != len(normalized):
              raise RuntimeError("not every row satisfies the two-cell plain contract")
          PY
