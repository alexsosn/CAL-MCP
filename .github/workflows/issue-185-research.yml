name: Issue 185 CPA 55430 exceptional rows

on:
  push:
    branches:
      - research/issue-185-unlemmatized-text

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Classify only nonconforming 55430 rows
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from html.parser import HTMLParser

          url = "https://cal.huc.edu/get_a_chapter.php?file=55430&cset=C&page=0"
          req = urllib.request.Request(
              url,
              headers={"User-Agent": "CAL-MCP research/0.1 (+https://github.com/alexsosn/CAL-MCP)"},
          )
          with urllib.request.urlopen(req, timeout=20) as response:
              body = response.read(262145)
              if len(body) > 262144:
                  raise RuntimeError("response exceeded 256 KiB")
              html = body.decode("utf-8", "replace")

          class Probe(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.in_text = False
                  self.row = None
                  self.cell = None
                  self.rows = []
              def handle_starttag(self, tag, attrs):
                  d = dict(attrs)
                  if tag == "table":
                      if self.in_text:
                          self._end_row()
                          self.in_text = False
                          return
                      if "text-display" in (d.get("class") or "").split():
                          self.in_text = True
                          return
                  if not self.in_text:
                      return
                  if tag == "tr":
                      self._end_row()
                      self.row = {"cells": [], "tags": {}}
                  elif self.row is not None:
                      self.row["tags"][tag] = self.row["tags"].get(tag, 0) + 1
                      if tag == "td":
                          self.cell = {"parts": [], "links": 0}
                          self.row["cells"].append(self.cell)
                      elif tag == "a" and self.cell is not None:
                          self.cell["links"] += 1
              def handle_endtag(self, tag):
                  if not self.in_text:
                      return
                  if tag == "td":
                      self.cell = None
                  elif tag == "tr":
                      self._end_row()
              def handle_data(self, data):
                  if self.cell is None:
                      return
                  text = " ".join(data.split())
                  if text:
                      self.cell["parts"].append(text)
              def _end_row(self):
                  if self.row is not None and self.row["cells"]:
                      self.rows.append(self.row)
                  self.row = None
                  self.cell = None

          p = Probe(); p.feed(html); p.close()
          exceptional = []
          for index, row in enumerate(p.rows):
              cells = row["cells"]
              texts = [" ".join(cell["parts"]) for cell in cells]
              exact = (
                  len(cells) == 2
                  and all(texts)
                  and not any(cell["links"] for cell in cells)
              )
              if exact:
                  continue
              exceptional.append({
                  "row_index": index,
                  "td_count": len(cells),
                  "cell_text_lengths": [len(x) for x in texts],
                  "first_cell_text": texts[0] if texts else None,
                  "cell_link_counts": [cell["links"] for cell in cells],
                  "tags": row["tags"],
              })
          print(json.dumps(exceptional, ensure_ascii=False, sort_keys=True))
          PY
