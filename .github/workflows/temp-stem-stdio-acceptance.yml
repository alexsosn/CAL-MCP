name: Temporary installed-stdio CAL verb stem acceptance
on:
  pull_request:
    paths: [".github/workflows/temp-stem-stdio-acceptance.yml"]
permissions:
  contents: read
jobs:
  exact-wheel-stdio:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build and install wheel (not editable source)
        run: |
          python -m pip install build
          python -m build --wheel --outdir dist
          python -m pip install dist/*.whl
      - name: Exercise public stdio MCP exact verb entries (three bounded logical calls)
        run: |
          cd "$RUNNER_TEMP"
          python - <<'PY'
          import asyncio
          import os
          from mcp import Client, StdioServerParameters

          async def main():
              params = StdioServerParameters(command="cal-mcp", env=dict(os.environ))
              async with Client(params) as client:
                  tools = {item.name: item for item in (await client.list_tools()).tools}
                  assert "cal_lexicon_lookup" in tools
                  for query, key, stems in (
                      ("ktb", "ktb V", {"G", "D", "C", "Gt"}),
                      (")mr", ")mr V", {"G", "Gt"}),
                      ("(hr", "(hr V", {"G"}),
                  ):
                      result = await client.call_tool("cal_lexicon_lookup", arguments={"query": query, "lemma_key": key})
                      assert not result.is_error, (query, str(result.content)[:600])
                      data = result.structured_content
                      assert data and data["status"] == "found", (query, data.get("status") if data else "missing")
                      assert data["entry"]["lemma"]["lemma_key"] == key
                      senses = data["entry"]["senses"]
                      assert senses and all(s["heading"] for s in senses), (query, len(senses))
                      labels = {s["heading"].split(" ", 1)[0] for s in senses}
                      assert stems.issubset(labels), (query, labels)
                      p = data["provenance"]
                      assert p["source_url"].startswith("https://cal.huc.edu/") and p["retrieved_at"]
                      print("live installed-stdio entry:", query, key, len(senses), sorted(labels))

          asyncio.run(main())
          PY
