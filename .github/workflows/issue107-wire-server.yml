name: issue-107 wire server

on:
  push:
    branches:
      - issue-107-specialized-gloss-fields
    paths:
      - .github/workflows/issue107-wire-server.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6
        with:
          ref: issue-107-specialized-gloss-fields
          fetch-depth: 0
      - name: Wire public tool and bootstrap contract
        shell: python
        run: |
          from pathlib import Path

          server = Path("src/cal_mcp/server.py")
          text = server.read_text()
          old_import = "from cal_mcp.search import EnglishSearchService\n"
          new_import = "from cal_mcp.search import EnglishSearchService, GlossField\n"
          if text.count(old_import) != 1:
              raise SystemExit("expected search import exactly once")
          text = text.replace(old_import, new_import)

          old_instruction = (
              '        "Use cal_gloss_search for CAL English-gloss search and cal_citation_text_search "\n'
              '        "for English words inside CAL citations. Use cal_text_catalogue to discover CAL "\n'
          )
          new_instruction = (
              '        "Use cal_gloss_search for ordinary CAL English-gloss search, cal_gloss_field for "\n'
              '        "CAL indexed specialized gloss fields, and cal_citation_text_search for English "\n'
              '        "words inside CAL citations. Use cal_text_catalogue to discover CAL "\n'
          )
          if text.count(old_instruction) != 1:
              raise SystemExit("expected search instruction exactly once")
          text = text.replace(old_instruction, new_instruction)

          marker = '''@mcp.tool(
              name="cal_citation_text_search",
              title="Search English words in CAL citations",
              structured_output=True,
          )
          async def cal_citation_text_search(
          '''
          addition = '''@mcp.tool(
              name="cal_gloss_field",
              title="Search one CAL specialized gloss field",
              structured_output=True,
          )
          async def cal_gloss_field(
              field: GlossField,
              ctx: Context[AppContext],
          ) -> dict[str, object]:
              """Search one CAL indexed specialized gloss field.

              The readable enum is mapped to CAL's private current field selector. One tool call
              performs one bounded CAL request and does not expand or traverse other fields.
              """

              client = ctx.request_context.lifespan_context.client
              result = await EnglishSearchService(client).search_gloss_field(field)
              return result.to_dict()


          ''' + marker
          if text.count(marker) != 1:
              raise SystemExit("expected citation tool marker exactly once")
          text = text.replace(marker, addition)
          server.write_text(text)

          bootstrap = Path("tests/test_bootstrap.py")
          text = bootstrap.read_text()
          old = '        "cal_gloss_search",\n        "cal_citation_text_search",\n'
          new = '        "cal_gloss_search",\n        "cal_gloss_field",\n        "cal_citation_text_search",\n'
          if text.count(old) != 1:
              raise SystemExit("expected bootstrap tool-set snippet exactly once")
          bootstrap.write_text(text.replace(old, new))

          Path(".github/workflows/issue107-wire-server.yml").unlink()
      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Wire specialized gloss-field MCP tool"
          git push origin HEAD:issue-107-specialized-gloss-fields
