name: Issue 193 live stdio acceptance

on:
  push:
    branches:
      - dev/issue-193-linkless-token-analysis

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install candidate
        run: python -m pip install .
      - name: Verify three current linkless results over stdio
        run: |
          python - <<'PY'
          import asyncio
          from mcp import Client, StdioServerParameters

          CASES = [
              ("620570101", 0, ["pwlws PN Personal name"]),
              (
                  "620570101",
                  2,
                  ["d_ p = d_ p --> dy p", "y$w( PN Personal name"],
              ),
              ("5500001001a019001", 0, ["lwT PN Personal name"]),
          ]

          async def main():
              async with Client(StdioServerParameters(command="cal-mcp")) as client:
                  for coordinate, word_index, expected in CASES:
                      result = await client.call_tool(
                          "cal_token_analysis",
                          {"coordinate": coordinate, "word_index": word_index},
                      )
                      if result.is_error:
                          raise RuntimeError(
                              f"{coordinate}/{word_index} failed: {result.content!r}"
                          )
                      data = result.structured_content
                      if not isinstance(data, dict):
                          raise RuntimeError(f"{coordinate}/{word_index}: no structured content")
                      if data.get("status") != "found":
                          raise RuntimeError(
                              f"{coordinate}/{word_index}: status={data.get('status')!r}"
                          )
                      if data.get("candidates") != []:
                          raise RuntimeError(
                              f"{coordinate}/{word_index}: invented linked candidates"
                          )
                      if data.get("unlinked_summaries") != expected:
                          raise RuntimeError(
                              f"{coordinate}/{word_index}: summaries changed "
                              f"{data.get('unlinked_summaries')!r}"
                          )
                  print("live #193 OK: three linkless CAL analyses preserved over stdio")

          asyncio.run(main())
          PY
