name: issue-106 text-info research probe

on:
  push:
    branches:
      - issue-106-text-information
    paths:
      - .github/workflows/issue106-research-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - name: Probe four fixed text-information selectors
        run: |
          set -euo pipefail
          for coord in 6042013 43200336 56000128 99999999; do
            echo "=== coord=$coord ==="
            curl --silent --show-error --max-time 15 --max-filesize 524288 -D /tmp/headers -o /tmp/body "https://cal.huc.edu/get_file_info.php?coord=$coord"
            head -n 1 /tmp/headers
            wc -c /tmp/body
            python -c 'import re; from pathlib import Path; s=Path("/tmp/body").read_text(errors="replace"); s=re.sub(r"<script\b.*?</script>"," ",s,flags=re.I|re.S); s=re.sub(r"<style\b.*?</style>"," ",s,flags=re.I|re.S); s=re.sub(r"<[^>]+>","\n",s); lines=[re.sub(r"\s+"," ",x).strip() for x in s.splitlines()]; print("\n".join(x for x in lines if x)[:8000])'
          done
