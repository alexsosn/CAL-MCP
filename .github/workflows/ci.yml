name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy
      - name: Pytest
        run: pytest

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Build sdist and wheel
        run: |
          python -m pip install 'build>=1,<2'
          python -m build
          test -f dist/cal_mcp-0.1.0-py3-none-any.whl
          test -f dist/cal_mcp-0.1.0.tar.gz
      - name: Install built wheel in fresh environment
        run: |
          python -m venv .venv-release
          .venv-release/bin/python -m pip install dist/cal_mcp-0.1.0-py3-none-any.whl
      - name: Verify installed metadata and stdio entry point
        run: |
          .venv-release/bin/python - <<'PY'
          import asyncio
          import importlib.metadata
          from pathlib import Path

          from mcp import Client, StdioServerParameters

          assert importlib.metadata.version("cal-mcp") == "0.1.0"
          executable = str(Path(".venv-release/bin/cal-mcp").resolve())

          async def verify() -> None:
              async with Client(StdioServerParameters(command=executable)) as client:
                  assert client.server_info is not None
                  assert client.server_info.name == "cal-mcp"
                  assert client.server_info.version == "0.1.0"
                  tools = await client.list_tools()
                  assert len(tools.tools) == 26

          asyncio.run(verify())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cal-mcp-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
