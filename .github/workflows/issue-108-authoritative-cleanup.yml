name: Issue 108 authoritative cleanup

on:
  push:
    branches:
      - issue-108-line-comments
    paths:
      - .github/workflows/issue-108-authoritative-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: issue-108-line-comments
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Apply frozen-contract cleanup
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/cal_mcp/texts.py")
          text = path.read_text(encoding="utf-8")

          old_import = "from cal_mcp.lemma_key import validate_lemma_key\n"
          if text.count(old_import) != 1:
              raise SystemExit(f"unexpected lemma import count: {text.count(old_import)}")
          text = text.replace(old_import, "", 1)

          old_close = '''            if self._span_parts is not None or self._anchor_parts is not None or self._in_gloss:\n                raise TextParseError(\n                    "CAL line-comments record closes with unfinished semantic markup"\n                )\n'''
          new_close = '''            if (\n                self._span_parts is not None\n                or self._anchor_parts is not None\n                or self._in_reference\n                or self._in_gloss\n            ):\n                raise TextParseError(\n                    "CAL line-comments record closes with unfinished semantic markup"\n                )\n'''
          if text.count(old_close) != 1:
              raise SystemExit(f"unexpected close-check anchor count: {text.count(old_close)}")
          text = text.replace(old_close, new_close, 1)

          old_lemma = '''    raw_lemma_key = lemma_values[0]\n    try:\n        _lemma, _suffix, lemma_key = validate_lemma_key(raw_lemma_key)\n    except ValueError as exc:\n        raise TextParseError(\n            "CAL line-comments lexical-entry link returned an invalid lemma key"\n        ) from exc\n    if lemma_key != raw_lemma_key:\n        raise TextParseError(\n            "CAL line-comments lexical-entry link returned a non-canonical lemma key"\n        )\n    return resolved, lemma_key\n'''
          new_lemma = '''    return resolved, lemma_values[0]\n'''
          if text.count(old_lemma) != 1:
              raise SystemExit(f"unexpected lemma-validation anchor count: {text.count(old_lemma)}")
          text = text.replace(old_lemma, new_lemma, 1)
          path.write_text(text, encoding="utf-8")

          docs = Path("docs/tools/texts.md")
          text = docs.read_text(encoding="utf-8")
          replacements = [
              (
                  "optional translation/comment text, canonical CAL `lemma_key`, rendered headword",
                  "optional translation/comment text, the opaque returned `lemma_key`, rendered headword",
              ),
              (
                  "foreign or malformed entry links, repeated/empty lemma selectors, malformed or non-canonical returned lemma keys, and unrecognized successful markup fail closed as parser drift.",
                  "foreign or malformed entry links, repeated/empty lemma selectors, and unrecognized successful markup fail closed as parser drift.",
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"docs anchor count for {old!r}: {text.count(old)}")
              text = text.replace(old, new, 1)
          docs.write_text(text, encoding="utf-8")
          PY
      - name: Remove cleanup harness before validation
        run: git rm .github/workflows/issue-108-authoritative-cleanup.yml
      - name: Install deterministic validation environment
        run: |
          python -m pip install "pip==26.2.1" "setuptools==79.0.1"
          python -m pip install -e ".[dev]" -c constraints/ci-py311.txt --build-constraint constraints/build-py311.txt
      - name: Validate complete tree
        run: |
          ruff check .
          ruff format --check .
          mypy
          pytest
      - name: Commit exact cleanup after GREEN
        run: |
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Align CAL line comments with frozen contract"
          git push origin HEAD:issue-108-line-comments
