name: Final v0.1 candidate validation

on:
  push:
    branches:
      - release/issue-15-v0.1-resume
    paths:
      - .github/workflows/issue-15-final-release-validation.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: d704ee5c2b542e22c22a3929771fa466dea0a0f6
      - name: Require exact merged release candidate
        run: test "$(git rev-parse HEAD)" = "d704ee5c2b542e22c22a3929771fa466dea0a0f6"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/ci-py311.txt
            constraints/build-py311.txt
      - name: Bootstrap frozen installer
        run: python -m pip install "pip==26.2.1" "setuptools==79.0.1"
      - name: Install frozen validation environment
        run: >-
          python -m pip install -e ".[dev]"
          -c constraints/ci-py311.txt
          --build-constraint constraints/build-py311.txt
      - name: Verify frozen dependency set
        run: |
          python -m pip check
          python scripts/verify_ci_environment.py constraints/ci-py311.txt \
            --exclude cal-mcp \
            --exclude pip \
            --exclude setuptools
      - name: Static and test gates
        run: |
          ruff check .
          ruff format --check .
          mypy
          pytest
      - name: Build exact wheel and sdist
        env:
          PIP_BUILD_CONSTRAINT: constraints/build-py311.txt
        run: python -m build --outdir dist
      - name: Verify simulated v0.1.0 artifacts and installed stdio surface
        run: python scripts/verify_release_artifact.py dist --tag v0.1.0
      - name: Run fixed nine-request CAL smoke
        run: python -m cal_mcp.live_smoke
