name: Research issue 11 Syriac contracts

on:
  push:
    branches:
      - feat/issue-11-syriac
    paths:
      - .github/workflows/research-issue-11-syriac.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe remaining bounded current CAL Syriac surfaces
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from html.parser import HTMLParser
          from urllib.parse import urlencode, urljoin
          from urllib.request import Request, urlopen

          BASE = "https://cal.huc.edu/"
          UA = "CAL-MCP issue-11 bounded research probe (4 requests max)"
          requests_made = 0

          def fetch(path, data=None):
              global requests_made
              requests_made += 1
              if requests_made > 4:
                  raise SystemExit("request budget exceeded")
              body = None if data is None else urlencode(data).encode()
              req = Request(urljoin(BASE, path), data=body, headers={"User-Agent": UA})
              with urlopen(req, timeout=15) as r:
                  raw = r.read(300_000)
                  print("FETCH", requests_made, r.status, r.geturl(), len(raw), r.headers.get("Content-Type"))
                  return raw.decode("utf-8", errors="replace")

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.items=[]; self.href=None; self.parts=[]
              def handle_starttag(self, tag, attrs):
                  if tag == "a":
                      self.href=dict(attrs).get("href"); self.parts=[]
              def handle_data(self, data):
                  if self.href is not None: self.parts.append(data)
              def handle_endtag(self, tag):
                  if tag == "a" and self.href is not None:
                      text=" ".join("".join(self.parts).split())
                      self.items.append((text, self.href))
                      self.href=None; self.parts=[]

          invalid=fetch("showpesh.php", {"bookname":"01","chapter":"01","verse":"99"})
          print("INVALID_TEXT", repr(" ".join(invalid.split())[-1200:]))

          avail=fetch("AvailSyr.html")
          p=Links(); p.feed(avail)
          print("AVAIL_LINKS", p.items)

          missing=fetch("NotInSL.html")
          p=Links(); p.feed(missing)
          print("MISSING_LINKS", p.items)

          cat=fetch("show_Syriac_categories.php?category=6")
          p=Links(); p.feed(cat)
          print("CATEGORY_LINKS", p.items[:30])
          print("REQUESTS", requests_made)
          PY
