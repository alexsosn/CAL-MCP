name: issue-97 direct Mandaic research

on:
  push:
    branches:
      - fix/issue-97-mandaic-route-scope

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fetch one fixed direct Mandaic page
        shell: python
        run: |
          import html.parser
          import urllib.parse
          import urllib.request

          URL = "https://cal.huc.edu/get_a_chapter.php?cset=M&file=74717"
          LIMIT = 512 * 1024

          request = urllib.request.Request(
              URL,
              headers={"User-Agent": "CAL-MCP issue-97 bounded research probe"},
          )
          with urllib.request.urlopen(request, timeout=15) as response:
              body = response.read(LIMIT + 1)
              print("status", response.status)
              print("content-type", response.headers.get("Content-Type"))
              print("final-url", response.geturl())
          if len(body) > LIMIT:
              raise SystemExit("response exceeded 512 KiB research cap")
          print("bytes", len(body))

          class ProbeParser(html.parser.HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.text = []
                  self.anchors = []
                  self._href = None
                  self._parts = []

              def handle_starttag(self, tag, attrs):
                  if tag == "a":
                      self._href = dict(attrs).get("href", "")
                      self._parts = []

              def handle_endtag(self, tag):
                  if tag == "a" and self._href is not None:
                      self.anchors.append((self._href, " ".join("".join(self._parts).split())))
                      self._href = None
                      self._parts = []

              def handle_data(self, data):
                  cleaned = " ".join(data.split())
                  if cleaned:
                      self.text.append(cleaned)
                  if self._href is not None:
                      self._parts.append(data)

          parser = ProbeParser()
          parser.feed(body.decode("utf-8", errors="replace"))

          print("--- semantic text (first 40 chunks) ---")
          for item in parser.text[:40]:
              print(item)

          print("--- relevant anchors (first 40) ---")
          kept = 0
          for href, label in parser.anchors:
              target = urllib.parse.urlsplit(urllib.parse.urljoin(URL, href))
              endpoint = target.path.rsplit("/", 1)[-1]
              if endpoint not in {
                  "get_file_info.php",
                  "get_a_chapter.php",
                  "bablex.php",
                  "getlex.php",
                  "comment.php",
              }:
                  continue
              print(endpoint, target.query, "::", label)
              kept += 1
              if kept >= 40:
                  break

          visible = " ".join(parser.text).casefold()
          nav_labels = [label.casefold() for _, label in parser.anchors]
          print("has-page-marker", "page " in visible and " of " in visible)
          print("has-previous-page", any("previous page" in label for label in nav_labels))
          print("has-next-page", any("next page" in label for label in nav_labels))
