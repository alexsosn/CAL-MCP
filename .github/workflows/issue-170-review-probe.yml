name: Issue 170 review structural probe

on:
  push:
    branches:
      - dev/issue-170-cpa-subtext-ids

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Inspect CPA route selector shapes
        run: |
          python - <<'PY'
          import re
          import urllib.request
          from collections import Counter, defaultdict
          from html.parser import HTMLParser
          from urllib.parse import parse_qs, urlsplit

          url = "https://cal.huc.edu/showsubtexts.php?subtext=55"
          req = urllib.request.Request(
              url,
              headers={"User-Agent": "CAL-MCP review/0.1 (+https://github.com/alexsosn/CAL-MCP)"},
          )
          with urllib.request.urlopen(req, timeout=20) as response:
              body = response.read().decode("utf-8", "replace")

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.hrefs = []
              def handle_starttag(self, tag, attrs):
                  if tag == "a":
                      href = dict(attrs).get("href")
                      if href:
                          self.hrefs.append(href)

          p = Links()
          p.feed(body)

          routes = []
          for href in p.hrefs:
              u = urlsplit(href)
              if u.path.rsplit("/",1)[-1] != "get_a_chapter.php":
                  continue
              q = parse_qs(u.query, keep_blank_values=True)
              if "sub" not in q:
                  continue
              file_id = (q.get("file") or ["?"])[0]
              sub = (q.get("sub") or ["?"])[0]
              cset = (q.get("cset") or ["<missing>"])[0]
              shape = (
                  "suffix" if re.fullmatch(r"[0-9]+[a-z]", sub)
                  else "decimal" if sub.isdigit()
                  else "other"
              )
              routes.append((file_id, sub, cset, shape, tuple(sorted(q))))

          counts = Counter((shape, cset, keys) for _,_,cset,shape,keys in routes)
          files = defaultdict(set)
          examples = {}
          for file_id, sub, cset, shape, keys in routes:
              files[(shape,cset,keys)].add(file_id)
              examples.setdefault((shape,cset,keys), (file_id, sub))
          print("route_count", len(routes))
          for key in sorted(counts, key=str):
              print({
                  "shape": key[0],
                  "cset": key[1],
                  "keys": key[2],
                  "count": counts[key],
                  "files": sorted(files[key]),
                  "example": examples[key],
              })
          PY
